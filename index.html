<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cahaya: Ibadah & Belajar</title>
<meta name="theme-color" content="#0f2a2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Scheherazade+New:wght@400;700&display=swap">
<style>
/* VOICE: warm, devotional for parents; bright, bouncy, encouraging for kids.
   IDEA: a prayer companion that turns into a children's adventure book when "Mode Anak" is switched on.
   PICTURE: dusk-gradient prayer card (adult) / island adventure map with a moon mascot, Nuri (kids).
   COLOUR and TYPE: deep teal night + dusk orange-rose + prayer green; kids: sky, sunshine, coral, mint. Plus Jakarta Sans / Baloo 2 / Amiri.
   LAYOUT: phone app, 400x844 framed on desktop, full screen on phones and tablets. */
:root{color-scheme:light dark;--bg:light-dark(#dfe9e7,#0a1716);--ink:light-dark(#10302e,#e8f1ef)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;display:grid;place-items:center;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffcf3f;outline-offset:2px}
input,select{font:inherit;font-size:16px}
.phone{position:relative;width:100vw;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
@media (min-width:520px) and (pointer:fine){.phone{width:400px;height:min(844px,calc(100dvh - 32px));border-radius:40px;box-shadow:0 30px 80px -20px #0008,0 0 0 10px #111,0 0 0 11px #333}}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.scr::-webkit-scrollbar{display:none}
.ic{flex:none;display:block}
.ar{font-family:"Amiri Quran","Amiri",serif;direction:rtl}
.nav{display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.nav button{display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;min-height:52px;padding-top:6px}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#14211f;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:90;max-width:86%;text-align:center;box-shadow:0 8px 24px #0006;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}}
.conf{position:fixed;pointer-events:none;z-index:100}

/* ADULT */
.adult{background:var(--bg);color:var(--ink)}
.adult .nav{background:var(--nav);border-top:1px solid var(--navline)}
.adult .nav button{color:var(--navtx)}.adult .nav button.on{color:var(--acc)}
.hero{margin:12px 14px 0;border-radius:24px;padding:16px 18px;background:linear-gradient(170deg,#ea8a35,#c8664c 55%,#a24d68);color:#fff;min-height:168px;display:grid;grid-template-rows:auto 1fr auto}
.hero h1{font-size:17px;margin:0;font-weight:800}
.hero .big{font-size:36px;font-weight:800;line-height:1.05;letter-spacing:-.5px}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.cd{font-variant-numeric:tabular-nums;font-weight:600;opacity:.92}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.pad{padding:14px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px 0}
.pill{border-radius:20px;padding:10px 14px;text-align:left;min-height:56px;color:#fff}
.pill small{display:block;font-size:11.5px;opacity:.9}.pill b{font-size:14.5px}
.quick{display:flex;gap:14px;overflow-x:auto;padding:16px 14px 4px;scrollbar-width:none}
.quick button{display:grid;justify-items:center;gap:5px;font-size:12px;font-weight:600;flex:none;width:64px;line-height:1.25;text-align:center}
.quick .qi{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--qi);color:var(--qiink)}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 14px 0}
.card h3{margin:0 0 8px;font-size:15.5px}
.mute{color:var(--mute);font-size:13px}
.pchk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pchk button{display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:600;padding:8px 0;border-radius:14px;background:var(--pk)}
.pchk button.on{background:var(--pkon)}
.circ{width:30px;height:30px;border-radius:50%;border:2px solid #7d9a95;display:grid;place-items:center}
.on .circ{border-color:#fff;background:#fff2;color:#fff}
.ptop{background:linear-gradient(180deg,#e58836,#d7773f);padding:18px 16px 10px;color:#fff}
.ptop h1{margin:0;font-size:28px;font-family:Amiri,serif;font-weight:700}
.dnav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;text-align:center}
.dnav b{font-size:18px;display:block}
.plist{background:linear-gradient(180deg,#d7773f,#a64e5f 85%)}
.prow{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:86px;color:#fff;border-bottom:1px solid var(--hair)}
.prow.next{background:#5fd38a}
.prow .nm{flex:1;font-size:19px;font-weight:600}.prow .nm small{display:block;font-size:13px;font-weight:500;opacity:.92}
.prow .tm{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.chk{width:44px;height:44px;display:grid;place-items:center}
.chk span{width:32px;height:32px;border-radius:50%;border:2px solid #ffffff90;display:grid;place-items:center}
.chk.on span{background:#fff;color:var(--pkon);border-color:#fff}
.week{display:grid;grid-template-columns:64px repeat(7,1fr);gap:6px 4px;align-items:center;font-size:11px;font-weight:700}
.week i{height:10px;border-radius:6px;background:#ffffff26;display:block}.week i.on{background:#5fd38a}
.seg{display:flex;background:var(--c3);border-radius:30px;padding:5px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:24px;font-weight:700;font-size:14px;min-height:44px}
.seg button.on{background:var(--btn);color:#fff}
.seg2{display:flex;gap:8px;margin:14px 0 4px}
.seg2 button{padding:10px 22px;border-radius:24px;font-weight:600;min-height:44px}
.seg2 button.on{background:var(--ink);color:var(--bg)}
.lrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--hair);width:100%;text-align:left}
.lrow .no{width:34px;font-family:Amiri,serif;font-size:24px;color:#6f8d88;text-align:center}
.lrow .t{flex:1}.lrow .t b{font-family:Amiri,serif;font-size:20px;font-weight:400;display:block}
.lrow .t small{color:var(--mute);font-size:13px}
.lrow .r{text-align:right}.lrow .r .ar{font-size:22px;display:block}
.tag{display:inline-block;font-size:10px;font-weight:700;background:var(--pkon);color:#fff;border-radius:8px;padding:1px 6px;margin-left:6px;vertical-align:2px;font-family:"Plus Jakarta Sans"}
.link{color:var(--acc);font-weight:600;font-size:14px}
.sheet{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.shd{display:flex;align-items:center;gap:6px;padding:10px 8px;border-bottom:1px solid var(--hair)}
.shd h2{font-size:18px;margin:0;flex:1}
.ayah{padding:18px 16px;border-bottom:1px solid var(--hair)}
.ayah .ar{font-size:28px;line-height:2.1;text-align:right}
.ayah p{margin:8px 0 0;color:var(--sub);font-size:15px}
.anum{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--acc);font-size:12px;font-weight:700;color:var(--acc)}
.compass{width:240px;height:240px;margin:20px auto;position:relative}
.big-tas{width:220px;height:220px;border-radius:50%;margin:24px auto;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#6fd69a,#2f8a5a);box-shadow:0 14px 0 #1f6643,0 24px 40px #0008;color:#fff;font-size:64px;font-weight:800;font-variant-numeric:tabular-nums}
.big-tas:active{transform:translateY(8px);box-shadow:0 6px 0 #1f6643}
.fld{display:grid;gap:6px;margin-bottom:14px;font-size:14px;font-weight:600}
.fld input,.fld select{background:var(--c2);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:12px 14px;min-height:48px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;font-weight:700;background:var(--btn);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:10px 14px;border-radius:14px;background:var(--c2);font-weight:600;font-size:14px;min-height:44px}
.chips button.on{background:var(--btn);color:#fff}

/* KIDS */
.kids{background:#e8f5ff;color:#24314a;font-family:"Baloo 2",system-ui,sans-serif}
.kids .nav{grid-template-columns:repeat(4,1fr);background:#fff;border-top:3px solid #d6ecff}
.kids .nav button{color:#7d8aa5;font-size:14px;font-weight:700}.kids .nav button.on{color:#ff6f7d}
.khead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:3px solid #d6ecff}
.khead .who{flex:1;text-align:left;display:flex;gap:10px;align-items:center}
.khead .who b{font-size:18px;line-height:1.1;display:block}
.xpbar{height:10px;background:#e3eefb;border-radius:8px;overflow:hidden;width:110px;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffcf3f,#ff9f43);border-radius:8px}
.stat{display:flex;align-items:center;gap:3px;font-weight:800;font-size:17px;padding:4px 10px;border-radius:14px;background:#fff6dc;color:#e09b00}
.stat.fl{background:#ffe8e3;color:#ff6a3d}
.kbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#eef5ff;color:#5b6b8a}
.map{position:relative;background:radial-gradient(circle at 20% 10%,#bfe6ff 0 30%,transparent 31%),linear-gradient(180deg,#a8dcff,#7cc7f5 60%,#62b5ea);min-height:100%;padding-bottom:40px}
.map svg.path{position:absolute;inset:0;width:100%;pointer-events:none}
.isl{position:absolute;width:150px;transform:translateX(-50%);display:grid;justify-items:center;text-align:center}
.isl .disc{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 8px 0 #0002,inset 0 -8px 0 #0002,0 0 0 6px #fff;position:relative}
.isl .disc::after{content:"";position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);width:130px;height:26px;border-radius:50%;background:#f6dd9e;z-index:-1;box-shadow:0 4px 0 #e0bf6f}
.isl .lbl{margin-top:18px;background:#fff;border-radius:14px;padding:4px 10px;font-weight:800;font-size:15px;line-height:1.2;box-shadow:0 4px 0 #0001}
.isl .lbl small{display:block;font-weight:600;color:#7d8aa5;font-size:12px}
.isl.lock .disc{filter:grayscale(.85) brightness(1.05)}
.isl .lk{position:absolute;top:-6px;right:20px;background:#24314a;color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center}
.bubble{background:#fff;border-radius:20px;padding:12px 14px;font-size:16px;line-height:1.35;position:relative;box-shadow:0 4px 0 #d6ecff;font-weight:600}
.mas{display:flex;gap:10px;align-items:flex-end;padding:14px}
.mas svg{flex:none}
.bounce{animation:bnc .7s ease-in-out infinite alternate}
@keyframes bnc{to{transform:translateY(-8px) rotate(-4deg)}}
.ktitle{font-size:26px;font-weight:800;margin:0;line-height:1.1}
.kcard{background:#fff;border-radius:24px;padding:14px;margin:0 14px 12px;box-shadow:0 5px 0 #d6ecff}
.topic{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:20px;padding:12px 14px;margin-bottom:10px;box-shadow:0 5px 0 #d6ecff;min-height:64px}
.topic .dot{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:none}
.topic .t{flex:1;font-weight:700;font-size:17px;line-height:1.2}
.topic .t small{display:block;font-weight:600;color:#7d8aa5;font-size:13px}
.topic.lock{opacity:.55}
.stars{display:flex;gap:1px;color:#e3e9f2}.stars .on{color:#ffc21a}
.grp{font-weight:800;color:#5b6b8a;margin:12px 4px 8px;font-size:15px}
.fx{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fx span{padding:6px 12px;border-radius:12px;font-weight:800;color:#fff;font-size:16px}
.fx .s{background:#59b8ff}.fx .x{background:#9b7bff}.fx .v{background:#ff6f7d}.fx .o{background:#3fcf9a}.fx .e{background:#ffb020}
.fx em{font-style:normal;font-weight:800;color:#9aa7bf}
.exr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px dashed #e3eefb}
.exr .sg{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;flex:none}
.exr p{margin:0;flex:1;font-weight:600;font-size:17px;line-height:1.3}
.spk{width:44px;height:44px;border-radius:14px;background:#e7f4ff;color:#2f8fd8;display:grid;place-items:center;flex:none}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips span{background:#fff6dc;color:#9a6b00;border-radius:12px;padding:4px 10px;font-weight:700;font-size:14px}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kgrid button{background:#f4f9ff;border-radius:16px;padding:10px;text-align:left;min-height:64px}
.kgrid b{display:block;font-size:15px}.kgrid small{color:#5b6b8a;font-size:14px;font-weight:600}
.vt{width:100%;border-collapse:collapse;font-size:15px}
.vt td,.vt th{padding:6px 4px;text-align:left;border-bottom:2px solid #eef5ff}
.vt th{color:#7d8aa5;font-size:13px}
.kbig{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 28px);margin:6px 14px 18px;min-height:60px;border-radius:20px;background:#ff6f7d;color:#fff;font-weight:800;font-size:21px;box-shadow:0 6px 0 #d9485a}
.kbig:active{transform:translateY(4px);box-shadow:0 2px 0 #d9485a}
.kbig.gr{background:#3fcf9a;box-shadow:0 6px 0 #22a374}.kbig.bl{background:#59b8ff;box-shadow:0 6px 0 #2f8fd8}
.kbig[disabled]{background:#c9d3e2;box-shadow:0 6px 0 #aab6c8;cursor:default}
.back{display:flex;align-items:center;gap:6px;padding:10px 12px 0}
.back button{display:flex;align-items:center;gap:4px;font-weight:800;color:#5b6b8a;min-height:44px;padding-right:8px}
/* game */
.gtop{display:flex;align-items:center;gap:10px;padding:12px 14px}
.prog{flex:1;height:16px;background:#d6ecff;border-radius:10px;overflow:hidden}
.prog i{display:block;height:100%;background:#3fcf9a;border-radius:10px;transition:width .3s}
.hearts{display:flex;gap:2px;color:#ff5a6e}.hearts .off{color:#d0d8e4}
.garea{padding:4px 16px 16px}
.slot{min-height:120px;border-bottom:3px dashed #c3d8ee;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px 0 14px;margin-bottom:18px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wch{padding:10px 14px;background:#fff;border-radius:14px;font-weight:700;font-size:18px;box-shadow:0 4px 0 #c9dcf0;min-height:48px}
.wch.used{visibility:hidden}
.wch.sel{background:#ffe7ea;box-shadow:0 4px 0 #ff9aa6;color:#d2364b}
.wch.good{background:#dcf8ec;box-shadow:0 4px 0 #7fdcb6}
.sent{font-size:22px;font-weight:700;line-height:1.5;background:#fff;border-radius:20px;padding:16px;box-shadow:0 5px 0 #d6ecff;margin-bottom:18px}
.sent u{text-decoration:none;display:inline-block;min-width:70px;border-bottom:3px solid #59b8ff;color:#2f8fd8;text-align:center}
.opts{display:grid;gap:10px}
.opt{background:#fff;border-radius:18px;padding:14px 16px;font-weight:700;font-size:18px;box-shadow:0 5px 0 #d6ecff;text-align:left;min-height:56px;border:3px solid transparent}
.opt.sel{border-color:#59b8ff;background:#eef7ff}
.opt.right{border-color:#3fcf9a;background:#e4fbf1}.opt.wrong{border-color:#ff6f7d;background:#ffecee}
.opts.pics{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.pics .opt{text-align:center;font-size:48px;padding:12px 4px;min-height:96px;display:grid;place-items:center}
.sw{width:56px;height:56px;border-radius:16px}
.bigplay{width:120px;height:120px;border-radius:50%;margin:8px auto 22px;display:grid;place-items:center;background:#59b8ff;color:#fff;box-shadow:0 8px 0 #2f8fd8}
.bigq{font-size:96px;text-align:center;line-height:1.3;margin:0 0 14px}
.fb{padding:14px 16px 18px;border-radius:24px 24px 0 0;animation:up .2s}
.fb.ok{background:#d5f7e8;color:#167a52}.fb.no{background:#ffe3e6;color:#b42a3d}
.fb h4{margin:0;font-size:22px;display:flex;align-items:center;gap:8px}
.fb p{margin:4px 0 12px;font-weight:600;font-size:16px;color:#3d4a63}
.fb .kbig{width:100%;margin:0}
.endv{text-align:center;padding:24px 18px}
.bigstars{display:flex;justify-content:center;gap:8px;margin:12px 0}
.bigstars svg{animation:pop2 .45s backwards}
@keyframes pop2{from{transform:scale(0) rotate(-40deg)}}
.hg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hg button{background:#fff;border-radius:16px;box-shadow:0 4px 0 #d6ecff;padding:6px 2px;min-height:84px}
.hg .ar{font-size:36px;line-height:1.4;display:block;font-family:Amiri,serif}
.hg small{font-weight:700;color:#5b6b8a}
.hg button.on{background:#fff4d1}
.vg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vg button{background:#fff;border-radius:18px;box-shadow:0 4px 0 #d6ecff;padding:10px 4px;display:grid;justify-items:center;gap:4px;font-weight:800;font-size:16px}
.vg .pic{font-size:44px;line-height:1.1;height:56px;display:grid;place-items:center}
.vg .dig{font-size:40px;font-weight:800;color:#59b8ff}
.ktabs{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
.ktabs button{flex:none;padding:8px 16px;border-radius:16px;background:#fff;font-weight:800;box-shadow:0 4px 0 #d6ecff;min-height:44px}
.ktabs button.on{background:#24314a;color:#fff;box-shadow:0 4px 0 #0b1426}
.doa .ar{font-size:26px;line-height:2;text-align:right;font-family:Amiri,serif}
.doa i{display:block;color:#2f8fd8;font-weight:600;font-size:15px}
.doa p{margin:4px 0 0;font-weight:600;color:#5b6b8a;font-size:15px}
.sh{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sh button{background:#fff;border-radius:20px;box-shadow:0 5px 0 #d6ecff;padding:10px 2px;display:grid;justify-items:center;gap:2px;font-weight:800}
.sh button small{font-weight:600;color:#7d8aa5;font-size:13px}
.sh button.on{background:#fff4d1;box-shadow:0 5px 0 #ffd66b}
.sh .st{color:#e3e9f2}.sh .on .st{color:#ffc21a}
.bdg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bdg div{text-align:center;font-weight:700;font-size:13px;line-height:1.2}
.bdg div.off{opacity:.35;filter:grayscale(1)}
.prof{display:grid;gap:14px;padding:0 16px}
.prof button{display:flex;align-items:center;gap:14px;background:#fff;border-radius:26px;padding:16px;text-align:left;box-shadow:0 6px 0 #d6ecff;border:4px solid transparent}
.prof button.on{border-color:#ff6f7d}
.prof b{font-size:24px;display:block;line-height:1.1}.prof small{font-size:15px;color:#5b6b8a;font-weight:600}
.kin{width:100%;border:3px solid #d6ecff;border-radius:18px;padding:12px 14px;font-family:inherit;font-size:18px;font-weight:700;background:#fff;color:#24314a;min-height:52px}
.gate{position:absolute;inset:0;background:#24314acc;z-index:60;display:grid;place-items:center;padding:20px}
.gate>div{background:#fff;border-radius:28px;padding:22px;width:100%;max-width:340px;text-align:center}
.chest{display:flex;align-items:center;gap:12px;margin:0 14px 12px;padding:14px;border-radius:24px;background:linear-gradient(135deg,#ffcf3f,#ff9f43);color:#5a3500;font-weight:800;width:calc(100% - 28px);text-align:left;box-shadow:0 6px 0 #d9841f}

{id:'spa',g:'Past',n:'Simple Past',i:'Untuk kejadian yang sudah selesai di masa lalu, seperti cerita liburan kemarin. Kata kerjanya berubah ke bentuk ke-2 (V2).',f:'S~s|V2~v|O~o',ex:['I visited Grandma yesterday.','I did not visit Grandma.','Did you visit Grandma?'],ts:['yesterday','last night','last week','two days ago'],fill:['We ___ to the zoo last Sunday.','went',['go','went','gone']],spot:['She buyed a new bag yesterday.','buyed','bought','"Buy" adalah kata kerja tidak beraturan: buy, bought, bought.']},
{id:'pac',g:'Past',n:'Past Continuous',i:'Untuk kegiatan yang sedang berlangsung pada waktu tertentu di masa lalu, seperti sedang membaca ketika telepon berdering.',f:'S~s|was/were~x|V-ing~v|O~o',ex:['I was reading when you called.','I was not reading.','Were you reading?'],ts:['when','while','at 8 last night'],fill:['They ___ playing when it rained.','were',['was','were','are']],spot:['We was watching TV at 8 p.m.','was','were','"We" memakai were, bukan was.']},
{id:'pap',g:'Past',n:'Past Perfect',i:'Untuk kejadian yang terjadi lebih dulu sebelum kejadian lain di masa lalu. Seperti kereta yang sudah pergi sebelum kita sampai.',f:'S~s|had~x|V3~v|O~o',ex:['The train had left before we arrived.','The train had not left.','Had the train left?'],ts:['before','after','by the time','already'],fill:['When I came, Mom had ___ a cake.','baked',['bake','baked','baking']],spot:['She had eat breakfast before school.','eat','eaten','Setelah had, pakai V3: eaten.']},
{id:'ppx',g:'Past',n:'Past Perfect Continuous',i:'Untuk kegiatan yang sudah berlangsung lama sebelum kejadian lain di masa lalu.',f:'S~s|had been~x|V-ing~v|O~o',ex:['He had been waiting for an hour before the bus came.','He had not been waiting long.','Had he been waiting long?'],ts:['for','since','before','how long'],fill:['They had been ___ all day, so they were tired.','working',['work','worked','working']],spot:['I had been study for hours.','study','studying','Setelah had been, pakai V-ing: studying.']},
{id:'sfu',g:'Future',n:'Simple Future',i:'Untuk rencana atau janji di masa depan, seperti janji membantu teman besok.',f:'S~s|will~x|V1~v|O~o',ex:['I will help you tomorrow.','I will not be late.','Will you come to my party?'],ts:['tomorrow','next week','soon','later'],fill:['We will ___ Grandpa next week.','visit',['visit','visited','visits']],spot:['She will goes to school tomorrow.','goes','go','Setelah will, kata kerja selalu bentuk dasar: go.']},
{id:'fuc',g:'Future',n:'Future Continuous',i:'Untuk kegiatan yang sedang berlangsung pada waktu tertentu di masa depan.',f:'S~s|will be~x|V-ing~v|O~o',ex:['This time tomorrow, I will be flying to Bali.','I will not be sleeping at nine.','Will you be studying tonight?'],ts:['this time tomorrow','at 7 tonight','all day tomorrow'],fill:['At 8 tomorrow, I will be ___ in class.','sitting',['sit','sat','sitting']],spot:['They will be play at noon.','play','playing','Setelah will be, pakai V-ing: playing.']},
{id:'fup',g:'Future',n:'Future Perfect',i:'Untuk sesuatu yang akan sudah selesai sebelum waktu tertentu di masa depan.',f:'S~s|will have~x|V3~v|O~o',ex:['By six, I will have finished my homework.','I will not have finished it by noon.','Will you have finished by six?'],ts:['by tomorrow','by next year','by the time'],fill:['By Friday, she will have ___ the story.','written',['write','wrote','written']],spot:['By noon, we will have eat lunch.','eat','eaten','Setelah will have, pakai V3: eaten.']},
{id:'fpc',g:'Future',n:'Future Perfect Continuous',i:'Untuk menghitung berapa lama sebuah kegiatan sudah berlangsung pada waktu tertentu di masa depan.',f:'S~s|will have been~x|V-ing~v|O~o',ex:['By June, I will have been learning English for two years.','I will not have been working here for a year by June.','Will you have been living here for a year?'],ts:['for','by','by the time'],fill:['By five, he will have been ___ for three hours.','swimming',['swim','swam','swimming']],spot:['By May, she will have been teach here for ten years.','teach','teaching','Setelah will have been, pakai V-ing: teaching.']},
{id:'spf',g:'Past Future',n:'Simple Past Future',i:'Untuk "akan" yang dilihat dari masa lalu, sering dipakai saat menceritakan janji seseorang.',f:'S~s|would~x|V1~v|O~o',ex:['He said he would call me.','He said he would not be late.','Would he come the next day?'],ts:['the next day','the following week','later'],fill:['She promised she ___ help me.','would',['will','would','was']],spot:['He said he would came early.','came','come','Setelah would, kata kerja bentuk dasar: come.']},
{id:'pfc',g:'Past Future',n:'Past Future Continuous',i:'Untuk kegiatan yang (menurut rencana di masa lalu) akan sedang berlangsung.',f:'S~s|would be~x|V-ing~v|O~o',ex:['She said she would be waiting at the gate.','She said she would not be working.','Would she be waiting there?'],ts:['at that time','the next day'],fill:['He said he would be ___ at eight.','sleeping',['sleep','slept','sleeping']],spot:['They said they would be travel the next day.','travel','traveling','Setelah would be, pakai V-ing: traveling.']},
{id:'pfp',g:'Past Future',n:'Past Future Perfect',i:'Untuk sesuatu yang seharusnya sudah terjadi, tetapi tidak terjadi. Sering muncul di kalimat "kalau saja...".',f:'S~s|would have~x|V3~v|O~o',ex:['I would have helped you if I had known.','I would not have come.','Would you have helped me?'],ts:['if + had V3','by then'],fill:['If I had studied, I would have ___ the test.','passed',['pass','passed','passing']],spot:['She would have went to the party.','went','gone','Setelah would have, pakai V3: gone.']},
{id:'pfx',g:'Past Future',n:'Past Future Perfect Continuous',i:'Untuk lamanya kegiatan yang akan sudah berlangsung, dilihat dari masa lalu.',f:'S~s|would have been~x|V-ing~v|O~o',ex:['By then, she would have been living there for ten years.','He would not have been working all day.','Would he have been working all day?'],ts:['by then','for','by that time'],fill:['He said by nine he would have been ___ for three hours.','driving',['drive','drove','driving']],spot:['They would have been wait for an hour.','wait','waiting','Setelah would have been, pakai V-ing: waiting.']}
]},
B:{n:'Parts of Speech',c:'#ff9f43',sub:'Kelas kata',t:[
{id:'nou',n:'Nouns',i:'Kata benda adalah nama untuk orang, hewan, tempat, benda, atau perasaan. Ibaratnya label nama di setiap barang.',f:'Noun~o|= nama benda~e',k:[['Common','city, dog'],['Proper','Jakarta, Ali'],['Countable','apple, chair'],['Uncountable','water, sugar'],['Abstract','love, happiness'],['Concrete','table, flower'],['Collective','team, family'],['Compound','toothbrush, football']],ex:['My family lives in Jakarta.','I do not have much water.','Is your toothbrush blue?'],fill:['There is some ___ in the glass.','water',['apple','water','apples']],spot:['I have two childs.','childs','children','Child bentuk jamaknya tidak beraturan: children.']},
{id:'pro',n:'Pronouns',i:'Kata ganti dipakai supaya kita tidak mengulang nama terus-menerus. "Rina makan, Rina minum" jadi "Rina makan, she minum".',f:'Pronoun~s|menggantikan~e|Noun~o',k:[['Personal','I, you, she, they'],['Possessive','mine, yours, hers'],['Reflexive','myself, herself'],['Demonstrative','this, that, these'],['Relative','who, which, that'],['Indefinite','someone, nobody']],ex:['She made the cake herself.','This is not mine.','Who is calling?'],fill:['This bag is ___.','mine',['me','my','mine']],spot:['Him is my best friend.','him','he','Sebagai subjek, pakai he, bukan him.']},
{id:'vrb',n:'Verbs',i:'Kata kerja menunjukkan aksi atau keadaan. Ini mesin penggerak kalimat!',f:'S~s|Verb~v|O~o',k:[['Action','run, eat, jump'],['Linking','is, seem, become'],['Helping','do, have, will, can'],['Transitive','She kicks the ball.'],['Intransitive','The baby sleeps.'],['Regular','play, played, played'],['Irregular','go, went, gone']],vt:[['go','went','gone'],['eat','ate','eaten'],['write','wrote','written'],['see','saw','seen'],['buy','bought','bought'],['swim','swam','swum'],['run','ran','run'],['take','took','taken'],['play','played','played']],ex:['The baby sleeps.','He does not run fast.','Can you swim?'],fill:['Yesterday I ___ a lion at the zoo.','saw',['see','saw','seen']],spot:['She has went home.','went','gone','Setelah has, pakai V3: gone.']},
{id:'adj',n:'Adjectives & Degrees',i:'Kata sifat menjelaskan benda: besar, lucu, merah. Untuk membandingkan, pakai -er/more (lebih) dan -est/most (paling).',f:'Positive~o|Comparative (-er/more)~x|Superlative (-est/most)~v',k:[['Descriptive','big, kind'],['Quantitative','some, many'],['Demonstrative','this book'],['Possessive','my bag'],['big','bigger, biggest'],['good','better, best'],['beautiful','more / most beautiful']],ex:['The elephant is bigger than the horse.','This cake is not too sweet.','Which is the tallest building?'],fill:['Ali is ___ than his brother.','taller',['tall','taller','tallest']],spot:['This is the most biggest box.','most','the biggest','Biggest sudah berarti "paling", jadi "most" tidak perlu.']},
{id:'osa',n:'Royal Order (OSASCOMP)',i:'Kalau ada banyak kata sifat, urutannya seperti barisan upacara: Opinion, Size, Age, Shape, Color, Origin, Material, Purpose.',f:'Opinion~s|Size~x|Age~v|Shape~o|Color~e|Origin~s|Material~x|Purpose~v',k:[['Opinion','lovely'],['Size','small'],['Age','old'],['Shape','round'],['Color','red'],['Origin','Japanese'],['Material','wooden'],['Purpose','sleeping (bag)']],ex:['I have a cute small brown dog.','It is not a big red ball.','Is it a beautiful old wooden chair?'],fill:['She wears a ___ dress.','beautiful long red',['red long beautiful','beautiful long red','long red beautiful']],spot:['I bought a red big ball.','red','big red','Size (big) harus sebelum Color (red): a big red ball.']},
{id:'adv',n:'Adverbs',i:'Kata keterangan menjelaskan bagaimana, di mana, kapan, seberapa sering, dan seberapa banyak sesuatu terjadi.',f:'S~s|Verb~v|Adverb~e',k:[['Manner','slowly, happily'],['Place','here, outside'],['Time','yesterday, now'],['Frequency','always, never'],['Degree','very, too']],ex:['The turtle walks slowly.','He does not speak loudly.','Do you always wake up early?'],fill:['The cheetah runs very ___.','quickly',['quick','quickly','quicker']],spot:['She sings beautiful.','beautiful','beautifully','Untuk menjelaskan cara bernyanyi, pakai adverb: beautifully.']},
{id:'pre',n:'Prepositions',i:'Kata depan menunjukkan posisi dan waktu: di dalam, di atas, di bawah, pada jam berapa.',f:'Noun~o|Preposition~x|Place/Time~e',k:[['in','in the box, in May'],['on','on the table, on Monday'],['at','at school, at 7'],['under','under the bed'],['between','between two trees'],['next to','next to me']],ex:['The cat is under the table.','The book is not on the shelf.','Is the ball in the box?'],fill:['School starts ___ seven o\'clock.','at',['in','on','at']],spot:['My birthday is in May 5th.','in','on','Untuk tanggal lengkap, pakai on: on May 5th.']},
{id:'con',n:'Conjunctions',i:'Kata sambung adalah lem yang menyatukan kata atau kalimat. Ingat FANBOYS: For, And, Nor, But, Or, Yet, So.',f:'Kalimat 1~s|Conjunction~x|Kalimat 2~o',k:[['FANBOYS','for, and, nor, but, or, yet, so'],['Subordinating','because, although, when, if']],ex:['I was hungry, so I ate rice.','I like tea, but I do not like coffee.','Do you want milk or juice?'],fill:['She stayed home ___ she was sick.','because',['but','because','or']],spot:['I was tired, but I went to bed early.','but','so','Karena capek lalu tidur, hubungannya sebab-akibat: so.']},
{id:'int',n:'Interjections',i:'Kata seru untuk menunjukkan perasaan: kaget, senang, sakit. Biasanya diikuti tanda seru!',f:'Interjection~v|!~e|Kalimat~o',k:[['Wow!','kagum'],['Yay!','senang'],['Ouch!','sakit'],['Oops!','tidak sengaja'],['Hooray!','merayakan']],ex:['Wow! What a beautiful garden!','Oh no, I did not bring my bag!','Hey, are you okay?'],fill:['___! I hurt my finger.','Ouch',['Yay','Ouch','Hooray']],spot:['Yay! I fell down and hurt my knee.','yay','Ouch','Jatuh itu sakit, jadi pakai Ouch, bukan Yay.']}
]},
C:{n:'Grammar Ahli',c:'#5c6bc0',sub:'Struktur lanjutan',t:[
{id:'ger',n:'Gerunds',i:'Gerund adalah kata kerja + ing yang berubah jadi kata benda. "Swimming" artinya kegiatan berenang.',f:'V-ing~v|= Noun~o',ex:['Swimming is my favorite sport.','I do not like waiting.','Do you enjoy reading?'],fill:['I enjoy ___ stories.','reading',['read','to read','reading']],spot:['She is good at draw.','draw','drawing','Setelah kata depan (at), pakai gerund: drawing.']},
{id:'inf',n:'Infinitives',i:'Infinitive adalah to + kata kerja dasar. Sering dipakai untuk tujuan atau keinginan.',f:'to~x|V1~v',ex:['I want to be a doctor.','She decided not to go.','Do you want to play?'],fill:['We hope ___ you soon.','to see',['see','to see','seeing']],spot:['I want to buying a kite.','buying','buy','Setelah to, pakai kata kerja dasar: buy.']},
{id:'par',n:'Participles',i:'Present participle (-ing) untuk yang membuat perasaan, past participle (V3) untuk yang merasakan. Filmnya boring, kamunya bored.',f:'V-ing~v|/~e|V3~x|sebagai sifat~o',k:[['Present','exciting, crying baby'],['Past','excited, broken glass']],ex:['The movie was exciting.','I am not bored.','Did you see the broken window?'],fill:['I am ___ in science.','interested',['interesting','interested','interest']],spot:['The story was very interested.','interested','interesting','Cerita yang membuat tertarik: interesting.']},
{id:'ncl',n:'Noun Clause',i:'Anak kalimat yang berperan sebagai kata benda, biasanya dimulai dengan that, what, where, why.',f:'S~s|V~v|that/wh-~x|S + V~o',ex:['I know that she is kind.','I do not know where he lives.','Do you know what time it is?'],fill:['Tell me ___ you live.','where',['where','what','who']],spot:['I do not know where does he live.','does','where he lives','Dalam noun clause, urutannya S + V tanpa does: where he lives.']},
{id:'acl',n:'Adjective Clause',i:'Anak kalimat yang menjelaskan kata benda, memakai who (orang), which (benda), that (keduanya).',f:'Noun~o|who/which/that~x|Clause~e',ex:['The girl who sits next to me is kind.','This is not the book that I wanted.','Is this the cat which you found?'],fill:['The man ___ lives next door is a doctor.','who',['who','which','where']],spot:['The book who I read was funny.','who','which','Untuk benda, pakai which atau that.']},
{id:'avc',n:'Adverbial Clause',i:'Anak kalimat yang menjelaskan kapan, kenapa, atau dalam kondisi apa: when, because, although, if.',f:'When/Because/Although~x|S + V~s|,~e|Main clause~o',ex:['When it rains, I stay at home.','Although he was tired, he did not stop.','Will you call me when you arrive?'],fill:['___ she was sick, she went to school.','Although',['Because','Although','So']],spot:['Because it was raining, so we stayed home.','so','(hapus so)','Sudah ada because, jadi tidak perlu so.']},
{id:'pph',n:'Prepositional Phrase',i:'Kelompok kata yang dimulai dengan preposition dan diakhiri kata benda: on the roof, in my bag.',f:'Preposition~x|(the)~e|Noun~o',ex:['The cat on the roof is mine.','The keys are not in my bag.','Is the book under the bed?'],fill:['We played football ___ the rain.','in',['in','at','of']],spot:['She is sitting at the chair.','at','on','Duduk di atas kursi: on the chair.']},
{id:'cnd',n:'Conditionals',i:'Kalimat "jika". Type 0 fakta, Type 1 mungkin terjadi, Type 2 khayalan sekarang, Type 3 penyesalan masa lalu, Mixed campuran.',f:'If~x|condition~s|,~e|result~o',k:[['Type 0','If you heat ice, it melts.'],['Type 1','If it rains, I will stay home.'],['Type 2','If I were a bird, I would fly.'],['Type 3','If I had studied, I would have passed.'],['Mixed','If I had slept early, I would not be tired now.']],ex:['If it rains, I will stay home.','If you do not hurry, you will be late.','What would you do if you were rich?'],fill:['If I ___ a bird, I would fly.','were',['am','were','will be']],spot:['If I am rich, I would buy a big house.','am','were','Type 2 (khayalan) memakai were: If I were rich.']},
{id:'pas',n:'Passive Voice',i:'Kalimat pasif fokus pada benda yang dikenai pekerjaan. Rumusnya be + V3.',f:'Object~o|be~x|V3~v|(by + pelaku)~e',k:[['Simple Present','is/are + V3'],['Simple Past','was/were + V3'],['Present Perfect','has/have been + V3'],['Simple Future','will be + V3']],ex:['The cake was made by Mom.','The room is not cleaned every day.','Was the window broken by the wind?'],fill:['English ___ spoken all over the world.','is',['is','are','does']],spot:['The letter was write by Dina.','write','written','Kalimat pasif memakai V3: written.']},
{id:'rep',n:'Reported Speech',i:'Menceritakan ulang ucapan orang lain. Tense-nya biasanya mundur satu langkah: am jadi was.',f:'S~s|said (that)~x|S + V mundur~o',ex:['She said that she was hungry.','He said that he did not like fish.','Did she say that she was tired?'],fill:['Ali said, "I am happy." Ali said that he ___ happy.','was',['is','was','were']],spot:['She said that she is tired yesterday.','is','was','Reported speech: is mundur menjadi was.']},
{id:'mod',n:'Modals & Semi-Modals',i:'Kata bantu yang memberi makna bisa, boleh, harus, sebaiknya: can, could, may, might, must, shall, should, will, would, ought to, used to.',f:'S~s|Modal~x|V1~v|O~o',k:[['can / could','bisa'],['may / might','boleh / mungkin'],['must','harus'],['should / ought to','sebaiknya'],['shall / will','akan'],['would','akan (lampau)'],['used to','dulu biasanya']],ex:['You should drink more water.','You must not run in the hall.','Can you help me?'],fill:['I ___ swim when I was five.','could',['can','could','must']],spot:['She can sings very well.','sings','sing','Setelah modal, kata kerja bentuk dasar: sing.']},
{id:'sva',n:'Subject-Verb Agreement',i:'Subjek dan kata kerja harus cocok seperti pasangan sepatu: tunggal dengan tunggal, jamak dengan jamak.',f:'Singular S~s|V+s~v|/~e|Plural S~o|V1~x',ex:['My brother plays the guitar.','The dogs do not bark at night.','Does everyone have a pencil?'],fill:['Each of the students ___ a book.','has',['have','has','having']],spot:['The children is playing outside.','is','are','Children itu jamak, jadi pakai are.']},
{id:'qtg',n:'Question Tags',i:'Pertanyaan pendek di akhir kalimat untuk memastikan, seperti "kan?". Kalimat positif, tag-nya negatif, dan sebaliknya.',f:'Kalimat +~s|,~e|tag −?~v',ex:["You are hungry, aren't you?",'She does not like milk, does she?',"He can swim, can't he?"],fill:['They went home, ___?',"didn't they",['did they',"didn't they","weren't they"]],spot:["She is your sister, isn't it?",'it','she','Tag memakai pronoun yang sesuai subjek: she.']},
{id:'cau',n:'Causative Verbs',i:'Untuk menyuruh atau membiarkan orang lain melakukan sesuatu: have, get, make, let.',f:'S~s|have/get/make/let~x|someone~o|V1/V3~v',k:[['have','I had my hair cut.'],['get','I got my bike fixed.'],['make','Mom made me clean my room.'],['let','Dad let me play outside.']],ex:['I had my hair cut.','Mom does not let me stay up late.','Did you get your bike fixed?'],fill:['My teacher made us ___ a poem.','write',['to write','write','writing']],spot:['Dad let me to play games.','to','(hapus to)','Setelah let + orang, langsung kata kerja dasar: let me play.']}
]}};

const isAr=s=>/[؀-ۿ]/.test(s||'');

  text=text.replace(/^﻿/,'').trim();const out=Array.from({length:114},()=>[]);

    let j=JSON.parse(text);if(!Array.isArray(j))j=j.chapters||j.surahs||(j.data&&j.data.surahs)||Object.values(j);
    j.forEach((s,i)=>{const n=(+(s.number||s.chapter||s.id)||i+1)-1;if(n<0||n>113)return;let vs=s.verses||s.ayahs||s.ayat||[];if(!Array.isArray(vs))vs=Object.values(vs);
      vs.forEach((v,k)=>{if(typeof v==='string'){out[n][k]=[isAr(v)?v:'',isAr(v)?'':v];return}const tx=typeof v.text==='object'&&v.text?(v.text.arab||v.text.ar||''):(v.text||v.arabic||v.ar||'');const tr=typeof v.translation==='string'?v.translation:v.translation&&typeof v.translation==='object'?(v.translation.id||v.translation.text||''):(v.terjemah||v.id_translation||'');out[n][k]=[isAr(tx)?tx:'',(isAr(tx)?tr:tr||tx)||'']})});
  }else{for(const line of text.split(/\r?\n/)){const m=line.match(/^(\d{1,3})\|(\d{1,3})\|(.*)$/);if(m){const t=m[3].trim();out[m[1]-1][m[2]-1]=isAr(t)?[t,'']:['',t]}}}
  return out;
}

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const r=$('#app').getBoundingClientRect(),c=document.createElement('canvas');c.className='conf';Object.assign(c.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});document.body.appendChild(c);const W=c.width=r.width,H=c.height=r.height,x=c.getContext('2d'),cols=['#ffcf3f','#ff6f7d','#59b8ff','#3fcf9a','#9b7bff'];const P=Array.from({length:150},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*13,vy:-Math.random()*13-4,r:Math.random()*7+4,c:cols[Math.random()*5|0],a:Math.random()*6}));let f=0;const step=()=>{x.clearRect(0,0,W,H);for(const p of P){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()}if(++f<160)requestAnimationFrame(step);else c.remove()};step()}

 niat:["أُصَلِّيْ سُنَّةَ الضُّحٰى رَكْعَتَيْنِ لِلّٰهِ تَعَالٰى","Ushallî sunnatadh-dhuhâ rak'ataini lillâhi ta'âlâ","Aku niat sholat sunnah Dhuha dua rakaat karena Allah Ta'ala."],
 cara:CARA2.concat(["Banyak yang membaca Asy-Syams/Ad-Duha di rakaat pertama dan Al-Lail/Al-Ikhlas di rakaat kedua (tidak wajib)","Ulangi untuk rakaat berikutnya, lalu berdoa"]),
 baca:[["Doa setelah sholat Dhuha","اَللّٰهُمَّ إِنَّ الضُّحَاءَ ضُحَاؤُكَ، وَالْبَهَاءَ بَهَاؤُكَ، وَالْجَمَالَ جَمَالُكَ، وَالْقُوَّةَ قُوَّتُكَ، وَالْقُدْرَةَ قُدْرَتُكَ، وَالْعِصْمَةَ عِصْمَتُكَ. اَللّٰهُمَّ إِنْ كَانَ رِزْقِيْ فِي السَّمَاءِ فَأَنْزِلْهُ، وَإِنْ كَانَ فِي الْأَرْضِ فَأَخْرِجْهُ، وَإِنْ كَانَ مُعْسَرًا فَيَسِّرْهُ، وَإِنْ كَانَ حَرَامًا فَطَهِّرْهُ، وَإِنْ كَانَ بَعِيْدًا فَقَرِّبْهُ، بِحَقِّ ضُحَائِكَ وَبَهَائِكَ وَجَمَالِكَ وَقُوَّتِكَ وَقُدْرَتِكَ، آتِنِيْ مَا آتَيْتَ عِبَادَكَ الصَّالِحِيْنَ","Allâhumma innadh-dhuhâ'a dhuhâ'uka, wal-bahâ'a bahâ'uka, wal-jamâla jamâluka, wal-quwwata quwwatuka, wal-qudrata qudratuka, wal-'ishmata 'ishmatuka. Allâhumma in kâna rizqî fis-samâ'i fa anzilhu, wa in kâna fil-ardhi fa akhrijhu, wa in kâna mu'saran fa yassirhu, wa in kâna harâman fa thahhirhu, wa in kâna ba'îdan fa qarribhu, bi haqqi dhuhâ'ika wa bahâ'ika wa jamâlika wa quwwatika wa qudratika, âtinî mâ âtaita 'ibâdakash-shâlihîn","Ya Allah, waktu dhuha adalah waktu-Mu, keagungan adalah keagungan-Mu, keindahan adalah keindahan-Mu, kekuatan adalah kekuatan-Mu, kekuasaan adalah kekuasaan-Mu, perlindungan adalah perlindungan-Mu. Ya Allah, jika rezekiku di langit turunkanlah, jika di bumi keluarkanlah, jika sulit mudahkanlah, jika haram sucikanlah, jika jauh dekatkanlah. Berikanlah kepadaku apa yang Engkau berikan kepada hamba-hamba-Mu yang saleh."]],
 ket:"Dilakukan saat matahari sudah naik sampai sebelum masuk waktu zuhur. Pahalanya disebut setara sedekah bagi setiap persendian tubuh."},
{id:"tahajud",n:"Sholat Tahajud",rk:"Minimal 2 rakaat, tidak dibatasi (salam tiap 2), ditutup witir",hk:"Sunnah muakkad",wk:"tahajud",
 niat:["أُصَلِّيْ سُنَّةَ التَّهَجُّدِ رَكْعَتَيْنِ لِلّٰهِ تَعَالٰى","Ushallî sunnatat-tahajjudi rak'ataini lillâhi ta'âlâ","Aku niat sholat sunnah Tahajud dua rakaat karena Allah Ta'ala."],
 cara:["Tidur dulu setelah Isya, lalu bangun di malam hari"].concat(CARA2,["Lanjutkan 2 rakaat berikutnya sesuai kemampuan","Tutup dengan sholat witir, lalu berdoa dan beristighfar"]),
 baca:[["Doa sholat Tahajud (HR. Bukhari)","اَللّٰهُمَّ لَكَ الْحَمْدُ أَنْتَ قَيِّمُ السَّمٰوَاتِ وَالْأَرْضِ وَمَنْ فِيْهِنَّ، وَلَكَ الْحَمْدُ أَنْتَ نُوْرُ السَّمٰوَاتِ وَالْأَرْضِ وَمَنْ فِيْهِنَّ، وَلَكَ الْحَمْدُ أَنْتَ الْحَقُّ، وَوَعْدُكَ الْحَقُّ، وَلِقَاؤُكَ حَقٌّ، وَقَوْلُكَ حَقٌّ، وَالْجَنَّةُ حَقٌّ، وَالنَّارُ حَقٌّ، وَالنَّبِيُّوْنَ حَقٌّ، وَمُحَمَّدٌ حَقٌّ، وَالسَّاعَةُ حَقٌّ. اَللّٰهُمَّ لَكَ أَسْلَمْتُ، وَبِكَ آمَنْتُ، وَعَلَيْكَ تَوَكَّلْتُ، وَإِلَيْكَ أَنَبْتُ، وَبِكَ خَاصَمْتُ، وَإِلَيْكَ حَاكَمْتُ، فَاغْفِرْ لِيْ مَا قَدَّمْتُ وَمَا أَخَّرْتُ، وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ، أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ، لَا إِلٰهَ إِلَّا أَنْتَ","Allâhumma lakal-hamdu anta qayyimus-samâwâti wal-ardhi wa man fîhinna, wa lakal-hamdu anta nûrus-samâwâti wal-ardhi wa man fîhinna, wa lakal-hamdu antal-haqq, wa wa'dukal-haqq, wa liqâ'uka haqq, wa qauluka haqq, wal-jannatu haqq, wan-nâru haqq, wan-nabiyyûna haqq, wa Muhammadun haqq, was-sâ'atu haqq. Allâhumma laka aslamtu, wa bika âmantu, wa 'alaika tawakkaltu, wa ilaika anabtu, wa bika khâshamtu, wa ilaika hâkamtu, faghfir lî mâ qaddamtu wa mâ akhkhartu, wa mâ asrartu wa mâ a'lantu, antal-muqaddimu wa antal-mu'akhkhiru, lâ ilâha illâ anta","Ya Allah, segala puji bagi-Mu, Engkaulah penegak langit, bumi, dan isinya; Engkaulah cahaya langit, bumi, dan isinya. Engkaulah Yang Haq, janji-Mu benar, pertemuan dengan-Mu benar, firman-Mu benar, surga benar, neraka benar, para nabi benar, Muhammad benar, dan hari kiamat benar. Ya Allah, kepada-Mu aku berserah, kepada-Mu aku beriman, kepada-Mu aku bertawakal, kepada-Mu aku kembali. Ampunilah dosaku yang lalu dan yang akan datang, yang tersembunyi dan yang tampak. Engkaulah Yang Mendahulukan dan Yang Mengakhirkan. Tiada tuhan selain Engkau."]],
 ket:"Waktu terbaik sepertiga malam terakhir. Termasuk qiyamul lail yang sangat dianjurkan."},
{id:"witir",n:"Sholat Witir",rk:"Ganjil: 1, 3, 5 … 11 rakaat",hk:"Sunnah muakkad",wk:"witir",
 niat:["أُصَلِّيْ سُنَّةَ الْوِتْرِ رَكْعَةً لِلّٰهِ تَعَالٰى","Ushallî sunnatal-witri rak'atan lillâhi ta'âlâ","Aku niat sholat sunnah Witir satu rakaat karena Allah Ta'ala. (Untuk 2 rakaat: rak'ataini; 3 rakaat: tsalâtsa raka'âtin)"],
 cara:["Untuk 3 rakaat: kerjakan 2 rakaat lalu salam, kemudian 1 rakaat lalu salam; atau 3 rakaat sekaligus dengan satu tasyahud akhir","Surah yang sering dibaca: Al-A'la (rakaat 1), Al-Kafirun (rakaat 2), Al-Ikhlas, Al-Falaq, An-Nas (rakaat 3)","Pada separuh akhir Ramadan, sebagian mazhab membaca qunut di rakaat terakhir","Jadikan witir sebagai penutup sholat malam"],
 baca:[["Dzikir setelah witir (dibaca 3×)","سُبْحَانَ الْمَلِكِ الْقُدُّوْسِ","Subhânal-malikil-quddûs","Mahasuci Raja Yang Mahasuci."]],
 ket:"Waktunya setelah Isya sampai sebelum Subuh."},
{id:"rawatib",n:"Sholat Rawatib",rk:"2 rakaat (zuhur dan asar boleh 4)",hk:"Muakkad & ghairu muakkad",wk:"rawatib",
 niat:["أُصَلِّيْ سُنَّةَ الصُّبْحِ رَكْعَتَيْنِ قَبْلِيَّةً لِلّٰهِ تَعَالٰى","Ushallî sunnatash-shubhi rak'ataini qabliyyatan lillâhi ta'âlâ","Aku niat sholat sunnah sebelum Subuh dua rakaat karena Allah Ta'ala. Ganti nama waktunya (azh-zhuhri, al-'ashri, al-maghribi, al-'isyâ'i) dan qabliyyatan (sebelum) / ba'diyyatan (sesudah)."],
 cara:["Muakkad (sangat dianjurkan): 2 sebelum Subuh, 2 atau 4 sebelum Zuhur, 2 sesudah Zuhur, 2 sesudah Magrib, 2 sesudah Isya","Ghairu muakkad: 2 atau 4 sebelum Asar, 2 sebelum Magrib, 2 sebelum Isya","Tidak ada rawatib sesudah Subuh dan sesudah Asar","Tata cara sama seperti sholat 2 rakaat biasa"],
 baca:[],ket:"Dua rakaat sebelum Subuh disebut lebih baik daripada dunia dan isinya (HR. Muslim)."},
{id:"taubat",n:"Sholat Taubat",rk:"2 rakaat",hk:"Sunnah",wk:"bebas",
 niat:["أُصَلِّيْ سُنَّةَ التَّوْبَةِ رَكْعَتَيْنِ لِلّٰهِ تَعَالٰى","Ushallî sunnatat-taubati rak'ataini lillâhi ta'âlâ","Aku niat sholat sunnah Taubat dua rakaat karena Allah Ta'ala."],
 cara:CARA2.concat(["Setelah salam, perbanyak istighfar dan baca Sayyidul Istighfar","Syarat taubat: menyesal, berhenti dari dosa, bertekad tidak mengulang, dan mengembalikan hak orang lain bila terkait sesama"]),
 baca:[["Sayyidul Istighfar","اَللّٰهُمَّ أَنْتَ رَبِّيْ لَا إِلٰهَ إِلَّا أَنْتَ، خَلَقْتَنِيْ وَأَنَا عَبْدُكَ، وَأَنَا عَلٰى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوْذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوْءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوْءُ بِذَنْبِيْ فَاغْفِرْ لِيْ، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوْبَ إِلَّا أَنْتَ","Allâhumma anta rabbî lâ ilâha illâ anta, khalaqtanî wa ana 'abduka, wa ana 'alâ 'ahdika wa wa'dika mastatha'tu, a'ûdzu bika min syarri mâ shana'tu, abû'u laka bini'matika 'alayya, wa abû'u bidzanbî faghfir lî, fa innahû lâ yaghfirudz-dzunûba illâ anta","Ya Allah, Engkau Tuhanku, tiada tuhan selain Engkau. Engkau menciptakanku dan aku hamba-Mu. Aku berada di atas janji-Mu semampuku. Aku berlindung kepada-Mu dari keburukan perbuatanku. Aku mengakui nikmat-Mu kepadaku dan mengakui dosaku, maka ampunilah aku, karena tidak ada yang mengampuni dosa selain Engkau."]],
 ket:"Dikerjakan kapan saja setelah berbuat dosa, di luar waktu terlarang sholat."},
{id:"hajat",n:"Sholat Hajat",rk:"2–12 rakaat (salam tiap 2)",hk:"Sunnah",wk:"bebas",
 niat:["أُصَلِّيْ سُنَّةَ الْحَاجَةِ رَكْعَتَيْنِ لِلّٰهِ تَعَالٰى","Ushallî sunnatal-hâjati rak'ataini lillâhi ta'âlâ","Aku niat sholat sunnah Hajat dua rakaat karena Allah Ta'ala."],
 cara:CARA2.concat(["Setelah salam, memuji Allah, bershalawat, lalu membaca doa hajat dan menyebut keperluan"]),
 baca:[["Doa sholat Hajat (HR. Tirmidzi)","لَا إِلٰهَ إِلَّا اللّٰهُ الْحَلِيْمُ الْكَرِيْمُ، سُبْحَانَ اللّٰهِ رَبِّ الْعَرْشِ الْعَظِيْمِ، اَلْحَمْدُ لِلّٰهِ رَبِّ الْعَالَمِيْنَ، أَسْأَلُكَ مُوْجِبَاتِ رَحْمَتِكَ، وَعَزَائِمَ مَغْفِرَتِكَ، وَالْغَنِيْمَةَ مِنْ كُلِّ بِرٍّ، وَالسَّلَامَةَ مِنْ كُلِّ إِثْمٍ، لَا تَدَعْ لِيْ ذَنْبًا إِلَّا غَفَرْتَهُ، وَلَا هَمًّا إِلَّا فَرَّجْتَهُ، وَلَا حَاجَةً هِيَ لَكَ رِضًا إِلَّا قَضَيْتَهَا يَا أَرْحَمَ الرَّاحِمِيْنَ","Lâ ilâha illallâhul-halîmul-karîm, subhânallâhi rabbil-'arsyil-'azhîm, al-hamdu lillâhi rabbil-'âlamîn, as'aluka mûjibâti rahmatik, wa 'azâ'ima maghfiratik, wal-ghanîmata min kulli birr, was-salâmata min kulli itsm, lâ tada' lî dzanban illâ ghafartah, wa lâ hamman illâ farrajtah, wa lâ hâjatan hiya laka ridhan illâ qadhaitahâ yâ arhamar-râhimîn","Tiada tuhan selain Allah Yang Maha Penyantun lagi Maha Mulia. Mahasuci Allah, Tuhan Arsy yang agung. Segala puji bagi Allah, Tuhan semesta alam. Aku memohon hal-hal yang mendatangkan rahmat-Mu, ampunan-Mu, keuntungan dari setiap kebaikan, dan keselamatan dari setiap dosa. Jangan biarkan satu dosa pun kecuali Engkau ampuni, satu kesedihan kecuali Engkau lapangkan, dan satu hajat yang Engkau ridai kecuali Engkau penuhi, wahai Yang Maha Penyayang."]],
 ket:"Dikerjakan ketika memiliki keperluan penting, di luar waktu terlarang. Sebagian ulama menilai hadisnya lemah tetapi boleh diamalkan untuk keutamaan."},
{id:"istikharah",n:"Sholat Istikharah",rk:"2 rakaat",hk:"Sunnah",wk:"bebas",
 niat:["أُصَلِّيْ سُنَّةَ الْاِسْتِخَارَةِ رَكْعَتَيْنِ لِلّٰهِ تَعَالٰى","Ushallî sunnatal-istikhârati rak'ataini lillâhi ta'âlâ","Aku niat sholat sunnah Istikharah dua rakaat karena Allah Ta'ala."],
 cara:CARA2.concat(["Setelah salam, baca doa istikharah. Saat sampai \"hâdzal-amra\", sebutkan urusan yang sedang dipilih","Lalu jalani pilihan yang paling dimantapkan hati dan dimudahkan jalannya"]),
 baca:[["Doa Istikharah (HR. Bukhari)","اَللّٰهُمَّ إِنِّيْ أَسْتَخِيْرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيْمِ، فَإِنَّكَ تَقْدِرُ وَلَا أَقْدِرُ، وَتَعْلَمُ وَلَا أَعْلَمُ، وَأَنْتَ عَلَّامُ الْغُيُوْبِ. اَللّٰهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هٰذَا الْأَمْرَ خَيْرٌ لِيْ فِيْ دِيْنِيْ وَمَعَاشِيْ وَعَاقِبَةِ أَمْرِيْ فَاقْدُرْهُ لِيْ وَيَسِّرْهُ لِيْ ثُمَّ بَارِكْ لِيْ فِيْهِ، وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هٰذَا الْأَمْرَ شَرٌّ لِيْ فِيْ دِيْنِيْ وَمَعَاشِيْ وَعَاقِبَةِ أَمْرِيْ فَاصْرِفْهُ عَنِّيْ وَاصْرِفْنِيْ عَنْهُ، وَاقْدُرْ لِيَ الْخَيْرَ حَيْثُ كَانَ ثُمَّ أَرْضِنِيْ بِهِ","Allâhumma innî astakhîruka bi 'ilmik, wa astaqdiruka bi qudratik, wa as'aluka min fadhlikal-'azhîm, fa innaka taqdiru wa lâ aqdir, wa ta'lamu wa lâ a'lam, wa anta 'allâmul-ghuyûb. Allâhumma in kunta ta'lamu anna hâdzal-amra khairun lî fî dînî wa ma'âsyî wa 'âqibati amrî faqdurhu lî wa yassirhu lî tsumma bârik lî fîh, wa in kunta ta'lamu anna hâdzal-amra syarrun lî fî dînî wa ma'âsyî wa 'âqibati amrî fashrifhu 'annî washrifnî 'anhu, waqdur liyal-khaira haitsu kâna tsumma ardhinî bih","Ya Allah, aku memohon pilihan kepada-Mu dengan ilmu-Mu, memohon kemampuan dengan kuasa-Mu, dan memohon karunia-Mu yang agung. Engkau Mahakuasa sedang aku tidak, Engkau Maha Mengetahui sedang aku tidak, Engkau Maha Mengetahui yang gaib. Ya Allah, jika urusan ini baik bagi agamaku, kehidupanku, dan akhir urusanku, takdirkanlah, mudahkanlah, lalu berkahilah. Jika urusan ini buruk bagiku, jauhkanlah ia dariku dan jauhkan aku darinya, takdirkan kebaikan di mana pun berada, lalu jadikan aku rida dengannya."]],
 ket:"Untuk memohon petunjuk dalam memilih perkara yang mubah (boleh), misalnya pekerjaan, jodoh, atau keputusan penting."},
{id:"jenazah",n:"Sholat Jenazah",rk:"4 takbir, tanpa rukuk dan sujud",hk:"Fardhu kifayah",wk:"jenazah",
 niat:["أُصَلِّيْ عَلٰى هٰذَا الْمَيِّتِ أَرْبَعَ تَكْبِيْرَاتٍ فَرْضَ كِفَايَةٍ لِلّٰهِ تَعَالٰى","Ushallî 'alâ hâdzal-mayyiti arba'a takbîrâtin fardha kifâyatin lillâhi ta'âlâ","Aku niat sholat atas jenazah ini empat takbir, fardhu kifayah karena Allah Ta'ala. (Jenazah perempuan: 'alâ hâdzihil-mayyitati)"],
 cara:["Dikerjakan sambil berdiri, menghadap kiblat, jenazah di depan","Takbir 1: membaca Al-Fatihah","Takbir 2: membaca shalawat Ibrahimiyah","Takbir 3: mendoakan jenazah","Takbir 4: berdoa untuk jenazah dan yang ditinggalkan","Salam"],
 baca:[SHALAWAT,["Doa setelah takbir ketiga","اَللّٰهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ","Allâhummaghfir lahû warhamhû wa 'âfihî wa'fu 'anhu (perempuan: lahâ, warhamhâ, wa 'âfihâ, wa'fu 'anhâ)","Ya Allah, ampunilah dia, rahmatilah dia, selamatkanlah dia, dan maafkanlah dia."],
  ["Doa setelah takbir keempat","اَللّٰهُمَّ لَا تَحْرِمْنَا أَجْرَهُ وَلَا تَفْتِنَّا بَعْدَهُ وَاغْفِرْ لَنَا وَلَهُ","Allâhumma lâ tahrimnâ ajrahû wa lâ taftinnâ ba'dahû waghfir lanâ wa lahû (perempuan: ajrahâ, ba'dahâ, wa lahâ)","Ya Allah, jangan halangi kami dari pahalanya, jangan beri kami fitnah sepeninggalnya, dan ampunilah kami dan dia."]],
 ket:"Wajib dikerjakan oleh sebagian kaum muslimin untuk setiap muslim yang wafat; bila sudah ada yang mengerjakan, gugur kewajiban yang lain."},
{id:"mutlak",n:"Sholat Sunnah Mutlak",rk:"Bebas, salam tiap 2 rakaat",hk:"Sunnah",wk:"bebas",
 niat:["أُصَلِّيْ سُنَّةً رَكْعَتَيْنِ لِلّٰهِ تَعَالٰى","Ushallî sunnatan rak'ataini lillâhi ta'âlâ","Aku niat sholat sunnah dua rakaat karena Allah Ta'ala."],
 cara:CARA2,baca:[],ket:"Sholat sunnah tanpa sebab dan waktu khusus. Boleh kapan saja selain waktu terlarang."},
{id:"tahiyat",n:"Tahiyatul Masjid",rk:"2 rakaat",hk:"Sunnah",wk:"masjid",

  const e=EDS.find(x=>x.id===id);if(!e)return;if(e.src==='base'){downloadQuran();return}
  if(edBusy){toast('Tunggu unduhan yang sedang berjalan');return}
  if(!navigator.onLine){toast('Butuh internet untuk mengunduh sekali');return}
  edBusy=id;render(true);toast(`Mengunduh ${e.n}…`);
  try{const out=Array.from({length:114},()=>[]);
    if(e.src==='aqc'){const r=await fetch('https://api.alquran.cloud/v1/quran/'+e.key);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();
      j.data.surahs.forEach(s=>s.ayahs.forEach((a,k)=>{out[s.number-1][k]=k===0&&s.number!==1&&s.number!==9?stripBism(a.text):a.text}))}
    else{let ok=false;
      try{const r=await fetch('https://api.quran.com/api/v4/quran/verses/'+e.key);if(r.ok){const j=await r.json();(j.verses||[]).forEach(v=>{const[s,a]=v.verse_key.split(':').map(Number);out[s-1][a-1]=v['text_'+e.key]});ok=(j.verses||[]).length>6000}}catch(_){}
      if(!ok){for(let s=1;s<=114;s++){const r=await fetch(`https://api.quran.com/api/v4/quran/verses/${e.key}?chapter_number=${s}`);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();j.verses.forEach(v=>{const a=+v.verse_key.split(':')[1];out[s-1][a-1]=v['text_'+e.key]});if(s%20===0)toast(`${e.n}: ${s}/114 surat…`)}}}
    const n=out.reduce((a,s)=>a+s.filter(Boolean).length,0);if(n<6000)throw new Error('data tidak lengkap');
    EDATA[id]=out;try{await idb('readwrite',st=>st.put(out,'ed-'+id))}catch(_){toast('Tersimpan untuk sesi ini saja')}
    if(id==='tajweed')S.q.tj=true;else S.q.ed=id;save();toast(`${e.n} tersimpan (${n.toLocaleString('id-ID')} ayat), bisa dipakai offline`)}
  catch(err){toast('Gagal mengunduh. Pastikan ada internet. Di pratinjau Claude unduhan memang diblokir.')}
  finally{edBusy=null;render(true)}}
function upcomingFasts(n=8){const out=[];for(let i=0;i<75&&out.length<n;i++){const d=dayDate(i),h=hparts(d);if(!h)break;const wd=d.getUTCDay(),k=h.m+'-'+h.d;
  if(k==='10-1'||k==='12-10'||(h.m===12&&h.d>=11&&h.d<=13))continue;const tg=[];
  if(h.m===9)tg.push('Ramadan (wajib)');if(k==='12-9')tg.push('Arafah');else if(h.m===12&&h.d<=8)tg.push(h.d===8?'Tarwiyah':'Awal Zulhijah');
  if(k==='1-9')tg.push("Tasu'a");if(k==='1-10')tg.push('Asyura');if(h.m===10&&h.d>=2)tg.push('Syawal');if(h.d>=13&&h.d<=15)tg.push('Ayyamul Bidh');if(wd===1)tg.push('Senin');if(wd===4)tg.push('Kamis');
  if(tg.length)out.push([d,h,tg,i])}return out}

const HE_BASE='https://hadeethenc.com/api/v1/';
const HE_ROOTS=[[3,'Akidah',459],[4,'Fikih dan Ushul Fikih',1102],[5,'Keutamaan dan Adab',741],[1,"Al-Qur'an dan Ilmunya",78],[6,'Dakwah dan Hisbah',98],[7,'Sejarah dan Tarikh',204],[2,'Hadis dan Ilmu Hadis',10]];
let HECACHE={},HECATS=null,HELIST={},heBusy={};
function autoMatan(t){if(!t)return '';let s=String(t).replace(/\s+/g,' ').trim(),best=-1,kl=0;
  for(const k of [' bersabda:',' bersabda,',' bersabda ',' said:',' said,',' berkata:']){const i=s.lastIndexOf(k);if(i>best){best=i;kl=k.length}}
  if(best>30)s=s.slice(best+kl).trim();s=s.replace(/^["'“«]+/,'');return s.length>280?s.slice(0,s.lastIndexOf(' ',265))+' …':s}
const firstSent=(t,n=2)=>{const p=String(t||'').replace(/\s+/g,' ').match(/[^.!?]+[.!?]+/g)||[t||''];return p.slice(0,n).join(' ').trim()};
async function heGet(path){const r=await fetch(HE_BASE+path);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function heEntry(d){const g=mapGrade(d.grade)==='none'&&/palsu|maudhu/i.test(d.grade||'')?'maudhu':mapGrade(d.grade);
  return{id:'e-'+d.id,judul:d.title,sumber:(d.attribution||'').replace(/[\[\]]/g,'')||'HadeethEnc',derajat:g,muhaqqiq:[`Penilaian: ${d.grade||'-'}`,'Sumber: Ensiklopedia Terjemahan Hadis (HadeethEnc)'],tema:[],
    ar:d.hadeeth_ar||'',id_:d.hadeeth||'',ringkas:firstSent(d.explanation,2),penjelasan:d.explanation||'',fawaid:(d.hints||[]).filter(Boolean),he:true}}
function heLoad(id){if(HECACHE[id]||heBusy[id])return;heBusy[id]=1;
  idb('readonly',s=>s.get('he-'+id)).catch(()=>null).then(async d=>{if(!d){d=await heGet(`hadeeths/one/?language=id&id=${id}`);idb('readwrite',s=>s.put(d,'he-'+id)).catch(()=>{})}
    HECACHE[id]=d;S.hec[id]=[d.title,mapGrade(d.grade)];save()}).catch(()=>{HECACHE[id]={err:1}}).finally(()=>{delete heBusy[id];render(true)})}
function heCats(){if(HECATS||heBusy.cats)return HECATS;heBusy.cats=1;
  idb('readonly',s=>s.get('he-cats')).catch(()=>null).then(async d=>{if(!d){d=await heGet('categories/list/?language=id');idb('readwrite',s=>s.put(d,'he-cats')).catch(()=>{})}HECATS=d}).catch(()=>{HECATS=[]}).finally(()=>{delete heBusy.cats;render(true)});return null}
function heList(cat){const L=HELIST[cat]||(HELIST[cat]={items:[],page:0,last:1,busy:false,err:false});
  if(!L.items.length&&!L.busy&&!L.err)heMore(cat);return L}
async function heMore(cat){const L=HELIST[cat];if(!L||L.busy||L.page>=L.last)return;L.busy=true;render(true);
  try{const j=await heGet(`hadeeths/list/?language=id&category_id=${cat}&page=${L.page+1}&per_page=20`);L.items.push(...(j.data||[]));L.page=+j.meta.current_page;L.last=+j.meta.last_page}
  catch(e){L.err=true}finally{L.busy=false;render(true)}}
async function heDownloadCat(cat){if(heBusy['dl'+cat])return;if(!navigator.onLine){toast('Butuh internet untuk mengunduh');return}heBusy['dl'+cat]=1;toast('Mengunduh kategori untuk offline…');
  try{let page=0,last=1,n=0;while(page<last){const j=await heGet(`hadeeths/list/?language=id&category_id=${cat}&page=${page+1}&per_page=50`);page=+j.meta.current_page;last=+j.meta.last_page;
      for(const it of j.data||[]){if(!S.hec[it.id]){try{const d=await heGet(`hadeeths/one/?language=id&id=${it.id}`);await idb('readwrite',s=>s.put(d,'he-'+it.id));HECACHE[it.id]=d;S.hec[it.id]=[d.title,mapGrade(d.grade)]}catch(_){}}n++;if(n%25===0)toast(`${n} hadis tersimpan…`)}}
    save();toast(`Selesai: ${n} hadis kategori ini tersimpan offline`)}
  catch(e){toast('Gagal mengunduh. Pastikan ada internet; di pratinjau Claude unduhan diblokir.')}finally{delete heBusy['dl'+cat];render(true)}}
async function dlKitabEng(id){const k=HKITAB.find(x=>x.id===id);if(!k||heBusy['en'+id])return;if(!navigator.onLine){toast('Butuh internet untuk mengunduh');return}heBusy['en'+id]=1;render(true);toast('Mengunduh terjemahan Inggris…');
  try{const L=HLIB[id]||await idb('readonly',s=>s.get('hk-'+id));const r=await fetch(HDATA_BASE+'eng-'+id+'.min.json');if(!r.ok)throw 0;const j=await r.json(),m={};j.hadiths.forEach(h=>{m[h.hadithnumber]=h.text});
    L.h.forEach(row=>{row[4]=m[row[0]]||''});L.en=true;HLIB[id]=L;await idb('readwrite',s=>s.put(L,'hk-'+id));S.hen[id]=1;save();toast('Terjemahan Inggris tersimpan')}
  catch(e){toast('Gagal mengunduh terjemahan Inggris.')}finally{delete heBusy['en'+id];render(true)}}
function Sheet6(){
  const hdr=t=>`<div class="shd"><button class="ibtn" data-a="close" aria-label="Kembali">${ic('left',26)}</button><h2>${t}</h2></div>`;
  const wrap=(t,b)=>`<div class="sheet">${hdr(t)}<div class="scr pad" id="rscr">${b}</div></div>`;
  if(sheet.startsWith('hecat:')){const id=+sheet.split(':')[1],root=HE_ROOTS.find(r=>r[0]===id),cats=heCats(),sub=(cats||[]).filter(c=>+c.parent_id===id),me=(cats||[]).find(c=>+c.id===id),L=heList(id);

    ${L.items.map(it=>{const c=S.hec[it.id],G=HGRADE[c?c[1]:'none'];return `<button class="hitem" data-a="sheet" data-v="hd:e-${it.id}"><span class="hbar" style="background:${c?G.c:'#3a5a58'}"></span><span style="flex:1"><b style="display:block;font-size:16px">${esc(it.title)}</b><small class="mute">${c?G.n+' · tersimpan offline':'Ketuk untuk membaca'}</small></span></button>`}).join('')}
    ${L.busy?'<p class="mute">Memuat…</p>':L.err?'<p class="mute">Gagal memuat daftar. Butuh internet (di pratinjau Claude diblokir). Hadis yang sudah disimpan tetap bisa dibuka dari pencarian.</p>':L.page<L.last?`<button class="btn" style="width:100%;margin-top:12px;background:var(--c2)" data-a="hemore" data-v="${id}">Muat lagi</button>`:''}

  return '';
}

['pagi','Perlindungan pagi dan petang (3×)','بِسْمِ اللّٰهِ الَّذِيْ لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيْعُ الْعَلِيْمُ',"Bismillâhilladzî lâ yadhurru ma'asmihî syai'un fil-ardhi wa lâ fis-samâ'i wa huwas-samî'ul-'alîm",'Dengan nama Allah yang bersama nama-Nya tidak ada sesuatu pun di bumi maupun di langit yang dapat membahayakan, dan Dia Maha Mendengar lagi Maha Mengetahui.','HR. Abu Dawud & Tirmidzi'],
['pagi','Rida kepada Allah (3×)','رَضِيْتُ بِاللّٰهِ رَبًّا، وَبِالْإِسْلَامِ دِيْنًا، وَبِمُحَمَّدٍ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا',"Radhîtu billâhi rabbâ, wa bil-islâmi dînâ, wa bi Muhammadin shallallâhu 'alaihi wa sallama nabiyyâ",'Aku rida Allah sebagai Tuhan, Islam sebagai agama, dan Muhammad ﷺ sebagai nabi.','HR. Abu Dawud & Tirmidzi'],
['pagi','Memasuki waktu pagi','اَللّٰهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوْتُ، وَإِلَيْكَ النُّشُوْرُ',"Allâhumma bika ashbahnâ, wa bika amsainâ, wa bika nahyâ, wa bika namûtu, wa ilaikan-nusyûr",'Ya Allah, dengan-Mu kami memasuki pagi dan petang, dengan-Mu kami hidup dan mati, dan kepada-Mu kami dibangkitkan. (Petang: "amsainâ… ashbahnâ… wa ilaikal-mashîr")','HR. Tirmidzi'],
['pagi','Sayyidul Istighfar','اَللّٰهُمَّ أَنْتَ رَبِّيْ لَا إِلٰهَ إِلَّا أَنْتَ، خَلَقْتَنِيْ وَأَنَا عَبْدُكَ، وَأَنَا عَلٰى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوْذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوْءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوْءُ بِذَنْبِيْ فَاغْفِرْ لِيْ، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوْبَ إِلَّا أَنْتَ',"Allâhumma anta rabbî lâ ilâha illâ anta, khalaqtanî wa ana 'abduka, wa ana 'alâ 'ahdika wa wa'dika mastatha'tu, a'ûdzu bika min syarri mâ shana'tu, abû'u laka bini'matika 'alayya, wa abû'u bidzanbî faghfir lî, fa innahû lâ yaghfirudz-dzunûba illâ anta",'Ya Allah, Engkau Tuhanku, tiada tuhan selain Engkau. Engkau menciptakanku dan aku hamba-Mu, aku berada di atas janji-Mu semampuku. Aku berlindung dari keburukan perbuatanku, aku mengakui nikmat-Mu dan dosaku, maka ampunilah aku.','HR. Bukhari'],
['sholat','Doa setelah azan','اَللّٰهُمَّ رَبَّ هٰذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيْلَةَ وَالْفَضِيْلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُوْدًا الَّذِيْ وَعَدْتَهُ',"Allâhumma rabba hâdzihid-da'watit-tâmmah, wash-shalâtil-qâ'imah, âti Muhammadanil-wasîlata wal-fadhîlah, wab'atshu maqâman mahmûdanilladzî wa'adtah",'Ya Allah, Tuhan pemilik seruan yang sempurna dan sholat yang ditegakkan ini, berikanlah kepada Muhammad wasilah dan keutamaan, dan bangkitkanlah ia di kedudukan terpuji yang Engkau janjikan.','HR. Bukhari'],
['sholat','Doa masuk masjid','اَللّٰهُمَّ افْتَحْ لِيْ أَبْوَابَ رَحْمَتِكَ','Allâhummaftah lî abwâba rahmatik','Ya Allah, bukakanlah untukku pintu-pintu rahmat-Mu.','HR. Muslim'],
['sholat','Doa keluar masjid','اَللّٰهُمَّ إِنِّيْ أَسْأَلُكَ مِنْ فَضْلِكَ',"Allâhumma innî as'aluka min fadhlik",'Ya Allah, aku memohon kepada-Mu dari karunia-Mu.','HR. Muslim'],
['sholat','Doa setelah wudhu','أَشْهَدُ أَنْ لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيْكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُوْلُهُ',"Asyhadu an lâ ilâha illallâhu wahdahû lâ syarîka lah, wa asyhadu anna Muhammadan 'abduhû wa rasûluh",'Aku bersaksi tiada tuhan selain Allah semata, tiada sekutu bagi-Nya, dan Muhammad adalah hamba dan rasul-Nya.','HR. Muslim'],
['puji','Tasbih dan tahmid','سُبْحَانَ اللّٰهِ وَبِحَمْدِهِ، سُبْحَانَ اللّٰهِ الْعَظِيْمِ',"Subhânallâhi wa bihamdih, subhânallâhil-'azhîm",'Mahasuci Allah dan dengan memuji-Nya, Mahasuci Allah Yang Mahaagung. (Dua kalimat ringan di lisan, berat di timbangan)','HR. Bukhari & Muslim'],
['puji','Tahlil','لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيْكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلٰى كُلِّ شَيْءٍ قَدِيْرٌ',"Lâ ilâha illallâhu wahdahû lâ syarîka lah, lahul-mulku wa lahul-hamdu, wa huwa 'alâ kulli syai'in qadîr",'Tiada tuhan selain Allah semata, tiada sekutu bagi-Nya. Milik-Nya kerajaan dan pujian, dan Dia Mahakuasa atas segala sesuatu.','HR. Bukhari & Muslim'],
['puji','Hauqalah','لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰهِ',"Lâ haula wa lâ quwwata illâ billâh",'Tiada daya dan kekuatan kecuali dengan pertolongan Allah. (Salah satu perbendaharaan surga)','HR. Bukhari & Muslim'],
['haji','Talbiyah','لَبَّيْكَ اللّٰهُمَّ لَبَّيْكَ، لَبَّيْكَ لَا شَرِيْكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ، لَا شَرِيْكَ لَكَ',"Labbaik Allâhumma labbaik, labbaika lâ syarîka laka labbaik, innal-hamda wan-ni'mata laka wal-mulk, lâ syarîka lak",'Aku penuhi panggilan-Mu ya Allah. Tiada sekutu bagi-Mu. Sungguh segala puji, nikmat, dan kerajaan milik-Mu.','HR. Bukhari & Muslim'],
['haji','Antara Rukun Yamani dan Hajar Aswad','رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ',"Rabbanâ âtinâ fid-dunyâ hasanah wa fil-âkhirati hasanah wa qinâ 'adzâban-nâr",'Ya Tuhan kami, berilah kami kebaikan di dunia dan kebaikan di akhirat, dan lindungilah kami dari siksa neraka. (QS. Al-Baqarah: 201)','HR. Abu Dawud'],
['safar','Doa naik kendaraan','سُبْحَانَ الَّذِيْ سَخَّرَ لَنَا هٰذَا وَمَا كُنَّا لَهُ مُقْرِنِيْنَ، وَإِنَّا إِلٰى رَبِّنَا لَمُنْقَلِبُوْنَ',"Subhânalladzî sakhkhara lanâ hâdzâ wa mâ kunnâ lahû muqrinîn, wa innâ ilâ rabbinâ lamunqalibûn",'Mahasuci Allah yang menundukkan kendaraan ini untuk kami, padahal kami tidak mampu menguasainya, dan sungguh kami akan kembali kepada Tuhan kami.','QS. Az-Zukhruf: 13–14'],
['safar','Melepas orang bepergian','أَسْتَوْدِعُ اللّٰهَ دِيْنَكَ وَأَمَانَتَكَ وَخَوَاتِيْمَ عَمَلِكَ',"Astaudi'ullâha dînaka wa amânataka wa khawâtîma 'amalik",'Aku titipkan kepada Allah agamamu, amanahmu, dan akhir amal-amalmu.','HR. Abu Dawud & Tirmidzi'],
['safar','Doa keluar rumah','بِسْمِ اللّٰهِ تَوَكَّلْتُ عَلَى اللّٰهِ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰهِ',"Bismillâhi tawakkaltu 'alallâh, lâ haula wa lâ quwwata illâ billâh",'Dengan nama Allah, aku bertawakal kepada Allah. Tiada daya dan kekuatan kecuali dengan pertolongan Allah.','HR. Abu Dawud & Tirmidzi'],
['duka','Saat tertimpa musibah','إِنَّا لِلّٰهِ وَإِنَّا إِلَيْهِ رَاجِعُوْنَ، اَللّٰهُمَّ أْجُرْنِيْ فِيْ مُصِيْبَتِيْ وَأَخْلِفْ لِيْ خَيْرًا مِنْهَا',"Innâ lillâhi wa innâ ilaihi râji'ûn, Allâhumma'jurnî fî mushîbatî wa akhlif lî khairan minhâ",'Sesungguhnya kami milik Allah dan kepada-Nya kami kembali. Ya Allah, berilah pahala atas musibahku dan gantilah dengan yang lebih baik.','HR. Muslim'],
['duka','Saat sangat sedih atau susah','لَا إِلٰهَ إِلَّا اللّٰهُ الْعَظِيْمُ الْحَلِيْمُ، لَا إِلٰهَ إِلَّا اللّٰهُ رَبُّ الْعَرْشِ الْعَظِيْمِ، لَا إِلٰهَ إِلَّا اللّٰهُ رَبُّ السَّمٰوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيْمِ',"Lâ ilâha illallâhul-'azhîmul-halîm, lâ ilâha illallâhu rabbul-'arsyil-'azhîm, lâ ilâha illallâhu rabbus-samâwâti wa rabbul-ardhi wa rabbul-'arsyil-karîm",'Tiada tuhan selain Allah Yang Mahaagung lagi Maha Penyantun; Tuhan Arsy yang agung; Tuhan langit, bumi, dan Arsy yang mulia.','HR. Bukhari & Muslim'],
['duka','Doa Nabi Yunus','لَا إِلٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّيْ كُنْتُ مِنَ الظَّالِمِيْنَ',"Lâ ilâha illâ anta subhânaka innî kuntu minazh-zhâlimîn",'Tiada tuhan selain Engkau, Mahasuci Engkau, sungguh aku termasuk orang yang zalim.','QS. Al-Anbiya: 87'],
['duka','Berserah diri','حَسْبُنَا اللّٰهُ وَنِعْمَ الْوَكِيْلُ',"Hasbunallâhu wa ni'mal-wakîl",'Cukuplah Allah bagi kami, dan Dia sebaik-baik pelindung.','QS. Ali Imran: 173'],
['alam','Saat turun hujan','اَللّٰهُمَّ صَيِّبًا نَافِعًا',"Allâhumma shayyiban nâfi'â",'Ya Allah, jadikanlah hujan ini hujan yang bermanfaat.','HR. Bukhari'],
['alam','Setelah hujan','مُطِرْنَا بِفَضْلِ اللّٰهِ وَرَحْمَتِهِ','Muthirnâ bifadhlillâhi wa rahmatih','Kami diberi hujan karena karunia dan rahmat Allah.','HR. Bukhari & Muslim'],
['alam','Saat angin kencang','اَللّٰهُمَّ إِنِّيْ أَسْأَلُكَ خَيْرَهَا وَخَيْرَ مَا فِيْهَا وَخَيْرَ مَا أُرْسِلَتْ بِهِ، وَأَعُوْذُ بِكَ مِنْ شَرِّهَا وَشَرِّ مَا فِيْهَا وَشَرِّ مَا أُرْسِلَتْ بِهِ',"Allâhumma innî as'aluka khairahâ wa khaira mâ fîhâ wa khaira mâ ursilat bih, wa a'ûdzu bika min syarrihâ wa syarri mâ fîhâ wa syarri mâ ursilat bih",'Ya Allah, aku memohon kebaikan angin ini, kebaikan yang ada padanya, dan kebaikan yang dibawanya; aku berlindung dari keburukannya.','HR. Muslim'],
['adab','Doa bercermin','اَللّٰهُمَّ أَنْتَ حَسَّنْتَ خَلْقِيْ فَحَسِّنْ خُلُقِيْ','Allâhumma anta hassanta khalqî fa hassin khuluqî','Ya Allah, Engkau telah membaguskan rupaku, maka baguskanlah akhlakku.','HR. Ahmad'],
['adab','Saat bersin dan menjawabnya','اَلْحَمْدُ لِلّٰهِ — يَرْحَمُكَ اللّٰهُ — يَهْدِيْكُمُ اللّٰهُ وَيُصْلِحُ بَالَكُمْ',"Al-hamdu lillâh — Yarhamukallâh — Yahdîkumullâhu wa yushlihu bâlakum",'Yang bersin: Segala puji bagi Allah. Yang mendengar: Semoga Allah merahmatimu. Yang bersin menjawab: Semoga Allah memberimu petunjuk dan memperbaiki keadaanmu.','HR. Bukhari'],
['adab','Penutup majelis','سُبْحَانَكَ اللّٰهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلٰهَ إِلَّا أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوْبُ إِلَيْكَ',"Subhânakallâhumma wa bihamdik, asyhadu an lâ ilâha illâ ant, astaghfiruka wa atûbu ilaik",'Mahasuci Engkau ya Allah dan dengan memuji-Mu. Aku bersaksi tiada tuhan selain Engkau, aku memohon ampun dan bertobat kepada-Mu.','HR. Tirmidzi'],
['keluarga','Masuk rumah','بِسْمِ اللّٰهِ وَلَجْنَا، وَبِسْمِ اللّٰهِ خَرَجْنَا، وَعَلَى اللّٰهِ رَبِّنَا تَوَكَّلْنَا',"Bismillâhi walajnâ, wa bismillâhi kharajnâ, wa 'alallâhi rabbinâ tawakkalnâ",'Dengan nama Allah kami masuk, dengan nama Allah kami keluar, dan kepada Allah Tuhan kami, kami bertawakal.','HR. Abu Dawud'],
['keluarga','Untuk kedua orang tua','رَبِّ اغْفِرْ لِيْ وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِيْ صَغِيْرًا','Rabbighfir lî wa liwâlidayya warhamhumâ kamâ rabbayânî shaghîrâ','Ya Tuhanku, ampunilah aku dan kedua orang tuaku, sayangilah mereka sebagaimana mereka mendidikku di waktu kecil.','QS. Al-Isra: 24'],
['keluarga','Pasangan dan keturunan yang menyejukkan','رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِيْنَ إِمَامًا',"Rabbanâ hab lanâ min azwâjinâ wa dzurriyyâtinâ qurrata a'yunin waj'alnâ lil-muttaqîna imâmâ",'Ya Tuhan kami, anugerahkanlah pasangan dan keturunan yang menyejukkan hati, dan jadikanlah kami pemimpin bagi orang bertakwa.','QS. Al-Furqan: 74'],
['keluarga','Untuk pengantin','بَارَكَ اللّٰهُ لَكَ وَبَارَكَ عَلَيْكَ وَجَمَعَ بَيْنَكُمَا فِيْ خَيْرٍ',"Bârakallâhu laka wa bâraka 'alaika wa jama'a bainakumâ fî khair",'Semoga Allah memberkahimu dalam suka dan duka, dan mengumpulkan kalian berdua dalam kebaikan.','HR. Abu Dawud & Tirmidzi'],
['makan','Sebelum makan','بِسْمِ اللّٰهِ','Bismillâh','Dengan nama Allah.','HR. Bukhari & Muslim'],
['makan','Lupa membaca basmalah di awal','بِسْمِ اللّٰهِ أَوَّلَهُ وَآخِرَهُ','Bismillâhi awwalahû wa âkhirah','Dengan nama Allah di awal dan di akhirnya.','HR. Abu Dawud & Tirmidzi'],
['makan','Sesudah makan','اَلْحَمْدُ لِلّٰهِ الَّذِيْ أَطْعَمَنِيْ هٰذَا وَرَزَقَنِيْهِ مِنْ غَيْرِ حَوْلٍ مِنِّيْ وَلَا قُوَّةٍ',"Al-hamdu lillâhilladzî ath'amanî hâdzâ wa razaqanîhi min ghairi haulin minnî wa lâ quwwah",'Segala puji bagi Allah yang memberiku makanan ini dan merezekikannya tanpa daya dan kekuatan dariku.','HR. Abu Dawud & Tirmidzi'],
['makan','Mendoakan tuan rumah','اَللّٰهُمَّ بَارِكْ لَهُمْ فِيْمَا رَزَقْتَهُمْ، وَاغْفِرْ لَهُمْ وَارْحَمْهُمْ','Allâhumma bârik lahum fîmâ razaqtahum, waghfir lahum warhamhum','Ya Allah, berkahilah rezeki yang Engkau berikan kepada mereka, ampunilah dan rahmatilah mereka.','HR. Muslim'],
['sakit','Menjenguk orang sakit','لَا بَأْسَ، طَهُوْرٌ إِنْ شَاءَ اللّٰهُ',"Lâ ba'sa, thahûrun insyâ Allâh",'Tidak mengapa, semoga sakit ini menyucikan (dari dosa), insya Allah.','HR. Bukhari'],
['sakit','Mendoakan kesembuhan','اَللّٰهُمَّ رَبَّ النَّاسِ أَذْهِبِ الْبَأْسَ، اشْفِ أَنْتَ الشَّافِيْ، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا',"Allâhumma rabban-nâs adzhibil-ba's, isyfi antasy-syâfî, lâ syifâ'a illâ syifâ'uk, syifâ'an lâ yughâdiru saqamâ",'Ya Allah, Tuhan manusia, hilangkanlah penyakit ini, sembuhkanlah, Engkaulah Maha Penyembuh; tiada kesembuhan selain dari-Mu, kesembuhan yang tidak menyisakan penyakit.','HR. Bukhari & Muslim'],

let gTok=null,gTokExp=0;
function gLoad(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>res();s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
async function gToken(prompt){await gLoad();return new Promise((res,rej)=>{const c=google.accounts.oauth2.initTokenClient({client_id:S.gcid,scope:'openid email profile https://www.googleapis.com/auth/drive.appdata',callback:r=>{if(r.error)rej(r);else{gTok=r.access_token;gTokExp=Date.now()+((+r.expires_in||3600)-60)*1000;res(gTok)}},error_callback:e=>rej(e)});c.requestAccessToken({prompt})})}
const gEnsure=()=>gTok&&Date.now()<gTokExp?Promise.resolve(gTok):gToken('');
async function gSignIn(){if(!S.gcid){toast('Isi Google Client ID dulu');return}try{await gToken('consent');const u=await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+gTok}})).json();S.guser={name:u.name||'',email:u.email||'',pic:u.picture||''};save();toast('Masuk sebagai '+(u.email||u.name));render(true)}catch(e){toast('Gagal masuk. Cek Client ID dan Authorized JavaScript origin.')}}
async function gFind(tk){const r=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D'cahaya-backup.json'&fields=files(id,modifiedTime)",{headers:{Authorization:'Bearer '+tk}});const j=await r.json();return(j.files||[])[0]}
async function gBackup(){try{const tk=await gEnsure(),f=await gFind(tk),fd=new FormData();
    fd.append('metadata',new Blob([JSON.stringify(f?{name:'cahaya-backup.json'}:{name:'cahaya-backup.json',parents:['appDataFolder']})],{type:'application/json'}));
    fd.append('file',new Blob([JSON.stringify({app:'cahaya',v:7,t:Date.now(),S})],{type:'application/json'}));
    const r=await fetch(f?`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=multipart`:'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:f?'PATCH':'POST',headers:{Authorization:'Bearer '+tk},body:fd});
    if(!r.ok)throw 0;S.gback=Date.now();save();toast('Cadangan tersimpan di Google Drive');render(true)}catch(e){toast('Gagal mencadangkan ke Google Drive')}}
async function gRestore(){try{const tk=await gEnsure(),f=await gFind(tk);if(!f){toast('Belum ada cadangan di Google Drive');return}const j=await (await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`,{headers:{Authorization:'Bearer '+tk}})).json();restoreState(j.S);toast('Data dipulihkan dari Google Drive')}catch(e){toast('Gagal memulihkan')}}
function restoreState(ns){if(!ns||typeof ns!=='object'){toast('File cadangan tidak valid');return}const keep={gcid:S.gcid,guser:S.guser};S=Object.assign(JSON.parse(JSON.stringify(DEF)),ns,keep);S.q=Object.assign(JSON.parse(JSON.stringify(DEF.q)),S.q||{});linkKids();sheet=null;sheetStack=[];save();render()}

let AU=null,auObj=null,P={s:0,a:0,playing:false,rep:0},auURLs={},auBusy={};
async function auList(ed,s){const k=ed+':'+s;if(auURLs[k])return auURLs[k];let l=null;try{l=await idb('readonly',st=>st.get('aul-'+k))}catch(e){}
  if(!l){try{const r=await fetch(`https://api.alquran.cloud/v1/surah/${s}/${ed}`);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();l=j.data.ayahs.map(a=>a.audio);try{await idb('readwrite',st=>st.put(l,'aul-'+k))}catch(e){}}
    catch(err){let g=0;for(let i=0;i<s-1;i++)g+=SLAT[i].c;l=[...Array(SLAT[s-1].c)].map((_,i)=>`https://cdn.islamic.network/quran/audio/128/${ed}/${g+i+1}.mp3`)}}
  auURLs[k]=l;return l}
async function auSrc(ed,s,a){try{const b=await idb('readonly',st=>st.get(`au-${ed}-${s}-${a}`));if(b)return URL.createObjectURL(b)}catch(e){}return(await auList(ed,s))[a-1]}
async function playAyah(s,a){const ed=S.qari||'ar.alafasy';AU=AU||new Audio();P.s=s;P.a=a;P.playing=true;markPlaying();
  try{const src=await auSrc(ed,s,a);if(auObj)URL.revokeObjectURL(auObj);auObj=String(src).startsWith('blob:')?src:null;AU.src=src;AU.playbackRate=S.arate||1;await AU.play()}
  catch(e){P.playing=false;markPlaying();toast('Audio gagal diputar. Butuh internet, atau unduh dulu untuk offline.');return}
  AU.onended=()=>{const rep=S.arep||1;if(P.rep<rep-1){P.rep++;AU.currentTime=0;AU.play().catch(()=>{});return}P.rep=0;const c=SLAT[P.s-1].c;
    if(S.acont===false){P.playing=false;markPlaying();return}if(P.a<c)playAyah(P.s,P.a+1);else if(S.anext&&P.s<114)playAyah(P.s+1,1);else{P.playing=false;markPlaying()}}}
function markPlaying(){document.querySelectorAll('.ayah.playing').forEach(e=>e.classList.remove('playing'));const el=document.getElementById(`ay-${P.s}-${P.a}`);

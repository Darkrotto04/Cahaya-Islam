<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cahaya: Ibadah & Belajar</title>
<meta name="theme-color" content="#0f2a2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Scheherazade+New:wght@400;700&display=swap">
<style>
/* VOICE: warm, devotional for parents; bright, bouncy, encouraging for kids.
   IDEA: a prayer companion that turns into a children's adventure book when "Mode Anak" is switched on.
   PICTURE: dusk-gradient prayer card (adult) / island adventure map with a moon mascot, Nuri (kids).
   COLOUR and TYPE: deep teal night + dusk orange-rose + prayer green; kids: sky, sunshine, coral, mint. Plus Jakarta Sans / Baloo 2 / Amiri.
   LAYOUT: phone app, 400x844 framed on desktop, full screen on phones and tablets. */
:root{color-scheme:light dark;--bg:light-dark(#dfe9e7,#0a1716);--ink:light-dark(#10302e,#e8f1ef)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;display:grid;place-items:center;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffcf3f;outline-offset:2px}
input,select{font:inherit;font-size:16px}
.phone{position:relative;width:100vw;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
@media (min-width:520px) and (pointer:fine){.phone{width:400px;height:min(844px,calc(100dvh - 32px));border-radius:40px;box-shadow:0 30px 80px -20px #0008,0 0 0 10px #111,0 0 0 11px #333}}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.scr::-webkit-scrollbar{display:none}
.ic{flex:none;display:block}
.ar{font-family:"Amiri Quran","Amiri",serif;direction:rtl}
.nav{display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.nav button{display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;min-height:52px;padding-top:6px}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#14211f;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:90;max-width:86%;text-align:center;box-shadow:0 8px 24px #0006;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}}
.conf{position:fixed;pointer-events:none;z-index:100}

/* ADULT */
.adult{background:#0f2a2b;color:#eef4f2}
.adult .nav{background:#0b2223;border-top:1px solid #1f3c3c}
.adult .nav button{color:#cfdad7}.adult .nav button.on{color:#5cc48a}
.hero{margin:14px 14px 0;border-radius:26px;padding:20px;background:linear-gradient(170deg,#ea8a35,#c8664c 55%,#a24d68);color:#fff;min-height:200px;display:grid;grid-template-rows:auto 1fr auto}
.hero h1{font-size:20px;margin:0;font-weight:800}
.hero .big{font-size:46px;font-weight:800;line-height:1;letter-spacing:-1px}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.cd{font-variant-numeric:tabular-nums;font-weight:600;opacity:.92}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.pad{padding:14px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px 0}
.pill{border-radius:22px;padding:12px 16px;text-align:left;min-height:64px;color:#fff}
.pill small{display:block;font-size:12px;opacity:.9}.pill b{font-size:16px}
.quick{display:flex;gap:14px;overflow-x:auto;padding:16px 14px 4px;scrollbar-width:none}
.quick button{display:grid;justify-items:center;gap:6px;font-size:13px;font-weight:600;flex:none;width:68px}
.quick .qi{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:#d8efe6;color:#0f2a2b}
.card{background:#1d3d3d;border-radius:22px;padding:16px;margin:12px 14px 0}
.card h3{margin:0 0 10px;font-size:17px}
.mute{color:#9fb8b2;font-size:13px}
.pchk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pchk button{display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:600;padding:8px 0;border-radius:14px;background:#244747}
.pchk button.on{background:#3f9e6c}
.circ{width:30px;height:30px;border-radius:50%;border:2px solid #7d9a95;display:grid;place-items:center}
.on .circ{border-color:#fff;background:#fff2;color:#fff}
.ptop{background:linear-gradient(180deg,#e58836,#d7773f);padding:18px 16px 10px;color:#fff}
.ptop h1{margin:0;font-size:28px;font-family:Amiri,serif;font-weight:700}
.dnav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;text-align:center}
.dnav b{font-size:18px;display:block}
.plist{background:linear-gradient(180deg,#d7773f,#a64e5f 85%)}
.prow{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:86px;color:#fff;border-bottom:1px solid #ffffff14}
.prow.next{background:#5fd38a}
.prow .nm{flex:1;font-size:19px;font-weight:600}.prow .nm small{display:block;font-size:13px;font-weight:500;opacity:.92}
.prow .tm{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.chk{width:44px;height:44px;display:grid;place-items:center}
.chk span{width:32px;height:32px;border-radius:50%;border:2px solid #ffffff90;display:grid;place-items:center}
.chk.on span{background:#fff;color:#3f9e6c;border-color:#fff}
.week{display:grid;grid-template-columns:64px repeat(7,1fr);gap:6px 4px;align-items:center;font-size:11px;font-weight:700}
.week i{height:10px;border-radius:6px;background:#ffffff26;display:block}.week i.on{background:#5fd38a}
.seg{display:flex;background:#25403f;border-radius:30px;padding:5px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:24px;font-weight:700;font-size:14px;min-height:44px}
.seg button.on{background:#4fa36c;color:#fff}
.seg2{display:flex;gap:8px;margin:14px 0 4px}
.seg2 button{padding:10px 22px;border-radius:24px;font-weight:600;min-height:44px}
.seg2 button.on{background:#fff;color:#0f2a2b}
.lrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #ffffff10;width:100%;text-align:left}
.lrow .no{width:34px;font-family:Amiri,serif;font-size:24px;color:#6f8d88;text-align:center}
.lrow .t{flex:1}.lrow .t b{font-family:Amiri,serif;font-size:20px;font-weight:400;display:block}
.lrow .t small{color:#9fb8b2;font-size:13px}
.lrow .r{text-align:right}.lrow .r .ar{font-size:22px;display:block}
.tag{display:inline-block;font-size:10px;font-weight:700;background:#3f9e6c;color:#fff;border-radius:8px;padding:1px 6px;margin-left:6px;vertical-align:2px;font-family:"Plus Jakarta Sans"}
.link{color:#5cc48a;font-weight:600;font-size:14px}
.sheet{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;background:#0f2a2b;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.shd{display:flex;align-items:center;gap:6px;padding:10px 8px;border-bottom:1px solid #ffffff12}
.shd h2{font-size:18px;margin:0;flex:1}
.ayah{padding:18px 16px;border-bottom:1px solid #ffffff10}
.ayah .ar{font-size:28px;line-height:2.1;text-align:right}
.ayah p{margin:8px 0 0;color:#c4d5d1;font-size:15px}
.anum{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid #5cc48a;font-size:12px;font-weight:700;color:#5cc48a}
.compass{width:240px;height:240px;margin:20px auto;position:relative}
.big-tas{width:220px;height:220px;border-radius:50%;margin:24px auto;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#6fd69a,#2f8a5a);box-shadow:0 14px 0 #1f6643,0 24px 40px #0008;color:#fff;font-size:64px;font-weight:800;font-variant-numeric:tabular-nums}
.big-tas:active{transform:translateY(8px);box-shadow:0 6px 0 #1f6643}
.fld{display:grid;gap:6px;margin-bottom:14px;font-size:14px;font-weight:600}
.fld input,.fld select{background:#24403f;border:1px solid #3a5a58;color:#fff;border-radius:14px;padding:12px 14px;min-height:48px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;font-weight:700;background:#4fa36c;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:10px 14px;border-radius:14px;background:#24403f;font-weight:600;font-size:14px;min-height:44px}
.chips button.on{background:#4fa36c;color:#fff}

/* KIDS */
.kids{background:#e8f5ff;color:#24314a;font-family:"Baloo 2",system-ui,sans-serif}
.kids .nav{grid-template-columns:repeat(3,1fr);background:#fff;border-top:3px solid #d6ecff}
.kids .nav button{color:#7d8aa5;font-size:14px;font-weight:700}.kids .nav button.on{color:#ff6f7d}
.khead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:3px solid #d6ecff}
.khead .who{flex:1;text-align:left;display:flex;gap:10px;align-items:center}
.khead .who b{font-size:18px;line-height:1.1;display:block}
.xpbar{height:10px;background:#e3eefb;border-radius:8px;overflow:hidden;width:110px;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffcf3f,#ff9f43);border-radius:8px}
.stat{display:flex;align-items:center;gap:3px;font-weight:800;font-size:17px;padding:4px 10px;border-radius:14px;background:#fff6dc;color:#e09b00}
.stat.fl{background:#ffe8e3;color:#ff6a3d}
.kbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#eef5ff;color:#5b6b8a}
.map{position:relative;background:radial-gradient(circle at 20% 10%,#bfe6ff 0 30%,transparent 31%),linear-gradient(180deg,#a8dcff,#7cc7f5 60%,#62b5ea);min-height:100%;padding-bottom:40px}
.map svg.path{position:absolute;inset:0;width:100%;pointer-events:none}
.isl{position:absolute;width:150px;transform:translateX(-50%);display:grid;justify-items:center;text-align:center}
.isl .disc{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 8px 0 #0002,inset 0 -8px 0 #0002,0 0 0 6px #fff;position:relative}
.isl .disc::after{content:"";position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);width:130px;height:26px;border-radius:50%;background:#f6dd9e;z-index:-1;box-shadow:0 4px 0 #e0bf6f}
.isl .lbl{margin-top:18px;background:#fff;border-radius:14px;padding:4px 10px;font-weight:800;font-size:15px;line-height:1.2;box-shadow:0 4px 0 #0001}
.isl .lbl small{display:block;font-weight:600;color:#7d8aa5;font-size:12px}
.isl.lock .disc{filter:grayscale(.85) brightness(1.05)}
.isl .lk{position:absolute;top:-6px;right:20px;background:#24314a;color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center}
.bubble{background:#fff;border-radius:20px;padding:12px 14px;font-size:16px;line-height:1.35;position:relative;box-shadow:0 4px 0 #d6ecff;font-weight:600}
.mas{display:flex;gap:10px;align-items:flex-end;padding:14px}
.mas svg{flex:none}
.bounce{animation:bnc .7s ease-in-out infinite alternate}
@keyframes bnc{to{transform:translateY(-8px) rotate(-4deg)}}
.ktitle{font-size:26px;font-weight:800;margin:0;line-height:1.1}
.kcard{background:#fff;border-radius:24px;padding:14px;margin:0 14px 12px;box-shadow:0 5px 0 #d6ecff}
.topic{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:20px;padding:12px 14px;margin-bottom:10px;box-shadow:0 5px 0 #d6ecff;min-height:64px}
.topic .dot{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:none}
.topic .t{flex:1;font-weight:700;font-size:17px;line-height:1.2}
.topic .t small{display:block;font-weight:600;color:#7d8aa5;font-size:13px}
.topic.lock{opacity:.55}
.stars{display:flex;gap:1px;color:#e3e9f2}.stars .on{color:#ffc21a}
.grp{font-weight:800;color:#5b6b8a;margin:12px 4px 8px;font-size:15px}
.fx{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fx span{padding:6px 12px;border-radius:12px;font-weight:800;color:#fff;font-size:16px}
.fx .s{background:#59b8ff}.fx .x{background:#9b7bff}.fx .v{background:#ff6f7d}.fx .o{background:#3fcf9a}.fx .e{background:#ffb020}
.fx em{font-style:normal;font-weight:800;color:#9aa7bf}
.exr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px dashed #e3eefb}
.exr .sg{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;flex:none}
.exr p{margin:0;flex:1;font-weight:600;font-size:17px;line-height:1.3}
.spk{width:44px;height:44px;border-radius:14px;background:#e7f4ff;color:#2f8fd8;display:grid;place-items:center;flex:none}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips span{background:#fff6dc;color:#9a6b00;border-radius:12px;padding:4px 10px;font-weight:700;font-size:14px}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kgrid button{background:#f4f9ff;border-radius:16px;padding:10px;text-align:left;min-height:64px}
.kgrid b{display:block;font-size:15px}.kgrid small{color:#5b6b8a;font-size:14px;font-weight:600}
.vt{width:100%;border-collapse:collapse;font-size:15px}
.vt td,.vt th{padding:6px 4px;text-align:left;border-bottom:2px solid #eef5ff}
.vt th{color:#7d8aa5;font-size:13px}
.kbig{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 28px);margin:6px 14px 18px;min-height:60px;border-radius:20px;background:#ff6f7d;color:#fff;font-weight:800;font-size:21px;box-shadow:0 6px 0 #d9485a}
.kbig:active{transform:translateY(4px);box-shadow:0 2px 0 #d9485a}
.kbig.gr{background:#3fcf9a;box-shadow:0 6px 0 #22a374}.kbig.bl{background:#59b8ff;box-shadow:0 6px 0 #2f8fd8}
.kbig[disabled]{background:#c9d3e2;box-shadow:0 6px 0 #aab6c8;cursor:default}
.back{display:flex;align-items:center;gap:6px;padding:10px 12px 0}
.back button{display:flex;align-items:center;gap:4px;font-weight:800;color:#5b6b8a;min-height:44px;padding-right:8px}
/* game */
.gtop{display:flex;align-items:center;gap:10px;padding:12px 14px}
.prog{flex:1;height:16px;background:#d6ecff;border-radius:10px;overflow:hidden}
.prog i{display:block;height:100%;background:#3fcf9a;border-radius:10px;transition:width .3s}
.hearts{display:flex;gap:2px;color:#ff5a6e}.hearts .off{color:#d0d8e4}
.garea{padding:4px 16px 16px}
.slot{min-height:120px;border-bottom:3px dashed #c3d8ee;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px 0 14px;margin-bottom:18px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wch{padding:10px 14px;background:#fff;border-radius:14px;font-weight:700;font-size:18px;box-shadow:0 4px 0 #c9dcf0;min-height:48px}
.wch.used{visibility:hidden}
.wch.sel{background:#ffe7ea;box-shadow:0 4px 0 #ff9aa6;color:#d2364b}
.wch.good{background:#dcf8ec;box-shadow:0 4px 0 #7fdcb6}
.sent{font-size:22px;font-weight:700;line-height:1.5;background:#fff;border-radius:20px;padding:16px;box-shadow:0 5px 0 #d6ecff;margin-bottom:18px}
.sent u{text-decoration:none;display:inline-block;min-width:70px;border-bottom:3px solid #59b8ff;color:#2f8fd8;text-align:center}
.opts{display:grid;gap:10px}
.opt{background:#fff;border-radius:18px;padding:14px 16px;font-weight:700;font-size:18px;box-shadow:0 5px 0 #d6ecff;text-align:left;min-height:56px;border:3px solid transparent}
.opt.sel{border-color:#59b8ff;background:#eef7ff}
.opt.right{border-color:#3fcf9a;background:#e4fbf1}.opt.wrong{border-color:#ff6f7d;background:#ffecee}
.opts.pics{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.pics .opt{text-align:center;font-size:48px;padding:12px 4px;min-height:96px;display:grid;place-items:center}
.sw{width:56px;height:56px;border-radius:16px}
.bigplay{width:120px;height:120px;border-radius:50%;margin:8px auto 22px;display:grid;place-items:center;background:#59b8ff;color:#fff;box-shadow:0 8px 0 #2f8fd8}
.bigq{font-size:96px;text-align:center;line-height:1.3;margin:0 0 14px}
.fb{padding:14px 16px 18px;border-radius:24px 24px 0 0;animation:up .2s}
.fb.ok{background:#d5f7e8;color:#167a52}.fb.no{background:#ffe3e6;color:#b42a3d}
.fb h4{margin:0;font-size:22px;display:flex;align-items:center;gap:8px}
.fb p{margin:4px 0 12px;font-weight:600;font-size:16px;color:#3d4a63}
.fb .kbig{width:100%;margin:0}
.endv{text-align:center;padding:24px 18px}
.bigstars{display:flex;justify-content:center;gap:8px;margin:12px 0}
.bigstars svg{animation:pop2 .45s backwards}
@keyframes pop2{from{transform:scale(0) rotate(-40deg)}}
.hg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hg button{background:#fff;border-radius:16px;box-shadow:0 4px 0 #d6ecff;padding:6px 2px;min-height:84px}
.hg .ar{font-size:36px;line-height:1.4;display:block;font-family:Amiri,serif}
.hg small{font-weight:700;color:#5b6b8a}
.hg button.on{background:#fff4d1}
.vg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vg button{background:#fff;border-radius:18px;box-shadow:0 4px 0 #d6ecff;padding:10px 4px;display:grid;justify-items:center;gap:4px;font-weight:800;font-size:16px}
.vg .pic{font-size:44px;line-height:1.1;height:56px;display:grid;place-items:center}
.vg .dig{font-size:40px;font-weight:800;color:#59b8ff}
.ktabs{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
.ktabs button{flex:none;padding:8px 16px;border-radius:16px;background:#fff;font-weight:800;box-shadow:0 4px 0 #d6ecff;min-height:44px}
.ktabs button.on{background:#24314a;color:#fff;box-shadow:0 4px 0 #0b1426}
.doa .ar{font-size:26px;line-height:2;text-align:right;font-family:Amiri,serif}
.doa i{display:block;color:#2f8fd8;font-weight:600;font-size:15px}
.doa p{margin:4px 0 0;font-weight:600;color:#5b6b8a;font-size:15px}
.sh{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sh button{background:#fff;border-radius:20px;box-shadow:0 5px 0 #d6ecff;padding:10px 2px;display:grid;justify-items:center;gap:2px;font-weight:800}
.sh button small{font-weight:600;color:#7d8aa5;font-size:13px}
.sh button.on{background:#fff4d1;box-shadow:0 5px 0 #ffd66b}
.sh .st{color:#e3e9f2}.sh .on .st{color:#ffc21a}
.bdg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bdg div{text-align:center;font-weight:700;font-size:13px;line-height:1.2}
.bdg div.off{opacity:.35;filter:grayscale(1)}
.prof{display:grid;gap:14px;padding:0 16px}
.prof button{display:flex;align-items:center;gap:14px;background:#fff;border-radius:26px;padding:16px;text-align:left;box-shadow:0 6px 0 #d6ecff;border:4px solid transparent}
.prof button.on{border-color:#ff6f7d}
.prof b{font-size:24px;display:block;line-height:1.1}.prof small{font-size:15px;color:#5b6b8a;font-weight:600}
.kin{width:100%;border:3px solid #d6ecff;border-radius:18px;padding:12px 14px;font-family:inherit;font-size:18px;font-weight:700;background:#fff;color:#24314a;min-height:52px}
.gate{position:absolute;inset:0;background:#24314acc;z-index:60;display:grid;place-items:center;padding:20px}
.gate>div{background:#fff;border-radius:28px;padding:22px;width:100%;max-width:340px;text-align:center}
.chest{display:flex;align-items:center;gap:12px;margin:0 14px 12px;padding:14px;border-radius:24px;background:linear-gradient(135deg,#ffcf3f,#ff9f43);color:#5a3500;font-weight:800;width:calc(100% - 28px);text-align:left;box-shadow:0 6px 0 #d9841f}
.chest.off{background:#fff;color:#7d8aa5;box-shadow:0 6px 0 #d6ecff}
.shake{animation:shk .5s 3}
@keyframes shk{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
/* v2: quran reader, compass, search */
.qsearch{display:flex;align-items:center;gap:10px;background:#25403f;border-radius:30px;padding:0 16px;margin:0 0 12px;min-height:50px}
.qsearch input{flex:1;background:none;border:0;color:#fff;min-height:48px;outline:none}
.qsearch input::placeholder{color:#8fa9a3}
.kbar{height:8px;border-radius:6px;background:#25403f;overflow:hidden;margin-top:6px}.kbar i{display:block;height:100%;background:#5cc48a}
.imp{background:linear-gradient(135deg,#2c5d4c,#1d3d3d);border:1px dashed #5cc48a;border-radius:20px;padding:16px;margin:12px 0}
.imp input[type=file]{display:none}
.hcards{display:grid;gap:10px;margin-top:12px}
.hcards div{border-radius:20px;padding:18px;text-align:center;background:#24403f}.hcards b{font-family:Amiri,serif;font-size:26px;font-weight:400;display:block}
.reader.sepia{background:#f5ecd9;color:#2b2116}.reader.sepia .shd{border-color:#0001}.reader.sepia .ayah{border-color:#0000000f}.reader.sepia .ayah p{color:#5a4a36}
.reader.light{background:#fff;color:#111}.reader.light .ayah p{color:#444}.reader.light .ayah{border-color:#0000000d}
.reader .ar{font-family:var(--qf,"Amiri Quran"),"Amiri",serif}
.aact{display:flex;gap:4px;margin-top:8px}
.aact button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#7d9a95}
.aact button.on{color:#ffc857}.aact button.h1{color:#ff9f43}.aact button.h2{color:#5cc48a}
.ayah.hl{background:#5cc48a1f}
.tgl{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #ffffff12;gap:12px;width:100%;text-align:left}
.tgl small{display:block;color:#9fb8b2;font-size:13px}
.sw2{width:50px;height:30px;border-radius:20px;background:#3a5a58;position:relative;flex:none}.sw2::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#cfdad7;transition:left .2s}
.sw2.on{background:#2f7d55}.sw2.on::after{left:24px;background:#5fd38a}
.dial{transition:transform .15s linear}
.qibla-ok{background:#1f5a3c!important}
.coord{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.coord input{background:#24403f;border:1px solid #3a5a58;color:#fff;border-radius:14px;padding:10px 12px;min-height:48px;width:100%}
.stp{display:grid;gap:8px}.stp div{display:flex;gap:10px;align-items:center;background:#f4f9ff;border-radius:14px;padding:8px 12px;font-weight:700}
.stp span{width:30px;height:30px;border-radius:50%;background:#3fcf9a;color:#fff;display:grid;place-items:center;flex:none;font-weight:800}
.ord .wch{font-size:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const isAr=s=>/[؀-ۿ]/.test(s||'');
function parseQuran(text){
  text=text.replace(/^﻿/,'').trim();const out=Array.from({length:114},()=>[]);
  if(text[0]==='['||text[0]==='{'){
    let j=JSON.parse(text);if(!Array.isArray(j))j=j.chapters||j.surahs||(j.data&&j.data.surahs)||Object.values(j);
    j.forEach((s,i)=>{const n=(+(s.number||s.chapter||s.id)||i+1)-1;if(n<0||n>113)return;let vs=s.verses||s.ayahs||s.ayat||[];if(!Array.isArray(vs))vs=Object.values(vs);
      vs.forEach((v,k)=>{if(typeof v==='string'){out[n][k]=[isAr(v)?v:'',isAr(v)?'':v];return}const tx=typeof v.text==='object'&&v.text?(v.text.arab||v.text.ar||''):(v.text||v.arabic||v.ar||'');const tr=typeof v.translation==='string'?v.translation:v.translation&&typeof v.translation==='object'?(v.translation.id||v.translation.text||''):(v.terjemah||v.id_translation||'');out[n][k]=[isAr(tx)?tx:'',(isAr(tx)?tr:tr||tx)||'']})});
  }else{for(const line of text.split(/\r?\n/)){const m=line.match(/^(\d{1,3})\|(\d{1,3})\|(.*)$/);if(m){const t=m[3].trim();out[m[1]-1][m[2]-1]=isAr(t)?[t,'']:['',t]}}}
  return out;
}

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const r=$('#app').getBoundingClientRect(),c=document.createElement('canvas');c.className='conf';Object.assign(c.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});document.body.appendChild(c);const W=c.width=r.width,H=c.height=r.height,x=c.getContext('2d'),cols=['#ffcf3f','#ff6f7d','#59b8ff','#3fcf9a','#9b7bff'];const P=Array.from({length:150},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*13,vy:-Math.random()*13-4,r:Math.random()*7+4,c:cols[Math.random()*5|0],a:Math.random()*6}));let f=0;const step=()=>{x.clearRect(0,0,W,H);for(const p of P){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()}if(++f<160)requestAnimationFrame(step);else c.remove()};step()}

/* ============ GAME ENGINE ============ */
const tok=s=>s.split(' ');
const clean=w=>w.replace(/[.,!?"]/g,'').toLowerCase();
const GENERIC=['for','since','when','while','before','after','by','by the time','already','how long','later','soon','at that time'];
const others=(pool,correct,n=2)=>shuffle([...new Set(pool.filter(x=>x!==correct))]).slice(0,n);
const chunk=(arr,n)=>{if(arr.length<=n)return arr.slice();const s=Math.random()*(arr.length-n+1)|0;return arr.slice(s,s+n)};
function buildGame(key){
  let qs=[],title;const adik=isAdik();
  if(ALLT[key]){const t=ALLT[key];title=t.n;const L=pick([0,1,2]),K=pick([0,1,2]),TYP=['Positif (+)','Negatif (−)','Tanya (?)'];
    const classify={t:'pick',sent:t.ex[K],prompt:'Kalimat ini termasuk jenis apa?',o:TYP,a:TYP[K],why:'Kalimat negatif memakai "not", kalimat tanya diakhiri tanda tanya (?).'};
    const fill={t:'fill',s:t.fill[0],a:t.fill[1],o:shuffle(t.fill[2]),why:`Ingat rumusnya: ${t.f.split('|').map(p=>p.split('~')[0]).join(' + ')}.`};
    const spot={t:'spot',s:t.spot[0],w:tok(t.spot[0]).findIndex(x=>clean(x)===t.spot[1].toLowerCase()),fix:t.spot[2],why:t.spot[3]};
    const listen={t:'listen',say:t.ex[L],o:shuffle(t.ex),a:t.ex[L]};
    let tsq=null;if(t.ts&&t.m==='A'){const good=t.ts.filter(x=>!GENERIC.includes(x));if(good.length){const c=pick(good),pool=MOD.A.t.filter(o=>o.g!==t.g).flatMap(o=>o.ts).filter(x=>!GENERIC.includes(x)&&!t.ts.includes(x));tsq={t:'pick',prompt:`Kata penanda waktu yang cocok untuk ${t.n}?`,o:shuffle([c,...others(pool,c)]),a:c,why:`Penanda ${t.n}: ${t.ts.join(', ')}.`}}}
    qs=adik?[classify,{t:'listen',say:t.ex[0],o:shuffle(t.ex),a:t.ex[0]},fill,listen]
      :[{t:'builder',toks:tok(t.ex[0]),answer:t.ex[0]},classify,fill,spot,tsq,listen,{t:'builder',toks:tok(t.ex[2]),answer:t.ex[2]}].filter(Boolean);
  }else if(key==='hija'){title='Tebak Huruf';qs=shuffle(HIJ).slice(0,6).map(h=>({t:'pick',big:h.h,prompt:'Huruf apa ini?',o:shuffle([h.n,...others(HIJ.map(x=>x.n),h.n)]),a:h.n,why:`Ini huruf ${h.n}.`}))}
  else if(key==='doa'){title='Kapan Doanya?';qs=shuffle(DOA).slice(0,5).map(d=>({t:'pick',arTxt:d.ar,prompt:'Doa ini dibaca kapan?',o:shuffle([d.w,...others(DOA.map(x=>x.w),d.w)]),a:d.w,why:`Ini ${d.n.toLowerCase()}: ${d.t}`}))}
  else if(key==='rukun'){title='Rukun & Wudhu';const R=RUKUN,ki=Math.random()*5|0,kj=Math.random()*6|0;
    qs=[{t:'order',toks:chunk(R.wudhu.s,adik?4:6),prompt:'Urutkan langkah wudhu, mulai dari yang pertama!'},
      {t:'pick',prompt:'Rukun Iman ada berapa?',o:['5','6','7'],a:'6',why:'Rukun Iman ada 6: Allah, malaikat, kitab, rasul, hari akhir, qada dan qadar.'},
      {t:'order',toks:chunk(R.sholat.s,adik?4:6),prompt:'Urutkan gerakan sholat!'},
      {t:'pick',prompt:`Rukun Islam yang ke-${ki+1} adalah…`,o:shuffle([R.islam.s[ki],...others(R.islam.s,R.islam.s[ki])]),a:R.islam.s[ki],why:`Rukun Islam ke-${ki+1}: ${R.islam.s[ki]}.`},
      {t:'order',toks:adik?R.islam.s.slice(0,3):R.islam.s.slice(),prompt:'Urutkan Rukun Islam!'},
      {t:'pick',prompt:`Rukun Iman yang ke-${kj+1} adalah…`,o:shuffle([R.iman.s[kj],...others(R.iman.s,R.iman.s[kj])]),a:R.iman.s[kj],why:`Rukun Iman ke-${kj+1}: ${R.iman.s[kj]}.`}]}
  else if(key==='asma'){title='Asmaul Husna';const pool=adik?ASMA.slice(0,20):ASMA;qs=shuffle(pool).slice(0,5).map(a=>({t:'pick',arTxt:a.ar,sent:a.l,prompt:'Apa arti nama Allah ini?',o:shuffle([a.t,...others(ASMA.map(x=>x.t).filter(x=>x!==a.t),a.t)]),a:a.t,why:`${a.l} artinya ${a.t}.`}))}
  else if(key==='abc'){title='Alphabet';const L=ABC.map(x=>x.l);qs=shuffle(ABC.filter(x=>x.l!=='X')).slice(0,6).map((x,i)=>i%2?{t:'pick',pic:[x.w,x.e],sent:'_'+x.w.slice(1),prompt:'Huruf depan kata ini apa?',o:shuffle([x.l,...others(L,x.l)]),a:x.l,say2:`${x.l} is for ${x.w}`,why:`${x.l} is for ${x.w}.`}:{t:'pick',say:x.l,prompt:'Dengarkan! Huruf apa itu?',o:shuffle([x.l,...others(L,x.l)]),a:x.l,why:`Yang kamu dengar adalah huruf ${x.l}.`})}
  else if(key==='talk'){title='Percakapan';const E=TALK.map(x=>x[0]),I=TALK.map(x=>x[1]);
    qs=shuffle(TALK).slice(0,5).map(([e,i],k)=>k%3===0?{t:'pick',say:e,prompt:'Dengarkan! Apa artinya?',o:shuffle([i,...others(I,i)]),a:i,why:`"${e}" artinya "${i}"`}:k%3===1||adik?{t:'pick',sent:i,prompt:'Apa bahasa Inggrisnya?',o:shuffle([e,...others(E,e)]),a:e,say2:e,why:`"${i}" dalam bahasa Inggris: "${e}"`}:{t:'builder',toks:tok(e),answer:e})}
  else if(key.startsWith('v-')){const c=VOC[key.slice(2)];title='Kosakata '+c.n;

setInterval(()=>{let stale=false;document.querySelectorAll('[data-cd]').forEach(el=>{const ms=+el.dataset.cd-Date.now();if(ms<=0)stale=true;else el.textContent=cdf(ms)});if(stale&&!sheet&&!G)render(true)},1000);
if('speechSynthesis' in window){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}catch(e){}}
render();
idb('readonly',s=>s.get('quran')).then(d=>{if(Array.isArray(d)&&d.length===114){QDATA=d;render(true)}}).catch(()=>{});
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude|anthropic/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
try{if(S.city==='gps'&&S.loc&&S.loc.n==='Lokasi GPS'&&navigator.permissions)navigator.permissions.query({name:'geolocation'}).then(r=>{if(r.state==='granted')useGPS(true)}).catch(()=>{})}catch(e){}
}

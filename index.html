{id:'ummi',n:'Shalawat Ummi',tag:'Populer di Indonesia',ar:'اللّٰهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ النَّبِيِّ الْأُمِّيِّ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ',l:'Allâhumma shalli \'alâ sayyidinâ Muhammadinin-nabiyyil-ummiyyi wa \'alâ âlihî wa shahbihî wa sallim',t:'Ya Allah, limpahkanlah shalawat kepada junjungan kami Muhammad, Nabi yang ummi, beserta keluarga dan sahabatnya, dan limpahkanlah salam.',ket:'Shalawat ringkas yang populer di majelis dzikir Nusantara. Sifat "an-nabiyy al-ummi" disebut dalam QS Al-A\'raf: 157.',src:'Disusun ulama; makna dari QS Al-A\'raf: 157'},
{id:'nariyah',n:'Shalawat Nariyah (Tafrijiyah)',tag:'Populer di Indonesia',ar:'اللّٰهُمَّ صَلِّ صَلَاةً كَامِلَةً وَسَلِّمْ سَلَامًا تَامًّا عَلَى سَيِّدِنَا مُحَمَّدٍ الَّذِي تَنْحَلُّ بِهِ الْعُقَدُ، وَتَنْفَرِجُ بِهِ الْكُرَبُ، وَتُقْضَى بِهِ الْحَوَائِجُ، وَتُنَالُ بِهِ الرَّغَائِبُ وَحُسْنُ الْخَوَاتِيمِ، وَيُسْتَسْقَى الْغَمَامُ بِوَجْهِهِ الْكَرِيمِ، وَعَلَى آلِهِ وَصَحْبِهِ فِي كُلِّ لَمْحَةٍ وَنَفَسٍ بِعَدَدِ كُلِّ مَعْلُومٍ لَكَ',l:'Allâhumma shalli shalâtan kâmilatan wa sallim salâman tâmman \'alâ sayyidinâ Muhammadinil-ladzî tanhallu bihil-\'uqadu, wa tanfariju bihil-kurabu, wa tuqdhâ bihil-hawâ\'iju, wa tunâlu bihir-raghâ\'ibu wa husnul-khawâtîm, wa yustasqal-ghamâmu bi wajhihil-karîm, wa \'alâ âlihî wa shahbihî fî kulli lamhatin wa nafasin bi \'adadi kulli ma\'lûmin lak',t:'Ya Allah, limpahkanlah shalawat yang sempurna dan salam yang penuh kepada junjungan kami Muhammad, yang dengan (wasilah)nya terurai segala ikatan, hilang segala kesusahan, terpenuhi segala hajat, tercapai segala keinginan dan husnul khatimah, dan diminta hujan dengan (wasilah) wajahnya yang mulia, juga kepada keluarga dan sahabatnya, setiap kedipan mata dan tarikan napas, sebanyak bilangan segala yang Engkau ketahui.',ket:'Dinisbatkan kepada Syaikh Ibrahim At-Tazi (abad ke-15) dan populer di Indonesia, sering dibaca 4.444 kali dalam majelis. Sebagian ulama mengkritik redaksi tawassul di dalamnya, sementara banyak ulama Nusantara mengamalkannya.',src:'Disusun ulama; bukan dari hadis'},
{id:'munjiyat',n:'Shalawat Munjiyat (Tunjina)',tag:'Populer di Indonesia',ar:'اللّٰهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ صَلَاةً تُنْجِينَا بِهَا مِنْ جَمِيعِ الْأَهْوَالِ وَالْآفَاتِ، وَتَقْضِي لَنَا بِهَا جَمِيعَ الْحَاجَاتِ، وَتُطَهِّرُنَا بِهَا مِنْ جَمِيعِ السَّيِّئَاتِ، وَتَرْفَعُنَا بِهَا عِنْدَكَ أَعْلَى الدَّرَجَاتِ، وَتُبَلِّغُنَا بِهَا أَقْصَى الْغَايَاتِ مِنْ جَمِيعِ الْخَيْرَاتِ فِي الْحَيَاةِ وَبَعْدَ الْمَمَاتِ',l:'Allâhumma shalli \'alâ sayyidinâ Muhammadin shalâtan tunjînâ bihâ min jamî\'il-ahwâli wal-âfât, wa taqdhî lanâ bihâ jamî\'al-hâjât, wa tuthahhirunâ bihâ min jamî\'is-sayyi\'ât, wa tarfa\'unâ bihâ \'indaka a\'lad-darajât, wa tuballighunâ bihâ aqshal-ghâyâti min jamî\'il-khairâti fil-hayâti wa ba\'dal-mamât',t:'Ya Allah, limpahkanlah shalawat kepada junjungan kami Muhammad, shalawat yang dengannya Engkau selamatkan kami dari segala ketakutan dan bencana, Engkau penuhi segala hajat kami, Engkau sucikan kami dari segala keburukan, Engkau angkat kami ke derajat tertinggi di sisi-Mu, dan Engkau sampaikan kami pada puncak segala kebaikan, di dunia dan setelah mati.',ket:'Dinukil dalam kitab-kitab ulama seperti karya Al-Fakihani. Sering dibaca saat menghadapi musibah atau hajat besar.',src:'Disusun ulama; bukan dari hadis'},
{id:'fatih',n:'Shalawat Al-Fatih',tag:'Disusun ulama',ar:'اللّٰهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ الْفَاتِحِ لِمَا أُغْلِقَ، وَالْخَاتِمِ لِمَا سَبَقَ، نَاصِرِ الْحَقِّ بِالْحَقِّ، وَالْهَادِي إِلَى صِرَاطِكَ الْمُسْتَقِيمِ، وَعَلَى آلِهِ حَقَّ قَدْرِهِ وَمِقْدَارِهِ الْعَظِيمِ',l:'Allâhumma shalli \'alâ sayyidinâ Muhammadinil-fâtihi limâ ughliq, wal-khâtimi limâ sabaq, nâshiril-haqqi bil-haqq, wal-hâdî ilâ shirâthikal-mustaqîm, wa \'alâ âlihî haqqa qadrihî wa miqdârihil-\'azhîm',t:'Ya Allah, limpahkanlah shalawat kepada junjungan kami Muhammad, pembuka apa yang tertutup, penutup apa yang terdahulu (para nabi), penolong kebenaran dengan kebenaran, dan penunjuk ke jalan-Mu yang lurus, juga kepada keluarganya, sesuai kedudukan dan martabatnya yang agung.',ket:'Dinisbatkan kepada Syaikh Muhammad Al-Bakri (abad ke-15). Diamalkan dalam beberapa tarekat.',src:'Disusun ulama; bukan dari hadis'},
{id:'thibbilqulub',n:'Shalawat Thibbil Qulub (Syifa)',tag:'Populer di Indonesia',ar:'اللّٰهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ طِبِّ الْقُلُوبِ وَدَوَائِهَا، وَعَافِيَةِ الْأَبْدَانِ وَشِفَائِهَا، وَنُورِ الْأَبْصَارِ وَضِيَائِهَا، وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ',l:'Allâhumma shalli \'alâ sayyidinâ Muhammadin thibbil-qulûbi wa dawâ\'ihâ, wa \'âfiyatil-abdâni wa syifâ\'ihâ, wa nûril-abshâri wa dhiyâ\'ihâ, wa \'alâ âlihî wa shahbihî wa sallim',t:'Ya Allah, limpahkanlah shalawat kepada junjungan kami Muhammad, pengobat hati dan penawarnya, penyehat badan dan penyembuhnya, cahaya penglihatan dan sinarnya, juga kepada keluarga dan sahabatnya, dan limpahkanlah salam.',ket:'Sering dibaca saat sakit sebagai doa kesembuhan. Kesembuhan tetap dari Allah; berobat juga diperintahkan.',src:'Disusun ulama; bukan dari hadis'},
{id:'asyghil',n:'Shalawat Asyghil',tag:'Disusun ulama',ar:'اللّٰهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ، وَأَشْغِلِ الظَّالِمِينَ بِالظَّالِمِينَ، وَأَخْرِجْنَا مِنْ بَيْنِهِمْ سَالِمِينَ، وَعَلَى آلِهِ وَصَحْبِهِ أَجْمَعِينَ',l:'Allâhumma shalli \'alâ sayyidinâ Muhammad, wa asyghilizh-zhâlimîna bizh-zhâlimîn, wa akhrijnâ min bainihim sâlimîn, wa \'alâ âlihî wa shahbihî ajma\'în',t:'Ya Allah, limpahkanlah shalawat kepada junjungan kami Muhammad. Sibukkanlah orang-orang zalim dengan sesama mereka, dan keluarkanlah kami dari tengah mereka dengan selamat, juga (shalawat) kepada keluarga dan seluruh sahabatnya.',ket:'Dinisbatkan kepada Imam Ja\'far Ash-Shadiq. Dibaca untuk memohon perlindungan dari kezaliman.',src:'Disusun ulama; bukan dari hadis'},
{id:'yanabi',n:'Yâ Nabî Salâm \'Alaika',tag:'Populer di Indonesia',ar:'يَا نَبِي سَلَامْ عَلَيْكَ ۞ يَا رَسُولْ سَلَامْ عَلَيْكَ ۞ يَا حَبِيبْ سَلَامْ عَلَيْكَ ۞ صَلَوَاتُ اللّٰهِ عَلَيْكَ',l:'Yâ Nabî salâm \'alaika, yâ Rasûl salâm \'alaika, yâ Habîb salâm \'alaika, shalawâtullâh \'alaika',t:'Wahai Nabi, salam atasmu. Wahai Rasul, salam atasmu. Wahai kekasih, salam atasmu. Shalawat Allah atasmu.',ket:'Dilantunkan sambil berdiri (mahallul qiyam) dalam pembacaan Maulid Al-Barzanji di majelis maulid dan pengajian di seluruh Nusantara.',src:'Maulid Al-Barzanji, Syaikh Ja\'far Al-Barzanji (abad ke-18)'},
{id:'zainal',n:'Assalâmu\'alaika Zainal Anbiyâ\'',tag:'Populer di Indonesia',ar:'السَّلَامُ عَلَيْكَ زَيْنَ الْأَنْبِيَاءِ ۞ السَّلَامُ عَلَيْكَ أَتْقَى الْأَتْقِيَاءِ ۞ السَّلَامُ عَلَيْكَ أَصْفَى الْأَصْفِيَاءِ ۞ السَّلَامُ عَلَيْكَ أَزْكَى الْأَزْكِيَاءِ',l:'Assalâmu \'alaika zainal-anbiyâ\', assalâmu \'alaika atqal-atqiyâ\', assalâmu \'alaika ashfal-ashfiyâ\', assalâmu \'alaika azkal-azkiyâ\'',t:'Salam atasmu, wahai perhiasan para nabi. Salam atasmu, wahai yang paling bertakwa. Salam atasmu, wahai yang paling suci hatinya. Salam atasmu, wahai yang paling bersih jiwanya.',ket:'Syair salam kepada Nabi yang sering dilantunkan di majelis shalawat, maulid, dan acara keluarga di Indonesia.',src:'Syair maulid tradisional'},
{id:'kamilah',n:'Shalawat Kamilah',tag:'Populer di Indonesia',ar:'اللّٰهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ عَدَدَ كَمَالِ اللّٰهِ وَكَمَا يَلِيقُ بِكَمَالِهِ',l:'Allâhumma shalli wa sallim wa bârik \'alâ sayyidinâ Muhammadin wa \'alâ âlihî \'adada kamâlillâhi wa kamâ yalîqu bikamâlih',t:'Ya Allah, limpahkanlah shalawat, salam, dan berkah kepada junjungan kami Muhammad dan keluarganya, sebanyak kesempurnaan Allah dan sebagaimana layak bagi kesempurnaan-Nya.',ket:'Shalawat ringkas yang sering dibaca sebagai wirid harian di pesantren.',src:'Disusun ulama; bukan dari hadis'},
{id:'yarobbi',n:'Yâ Rabbi bil Mushthafâ',tag:'Populer di Indonesia',ar:'يَا رَبِّ بِالْمُصْطَفَى بَلِّغْ مَقَاصِدَنَا ۞ وَاغْفِرْ لَنَا مَا مَضَى يَا وَاسِعَ الْكَرَمِ',l:'Yâ rabbi bil-mushthafâ balligh maqâshidanâ, waghfir lanâ mâ madhâ yâ wâsi\'al-karami',t:'Wahai Tuhanku, dengan (berkah) Al-Mushthafa, sampaikanlah maksud-maksud kami, dan ampunilah dosa kami yang telah lalu, wahai Yang Mahaluas kemurahan-Nya.',ket:'Bait yang biasa dilantunkan bersama Qasidah Burdah, sering menjadi pembuka atau penutup majelis shalawat.',src:'Tradisi pembacaan Qasidah Burdah'},
{id:'badar',n:'Shalawat Badar',tag:'Populer di Indonesia',nolyr:1,l:'Shalâtullâh salâmullâh, \'alâ Thâhâ rasûlillâh… (baris pembuka)',t:'',ket:'Disusun oleh KH Ali Manshur Shiddiq sekitar awal 1960-an, lalu dipopulerkan di lingkungan Nahdlatul Ulama. Isinya shalawat dan salam kepada Nabi ﷺ serta tawassul dengan para sahabat pejuang Perang Badar. Kini menjadi salah satu shalawat paling dikenal di Indonesia.',src:'KH Ali Manshur Shiddiq (abad ke-20)'},
{id:'tanpowaton',n:'Syi\'ir Tanpo Waton ("Shalawat Gus Dur")',tag:'Populer di Indonesia',nolyr:1,l:'Syair berbahasa Jawa, diawali istighfar dan shalawat',t:'',ket:'Syair tasawuf berbahasa Jawa yang populer sekitar 2010 dan sering disebut "Shalawat Gus Dur" karena suara pelantunnya mirip KH Abdurrahman Wahid. Syair ini sebenarnya karya dan dilantunkan oleh KH Mohammad Nizam As-Shofa (Sidoarjo). Isinya ajakan memperbaiki hati, belajar Al-Qur\'an, dan mengamalkan syariat dengan hakikat.',src:'KH Mohammad Nizam As-Shofa (abad ke-21)'},
{id:'tarhim',n:'Shalawat Tarhim',tag:'Populer di Indonesia',nolyr:1,l:'Ash-shalâtu was-salâmu \'alaik… (baris pembuka)',t:'',ket:'Lantunan pujian kepada Nabi ﷺ yang diputar di banyak masjid Indonesia menjelang adzan Subuh. Rekaman yang terkenal dilantunkan Syaikh Mahmud Khalil Al-Hushari (qari Mesir) dan direkam di studio Lokananta, Solo, sekitar tahun 1960-an.',src:'Syaikh Mahmud Khalil Al-Hushari (abad ke-20)'},
{id:'burdah',n:'Maulâya shalli wa sallim (Burdah)',tag:'Syair klasik',ar:'مَوْلَايَ صَلِّ وَسَلِّمْ دَائِمًا أَبَدًا ۞ عَلَى حَبِيبِكَ خَيْرِ الْخَلْقِ كُلِّهِمِ',l:'Maulâya shalli wa sallim dâ\'iman abadan, \'alâ habîbika khairil-khalqi kullihimi',t:'Wahai Tuhanku, limpahkanlah shalawat dan salam selalu dan selamanya kepada kekasih-Mu, sebaik-baik seluruh makhluk.',ket:'Bait penyela (refrain) dari Qasidah Burdah karya Imam Al-Bushiri (wafat ±1294 M), syair pujian Nabi yang paling terkenal.',src:'Qasidah Al-Burdah, Imam Al-Bushiri (abad ke-13)'},
{id:'thalaal',n:'Thala\'al Badru \'Alainâ',tag:'Syair klasik',ar:'طَلَعَ الْبَدْرُ عَلَيْنَا ۞ مِنْ ثَنِيَّاتِ الْوَدَاعِ ۞ وَجَبَ الشُّكْرُ عَلَيْنَا ۞ مَا دَعَا لِلّٰهِ دَاعِ ۞ أَيُّهَا الْمَبْعُوثُ فِينَا ۞ جِئْتَ بِالْأَمْرِ الْمُطَاعِ',l:'Thala\'al-badru \'alainâ, min tsaniyyâtil-wadâ\'. Wajabasy-syukru \'alainâ, mâ da\'â lillâhi dâ\'. Ayyuhal-mab\'ûtsu fînâ, ji\'ta bil-amril-muthâ\'',t:'Telah terbit bulan purnama di atas kami, dari bukit Tsaniyyatul Wada\'. Wajib kami bersyukur selama ada yang menyeru kepada Allah. Wahai yang diutus kepada kami, engkau datang membawa perintah yang ditaati.',ket:'Syair yang menurut riwayat sejarah dilantunkan penduduk Madinah saat menyambut Nabi ﷺ. Sanad riwayatnya dinilai lemah oleh sebagian ahli hadis, tetapi syairnya klasik dan populer.',src:'Riwayat sirah (Al-Baihaqi, Dala\'il An-Nubuwwah)'}];

/* ============ KISAH NARASI (bab + percakapan) ============ */
/* format: KBAB[id] = [[judul bab, [paragraf...], [[pembicara, ucapan, rujukan], ...]], ...] */
const KBAB={};
KBAB.adam=[
[`Rencana Allah: seorang khalifah`,[`Sebelum manusia ada, Allah memberitahukan rencana-Nya kepada para malaikat: Dia akan menjadikan seorang khalifah di bumi. Para malaikat, yang selalu bertasbih, bertanya dengan penuh hormat, karena mereka khawatir makhluk baru itu akan menumpahkan darah.`,`Allah menjawab bahwa Dia mengetahui apa yang tidak mereka ketahui.`],
[[`Allah`,`Sesungguhnya Aku hendak menjadikan khalifah di bumi.`,`QS Al-Baqarah: 30`],[`Para malaikat`,`Apakah Engkau hendak menjadikan di sana orang yang merusak dan menumpahkan darah, padahal kami bertasbih memuji-Mu dan menyucikan nama-Mu?`,`QS Al-Baqarah: 30`],[`Allah`,`Sungguh, Aku mengetahui apa yang tidak kamu ketahui.`,`QS Al-Baqarah: 30`]]],
[`Ujian ilmu dan perintah sujud`,[`Allah menciptakan Adam dari tanah liat, membentuknya, lalu meniupkan ruh ciptaan-Nya. Kemudian Allah mengajarkan kepada Adam nama-nama segala sesuatu.`,`Allah memperlihatkan benda-benda itu kepada para malaikat dan meminta mereka menyebutkan namanya. Para malaikat mengakui keterbatasan ilmu mereka. Lalu Adam menyebutkan semuanya.`,`Setelah itu Allah memerintahkan para malaikat bersujud (sebagai penghormatan) kepada Adam. Semuanya bersujud, kecuali Iblis dari golongan jin. Ia menolak karena sombong dan merasa lebih mulia.`],
[[`Para malaikat`,`Mahasuci Engkau, tidak ada yang kami ketahui selain apa yang telah Engkau ajarkan kepada kami.`,`QS Al-Baqarah: 32`],[`Allah`,`Apa yang menghalangimu bersujud ketika Aku menyuruhmu?`,`QS Al-A'raf: 12`],[`Iblis`,`Aku lebih baik daripada dia. Engkau ciptakan aku dari api, sedangkan dia Engkau ciptakan dari tanah.`,`QS Al-A'raf: 12`]]],
[`Di surga, godaan, dan taubat`,[`Adam dan istrinya, Hawa, ditempatkan di surga dan boleh menikmati apa saja, kecuali mendekati satu pohon. Iblis yang telah dilaknat bersumpah akan menyesatkan anak cucu Adam. Ia membisikkan bahwa pohon itu akan membuat mereka kekal.`,`Keduanya lupa dan memakan buahnya. Seketika aurat mereka tampak, dan mereka menutupinya dengan daun-daun surga. Adam tidak membela diri seperti Iblis. Ia langsung mengakui kesalahan dan memohon ampun.`],
[[`Iblis`,`Tuhanmu tidak melarangmu mendekati pohon ini, kecuali agar kamu berdua tidak menjadi malaikat atau menjadi orang yang kekal.`,`QS Al-A'raf: 20`],[`Adam & Hawa`,`Ya Tuhan kami, kami telah menzalimi diri kami sendiri. Jika Engkau tidak mengampuni kami dan merahmati kami, niscaya kami termasuk orang-orang yang rugi.`,`QS Al-A'raf: 23`]]],
[`Kehidupan di bumi`,[`Allah menerima taubat mereka, lalu menurunkan mereka ke bumi sebagai tempat tinggal sampai waktu yang ditentukan, disertai janji petunjuk: siapa yang mengikuti petunjuk-Nya tidak akan takut dan bersedih.`,`Di bumi, putra-putra Adam berkembang. Al-Qur'an menceritakan dua putranya yang berkurban. Kurban yang satu diterima, yang lain tidak, lalu yang iri membunuh saudaranya. Inilah pembunuhan pertama dalam sejarah manusia, yang mengajarkan bahaya iri hati. (Nama Habil dan Qabil berasal dari riwayat, bukan dari Al-Qur'an.)`],
[[`Putra yang saleh`,`Sesungguhnya Allah hanya menerima (kurban) dari orang-orang yang bertakwa.`,`QS Al-Ma'idah: 27`]]]];
KBAB.idris=[
[`Seorang yang sangat jujur`,[`Al-Qur'an menyebut Idris dengan dua sifat mulia: shiddiq (sangat membenarkan dan jujur) dan nabi. Ia hidup jauh sebelum Nabi Nuh menurut para ahli sejarah, dan termasuk keturunan Adam yang menjaga ajaran tauhid.`,`Sedikit sekali rincian kehidupannya yang disebut dalam sumber yang kuat. Para ulama mengingatkan agar kita tidak berlebihan dengan kisah-kisah yang tidak bersanad.`],[[`Allah`,`Dan ceritakanlah (Muhammad) kisah Idris di dalam Kitab (Al-Qur'an). Sesungguhnya dia adalah orang yang sangat membenarkan dan seorang nabi. Dan Kami telah mengangkatnya ke martabat yang tinggi.`,`QS Maryam: 56–57`]]],
[`Bertemu Rasulullah di langit keempat`,[`Dalam perjalanan Mi'raj, Nabi Muhammad ﷺ naik dari satu langit ke langit berikutnya ditemani Jibril. Di langit keempat beliau bertemu Nabi Idris, yang menyambutnya dengan hangat.`],[[`Jibril`,`Ini Idris, berilah salam kepadanya.`,`HR. Bukhari & Muslim`],[`Nabi Idris`,`Selamat datang wahai saudara yang saleh dan nabi yang saleh.`,`HR. Bukhari & Muslim`]]],
[`Pelajaran`,[`Kisah Idris mengajarkan bahwa kemuliaan di sisi Allah diraih dengan kejujuran, kesabaran, dan keteguhan. Banyak riwayat menyebut beliau orang pertama yang menulis dengan pena dan pandai menjahit. Riwayat ini populer, tetapi derajatnya lemah, sehingga cukup diambil hikmahnya: ilmu dan keterampilan adalah bagian dari ibadah.`]]];
KBAB.nuh=[
[`Kaum yang lupa`,[`Generasi demi generasi setelah Adam hidup dalam tauhid. Lalu muncul kebiasaan membuat patung orang-orang saleh yang telah wafat (Wadd, Suwa', Yaghuts, Ya'uq, dan Nasr) untuk dikenang. Lama-kelamaan, generasi berikutnya menyembah patung-patung itu. (Penjelasan ini dari Ibnu Abbas dalam Shahih Bukhari.)`,`Allah mengutus Nuh, rasul pertama kepada penduduk bumi, untuk mengajak mereka kembali menyembah Allah saja.`],
[[`Nuh`,`Wahai kaumku, sembahlah Allah, tidak ada tuhan bagimu selain Dia. Sesungguhnya aku takut kamu akan ditimpa azab pada hari yang besar.`,`QS Al-A'raf: 59`],[`Para pemuka kaum`,`Sesungguhnya kami melihatmu berada dalam kesesatan yang nyata.`,`QS Al-A'raf: 60`]]],
[`Dakwah tanpa lelah`,[`Nuh berdakwah dengan segala cara: siang dan malam, terang-terangan dan diam-diam. Setiap kali diajak, mereka menutup telinga dengan jari dan menutup wajah dengan pakaian. Mereka merendahkan para pengikut Nuh yang miskin dan meminta Nuh mengusir mereka. Nuh menolak.`,`Nuh juga menjelaskan buah dari istighfar: hujan yang lebat, harta, anak-anak, kebun, dan sungai.`],
[[`Nuh`,`Mohonlah ampunan kepada Tuhanmu, sungguh Dia Maha Pengampun. Niscaya Dia menurunkan hujan yang lebat dari langit kepadamu, memperbanyak harta dan anak-anakmu.`,`QS Nuh: 10–12`],[`Kaum Nuh`,`Wahai Nuh, engkau telah berbantah dengan kami dan memperpanjang bantahanmu. Datangkanlah kepada kami azab yang engkau ancamkan, jika engkau termasuk orang yang benar.`,`QS Hud: 32`]]],
[`Membangun bahtera`,[`Setelah 950 tahun, Allah mewahyukan bahwa tidak akan ada lagi yang beriman selain yang sudah beriman. Nuh diperintah membuat bahtera di bawah pengawasan Allah.`,`Setiap kali pemuka kaumnya lewat, mereka mengejeknya karena membuat kapal di daratan. Nuh menjawab dengan tenang.`],
[[`Nuh`,`Jika kamu mengejek kami, maka kami pun akan mengejekmu sebagaimana kamu mengejek. Kelak kamu akan mengetahui siapa yang akan ditimpa azab yang menghinakan.`,`QS Hud: 38–39`]]],
[`Banjir besar dan seorang anak`,[`Ketika perintah Allah datang, air memancar dari tanur dan dari bumi, dan hujan turun deras dari langit. Nuh membawa orang-orang beriman dan sepasang dari setiap jenis hewan. Bahtera berlayar di tengah gelombang setinggi gunung.`,`Nuh melihat putranya di tempat terpisah dan memanggilnya dengan penuh kasih. Putranya menolak dan mengira gunung dapat menyelamatkannya. Gelombang memisahkan keduanya.`],
[[`Nuh`,`Wahai anakku, naiklah (ke kapal) bersama kami, dan janganlah engkau bersama orang-orang kafir.`,`QS Hud: 42`],[`Putra Nuh`,`Aku akan berlindung ke gunung yang dapat menyelamatkanku dari air bah.`,`QS Hud: 43`],[`Nuh`,`Tidak ada yang melindungi hari ini dari azab Allah selain Allah Yang Maha Penyayang.`,`QS Hud: 43`]]],
[`Berlabuh di Judi`,[`Setelah semuanya selesai, bumi diperintah menelan airnya dan langit berhenti menurunkan hujan. Bahtera berlabuh di Bukit Judi. Nuh berdoa untuk putranya, dan Allah mengajarinya bahwa keluarga sejati adalah yang seiman. Nuh segera memohon ampun.`],
[[`Allah`,`Wahai bumi, telanlah airmu! Wahai langit, berhentilah!`,`QS Hud: 44`],[`Nuh`,`Ya Tuhanku, aku berlindung kepada-Mu dari memohon sesuatu yang aku tidak mengetahui (hakikat)nya. Jika Engkau tidak mengampuniku dan merahmatiku, niscaya aku termasuk orang yang rugi.`,`QS Hud: 47`]]]];
KBAB.hud=[
[`Kaum 'Ad yang perkasa`,[`Kaum 'Ad hidup di Al-Ahqaf, daerah bukit-bukit pasir di selatan Jazirah Arab. Allah memberi mereka tubuh kuat, ternak, kebun, dan mata air. Mereka membangun Iram, kota bertiang-tiang tinggi yang belum pernah ada tandingannya.`,`Namun kekuatan membuat mereka sombong. Allah mengutus saudara mereka sendiri, Hud.`],
[[`Hud`,`Wahai kaumku, sembahlah Allah, tidak ada tuhan bagimu selain Dia. Mengapa kamu tidak bertakwa?`,`QS Al-A'raf: 65`],[`Kaum 'Ad`,`Siapakah yang lebih kuat dari kami?`,`QS Fushshilat: 15`]]],
[`Tantangan dan keteguhan`,[`Mereka menuduh Hud kurang akal dan berkata tuhan-tuhan mereka telah membuatnya gila. Hud menantang mereka semua dengan keyakinan penuh kepada Allah.`],
[[`Kaum 'Ad`,`Kami tidak akan meninggalkan sembahan kami karena perkataanmu, dan kami tidak akan beriman kepadamu.`,`QS Hud: 53`],[`Hud`,`Aku bersaksi kepada Allah dan saksikanlah bahwa aku berlepas diri dari apa yang kamu persekutukan… Maka lakukanlah tipu dayamu semua terhadapku dan jangan beri aku tangguh. Sesungguhnya aku bertawakal kepada Allah, Tuhanku dan Tuhanmu.`,`QS Hud: 54–56`]]],
[`Awan yang ternyata azab`,[`Kemarau melanda. Suatu hari mereka melihat gumpalan awan bergerak menuju lembah mereka dan bergembira karena mengira hujan akan turun. Ternyata itu angin yang sangat dingin dan kencang. Angin itu berembus tujuh malam delapan hari dan menghancurkan segalanya. Hud dan orang-orang beriman diselamatkan.`,`Karena itu, Nabi Muhammad ﷺ tampak cemas setiap kali melihat awan gelap atau angin kencang, sampai hujan turun (HR. Bukhari & Muslim).`],
[[`Kaum 'Ad`,`Inilah awan yang akan menurunkan hujan kepada kita.`,`QS Al-Ahqaf: 24`],[`Allah`,`Bukan! Itulah azab yang kamu minta disegerakan, (yaitu) angin yang mengandung azab yang pedih.`,`QS Al-Ahqaf: 24`]]]];
KBAB.saleh=[
[`Pemahat gunung`,[`Kaum Tsamud mewarisi negeri setelah kaum 'Ad. Mereka mahir memahat gunung menjadi rumah-rumah megah. Sisa-sisanya masih dapat dilihat di Al-Hijr (Hegra) dekat Al-Ula. Allah mengutus Saleh, seorang yang sebelumnya sangat mereka harapkan.`],
[[`Kaum Tsamud`,`Wahai Saleh, sungguh engkau sebelum ini berada di tengah kami sebagai orang yang kami harapkan. Mengapa engkau melarang kami menyembah apa yang disembah nenek moyang kami?`,`QS Hud: 62`]]],
[`Unta dari Allah`,[`Mereka meminta bukti. Allah mendatangkan seekor unta betina sebagai mukjizat dan ujian. Air sumur dibagi: sehari untuk unta, sehari untuk mereka. Saleh memperingatkan agar unta itu jangan diganggu.`],
[[`Saleh`,`Wahai kaumku, inilah unta betina dari Allah sebagai tanda (mukjizat) untukmu. Biarkanlah ia makan di bumi Allah, dan jangan kamu mengganggunya dengan gangguan apa pun yang akan menyebabkan kamu segera ditimpa azab.`,`QS Hud: 64`]]],
[`Sembilan perusak dan akhir yang pahit`,[`Sembilan orang perusak di kota itu bersekongkol. Orang yang paling celaka di antara mereka menyembelih unta itu, sementara yang lain merestui. Mereka bahkan berencana membunuh Saleh dan keluarganya pada malam hari.`,`Saleh memberi tenggat tiga hari. Lalu datang suara keras yang mengguntur dan gempa, dan mereka mati bergelimpangan di rumah-rumah mereka.`],
[[`Para perusak`,`Bersumpahlah kamu dengan nama Allah, bahwa kita pasti akan menyerangnya dan keluarganya pada malam hari.`,`QS An-Naml: 49`],[`Saleh`,`Bersenang-senanglah kamu di rumahmu selama tiga hari. Itu adalah janji yang tidak dapat didustakan.`,`QS Hud: 65`],[`Saleh`,`Wahai kaumku, sungguh aku telah menyampaikan amanat Tuhanku kepadamu dan aku telah menasihati kamu, tetapi kamu tidak menyukai orang-orang yang memberi nasihat.`,`QS Al-A'raf: 79`]]]];
KBAB.ibrahim=[
[`Pemuda yang mencari Tuhan`,[`Ibrahim tumbuh di tengah kaum penyembah berhala dan bintang. Ayahnya, Azar, adalah pembuat berhala. Dengan akal yang jernih, Ibrahim mengajak kaumnya berpikir. Ketika melihat bintang, bulan, lalu matahari terbenam, ia menegaskan bahwa yang terbenam tidak layak disembah.`,`Ia menasihati ayahnya dengan lembut, memanggilnya "wahai ayahku" berulang kali.`],
[[`Ibrahim`,`Wahai ayahku, mengapa engkau menyembah sesuatu yang tidak mendengar, tidak melihat, dan tidak dapat menolongmu sedikit pun?`,`QS Maryam: 42`],[`Azar`,`Bencikah engkau kepada tuhan-tuhanku, wahai Ibrahim? Jika engkau tidak berhenti, pasti engkau akan kurajam. Tinggalkanlah aku untuk waktu yang lama.`,`QS Maryam: 46`],[`Ibrahim`,`Semoga keselamatan dilimpahkan kepadamu. Aku akan memohonkan ampunan bagimu kepada Tuhanku.`,`QS Maryam: 47`]]],
[`Kapak dan berhala terbesar`,[`Saat kaumnya pergi ke perayaan, Ibrahim menghancurkan berhala-berhala dan menggantungkan kapak di leher berhala terbesar. Ketika mereka kembali dan murka, Ibrahim menyuruh mereka bertanya kepada berhala itu, supaya mereka sadar berhala tak bisa berbicara.`],
[[`Kaumnya`,`Engkaukah yang melakukan ini terhadap tuhan-tuhan kami, wahai Ibrahim?`,`QS Al-Anbiya: 62`],[`Ibrahim`,`Sebenarnya patung besar itu yang melakukannya. Maka tanyakanlah kepada mereka, jika mereka dapat berbicara.`,`QS Al-Anbiya: 63`],[`Kaumnya`,`Engkau tahu bahwa (berhala-berhala) itu tidak dapat berbicara.`,`QS Al-Anbiya: 65`],[`Ibrahim`,`Mengapa kamu menyembah selain Allah sesuatu yang tidak memberi manfaat dan tidak pula mendatangkan mudarat kepadamu?`,`QS Al-Anbiya: 66`]]],
[`Debat dengan raja dan api yang dingin`,[`Ibrahim dihadapkan kepada raja yang mengaku berkuasa (para mufasir menyebutnya Namrud). Hujjah Ibrahim membuat raja itu terdiam.`,`Kaumnya lalu menyalakan api yang sangat besar dan melemparkan Ibrahim ke dalamnya. Ibrahim berserah diri dengan kalimat "Hasbunallah wa ni'mal wakil" (HR. Bukhari, dari Ibnu Abbas). Allah memerintahkan api menjadi dingin dan menyelamatkan.`],
[[`Ibrahim`,`Tuhanku ialah Yang menghidupkan dan mematikan.`,`QS Al-Baqarah: 258`],[`Sang raja`,`Aku pun dapat menghidupkan dan mematikan.`,`QS Al-Baqarah: 258`],[`Ibrahim`,`Allah menerbitkan matahari dari timur, maka terbitkanlah ia dari barat!`,`QS Al-Baqarah: 258`],[`Allah`,`Wahai api, jadilah dingin dan keselamatan bagi Ibrahim!`,`QS Al-Anbiya: 69`]]],
[`Lembah tanpa tanaman`,[`Atas perintah Allah, Ibrahim membawa Hajar dan bayi Ismail ke lembah Makkah yang kering, hanya dengan sekantong kurma dan sedikit air. Saat Ibrahim beranjak pergi, Hajar mengejarnya dan bertanya. Jawaban Ibrahim membuatnya tenang. (HR. Bukhari, dari Ibnu Abbas)`],
[[`Hajar`,`Wahai Ibrahim, ke mana engkau pergi meninggalkan kami di lembah yang tidak ada manusia dan apa pun ini? Apakah Allah yang memerintahkanmu?`,`HR. Bukhari`],[`Ibrahim`,`Ya.`,`HR. Bukhari`],[`Hajar`,`Kalau begitu, Allah tidak akan menyia-nyiakan kami.`,`HR. Bukhari`],[`Ibrahim (berdoa)`,`Ya Tuhan kami, sesungguhnya aku telah menempatkan sebagian keturunanku di lembah yang tidak bertanaman di dekat rumah-Mu yang dihormati… maka jadikanlah hati sebagian manusia cenderung kepada mereka.`,`QS Ibrahim: 37`]]],
[`Mimpi dan pengorbanan`,[`Bertahun-tahun kemudian, Ibrahim bermimpi menyembelih Ismail. Mimpi para nabi adalah wahyu. Ia menyampaikannya kepada putranya, dan jawaban Ismail menjadi teladan sepanjang masa. Ketika keduanya telah berserah diri, Allah memanggil Ibrahim dan menggantinya dengan sembelihan yang besar.`],
[[`Ibrahim`,`Wahai anakku, sesungguhnya aku bermimpi bahwa aku menyembelihmu. Maka pikirkanlah bagaimana pendapatmu!`,`QS Ash-Shaffat: 102`],[`Ismail`,`Wahai ayahku, lakukanlah apa yang diperintahkan (Allah) kepadamu. Insya Allah engkau akan mendapatiku termasuk orang yang sabar.`,`QS Ash-Shaffat: 102`],[`Allah`,`Wahai Ibrahim, sungguh engkau telah membenarkan mimpi itu.`,`QS Ash-Shaffat: 104–105`]]],
[`Membangun Ka'bah`,[`Ibrahim dan Ismail meninggikan fondasi Ka'bah. Ismail membawa batu, Ibrahim menyusunnya sambil berdiri di atas sebuah batu yang kini dikenal sebagai Maqam Ibrahim. Sambil bekerja, keduanya berdoa.`],
[[`Ibrahim & Ismail`,`Ya Tuhan kami, terimalah (amal) dari kami. Sungguh, Engkaulah Yang Maha Mendengar, Maha Mengetahui.`,`QS Al-Baqarah: 127`],[`Ibrahim & Ismail`,`Ya Tuhan kami, utuslah di tengah mereka seorang rasul dari kalangan mereka sendiri…`,`QS Al-Baqarah: 129 (dikabulkan dengan diutusnya Nabi Muhammad ﷺ)`]]]];
KBAB.luth=[
[`Hijrah bersama Ibrahim`,[`Luth adalah keponakan Ibrahim yang beriman kepadanya dan ikut hijrah. Allah mengutusnya ke negeri Sadum di sekitar Laut Mati. Penduduknya melakukan perbuatan keji yang belum pernah dilakukan siapa pun sebelumnya, merampok di jalan, dan berbuat mungkar di majelis-majelis mereka.`],
[[`Luth`,`Mengapa kamu mengerjakan perbuatan keji yang belum pernah dikerjakan oleh seorang pun sebelum kamu?`,`QS Al-A'raf: 80`],[`Kaum Luth`,`Usirlah mereka (Luth dan pengikutnya) dari negerimu ini. Mereka adalah orang-orang yang menganggap dirinya suci.`,`QS Al-A'raf: 82`]]],
[`Tamu-tamu malaikat`,[`Para malaikat yang sebelumnya membawa kabar gembira kepada Ibrahim datang ke rumah Luth dalam rupa pemuda. Luth merasa sangat susah karena khawatir kaumnya akan mengganggu tamu-tamunya. Kaumnya pun datang bergegas.`],
[[`Luth`,`Wahai kaumku, bertakwalah kepada Allah dan janganlah kamu mencemarkan (nama)ku terhadap tamuku ini. Tidak adakah di antaramu seorang yang berakal?`,`QS Hud: 78`],[`Para malaikat`,`Wahai Luth, sesungguhnya kami adalah utusan Tuhanmu. Mereka tidak akan dapat mengganggumu. Pergilah beserta keluargamu pada akhir malam, dan jangan ada seorang pun di antara kamu yang menoleh ke belakang, kecuali istrimu.`,`QS Hud: 81`]]],
[`Negeri yang dibalikkan`,[`Menjelang subuh, Luth dan keluarganya yang beriman keluar. Azab datang: negeri itu dibalikkan dan dihujani batu dari tanah yang terbakar. Istri Luth yang berkhianat dalam akidah ikut binasa. Kisah ini menjadi peringatan bagi orang-orang yang berpikir.`]]];
KBAB.ismail=[
[`Zamzam dan langkah Hajar`,[`Setelah bekal habis, bayi Ismail menangis kehausan. Hajar naik ke bukit Shafa, mencari-cari orang, lalu berlari ke Marwah. Ia bolak-balik tujuh kali. Nabi ﷺ bersabda: "Itulah (asal) sa'i manusia di antara keduanya."`,`Lalu terdengar suara. Malaikat Jibril menggali tanah dengan tumitnya hingga air memancar. Hajar membendungnya sambil berkata "zam, zam" (berkumpullah). (HR. Bukhari)`],
[[`Hajar`,`Engkau telah memperdengarkan suaramu, jika engkau dapat menolong (maka tolonglah).`,`HR. Bukhari`],[`Nabi Muhammad ﷺ`,`Semoga Allah merahmati ibu Ismail. Seandainya ia membiarkan Zamzam, niscaya Zamzam menjadi mata air yang mengalir.`,`HR. Bukhari`]]],
[`Kabilah Jurhum dan Makkah yang hidup`,[`Kabilah Jurhum yang melintas melihat burung berputar-putar di atas lembah, tanda ada air. Mereka meminta izin tinggal kepada Hajar. Makkah pun mulai ramai. Ismail tumbuh di tengah mereka, belajar bahasa Arab yang fasih, dan menikah dengan wanita Jurhum.`],
[[`Kabilah Jurhum`,`Apakah engkau mengizinkan kami singgah di dekatmu?`,`HR. Bukhari`],[`Hajar`,`Ya, tetapi kalian tidak punya hak atas air ini.`,`HR. Bukhari`]]],
[`Pesan "ganti ambang pintumu"`,[`Ibrahim datang berkunjung ketika Ismail sedang berburu. Istri Ismail mengeluhkan kesempitan hidup. Ibrahim menitip pesan: "Gantilah ambang pintumu." Ismail paham maksudnya: ceraikan istri yang tidak bersyukur. Ismail kemudian menikah lagi. Pada kunjungan berikutnya, istri barunya memuji Allah atas keadaan mereka, dan Ibrahim berpesan: "Kokohkanlah ambang pintumu." (HR. Bukhari)`,`Kisah ini mengajarkan nilai syukur dalam rumah tangga.`]],
[`Anak yang sabar dan penepat janji`,[`Ismail rela dikorbankan, membantu ayahnya membangun Ka'bah, dan dipuji Allah sebagai penepat janji. Ia menyuruh keluarganya sholat dan menunaikan zakat. Dari keturunannya kelak lahir Nabi Muhammad ﷺ.`],
[[`Allah`,`Dan ceritakanlah kisah Ismail di dalam Kitab. Dia benar-benar seorang yang benar janjinya, seorang rasul dan nabi. Dia menyuruh keluarganya sholat dan menunaikan zakat, dan dia seorang yang diridai di sisi Tuhannya.`,`QS Maryam: 54–55`]]]];
KBAB.ishaq=[
[`Tamu-tamu Ibrahim`,[`Suatu hari Ibrahim kedatangan tamu-tamu asing. Ia segera menyuguhkan anak sapi panggang, tetapi tangan mereka tidak menyentuhnya. Ibrahim merasa takut, lalu mereka memperkenalkan diri sebagai malaikat dan membawa kabar gembira.`],
[[`Para malaikat`,`Janganlah engkau takut. Sesungguhnya kami memberi kabar gembira kepadamu dengan (kelahiran) seorang anak laki-laki yang alim (Ishaq).`,`QS Al-Hijr: 53`],[`Sarah`,`Sungguh ajaib, mungkinkah aku akan melahirkan anak padahal aku sudah tua, dan suamiku ini sudah sangat tua? Ini benar-benar sesuatu yang ajaib.`,`QS Hud: 72`],[`Para malaikat`,`Mengapa engkau merasa heran tentang ketetapan Allah? (Itu adalah) rahmat dan berkah Allah dicurahkan kepada kamu, wahai ahlul bait!`,`QS Hud: 73`]]],
[`Nabi dan leluhur Bani Israil`,[`Ishaq tumbuh menjadi nabi yang saleh di tanah Kan'an. Dari Ishaq lahir Ya'qub, dan dari Ya'qub lahir dua belas suku Bani Israil serta banyak nabi. Allah memuji Ibrahim, Ishaq, dan Ya'qub sebagai orang-orang yang punya kekuatan (dalam ibadah) dan pandangan (dalam agama).`],
[[`Allah`,`Dan ingatlah hamba-hamba Kami: Ibrahim, Ishaq, dan Ya'qub yang mempunyai kekuatan-kekuatan yang besar dan ilmu-ilmu yang tinggi.`,`QS Shad: 45`]]]];
KBAB.yaqub=[
[`Ayah dua belas putra`,[`Ya'qub, yang juga bernama Israil, hidup di tanah Kan'an bersama dua belas putranya. Dua yang termuda, Yusuf dan Bunyamin, sangat ia sayangi. Ketika Yusuf kecil menceritakan mimpinya, Ya'qub langsung paham bahwa putranya akan diangkat derajatnya dan khawatir saudara-saudaranya iri.`],
[[`Ya'qub`,`Wahai anakku, janganlah engkau ceritakan mimpimu kepada saudara-saudaramu, mereka akan membuat tipu daya terhadapmu. Sungguh, setan adalah musuh yang nyata bagi manusia.`,`QS Yusuf: 5`]]],
[`Baju berlumur darah palsu`,[`Saudara-saudara Yusuf membujuk ayah mereka agar Yusuf boleh ikut bermain. Mereka pulang sore hari sambil menangis, membawa baju Yusuf berlumur darah palsu. Ya'qub tahu mereka berbohong, tetapi memilih sabar yang indah.`],
[[`Putra-putra Ya'qub`,`Wahai ayah kami, kami pergi berlomba dan kami tinggalkan Yusuf di dekat barang-barang kami, lalu dia dimakan serigala.`,`QS Yusuf: 17`],[`Ya'qub`,`Sebenarnya hanya dirimu sendiri yang memandang baik urusan (yang buruk) itu. Maka (kesabaranku) adalah kesabaran yang baik. Dan kepada Allah saja memohon pertolongan atas apa yang kamu ceritakan.`,`QS Yusuf: 18`]]],
[`Jangan berputus asa`,[`Bertahun-tahun berlalu. Kemudian Bunyamin juga tertahan di Mesir. Ya'qub menangis hingga matanya memutih, tetapi ia tidak mengeluh kepada manusia. Ia justru menyuruh anak-anaknya mencari Yusuf.`],
[[`Ya'qub`,`Hanya kepada Allah aku mengadukan kesusahan dan kesedihanku.`,`QS Yusuf: 86`],[`Ya'qub`,`Wahai anak-anakku, pergilah dan carilah berita tentang Yusuf dan saudaranya, dan jangan kamu berputus asa dari rahmat Allah.`,`QS Yusuf: 87`]]],
[`Bau Yusuf dan mata yang kembali`,[`Saat kafilah membawa baju Yusuf keluar dari Mesir, Ya'qub berkata ia mencium bau Yusuf. Ketika baju itu diusapkan ke wajahnya, penglihatannya kembali. Keluarga itu pindah ke Mesir. Menjelang wafat, Ya'qub mengumpulkan anak-anaknya dan menanyakan hal terpenting.`],
[[`Ya'qub`,`Apa yang kamu sembah sepeninggalku?`,`QS Al-Baqarah: 133`],[`Putra-putranya`,`Kami akan menyembah Tuhanmu dan Tuhan nenek moyangmu, Ibrahim, Ismail, dan Ishaq, (yaitu) Tuhan Yang Maha Esa, dan kami (hanya) berserah diri kepada-Nya.`,`QS Al-Baqarah: 133`]]]];
KBAB.yusuf=[
[`Mimpi dan sumur`,[`Yusuf kecil bermimpi sebelas bintang, matahari, dan bulan bersujud kepadanya. Saudara-saudaranya yang iri bersekongkol. Salah seorang dari mereka mengusulkan agar Yusuf dibuang ke sumur, bukan dibunuh. Di dasar sumur yang gelap, Allah mewahyukan kepada Yusuf bahwa kelak ia akan menceritakan perbuatan mereka itu.`],
[[`Yusuf`,`Wahai ayahku, sungguh aku bermimpi melihat sebelas bintang, matahari, dan bulan; kulihat semuanya sujud kepadaku.`,`QS Yusuf: 4`],[`Salah satu saudaranya`,`Janganlah kamu membunuh Yusuf, tetapi masukkan saja dia ke dasar sumur agar dipungut oleh sebagian musafir.`,`QS Yusuf: 10`]]],
[`Di rumah Al-Aziz`,[`Kafilah musafir menemukannya dan menjualnya murah di Mesir. Al-Aziz, pembesar Mesir, membelinya dan berpesan kepada istrinya agar memuliakannya. Ketika dewasa, Yusuf sangat tampan, dan istri Al-Aziz menggodanya serta mengunci pintu-pintu. Yusuf menolak dan berlari ke pintu. Bajunya robek dari belakang, dan itulah bukti kejujurannya.`],
[[`Istri Al-Aziz`,`Marilah mendekat kepadaku.`,`QS Yusuf: 23`],[`Yusuf`,`Aku berlindung kepada Allah. Sungguh, tuanku telah memperlakukan aku dengan baik. Sesungguhnya orang yang zalim itu tidak akan beruntung.`,`QS Yusuf: 23`],[`Seorang saksi dari keluarganya`,`Jika bajunya koyak di bagian depan, maka perempuan itu benar… dan jika bajunya koyak di bagian belakang, maka perempuan itulah yang dusta.`,`QS Yusuf: 26–27`]]],
[`Lebih memilih penjara`,[`Fitnah menyebar di kalangan wanita kota. Istri Al-Aziz mengundang mereka dan memperlihatkan Yusuf. Mereka terpesona hingga tanpa sadar melukai tangan sendiri dengan pisau. Ketika diancam penjara, Yusuf memilih penjara daripada maksiat.`],
[[`Para wanita`,`Mahasempurna Allah, ini bukanlah manusia. Ini benar-benar malaikat yang mulia.`,`QS Yusuf: 31`],[`Yusuf`,`Wahai Tuhanku, penjara lebih aku sukai daripada memenuhi ajakan mereka.`,`QS Yusuf: 33`]]],
[`Dakwah di penjara dan mimpi raja`,[`Di penjara, dua pemuda meminta Yusuf menakwilkan mimpi mereka. Sebelum menjawab, Yusuf mengajak mereka bertauhid. Bertahun-tahun kemudian, raja Mesir bermimpi tujuh sapi gemuk dimakan tujuh sapi kurus. Yusuf menakwilkannya: tujuh tahun subur, lalu tujuh tahun paceklik, dan memberi solusi menyimpan gandum di tangkainya.`,`Raja memanggilnya, tetapi Yusuf meminta namanya dibersihkan dulu. Istri Al-Aziz pun mengakui kesalahannya.`],
[[`Yusuf`,`Wahai kedua penghuni penjara, manakah yang lebih baik: tuhan-tuhan yang bermacam-macam itu ataukah Allah Yang Maha Esa lagi Mahaperkasa?`,`QS Yusuf: 39`],[`Istri Al-Aziz`,`Sekarang jelaslah kebenaran itu. Akulah yang menggodanya, dan sesungguhnya dia termasuk orang yang benar.`,`QS Yusuf: 51`],[`Yusuf`,`Jadikanlah aku bendaharawan negeri (Mesir). Karena sesungguhnya aku orang yang pandai menjaga dan berpengetahuan.`,`QS Yusuf: 55`]]],
[`Saudara-saudara datang meminta gandum`,[`Paceklik melanda hingga Kan'an. Saudara-saudara Yusuf datang ke Mesir dan tidak mengenalinya, sementara Yusuf mengenali mereka. Lewat sebuah siasat, Bunyamin ditahan di Mesir. Pada kedatangan berikutnya, Yusuf membuka jati dirinya.`],
[[`Saudara-saudaranya`,`Apakah engkau benar-benar Yusuf?`,`QS Yusuf: 90`],[`Yusuf`,`Akulah Yusuf dan ini saudaraku. Sungguh, Allah telah melimpahkan karunia-Nya kepada kami. Sesungguhnya barang siapa bertakwa dan bersabar, maka Allah tidak menyia-nyiakan pahala orang yang berbuat baik.`,`QS Yusuf: 90`],[`Yusuf`,`Pada hari ini tidak ada cercaan terhadap kamu. Mudah-mudahan Allah mengampuni kamu. Dan Dia Maha Penyayang di antara para penyayang.`,`QS Yusuf: 92`]]],
[`Mimpi yang menjadi nyata`,[`Ya'qub dan seluruh keluarga datang ke Mesir. Yusuf menaikkan kedua orang tuanya ke singgasana, dan mereka semua tunduk memberi hormat (sujud penghormatan yang dibolehkan dalam syariat mereka). Mimpi masa kecilnya terwujud. Yusuf menutup kisahnya dengan doa.`],
[[`Yusuf`,`Wahai ayahku, inilah takwil mimpiku yang dahulu itu. Sungguh, Tuhanku telah menjadikannya kenyataan.`,`QS Yusuf: 100`],[`Yusuf`,`(Ya Tuhanku) Wafatkanlah aku dalam keadaan muslim dan gabungkanlah aku dengan orang-orang yang saleh.`,`QS Yusuf: 101`]]]];

KBAB.ayyub=[
[`Hamba yang kaya dan bersyukur`,[`Ayyub adalah nabi yang diberi limpahan harta, ternak, kebun, dan anak-anak. Ia selalu bersyukur dan dermawan.`,`Kemudian Allah mengujinya: hartanya habis, anak-anaknya wafat, dan tubuhnya ditimpa penyakit yang lama. Orang-orang menjauh, kecuali istrinya yang setia merawatnya. Ayyub tetap memuji Allah. (Rincian lamanya sakit dan jenis penyakit berasal dari riwayat; yang pasti dari Al-Qur'an adalah kesabarannya.)`]],
[`Doa yang penuh adab`,[`Setelah sekian lama, Ayyub berdoa. Ia tidak menuntut dan tidak mengeluh. Ia hanya menyebut keadaannya dan sifat kasih sayang Allah.`],
[[`Ayyub`,`(Ya Tuhanku), sungguh aku telah ditimpa penyakit, padahal Engkau Tuhan Yang Maha Penyayang dari semua yang penyayang.`,`QS Al-Anbiya: 83`],[`Ayyub`,`Sesungguhnya aku diganggu setan dengan penderitaan dan bencana.`,`QS Shad: 41`]]],
[`Mata air penyembuh`,[`Allah mengabulkan doanya dan memerintahkannya menghentakkan kaki ke tanah. Memancarlah air yang sejuk untuk mandi dan minum, dan Ayyub sembuh. Allah mengembalikan keluarganya dan melipatgandakannya sebagai rahmat.`,`Ayyub pernah bersumpah akan memukul istrinya (karena suatu sebab) jika sembuh. Allah memberinya keringanan: cukup memukul dengan seikat rumput agar sumpahnya tidak dilanggar, sebagai bentuk kasih sayang kepada istri yang setia.`],
[[`Allah`,`Hentakkanlah kakimu. Inilah air yang sejuk untuk mandi dan untuk minum.`,`QS Shad: 42`],[`Allah`,`Sungguh, Kami dapati dia seorang yang sabar. Dialah sebaik-baik hamba. Sungguh, dia sangat taat (kepada Allah).`,`QS Shad: 44`]]]];
KBAB.syuaib=[
[`Pasar yang curang`,[`Penduduk Madyan hidup di jalur dagang yang ramai. Mereka mengurangi takaran dan timbangan, mencegat orang di jalan, dan menyembah selain Allah. Allah mengutus Syu'aib, seorang yang dijuluki "khatibul anbiya" (orator para nabi) karena tutur katanya yang indah.`],
[[`Syu'aib`,`Wahai kaumku, sempurnakanlah takaran dan timbangan dengan adil, dan janganlah kamu merugikan manusia terhadap hak-hak mereka.`,`QS Hud: 85`],[`Syu'aib`,`Sisa (keuntungan) dari Allah adalah lebih baik bagimu jika kamu orang yang beriman.`,`QS Hud: 86`]]],
[`Ejekan tentang sholat`,[`Kaumnya mengejek: apakah sholatnya yang menyuruh mereka meninggalkan sembahan nenek moyang dan berhenti mengatur harta sesuka hati? Syu'aib menjawab dengan rendah hati dan tulus.`],
[[`Kaum Madyan`,`Wahai Syu'aib, apakah sholatmu yang menyuruhmu agar kami meninggalkan apa yang disembah nenek moyang kami, atau melarang kami mengelola harta kami menurut cara yang kami kehendaki?`,`QS Hud: 87`],[`Syu'aib`,`Aku tidak bermaksud kecuali (mendatangkan) perbaikan selama aku masih sanggup. Dan petunjuk yang aku ikuti hanyalah dari Allah. Kepada-Nya aku bertawakal dan kepada-Nya aku kembali.`,`QS Hud: 88`]]],
[`Ancaman dan azab`,[`Para pemuka mengancam akan mengusir Syu'aib dan pengikutnya, kecuali mereka kembali ke agama nenek moyang. Syu'aib menolak. Azab pun datang: gempa dahsyat dan suara keras yang mengguntur. Mereka mati di rumah-rumah mereka seakan-akan belum pernah tinggal di sana.`],
[[`Para pemuka`,`Wahai Syu'aib, pasti kami usir engkau bersama orang-orang yang beriman dari negeri kami, kecuali engkau kembali kepada agama kami.`,`QS Al-A'raf: 88`],[`Syu'aib`,`Ya Tuhan kami, berilah keputusan antara kami dan kaum kami dengan hak (adil). Engkaulah pemberi keputusan terbaik.`,`QS Al-A'raf: 89`]]]];
KBAB.musa=[
[`Bayi di Sungai Nil`,[`Fir'aun memerintah Mesir dengan kejam. Ia membunuh setiap bayi laki-laki Bani Israil. Allah mengilhamkan kepada ibu Musa agar menyusuinya, lalu menaruhnya dalam peti dan menghanyutkannya ke sungai jika khawatir. Peti itu sampai ke istana Fir'aun.`,`Istri Fir'aun, Asiyah, jatuh sayang kepadanya. Bayi itu menolak semua ibu susu, sampai saudara perempuan Musa menawarkan "sebuah keluarga" yang ternyata ibunya sendiri. Allah mengembalikan Musa ke pangkuan ibunya.`],
[[`Allah (ilham kepada ibu Musa)`,`Susuilah dia (Musa). Apabila engkau khawatir terhadapnya, hanyutkanlah dia ke sungai. Jangan takut dan jangan bersedih, sungguh Kami akan mengembalikannya kepadamu dan menjadikannya salah seorang rasul.`,`QS Al-Qashash: 7`],[`Asiyah`,`(Dia) adalah penyejuk mata hati bagiku dan bagimu. Janganlah kamu membunuhnya. Mudah-mudahan dia bermanfaat bagi kita atau kita ambil dia menjadi anak.`,`QS Al-Qashash: 9`]]],
[`Lari ke Madyan`,[`Saat dewasa, Musa berusaha melerai perkelahian dan tanpa sengaja memukul seorang Mesir hingga tewas. Ia segera bertaubat. Mendengar rencana pembunuhan terhadapnya, Musa lari ke Madyan.`,`Di sebuah sumur, ia membantu dua gadis memberi minum ternak mereka, lalu berteduh dan berdoa. Ayah kedua gadis itu, seorang tua yang saleh, mengundangnya, lalu menikahkannya dengan salah satu putrinya dengan mahar bekerja 8–10 tahun.`],
[[`Musa`,`Ya Tuhanku, sesungguhnya aku sangat memerlukan suatu kebaikan (makanan) yang Engkau turunkan kepadaku.`,`QS Al-Qashash: 24`],[`Salah satu gadis`,`Wahai ayahku, jadikanlah dia sebagai pekerja (pada kita). Sesungguhnya orang yang paling baik yang engkau ambil sebagai pekerja ialah orang yang kuat dan dapat dipercaya.`,`QS Al-Qashash: 26`]]],
[`Api di lembah Thuwa`,[`Dalam perjalanan pulang bersama keluarganya, pada malam yang dingin, Musa melihat api di lereng gunung. Ternyata di sanalah Allah berbicara langsung kepadanya.`],
[[`Allah`,`Wahai Musa! Sungguh, Aku adalah Tuhanmu, maka lepaskan kedua terompahmu. Karena sesungguhnya engkau berada di lembah yang suci, Thuwa.`,`QS Thaha: 11–12`],[`Allah`,`Apakah yang ada di tangan kananmu, wahai Musa?`,`QS Thaha: 17`],[`Musa`,`Ini adalah tongkatku. Aku bertumpu padanya, merontokkan (daun) dengannya untuk kambingku, dan bagiku masih ada lagi keperluan yang lain padanya.`,`QS Thaha: 18`],[`Musa`,`Ya Tuhanku, lapangkanlah dadaku, mudahkanlah untukku urusanku, dan lepaskanlah kekakuan dari lidahku, agar mereka mengerti perkataanku. Dan jadikanlah untukku seorang pembantu dari keluargaku, (yaitu) Harun, saudaraku.`,`QS Thaha: 25–30`]]],
[`Di hadapan Fir'aun`,[`Allah memerintahkan Musa dan Harun berbicara kepada Fir'aun dengan lemah lembut. Fir'aun menyindir masa lalu Musa yang dibesarkan di istana. Musa menyampaikan risalah dengan tegas dan menunjukkan mukjizat tongkat dan tangannya.`],
[[`Allah`,`Maka berbicaralah kamu berdua kepadanya dengan kata-kata yang lemah lembut, mudah-mudahan dia sadar atau takut.`,`QS Thaha: 44`],[`Fir'aun`,`Siapakah Tuhan kamu berdua, wahai Musa?`,`QS Thaha: 49`],[`Musa`,`Tuhan kami ialah (Tuhan) yang telah memberikan bentuk kejadian kepada segala sesuatu, kemudian memberinya petunjuk.`,`QS Thaha: 50`]]],
[`Para penyihir yang bersujud`,[`Fir'aun mengumpulkan para penyihir terbaik pada hari raya. Mereka melemparkan tali dan tongkat yang tampak bergerak seperti ular. Musa melemparkan tongkatnya, dan tongkat itu menelan semua tipuan mereka. Para penyihir, yang paling paham sihir, langsung tahu bahwa ini bukan sihir. Mereka sujud dan beriman, meski diancam disalib.`],
[[`Para penyihir`,`Kami beriman kepada Tuhannya Harun dan Musa.`,`QS Thaha: 70`],[`Fir'aun`,`Apakah kamu telah beriman kepadanya sebelum aku memberi izin kepadamu?`,`QS Thaha: 71`],[`Para penyihir`,`Kami tidak akan memilih (tunduk) kepadamu atas bukti-bukti nyata yang telah datang kepada kami… Maka putuskanlah apa yang hendak kamu putuskan. Sesungguhnya kamu hanya dapat memutuskan pada kehidupan dunia ini.`,`QS Thaha: 72`]]],
[`Laut terbelah`,[`Musa membawa Bani Israil keluar dari Mesir pada malam hari. Fir'aun dan tentaranya mengejar. Saat pagi, mereka terjepit di tepi laut dan Bani Israil panik. Musa tetap yakin. Allah memerintahkannya memukul laut dengan tongkat, dan laut terbelah menjadi jalan yang kering. Ketika Fir'aun menyusul ke tengahnya, laut kembali menutup. Di detik terakhir Fir'aun mengaku beriman, tetapi sudah terlambat.`],
[[`Bani Israil`,`Kita benar-benar akan tersusul.`,`QS Asy-Syu'ara: 61`],[`Musa`,`Sekali-kali tidak akan (tersusul). Sesungguhnya Tuhanku bersamaku, Dia akan memberi petunjuk kepadaku.`,`QS Asy-Syu'ara: 62`],[`Fir'aun (saat tenggelam)`,`Aku percaya bahwa tidak ada tuhan selain Tuhan yang dipercayai oleh Bani Israil.`,`QS Yunus: 90`]]],
[`Taurat dan anak sapi emas`,[`Musa pergi ke Bukit Thur selama 40 malam untuk menerima Taurat, dan menitipkan kaumnya kepada Harun. Samiri membuat patung anak sapi dari perhiasan, dan sebagian Bani Israil menyembahnya. Musa kembali dengan marah dan sedih. Ia menegur Harun, lalu menghukum Samiri.`],
[[`Musa`,`Ya Tuhanku, tampakkanlah (diri-Mu) kepadaku agar aku dapat melihat Engkau.`,`QS Al-A'raf: 143`],[`Allah`,`Engkau tidak akan (sanggup) melihat-Ku, namun lihatlah ke gunung itu. Jika ia tetap di tempatnya (seperti sediakala), niscaya engkau dapat melihat-Ku.`,`QS Al-A'raf: 143`],[`Harun`,`Wahai putra ibuku! Janganlah engkau pegang janggutku dan jangan (pula) kepalaku. Aku sungguh khawatir engkau akan berkata, "Engkau telah memecah belah antara Bani Israil."`,`QS Thaha: 94`]]]];
KBAB.harun=[
[`Doa seorang saudara`,[`Harun adalah kakak Musa. Ia lebih fasih berbicara. Ketika diutus kepada Fir'aun, Musa memohon agar Harun dijadikan pendamping. Allah mengabulkan dan mengangkat Harun menjadi nabi. Para ulama menyebut doa Musa ini sebagai pemberian terbesar seorang saudara kepada saudaranya.`],
[[`Musa`,`Dan saudaraku Harun, dia lebih fasih lidahnya daripada aku, maka utuslah dia bersamaku sebagai pembantuku untuk membenarkan (perkataan)ku.`,`QS Al-Qashash: 34`],[`Allah`,`Sungguh, telah diperkenankan permintaanmu, wahai Musa.`,`QS Thaha: 36`]]],
[`Menjaga kaum dalam fitnah`,[`Ketika Musa ke Bukit Thur, Harun memimpin Bani Israil. Saat Samiri menyesatkan mereka dengan anak sapi emas, Harun menasihati dengan tegas, tetapi mereka bersikeras menunggu Musa. Harun memilih menjaga persatuan sambil terus menasihati.`],
[[`Harun`,`Wahai kaumku! Sesungguhnya kamu hanya sekadar diberi cobaan (dengan patung anak sapi) itu. Sungguh, Tuhanmu ialah (Allah) Yang Maha Pengasih, maka ikutilah aku dan taatilah perintahku.`,`QS Thaha: 90`],[`Kaumnya`,`Kami tidak akan meninggalkannya (dan) tetap menyembahnya sampai Musa kembali kepada kami.`,`QS Thaha: 91`]]],
[`Teladan bagi Ali`,[`Nabi Muhammad ﷺ pernah menitipkan Madinah kepada Ali saat Perang Tabuk. Ali merasa sedih karena ditinggal. Nabi ﷺ menghiburnya dengan perumpamaan Harun.`],
[[`Nabi Muhammad ﷺ`,`Tidakkah engkau rida kedudukanmu di sisiku seperti kedudukan Harun di sisi Musa? Hanya saja tidak ada nabi sesudahku.`,`HR. Bukhari & Muslim`]]]];
KBAB.dzulkifli=[
[`Nama yang dipuji Al-Qur'an`,[`Dzulkifli disebut dua kali dalam Al-Qur'an, selalu bersama para nabi yang dikenal sabar dan terpilih. Namanya berarti "pemilik bagian/tanggungan", yang menurut sebagian mufasir merujuk pada kesanggupannya memikul tanggung jawab.`],
[[`Allah`,`Dan (ingatlah kisah) Ismail, Idris, dan Dzulkifli. Mereka semua termasuk orang-orang yang sabar. Dan Kami masukkan mereka ke dalam rahmat Kami. Sungguh, mereka termasuk orang-orang yang saleh.`,`QS Al-Anbiya: 85–86`]]],
[`Riwayat tentang janji yang ditepati`,[`Sebuah riwayat tafsir (dari Mujahid) menceritakan seorang nabi Bani Israil yang sudah tua. Ia mencari pengganti yang sanggup berpuasa di siang hari, beribadah di malam hari, dan tidak marah saat memutuskan perkara. Seorang laki-laki menyanggupinya dan menepati janjinya meski Iblis berulang kali menggodanya agar marah. Laki-laki itu disebut Dzulkifli.`,`Riwayat ini tidak sampai kepada Nabi ﷺ, sehingga kita mengambil hikmahnya saja: menepati janji dan menahan amarah.`]]];
KBAB.daud=[
[`Pemuda melawan Jalut`,[`Bani Israil yang lama tertindas meminta seorang raja untuk memimpin perang. Allah mengangkat Thalut. Pasukannya diuji dengan sungai: hanya boleh minum seteguk. Sebagian besar gagal. Yang tersisa sedikit, dan mereka gentar melihat pasukan Jalut yang besar. Namun orang-orang yang yakin justru berdoa.`,`Di medan perang, Daud yang masih muda membunuh Jalut. Allah memberinya kerajaan dan hikmah.`],
[[`Orang-orang yang yakin`,`Betapa banyak kelompok kecil mengalahkan kelompok besar dengan izin Allah. Dan Allah beserta orang-orang yang sabar.`,`QS Al-Baqarah: 249`],[`Pasukan Thalut (berdoa)`,`Ya Tuhan kami, limpahkanlah kesabaran kepada kami, kukuhkanlah langkah kami, dan tolonglah kami menghadapi orang-orang kafir.`,`QS Al-Baqarah: 250`]]],
[`Gunung dan burung ikut bertasbih`,[`Daud memiliki suara yang sangat merdu saat membaca Zabur. Ketika ia bertasbih, gunung-gunung dan burung ikut bertasbih bersamanya. Allah juga melunakkan besi baginya, sehingga ia membuat baju besi yang melindungi dalam perang.`,`Meski raja, Daud makan dari hasil tangannya sendiri, berpuasa sehari dan berbuka sehari, serta tidur sebagian malam lalu bangun beribadah.`],
[[`Allah`,`Wahai gunung-gunung dan burung-burung! Bertasbihlah berulang-ulang bersama Daud.`,`QS Saba: 10`],[`Nabi Muhammad ﷺ`,`Puasa yang paling dicintai Allah adalah puasa Daud, dan sholat yang paling dicintai Allah adalah sholat Daud: ia tidur separuh malam, bangun sepertiganya, dan tidur seperenamnya. Ia berpuasa sehari dan berbuka sehari.`,`HR. Bukhari & Muslim`]]],
[`Dua orang yang berselisih`,[`Suatu hari dua orang memanjat dinding mihrab Daud dan meminta keputusan. Yang satu punya 99 ekor kambing dan meminta satu-satunya kambing milik saudaranya. Daud memutuskan, lalu menyadari bahwa ini adalah ujian baginya. Ia segera bersujud dan bertaubat.`],
[[`Salah seorang yang berselisih`,`Sesungguhnya saudaraku ini mempunyai sembilan puluh sembilan ekor kambing betina, dan aku mempunyai seekor saja. Lalu dia berkata, "Serahkanlah (kambingmu) itu kepadaku!"`,`QS Shad: 23`],[`Allah`,`Wahai Daud! Sesungguhnya engkau Kami jadikan khalifah di bumi, maka berilah keputusan (perkara) di antara manusia dengan adil dan janganlah engkau mengikuti hawa nafsu.`,`QS Shad: 26`]]]];
KBAB.sulaiman=[
[`Keputusan tentang ladang`,[`Sejak muda Sulaiman diberi pemahaman yang tajam. Suatu ketika kambing-kambing milik suatu kaum merusak ladang orang lain pada malam hari. Daud dan Sulaiman sama-sama memberi keputusan, dan Allah memberikan pemahaman yang lebih tepat kepada Sulaiman. Keduanya tetap dipuji karena diberi hikmah dan ilmu.`],
[[`Allah`,`Maka Kami memberikan pengertian kepada Sulaiman tentang (hukum yang lebih tepat), dan kepada masing-masing Kami berikan hikmah dan ilmu.`,`QS Al-Anbiya: 79`]]],
[`Semut yang berbicara`,[`Sulaiman memimpin pasukan yang terdiri dari manusia, jin, dan burung. Saat melewati lembah semut, seekor semut memperingatkan kaumnya. Sulaiman mendengar, tersenyum, lalu bersyukur kepada Allah.`],
[[`Seekor semut`,`Wahai semut-semut, masuklah ke dalam sarang-sarangmu agar kamu tidak diinjak oleh Sulaiman dan bala tentaranya, sedangkan mereka tidak menyadari.`,`QS An-Naml: 18`],[`Sulaiman`,`Ya Tuhanku, anugerahkanlah aku ilham untuk tetap mensyukuri nikmat-Mu yang telah Engkau anugerahkan kepadaku dan kepada kedua orang tuaku, dan agar aku mengerjakan kebajikan yang Engkau ridai.`,`QS An-Naml: 19`]]],
[`Burung hud-hud dan Ratu Saba'`,[`Sulaiman memeriksa barisan burung dan tidak menemukan hud-hud. Hud-hud datang membawa berita penting: seorang ratu di negeri Saba' (Yaman) memiliki singgasana besar, tetapi ia dan kaumnya menyembah matahari.`,`Sulaiman mengirim surat yang diawali "Bismillahirrahmanirrahim". Ratu bermusyawarah dengan para pembesarnya dan memilih mengirim hadiah. Sulaiman menolak hadiah itu, karena yang ia inginkan adalah iman mereka.`],
[[`Hud-hud`,`Aku telah mengetahui sesuatu yang belum engkau ketahui. Aku datang kepadamu dari negeri Saba' membawa suatu berita yang meyakinkan.`,`QS An-Naml: 22`],[`Ratu Saba'`,`Wahai para pembesar! Sesungguhnya telah disampaikan kepadaku sebuah surat yang mulia. Surat itu dari Sulaiman, isinya: "Dengan nama Allah Yang Maha Pengasih lagi Maha Penyayang. Janganlah engkau berlaku sombong terhadapku dan datanglah kepadaku sebagai orang-orang yang berserah diri."`,`QS An-Naml: 29–31`],[`Sulaiman`,`Apakah kamu akan memberi harta kepadaku? Apa yang Allah berikan kepadaku lebih baik daripada apa yang Allah berikan kepadamu.`,`QS An-Naml: 36`]]],
[`Singgasana dalam sekejap mata`,[`Sulaiman bertanya siapa yang sanggup membawa singgasana ratu sebelum ia datang. Seorang yang punya ilmu dari Kitab memindahkannya dalam sekejap mata. Ketika Ratu Balqis tiba, ia melihat singgasananya sendiri dan sebuah istana berlantai kaca yang disangkanya air. Ia pun sadar akan kebesaran Allah dan berserah diri.`],
[[`Seorang yang berilmu dari Kitab`,`Aku akan membawanya kepadamu sebelum matamu berkedip.`,`QS An-Naml: 40`],[`Sulaiman`,`Ini termasuk karunia Tuhanku untuk mengujiku, apakah aku bersyukur atau mengingkari (nikmat-Nya).`,`QS An-Naml: 40`],[`Ratu Balqis`,`Ya Tuhanku, sungguh aku telah berbuat zalim terhadap diriku. Aku berserah diri bersama Sulaiman kepada Allah, Tuhan seluruh alam.`,`QS An-Naml: 44`]]],
[`Wafat bersandar pada tongkat`,[`Sulaiman wafat saat bersandar pada tongkatnya. Para jin terus bekerja keras karena mengira ia masih mengawasi, sampai rayap memakan tongkat itu dan jasadnya tersungkur. Barulah jin sadar bahwa mereka tidak mengetahui yang gaib.`],
[[`Allah`,`Maka ketika dia telah tersungkur, tahulah jin itu bahwa sekiranya mereka mengetahui yang gaib, tentu mereka tidak tetap dalam siksa yang menghinakan.`,`QS Saba: 14`]]]];
KBAB.ilyas=[
[`Melawan penyembahan Ba'l`,[`Setelah masa Sulaiman, sebagian Bani Israil kembali menyembah berhala, di antaranya Ba'l. Allah mengutus Ilyas. Ia menegur kaumnya dengan pertanyaan yang menggugah akal.`],
[[`Ilyas`,`Mengapa kamu tidak bertakwa? Patutkah kamu menyembah Ba'l dan kamu tinggalkan (Allah) sebaik-baik Pencipta, (yaitu) Allah Tuhanmu dan Tuhan nenek moyangmu yang terdahulu?`,`QS Ash-Shaffat: 124–126`]]],
[`Salam abadi`,[`Kebanyakan kaumnya mendustakannya, tetapi Allah mengabadikan namanya dengan pujian dan salam yang diucapkan umat hingga akhir zaman. Riwayat tentang kekeringan di masa Ilyas dan kepergiannya berasal dari Ahli Kitab, sehingga cukup diambil hikmahnya.`],
[[`Allah`,`Selamat sejahtera bagi Ilyas. Demikianlah Kami memberi balasan kepada orang-orang yang berbuat baik. Sungguh, dia termasuk hamba-hamba Kami yang beriman.`,`QS Ash-Shaffat: 130–132`]]]];
KBAB.ilyasa=[
[`Penerus dakwah`,[`Al-Qur'an menyebut Ilyasa' di antara para nabi yang diberi petunjuk dan dilebihkan derajatnya. Menurut para sejarawan, ia adalah murid dan penerus Ilyas yang melanjutkan dakwah di tengah Bani Israil.`,`Rincian kisahnya tidak ada dalam Al-Qur'an maupun hadis sahih. Kehadirannya dalam daftar nabi pilihan mengajarkan bahwa keberlanjutan dakwah dari guru kepada murid adalah amal yang mulia.`],
[[`Allah`,`Dan Ismail, Ilyasa', Yunus, dan Luth. Masing-masing Kami lebihkan (derajatnya) di atas umat (pada masanya).`,`QS Al-An'am: 86`]]]];
KBAB.yunus=[
[`Pergi sebelum izin`,[`Yunus diutus ke Ninawa, kota besar dengan lebih dari seratus ribu penduduk. Mereka menolak dakwahnya. Yunus pun pergi meninggalkan mereka dalam keadaan marah, sebelum Allah mengizinkannya.`],
[[`Allah`,`Dan (ingatlah kisah) Dzun Nun (Yunus), ketika dia pergi dalam keadaan marah, lalu dia menyangka bahwa Kami tidak akan menyulitkannya.`,`QS Al-Anbiya: 87`]]],
[`Undian di kapal`,[`Yunus menaiki kapal yang penuh muatan. Di tengah laut, kapal oleng dan nyaris tenggelam. Para penumpang mengadakan undian untuk mengurangi beban, dan nama Yunus yang keluar. Ia dilemparkan ke laut, lalu ditelan seekor ikan besar.`]],
[`Doa dalam tiga kegelapan`,[`Di dalam kegelapan perut ikan, kegelapan laut, dan kegelapan malam, Yunus menyadari kesalahannya. Ia bertasbih dan berdoa dengan kalimat yang kini dikenal sebagai doa Dzun Nun. Seandainya ia tidak bertasbih, ia akan tetap di perut ikan sampai hari kebangkitan.`],
[[`Yunus`,`Tidak ada tuhan selain Engkau. Mahasuci Engkau. Sungguh, aku termasuk orang-orang yang zalim.`,`QS Al-Anbiya: 87`],[`Allah`,`Maka Kami kabulkan (doa)nya dan Kami selamatkan dia dari kedukaan. Dan demikianlah Kami menyelamatkan orang-orang yang beriman.`,`QS Al-Anbiya: 88`],[`Nabi Muhammad ﷺ`,`Doa Dzun Nun ketika di perut ikan… tidaklah seorang muslim berdoa dengannya untuk suatu hal, melainkan Allah mengabulkan baginya.`,`HR. Tirmidzi`]]],
[`Pohon labu dan kaum yang bertaubat`,[`Ikan itu memuntahkan Yunus ke daratan dalam keadaan lemah. Allah menumbuhkan pohon labu yang menaunginya. Setelah pulih, ia kembali ke kaumnya. Ternyata mereka telah bertaubat ketika melihat tanda-tanda azab, dan Allah menerima taubat mereka. Inilah satu-satunya kaum yang taubatnya diterima saat azab sudah di depan mata.`],
[[`Allah`,`Maka mengapa tidak ada (penduduk) suatu negeri yang beriman lalu imannya bermanfaat kepadanya selain kaum Yunus? Ketika mereka (kaum Yunus) beriman, Kami hilangkan dari mereka azab yang menghinakan dalam kehidupan dunia.`,`QS Yunus: 98`]]]];
KBAB.zakaria=[
[`Penjaga Maryam`,[`Zakaria adalah nabi dan imam di Baitul Maqdis. Ketika Maryam kecil dinazarkan untuk berkhidmat di sana, para ulama berebut ingin mengasuhnya. Mereka mengundi dengan melemparkan pena ke sungai, dan Zakaria yang terpilih. Setiap kali masuk mihrab, Zakaria mendapati rezeki di sisi Maryam.`],
[[`Zakaria`,`Wahai Maryam, dari mana engkau memperoleh (makanan) ini?`,`QS Ali Imran: 37`],[`Maryam`,`Itu dari sisi Allah. Sesungguhnya Allah memberi rezeki kepada siapa yang Dia kehendaki tanpa perhitungan.`,`QS Ali Imran: 37`]]],
[`Doa yang lirih`,[`Melihat itu, Zakaria yang sudah sangat tua, dengan istri yang mandul, tergerak berdoa. Ia berdoa dengan suara lembut di tengah malam. Ia khawatir tidak ada penerus yang menjaga agama setelahnya.`],
[[`Zakaria`,`Ya Tuhanku, sungguh tulangku telah lemah dan kepalaku telah dipenuhi uban, dan aku belum pernah kecewa dalam berdoa kepada-Mu, ya Tuhanku.`,`QS Maryam: 4`],[`Zakaria`,`Ya Tuhanku, janganlah Engkau biarkan aku hidup seorang diri (tanpa keturunan), dan Engkaulah ahli waris yang terbaik.`,`QS Al-Anbiya: 89`]]],
[`Kabar gembira bernama Yahya`,[`Malaikat menyeru Zakaria ketika ia berdiri sholat di mihrab: ia akan dikaruniai putra bernama Yahya. Sebagai tanda, Zakaria tidak dapat berbicara kepada manusia selama tiga hari kecuali dengan isyarat, sementara lisannya tetap bisa berdzikir.`],
[[`Para malaikat`,`Allah menyampaikan kabar gembira kepadamu dengan (kelahiran) Yahya, yang membenarkan sebuah kalimat (firman) dari Allah, panutan, berkemampuan menahan diri (dari hawa nafsu), dan seorang nabi di antara orang-orang saleh.`,`QS Ali Imran: 39`],[`Zakaria`,`Ya Tuhanku, bagaimana aku bisa mendapat anak, sedang aku sudah sangat tua dan istriku pun mandul?`,`QS Ali Imran: 40`],[`Allah`,`Demikianlah, Allah berbuat apa yang Dia kehendaki.`,`QS Ali Imran: 40`]]]];
KBAB.yahya=[
[`Anak yang istimewa`,[`Yahya lahir sebagai jawaban atas doa ayahnya. Namanya belum pernah dipakai siapa pun sebelumnya. Sejak kecil ia diberi hikmah dan pemahaman tentang Taurat, berhati lembut, suci, dan sangat berbakti kepada orang tua.`],
[[`Allah`,`Wahai Yahya! Ambillah (pelajarilah) Kitab (Taurat) itu dengan sungguh-sungguh. Dan Kami berikan hikmah kepadanya (selagi dia) masih kanak-kanak.`,`QS Maryam: 12`]]],
[`Lima perintah di Baitul Maqdis`,[`Nabi Muhammad ﷺ menceritakan bahwa Allah memerintahkan Yahya menyampaikan lima perkara kepada Bani Israil. Yahya mengumpulkan manusia di Baitul Maqdis hingga penuh, lalu berkhotbah: sembahlah Allah dan jangan menyekutukan-Nya, dirikan sholat, berpuasa, bersedekah, dan perbanyak dzikir. Ia menjelaskan setiap perintah dengan perumpamaan yang indah.`],
[[`Yahya`,`Sesungguhnya Allah memerintahkan aku lima perkara agar aku mengamalkannya dan memerintahkan kalian untuk mengamalkannya…`,`HR. Tirmidzi (sahih)`]]],
[`Salam di tiga keadaan`,[`Yahya hidup sezaman dengan Isa dan membenarkannya. Ia dikenal sangat takut kepada Allah. Menurut riwayat sejarah, ia wafat dibunuh karena menegur kemungkaran penguasa. Allah memberinya salam pada tiga keadaan terberat manusia.`],
[[`Allah`,`Dan kesejahteraan baginya pada hari dia dilahirkan, pada hari dia wafat, dan pada hari dia dibangkitkan hidup kembali.`,`QS Maryam: 15`]]]];
KBAB.isa=[
[`Kabar untuk Maryam`,[`Maryam sedang menyendiri ketika Jibril datang dalam rupa manusia yang sempurna. Maryam berlindung kepada Allah. Jibril menenangkannya dan menyampaikan kabar bahwa ia akan melahirkan seorang putra yang suci.`],
[[`Maryam`,`Sungguh, aku berlindung kepada Tuhan Yang Maha Pengasih terhadapmu, jika engkau orang yang bertakwa.`,`QS Maryam: 18`],[`Jibril`,`Sesungguhnya aku hanyalah utusan Tuhanmu, untuk menyampaikan anugerah kepadamu seorang anak laki-laki yang suci.`,`QS Maryam: 19`],[`Maryam`,`Bagaimana mungkin aku mempunyai anak laki-laki, padahal tidak pernah ada orang (laki-laki) yang menyentuhku dan aku bukan seorang pezina?`,`QS Maryam: 20`],[`Jibril`,`Demikianlah. Tuhanmu berfirman, "Hal itu mudah bagi-Ku."`,`QS Maryam: 21`]]],
[`Di bawah pohon kurma`,[`Saat hendak melahirkan, Maryam menyingkir ke tempat jauh dan bersandar pada pangkal pohon kurma. Rasa sakit dan beban batin membuatnya berharap mati sebelum itu. Lalu terdengar seruan yang menghibur: ada anak sungai di bawahnya, dan goyangkanlah pohon kurma, niscaya kurma masak akan berjatuhan.`],
[[`Maryam`,`Wahai, betapa (baiknya) aku mati sebelum ini, dan aku menjadi seorang yang tidak diperhatikan dan dilupakan.`,`QS Maryam: 23`],[`Seruan dari bawahnya`,`Janganlah engkau bersedih hati, sesungguhnya Tuhanmu telah menjadikan anak sungai di bawahmu. Dan goyangkanlah pangkal pohon kurma itu ke arahmu, niscaya pohon itu akan menggugurkan buah kurma yang masak kepadamu.`,`QS Maryam: 24–25`]]],
[`Bayi yang berbicara`,[`Maryam kembali kepada kaumnya sambil menggendong bayinya. Mereka menuduhnya berbuat keji. Maryam hanya menunjuk bayinya, karena ia sedang bernazar diam. Lalu bayi Isa berbicara dan membela ibunya.`],
[[`Kaum Maryam`,`Wahai Maryam! Sungguh, engkau telah membawa sesuatu yang sangat mungkar. Wahai saudara perempuan Harun! Ayahmu bukan seorang yang buruk perangai dan ibumu bukan seorang pezina.`,`QS Maryam: 27–28`],[`Kaum Maryam`,`Bagaimana kami akan berbicara dengan anak kecil yang masih dalam ayunan?`,`QS Maryam: 29`],[`Bayi Isa`,`Sesungguhnya aku hamba Allah. Dia memberiku Kitab (Injil) dan Dia menjadikan aku seorang nabi. Dan Dia menjadikan aku seorang yang diberkahi di mana saja aku berada, dan Dia memerintahkan kepadaku (melaksanakan) sholat dan (menunaikan) zakat selama aku hidup.`,`QS Maryam: 30–31`]]],
[`Mukjizat dan para hawariyyun`,[`Isa menyeru Bani Israil kepada tauhid dan membenarkan Taurat, sambil meringankan sebagian aturan yang memberatkan. Dengan izin Allah ia membentuk burung dari tanah lalu meniupnya hingga hidup, menyembuhkan orang buta sejak lahir dan penderita sopak, serta menghidupkan orang mati. Ketika ia merasakan kekafiran kaumnya, ia mencari penolong.`],
[[`Isa`,`Siapakah yang akan menjadi penolongku untuk (menegakkan agama) Allah?`,`QS Ali Imran: 52`],[`Para hawariyyun`,`Kamilah penolong (agama) Allah. Kami beriman kepada Allah, dan saksikanlah bahwa kami adalah orang-orang muslim.`,`QS Ali Imran: 52`]]],
[`Hidangan dari langit`,[`Para hawariyyun meminta hidangan dari langit agar hati mereka tenteram. Isa berdoa, dan Allah menurunkannya dengan peringatan keras bagi siapa yang kafir setelahnya.`],
[[`Para hawariyyun`,`Wahai Isa putra Maryam! Bersediakah Tuhanmu menurunkan hidangan dari langit kepada kami?`,`QS Al-Ma'idah: 112`],[`Isa`,`Ya Tuhan kami, turunkanlah kepada kami hidangan dari langit (yang hari turunnya) akan menjadi hari raya bagi kami, yaitu bagi orang-orang yang sekarang bersama kami maupun yang datang setelah kami, dan menjadi tanda bagi kekuasaan Engkau.`,`QS Al-Ma'idah: 114`]]],
[`Diangkat, dan akan kembali`,[`Para pemuka yang memusuhinya merencanakan pembunuhan. Allah membalas tipu daya mereka: Isa tidak dibunuh dan tidak disalib. Allah mengangkatnya. Pada hari kiamat, Allah akan bertanya kepadanya tentang orang-orang yang menuhankannya, dan Isa berlepas diri. Menurut hadis sahih, Isa akan turun di akhir zaman, mematahkan salib, dan memimpin dengan adil.`],
[[`Allah`,`Mereka tidak membunuhnya dan tidak (pula) menyalibnya, tetapi (yang mereka bunuh adalah) orang yang diserupakan dengan Isa… Allah telah mengangkat Isa ke hadirat-Nya.`,`QS An-Nisa: 157–158`],[`Isa (di hari kiamat)`,`Mahasuci Engkau, tidak patut bagiku mengatakan apa yang bukan hakku… Aku tidak pernah mengatakan kepada mereka kecuali apa yang Engkau perintahkan kepadaku, (yaitu) "Sembahlah Allah, Tuhanku dan Tuhanmu."`,`QS Al-Ma'idah: 116–117`]]]];
KBAB.muhammad=[
[`Yatim yang terpercaya`,[`Muhammad lahir di Makkah pada Tahun Gajah. Ayahnya, Abdullah, wafat sebelum ia lahir. Ia disusui Halimah dari Bani Sa'ad di pedalaman. Ibunya, Aminah, wafat ketika ia berusia enam tahun, dan kakeknya, Abdul Muthalib, wafat dua tahun kemudian. Ia lalu diasuh pamannya, Abu Thalib.`,`Ia tumbuh menjadi pemuda yang jujur sehingga dijuluki Al-Amin. Ketika Quraisy berselisih tentang siapa yang berhak meletakkan Hajar Aswad saat renovasi Ka'bah, mereka sepakat menyerahkan keputusan kepada orang pertama yang masuk masjid. Ternyata ia yang datang. Ia meletakkan batu itu di atas kain dan meminta setiap kepala kabilah memegang ujungnya bersama-sama.`],
[[`Kaum Quraisy`,`Ini Al-Amin! Kami rela (dengan keputusannya), ini Muhammad.`,`Sirah Ibnu Hisyam; Musnad Ahmad`]]],
[`Iqra' di Gua Hira`,[`Menjelang usia 40, ia gemar menyendiri beribadah di Gua Hira. Pada suatu malam di bulan Ramadhan, Jibril datang dan memerintahkannya membaca. Ia pulang dengan gemetar kepada Khadijah, yang menenangkannya dengan kata-kata yang abadi. Khadijah lalu membawanya kepada Waraqah bin Naufal, yang membenarkan bahwa itu adalah wahyu seperti yang datang kepada Musa.`],
[[`Jibril`,`Bacalah!`,`HR. Bukhari`],[`Muhammad ﷺ`,`Aku tidak bisa membaca.`,`HR. Bukhari`],[`Jibril`,`Bacalah dengan (menyebut) nama Tuhanmu yang menciptakan…`,`QS Al-'Alaq: 1`],[`Muhammad ﷺ`,`Selimutilah aku, selimutilah aku… Sungguh, aku khawatir terhadap diriku.`,`HR. Bukhari`],[`Khadijah`,`Tidak, demi Allah, Allah tidak akan pernah menghinakanmu. Sungguh engkau menyambung silaturahim, menanggung beban orang lemah, memberi orang yang tidak punya, memuliakan tamu, dan menolong orang yang tertimpa musibah.`,`HR. Bukhari`]]],
[`Dakwah di bukit Shafa`,[`Setelah tiga tahun berdakwah diam-diam, turun perintah memberi peringatan kepada kerabat. Nabi ﷺ naik ke bukit Shafa dan memanggil kabilah-kabilah Quraisy. Abu Lahab, pamannya sendiri, menjawab dengan kasar.`],
[[`Nabi Muhammad ﷺ`,`Bagaimana pendapat kalian, jika aku kabarkan bahwa ada pasukan berkuda di lembah sana yang hendak menyerang kalian, apakah kalian memercayaiku?`,`HR. Bukhari`],[`Kaum Quraisy`,`Ya, kami tidak pernah mendapatimu kecuali jujur.`,`HR. Bukhari`],[`Nabi Muhammad ﷺ`,`Sesungguhnya aku adalah pemberi peringatan bagi kalian sebelum datangnya azab yang pedih.`,`HR. Bukhari`]]],
[`Tahun duka dan Thaif`,[`Tekanan terhadap kaum muslimin semakin berat: boikot tiga tahun, penyiksaan, dan hijrah sebagian sahabat ke Habasyah. Pada tahun ke-10 kenabian, Khadijah dan Abu Thalib wafat. Nabi ﷺ pergi ke Thaif untuk berdakwah, tetapi diusir dan dilempari batu hingga kakinya berdarah.`,`Malaikat penjaga gunung menawarkan untuk menimpakan dua gunung kepada mereka. Nabi ﷺ menolak dengan penuh kasih.`],
[[`Malaikat penjaga gunung`,`Jika engkau mau, aku akan menimpakan kedua gunung ini kepada mereka.`,`HR. Bukhari & Muslim`],[`Nabi Muhammad ﷺ`,`Tidak, bahkan aku berharap Allah akan mengeluarkan dari keturunan mereka orang yang menyembah Allah semata dan tidak menyekutukan-Nya dengan sesuatu pun.`,`HR. Bukhari & Muslim`]]],
[`Isra' Mi'raj`,[`Dalam satu malam, Nabi ﷺ diperjalankan dari Masjidil Haram ke Masjidil Aqsha, lalu naik ke langit dan bertemu para nabi, hingga ke Sidratul Muntaha. Di sana diwajibkan sholat. Semula 50 waktu, lalu atas saran Nabi Musa beliau berulang kali memohon keringanan hingga menjadi 5 waktu dengan pahala 50.`,`Esok harinya kaum Quraisy mengejek, dan sebagian orang mendatangi Abu Bakar.`],
[[`Kaum Quraisy`,`Temanmu mengaku pergi ke Baitul Maqdis semalam lalu kembali sebelum pagi!`,`HR. Hakim`],[`Abu Bakar`,`Jika dia yang mengatakannya, maka dia benar. Aku membenarkannya untuk berita langit yang lebih jauh dari itu.`,`HR. Hakim (sahih)`]]],
[`Hijrah dan Gua Tsur`,[`Penduduk Yatsrib (Madinah) berbaiat di Aqabah. Kaum muslimin berhijrah sedikit demi sedikit. Quraisy berencana membunuh Nabi ﷺ. Pada malam itu Ali tidur di ranjangnya, sementara Nabi ﷺ dan Abu Bakar keluar dan bersembunyi tiga malam di Gua Tsur. Para pengejar sampai di mulut gua, dan Abu Bakar cemas.`],
[[`Abu Bakar`,`Wahai Rasulullah, seandainya salah seorang dari mereka melihat ke bawah kakinya, pasti dia melihat kita.`,`HR. Bukhari & Muslim`],[`Nabi Muhammad ﷺ`,`Apa dugaanmu terhadap dua orang, sedangkan yang ketiganya adalah Allah?`,`HR. Bukhari & Muslim`],[`Allah`,`Janganlah engkau bersedih, sesungguhnya Allah bersama kita.`,`QS At-Taubah: 40`]]],
[`Membangun Madinah`,[`Setibanya di Madinah, Nabi ﷺ membangun Masjid Nabawi, mempersaudarakan Muhajirin dan Anshar, dan membuat Piagam Madinah yang mengatur kehidupan bersama. Pesan pertama yang beliau sampaikan sangat sederhana.`],
[[`Nabi Muhammad ﷺ`,`Wahai manusia, sebarkanlah salam, berikanlah makan, sambunglah tali silaturahim, dan sholatlah di malam hari ketika manusia sedang tidur, niscaya kalian masuk surga dengan selamat.`,`HR. Tirmidzi (sahih), dari Abdullah bin Salam`]]],
[`Badar, Uhud, Khandaq, dan Hudaibiyah`,[`Pada 2 H, 313 kaum muslimin menang atas sekitar seribu pasukan Quraisy di Badar. Pada 3 H, di Uhud, kemenangan berbalik karena para pemanah meninggalkan pos, dan Nabi ﷺ terluka. Pada 5 H, pasukan sekutu mengepung Madinah, tetapi terhalang parit dan dibubarkan angin.`,`Pada 6 H, Perjanjian Hudaibiyah tampak merugikan, tetapi Allah menyebutnya "kemenangan yang nyata". Umar sempat gelisah dan bertanya.`],
[[`Umar bin Khattab`,`Bukankah kita di atas kebenaran dan musuh kita di atas kebatilan? Lalu mengapa kita menerima kehinaan dalam agama kita?`,`HR. Bukhari`],[`Nabi Muhammad ﷺ`,`Sesungguhnya aku adalah utusan Allah, dan aku tidak akan bermaksiat kepada-Nya. Dialah penolongku.`,`HR. Bukhari`]]],
[`Fathu Makkah: hari kasih sayang`,[`Pada 8 H, Quraisy melanggar perjanjian. Nabi ﷺ berangkat dengan 10.000 pasukan dan memasuki Makkah hampir tanpa pertumpahan darah. Berhala-berhala di sekitar Ka'bah dihancurkan sambil membaca: "Kebenaran telah datang dan kebatilan telah lenyap." Penduduk Makkah, yang dulu mengusir dan memeranginya, menunggu keputusan dengan cemas.`],
[[`Nabi Muhammad ﷺ`,`Wahai kaum Quraisy, menurut kalian apa yang akan aku lakukan terhadap kalian?`,`Sirah Ibnu Hisyam`],[`Kaum Quraisy`,`Kebaikan. Engkau saudara yang mulia, putra saudara yang mulia.`,`Sirah Ibnu Hisyam`],[`Nabi Muhammad ﷺ`,`Pergilah, kalian semua bebas.`,`Sirah Ibnu Hisyam; As-Sunan Al-Kubra Al-Baihaqi`]]],
[`Haji Wada' dan perpisahan`,[`Pada 10 H, Nabi ﷺ berhaji bersama lebih dari seratus ribu orang. Di Arafah beliau berkhutbah tentang kehormatan darah dan harta, hak-hak wanita, dan berpegang pada Kitabullah. Turun ayat bahwa agama telah disempurnakan.`,`Beberapa bulan kemudian beliau sakit. Di hari-hari terakhir, beliau berpesan tentang sholat dan budak. Beliau wafat di pangkuan Aisyah pada Senin, 12 Rabi'ul Awal 11 H. Abu Bakar menenangkan umat yang terguncang.`],
[[`Nabi Muhammad ﷺ`,`Sesungguhnya darah dan harta kalian haram atas kalian, seperti haramnya hari kalian ini, di bulan kalian ini, di negeri kalian ini… Bukankah aku telah menyampaikan?`,`HR. Bukhari & Muslim`],[`Nabi Muhammad ﷺ (akhir hayat)`,`(Jagalah) sholat, (jagalah) sholat, dan (perlakukan baik) budak-budak kalian.`,`HR. Abu Dawud, Ibnu Majah`],[`Abu Bakar`,`Barangsiapa menyembah Muhammad, sesungguhnya Muhammad telah wafat. Dan barangsiapa menyembah Allah, sesungguhnya Allah Mahahidup dan tidak akan mati.`,`HR. Bukhari`]]]];

KBAB.abubakar=[
[`Sahabat sejak sebelum kenabian`,[`Abu Bakar, nama aslinya Abdullah bin Utsman, adalah saudagar terhormat di Makkah, sahabat karib Muhammad sejak muda, dan tidak pernah menyembah berhala. Ketika Nabi ﷺ menyampaikan risalah, ia langsung beriman tanpa ragu. Lewat dakwahnya, masuk Islam tokoh-tokoh besar: Utsman, Zubair, Abdurrahman bin Auf, Sa'ad bin Abi Waqqash, dan Thalhah.`,`Hartanya ia gunakan untuk memerdekakan budak-budak muslim yang disiksa, seperti Bilal.`],
[[`Nabi Muhammad ﷺ`,`Tidak ada seorang pun yang aku ajak masuk Islam melainkan ada keraguan dan pertimbangan padanya, kecuali Abu Bakar. Ia tidak ragu sedikit pun ketika aku menyebutkannya.`,`Sirah Ibnu Ishaq`]]],
[`Ash-Shiddiq`,[`Setelah peristiwa Isra' Mi'raj, kaum musyrik menganggap inilah kesempatan menggoyahkan Abu Bakar. Jawabannya justru membuatnya digelari Ash-Shiddiq (yang selalu membenarkan).`],
[[`Kaum musyrik`,`Temanmu mengaku semalam pergi ke Baitul Maqdis dan kembali sebelum pagi.`,`HR. Hakim`],[`Abu Bakar`,`Jika ia yang mengatakannya, maka ia benar.`,`HR. Hakim (sahih)`]]],
[`Seluruh harta untuk Allah`,[`Saat persiapan Perang Tabuk, Nabi ﷺ meminta sedekah. Umar membawa separuh hartanya dan berharap kali ini bisa mengungguli Abu Bakar. Ternyata Abu Bakar membawa seluruh hartanya.`],
[[`Nabi Muhammad ﷺ`,`Apa yang engkau sisakan untuk keluargamu?`,`HR. Abu Dawud & Tirmidzi`],[`Abu Bakar`,`Aku sisakan untuk mereka Allah dan Rasul-Nya.`,`HR. Abu Dawud & Tirmidzi`],[`Umar`,`Aku tidak akan pernah bisa mengunggulinya dalam hal apa pun selamanya.`,`HR. Abu Dawud & Tirmidzi`]]],
[`Khalifah yang teguh`,[`Saat Nabi ﷺ wafat, banyak sahabat terguncang. Abu Bakar menenangkan mereka. Ia dibaiat sebagai khalifah dan menyampaikan pidato pertama yang rendah hati. Ia tegas memerangi kaum murtad dan penolak zakat. Atas usulan Umar, ia memerintahkan Zaid bin Tsabit mengumpulkan Al-Qur'an dalam satu mushaf.`,`Ia memimpin sekitar dua tahun, lalu wafat pada 13 H dan dimakamkan di samping Nabi ﷺ.`],
[[`Abu Bakar (pidato pertama)`,`Wahai manusia, aku telah diangkat memimpin kalian, padahal aku bukanlah yang terbaik di antara kalian. Jika aku berbuat baik, bantulah aku. Jika aku berbuat buruk, luruskanlah aku… Taatilah aku selama aku menaati Allah dan Rasul-Nya.`,`Sirah Ibnu Hisyam`]]]];
KBAB.umar=[
[`Pedang terhunus yang berubah arah`,[`Umar bin Khattab adalah pemuda Quraisy yang kuat dan keras menentang Islam. Suatu hari ia keluar dengan pedang hendak membunuh Nabi ﷺ. Di jalan ia diberi tahu bahwa adiknya, Fatimah, dan suaminya sudah masuk Islam. Ia mendatangi rumah mereka dan memukul adiknya hingga berdarah.`,`Melihat darah adiknya, hatinya melunak. Ia meminta lembaran yang sedang mereka baca, yaitu awal Surah Thaha. Ayat-ayat itu menggetarkan hatinya.`],
[[`Umar`,`Alangkah indah dan mulianya perkataan ini! Tunjukkan kepadaku di mana Muhammad.`,`Sirah Ibnu Hisyam`]]],
[`Al-Faruq`,[`Setelah Umar masuk Islam, kaum muslimin berani sholat terang-terangan di depan Ka'bah. Ibnu Mas'ud berkata: "Kami senantiasa merasa mulia sejak Umar masuk Islam" (HR. Bukhari).`,`Ketika hijrah, banyak sahabat berangkat diam-diam. Menurut riwayat sejarah, Umar justru berangkat terang-terangan dan menantang siapa pun yang ingin menghalanginya.`],
[[`Nabi Muhammad ﷺ`,`Demi Dzat yang jiwaku di tangan-Nya, tidaklah setan berpapasan denganmu di suatu jalan, melainkan ia akan mengambil jalan selain jalanmu.`,`HR. Bukhari & Muslim`]]],
[`Khalifah yang memikul gandum`,[`Sebagai khalifah, Umar sering berkeliling malam. Suatu malam ia mendengar anak-anak menangis kelaparan, sementara ibu mereka memasak batu agar anak-anak tertidur. Umar sendiri memikul sekarung gandum dan memasakkannya untuk mereka. Ia juga pernah menerima kritik seorang wanita di masjid tentang mahar dan mengakui pendapat wanita itu.`,`Ketika menerima kunci Baitul Maqdis, ia datang dengan pakaian sederhana, bergantian menunggang unta dengan pembantunya. Ia menetapkan kalender Hijriah, membentuk diwan (administrasi), dan mendirikan kota-kota baru.`],
[[`Umar`,`Seandainya seekor keledai terperosok di Irak, aku khawatir Allah akan menanyakanku: mengapa tidak engkau ratakan jalan untuknya?`,`Riwayat masyhur dalam Tarikh`]]],
[`Syahid di mihrab`,[`Umar sering berdoa agar dianugerahi mati syahid di kota Rasulullah. Pada 23 H, saat mengimami sholat Subuh, ia ditikam oleh Abu Lu'lu'ah. Menjelang wafat ia meminta izin Aisyah agar dimakamkan di samping Nabi ﷺ dan Abu Bakar.`],
[[`Umar`,`Ya Allah, anugerahkan kepadaku mati syahid di jalan-Mu, dan jadikan kematianku di negeri Rasul-Mu.`,`HR. Bukhari`]]]];
KBAB.utsman=[
[`Saudagar yang pemalu`,[`Utsman bin Affan masuk Islam lewat ajakan Abu Bakar. Ia sangat pemalu dan dermawan. Ia menikah dengan Ruqayyah binti Rasulullah dan ikut hijrah ke Habasyah. Setelah Ruqayyah wafat, ia menikah dengan Ummu Kultsum, sehingga digelari Dzun Nurain.`],
[[`Nabi Muhammad ﷺ`,`Tidakkah aku malu kepada seseorang yang malaikat pun malu kepadanya?`,`HR. Muslim`]]],
[`Sumur Rumah dan pasukan Tabuk`,[`Di Madinah, air bersih dikuasai seorang Yahudi pemilik sumur Rumah yang menjualnya mahal. Nabi ﷺ menawarkan surga bagi yang membelinya untuk kaum muslimin. Utsman membelinya dan mewakafkannya. Saat Perang Tabuk yang sulit, ia membiayai sebagian besar pasukan.`],
[[`Nabi Muhammad ﷺ`,`Tidak ada yang membahayakan Utsman apa pun yang ia lakukan setelah hari ini.`,`HR. Tirmidzi (hasan)`]]],

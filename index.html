function dlUI(txt,pct){const el=$('#dlprog');if(el){el.hidden=!txt;const t=el.querySelector('span'),b=el.querySelector('i');if(t)t.textContent=txt||'';if(b)b.style.width=(pct||0)+'%'}}
async function auSaveOne(ed,s,a,url,cache){const key=`au-${ed}-${s}-${a}`;
  if(await cache.match(url))return 'c';let has=null;try{has=await idb('readonly',st=>st.getKey(key))}catch(_){}if(has)return 'i';
  let r=null;try{r=await fetch(url,{mode:'cors'});if(!r.ok)throw new Error('HTTP '+r.status);const b=await r.blob();await idb('readwrite',st=>st.put(b,key));return 'i'}
  catch(err){if(r&&!r.ok&&r.status)throw err;
    const o=await fetch(url,{mode:'no-cors'});await cache.put(url,o);return 'o'}}
async function dlAudio(s,quiet){const ed=S.qari||'ar.alafasy',k=ed+':'+s;if(auBusy[k])return true;if(!navigator.onLine){toast('Butuh internet untuk mengunduh');return false}
  auBusy[k]=1;const nm=SLAT[s-1].n,btn=$('#dlbtn');if(btn){btn.disabled=true;btn.textContent='Mengunduh…'}dlUI(nm+': menyiapkan…',0);
  try{try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
    const l=await auList(ed,s),cache=await caches.open(AUC);let n=0,fail=0,i=0;
    const work=async()=>{while(i<l.length){const a=++i;let ok=false;for(let t=0;t<3&&!ok;t++){try{await auSaveOne(ed,s,a,l[a-1],cache);ok=true}catch(_){await new Promise(r=>setTimeout(r,600))}}
      if(ok)n++;else fail++;dlUI(`${nm}: ${n}/${l.length} ayat`,Math.round(n/l.length*100))}};
    await Promise.all([work(),work(),work(),work()]);
    if(fail){toast(`${nm}: ${fail} ayat gagal. Ketuk unduh lagi untuk melanjutkan.`);return false}
    S.audl[k]=1;save();if(!quiet)toast(`Audio ${nm} tersimpan offline`);return true}
  catch(e){toast('Gagal mengunduh audio. Periksa koneksi lalu coba lagi.');return false}
  finally{delete auBusy[k];dlUI('');if(sheet==='qaudio')render(true)}}
async function dlAudioMany(list){let ok=0;for(const s of list){if(await dlAudio(s,true))ok++}toast(`${ok}/${list.length} surat tersimpan offline`)}
async function delAudio(k){const[ed,s]=k.split(':');let cache=null;try{cache=await caches.open(AUC)}catch(_){}let l=null;try{l=await auList(ed,+s)}catch(_){}
  for(let a=1;a<=SLAT[s-1].c;a++){try{await idb('readwrite',st=>st.delete(`au-${ed}-${s}-${a}`))}catch(_){}if(cache&&l)try{await cache.delete(l[a-1])}catch(_){}}delete S.audl[k];save();toast('Audio dihapus dari HP');render(true)}

function beadsHTML(){const b=BEADS[S.bead||0];return `<div class="beads" id="beads">${[...Array(13)].map(()=>`<i style="background:radial-gradient(circle at 32% 28%,${b[2]},${b[1]} 62%)"></i>`).join('')}</div>`}
function tasTap(){S.tasbih++;const T=tasTarget();let done=false;if(T&&S.tasbih>=T){S.tasR=(S.tasR||1)+1;S.tasbih=0;done=true}
  const c=$('#tc'),r=$('#tr'),bd=$('#beads');if(c)c.textContent=String(S.tasbih).padStart(2,'0');if(r)r.textContent=S.tasR||1;
  if(bd){bd.classList.remove('slide');void bd.offsetWidth;bd.classList.add('slide')}
  if(done){sfx('ok');try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(_){}toast(`${ZIKIR[S.tasIdx%ZIKIR.length][0]} ${T}×, putaran selesai`)}else if(S.tasSnd!==false)sfx('tap');save()}

/* ---------- 25 NABI ---------- */
{id:'adam',cat:'nabi',n:'Nabi Adam',ar:'آدَم',g:'Abul Basyar (bapak manusia)',tempat:'Surga, lalu diturunkan ke bumi. Lokasi turunnya tidak disebut Al-Qur\'an; riwayat tentang India/Sri Lanka dan pertemuan di Arafah tidak kuat.',masa:'Manusia pertama; zamannya tidak dapat ditentukan',
k:['Allah memberitahu para malaikat bahwa Dia akan menjadikan khalifah di bumi. Adam diciptakan dari tanah, lalu ditiupkan ruh kepadanya.','Allah mengajarkan kepada Adam nama-nama segala sesuatu, lalu memerintahkan malaikat bersujud kepadanya. Semua bersujud kecuali Iblis yang sombong.','Adam dan Hawa tinggal di surga dan dilarang mendekati satu pohon. Iblis menggoda keduanya hingga melanggar. Mereka menyesal dan berdoa "Rabbana zhalamna anfusana…", lalu Allah menerima taubat mereka dan menurunkan mereka ke bumi.'],
keut:['Diciptakan langsung oleh Allah "dengan kedua tangan-Nya" (QS Shad: 75)','Diajarkan nama-nama segala sesuatu (QS Al-Baqarah: 31)','Malaikat diperintah bersujud (penghormatan) kepadanya (QS Al-Baqarah: 34)','Teladan taubat: doa di QS Al-A\'raf: 23'],ref:'QS Al-Baqarah: 30–38; Al-A\'raf: 11–25; Thaha: 115–123'},
{id:'idris',cat:'nabi',n:'Nabi Idris',ar:'إِدْرِيس',g:'Nabi yang sangat jujur',tempat:'Tidak disebut Al-Qur\'an. Sebagian riwayat menyebut Babilonia atau Mesir.',masa:'Setelah Adam dan Syits, sebelum Nuh (menurut riwayat)',
k:['Al-Qur\'an menyebut Idris sebagai orang yang sangat membenarkan (shiddiq) dan seorang nabi, serta termasuk orang-orang yang sabar.','Riwayat-riwayat (sebagian bersumber israiliyat) menyebut beliau ahli ilmu, yang pertama menulis dengan pena dan menjahit pakaian. Riwayat ini tidak dapat dipastikan.'],
keut:['"Kami angkat dia ke tempat (martabat) yang tinggi" (QS Maryam: 56–57)','Ditemui Rasulullah ﷺ di langit keempat saat Mi\'raj (HR. Bukhari & Muslim)','Disebut di antara orang-orang sabar (QS Al-Anbiya: 85)'],ref:'QS Maryam: 56–57; Al-Anbiya: 85–86'},
{id:'nuh',cat:'nabi',n:'Nabi Nuh',ar:'نُوح',g:'Ulul Azmi; Rasul pertama ke penduduk bumi',tempat:'Mesopotamia (Irak). Bahtera berlabuh di Bukit Judi (QS Hud: 44), yang dikaitkan dengan wilayah Turki tenggara/Irak utara.',masa:'Jauh sebelum Ibrahim; tahun tidak diketahui pasti',
k:['Kaum Nuh menyembah berhala Wadd, Suwa\', Yaghuts, Ya\'uq, dan Nasr. Nuh berdakwah siang dan malam, terang-terangan dan diam-diam, selama 950 tahun, tetapi hanya sedikit yang beriman.','Allah memerintahkan Nuh membuat bahtera. Kaumnya mengejek. Lalu datang banjir besar: air memancar dari bumi dan turun dari langit.','Orang beriman dan pasangan-pasangan hewan selamat di bahtera. Putra Nuh dan istrinya yang ingkar ikut tenggelam.'],
keut:['Berdakwah 950 tahun dengan sabar (QS Al-Ankabut: 14)','Mukjizat bahtera dan keselamatan orang beriman dari banjir','Termasuk Ulul Azmi (QS Al-Ahzab: 7; Asy-Syura: 13)','Disebut "hamba yang banyak bersyukur" (QS Al-Isra: 3)'],ref:'QS Nuh (71); Hud: 25–49; Al-Mu\'minun: 23–30'},
{id:'hud',cat:'nabi',n:'Nabi Hud',ar:'هُود',g:'Utusan kepada kaum \'Ad',tempat:'Al-Ahqaf (bukit-bukit pasir), selatan Jazirah Arab, antara Yaman dan Oman',masa:'Setelah Nuh; tahun tidak diketahui',
k:['Kaum \'Ad bertubuh kuat dan membangun kota megah Iram yang bertiang-tiang tinggi. Mereka sombong dan menyembah selain Allah.','Hud mengajak mereka bertauhid dan beristighfar, tetapi mereka menantang azab.','Allah mengirim angin yang sangat dingin dan kencang selama tujuh malam delapan hari yang membinasakan mereka. Hud dan orang beriman diselamatkan.'],
keut:['Keteguhan berdakwah sendirian menghadapi kaum yang kuat (QS Hud: 50–60)','Keselamatan orang beriman dari azab angin (QS Al-Haqqah: 6–8)'],ref:'QS Al-A\'raf: 65–72; Hud: 50–60; Al-Ahqaf: 21–26; Al-Fajr: 6–8'},
{id:'saleh',cat:'nabi',n:'Nabi Saleh',ar:'صَالِح',g:'Utusan kepada kaum Tsamud',tempat:'Al-Hijr (QS Al-Hijr: 80), kini dikenal sebagai Mada\'in Saleh/Hegra dekat Al-Ula, Arab Saudi',masa:'Setelah kaum \'Ad; tahun tidak diketahui',
k:['Kaum Tsamud mahir memahat rumah di gunung batu. Saleh mengajak mereka menyembah Allah saja.','Mereka meminta bukti, maka Allah memberi mukjizat seekor unta betina (naqatullah) dengan aturan giliran minum. Mereka dilarang mengganggunya.','Kaum itu justru menyembelih unta tersebut. Tiga hari kemudian datang azab suara keras yang mengguntur dan gempa. Saleh dan orang beriman selamat.'],
keut:['Mukjizat unta betina sebagai tanda dari Allah (QS Al-A\'raf: 73)','Rasulullah ﷺ melarang para sahabat memakai air sumur kaum Tsamud saat melewati Hijr menuju Tabuk (HR. Bukhari)'],ref:'QS Al-A\'raf: 73–79; Hud: 61–68; Asy-Syams: 11–15'},
{id:'ibrahim',cat:'nabi',n:'Nabi Ibrahim',ar:'إِبْرَاهِيم',g:'Khalilullah; Bapak para nabi; Ulul Azmi',tempat:'Riwayat menyebut lahir di Ur/Babilonia (Irak). Hijrah ke Syam (Palestina), sempat ke Mesir, lalu ke Makkah. Makamnya menurut tradisi di Al-Khalil (Hebron).',masa:'Perkiraan sejarawan ±abad 19–18 SM (tidak pasti)',
k:['Sejak muda Ibrahim menolak penyembahan berhala kaumnya dan ayahnya. Ia menghancurkan berhala-berhala dan menyisakan yang terbesar untuk menyadarkan kaumnya.','Raja Namrud dan kaumnya membakar Ibrahim, tetapi Allah berfirman: "Wahai api, jadilah dingin dan keselamatan bagi Ibrahim."','Atas perintah Allah, Ibrahim membawa Hajar dan bayi Ismail ke lembah Makkah yang tandus. Kelak bersama Ismail ia membangun Ka\'bah dan menyeru manusia berhaji.','Ibrahim diuji dengan perintah menyembelih Ismail. Keduanya pasrah, lalu Allah menggantinya dengan sembelihan yang besar. Peristiwa ini menjadi asal ibadah kurban.'],
keut:['Selamat dari api (QS Al-Anbiya: 68–70)','Dijadikan kekasih Allah, Khalilullah (QS An-Nisa: 125)','Membangun Ka\'bah bersama Ismail (QS Al-Baqarah: 127)','Teladan (uswah hasanah) bagi orang beriman (QS Al-Mumtahanah: 4)','Disebut dalam shalawat tasyahud akhir setiap sholat'],ref:'QS Al-Baqarah: 124–133; Al-An\'am: 74–83; Al-Anbiya: 51–73; Ash-Shaffat: 83–113'},
{id:'luth',cat:'nabi',n:'Nabi Luth',ar:'لُوط',g:'Keponakan Nabi Ibrahim',tempat:'Negeri Sadum (Sodom) di sekitar Laut Mati (wilayah Yordania–Palestina kini)',masa:'Sezaman dengan Ibrahim',
k:['Luth beriman kepada Ibrahim dan ikut hijrah, lalu diutus ke kaum Sadum yang melakukan perbuatan keji yang belum pernah dilakukan kaum mana pun.','Luth menasihati mereka, tetapi mereka mengancam mengusirnya. Malaikat datang dalam rupa pemuda tampan dan memerintahkan Luth pergi di malam hari tanpa menoleh.','Negeri itu dibalikkan dan dihujani batu dari tanah yang terbakar. Istri Luth yang berkhianat ikut binasa.'],
keut:['Diberi hikmah dan ilmu (QS Al-Anbiya: 74)','Diselamatkan bersama keluarganya yang beriman (QS Hud: 81)'],ref:'QS Hud: 77–83; Al-Hijr: 58–77; Asy-Syu\'ara: 160–175'},
{id:'ismail',cat:'nabi',n:'Nabi Ismail',ar:'إِسْمَاعِيل',g:'Putra Ibrahim dan Hajar; leluhur bangsa Arab',tempat:'Makkah',masa:'Sezaman dengan Ibrahim',
k:['Saat bayi, Ismail ditinggal bersama ibunya, Hajar, di lembah Makkah. Hajar berlari tujuh kali antara Shafa dan Marwah mencari air, lalu memancarlah air Zamzam. Peristiwa ini diabadikan dalam ibadah sa\'i.','Ketika remaja, Ismail rela disembelih karena perintah Allah: "Wahai ayahku, lakukanlah apa yang diperintahkan kepadamu."','Ia membantu ayahnya meninggikan fondasi Ka\'bah. Dari keturunannya lahir Nabi Muhammad ﷺ.'],
keut:['Sabar dan pasrah dalam ujian penyembelihan (QS Ash-Shaffat: 102)','"Benar janjinya" (shadiqul wa\'d) (QS Maryam: 54)','Turut membangun Ka\'bah (QS Al-Baqarah: 127)','Kisah Zamzam dan sa\'i Hajar (HR. Bukhari)'],ref:'QS Al-Baqarah: 125–129; Ash-Shaffat: 100–107; Maryam: 54–55'},
{id:'ishaq',cat:'nabi',n:'Nabi Ishaq',ar:'إِسْحَاق',g:'Putra Ibrahim dan Sarah',tempat:'Kan\'an (Palestina)',masa:'Sezaman dengan Ibrahim',
k:['Malaikat membawa kabar gembira kepada Ibrahim dan Sarah tentang kelahiran Ishaq, padahal keduanya sudah tua. Sarah tertawa heran.','Ishaq menjadi nabi, dan dari keturunannya lahir Ya\'qub serta para nabi Bani Israil.'],
keut:['Kelahirannya adalah kabar gembira dari Allah (QS Hud: 71–72)','Disebut nabi yang saleh dan diberkahi (QS Ash-Shaffat: 112–113)'],ref:'QS Hud: 69–73; Ash-Shaffat: 112–113'},
{id:'yaqub',cat:'nabi',n:'Nabi Ya\'qub',ar:'يَعْقُوب',g:'Israil; ayah 12 suku Bani Israil',tempat:'Kan\'an (Palestina), kemudian pindah ke Mesir',masa:'Cucu Ibrahim',
k:['Ya\'qub memiliki dua belas putra, di antaranya Yusuf dan Bunyamin. Saudara-saudara Yusuf iri, lalu membuangnya ke sumur dan mengaku Yusuf dimakan serigala.','Ya\'qub bersabar dengan "sabar yang indah" hingga matanya memutih karena sedih.','Bertahun-tahun kemudian baju Yusuf diusapkan ke wajahnya dan penglihatannya kembali. Keluarga itu berkumpul lagi di Mesir.'],
keut:['Sabar yang indah, shabrun jamil (QS Yusuf: 18, 83)','Penglihatan kembali lewat baju Yusuf (QS Yusuf: 93–96)','Wasiat tauhid kepada anak-anaknya (QS Al-Baqarah: 132–133)'],ref:'QS Yusuf (12); Al-Baqarah: 132–133'},
{id:'yusuf',cat:'nabi',n:'Nabi Yusuf',ar:'يُوسُف',g:'Pemilik "kisah terbaik"',tempat:'Kan\'an, lalu Mesir',masa:'Putra Ya\'qub; tahun tidak pasti',
k:['Sejak kecil Yusuf bermimpi sebelas bintang, matahari, dan bulan bersujud kepadanya. Ia dibuang saudara-saudaranya ke sumur, ditemukan kafilah, dan dijual sebagai budak di Mesir.','Di rumah Al-Aziz, Yusuf digoda istri pembesar itu tetapi menolak. Ia lebih memilih penjara daripada maksiat.','Di penjara ia menakwilkan mimpi, lalu menakwilkan mimpi raja tentang tujuh sapi gemuk dan tujuh sapi kurus. Ia diangkat menjadi pengelola perbendaharaan Mesir dan menyelamatkan negeri dari paceklik.','Akhirnya ia memaafkan saudara-saudaranya dan memboyong keluarganya ke Mesir.'],
keut:['Ilmu takwil mimpi (QS Yusuf: 6, 101)','Menjaga kesucian diri dari godaan (QS Yusuf: 23–33)','Diberi separuh ketampanan (HR. Muslim, hadis Mi\'raj)','Teladan memaafkan: "Tidak ada cercaan atas kalian hari ini" (QS Yusuf: 92)'],ref:'QS Yusuf (12)'},
{id:'ayyub',cat:'nabi',n:'Nabi Ayyub',ar:'أَيُّوب',g:'Teladan kesabaran',tempat:'Riwayat menyebut Hauran, Syam (Suriah kini)',masa:'Tahun tidak diketahui',
k:['Ayyub semula diberi harta, anak, dan kesehatan yang melimpah. Lalu ia diuji dengan kehilangan harta, anak, dan penyakit yang panjang.','Ia tetap bersabar dan berdoa: "Sesungguhnya aku ditimpa penyakit, dan Engkau Yang Maha Penyayang."','Allah memerintahkannya menghentakkan kaki, lalu memancar air untuk mandi dan minum yang menyembuhkannya. Keluarga dan nikmatnya dikembalikan berlipat.'],
keut:['Disebut "sebaik-baik hamba" dan sangat taat (QS Shad: 44)','Kesembuhan melalui mata air dari hentakan kaki (QS Shad: 42)','Doa Ayyub di QS Al-Anbiya: 83'],ref:'QS Al-Anbiya: 83–84; Shad: 41–44'},
{id:'syuaib',cat:'nabi',n:'Nabi Syu\'aib',ar:'شُعَيْب',g:'Utusan kepada Madyan dan Ashabul Aikah',tempat:'Madyan, barat laut Jazirah Arab dekat Teluk Aqabah',masa:'Sebelum Musa',
k:['Penduduk Madyan berdagang dengan curang: mengurangi takaran dan timbangan. Syu\'aib mengajak mereka bertauhid dan berdagang dengan jujur.','Mereka mengejek dan mengancam akan mengusirnya. Lalu azab datang berupa gempa dan suara keras, sementara Ashabul Aikah ditimpa azab "hari yang dinaungi awan".','Sebagian mufasir berpendapat Syu\'aib adalah mertua Musa. Namun pendapat ini diperselisihkan.'],
keut:['Seruan kejujuran dalam takaran dan timbangan (QS Hud: 84–85)','Pandai berdakwah dengan tutur yang baik'],ref:'QS Al-A\'raf: 85–93; Hud: 84–95; Asy-Syu\'ara: 176–191'},
{id:'musa',cat:'nabi',n:'Nabi Musa',ar:'مُوسَى',g:'Kalimullah; Ulul Azmi; penerima Taurat',tempat:'Mesir, Madyan, Semenanjung Sinai (Bukit Thur)',masa:'Perkiraan sebagian sejarawan ±abad 13 SM (tidak pasti)',
k:['Musa lahir ketika Fir\'aun membunuh bayi laki-laki Bani Israil. Ibunya menghanyutkannya di Sungai Nil, lalu ia dipungut dan diasuh di istana Fir\'aun.','Setelah dewasa ia lari ke Madyan, menikah, dan dalam perjalanan pulang Allah berbicara langsung kepadanya di lembah Thuwa serta mengutusnya kepada Fir\'aun bersama Harun.','Fir\'aun menolak. Para penyihirnya justru beriman setelah tongkat Musa menelan sihir mereka. Musa membawa Bani Israil keluar dari Mesir. Laut terbelah untuk mereka, lalu menenggelamkan Fir\'aun dan bala tentaranya.','Di Bukit Thur, Musa menerima Taurat.'],
keut:['Allah berbicara langsung kepadanya (QS An-Nisa: 164)','Tongkat menjadi ular; tangan bercahaya putih (QS Thaha: 17–22)','Laut terbelah (QS Asy-Syu\'ara: 63)','Dua belas mata air dari batu (QS Al-Baqarah: 60)','Diberi sembilan mukjizat yang nyata (QS Al-Isra: 101)'],ref:'QS Thaha: 9–98; Al-Qashash: 3–46; Asy-Syu\'ara: 10–68'},
{id:'harun',cat:'nabi',n:'Nabi Harun',ar:'هَارُون',g:'Saudara dan pendamping Musa',tempat:'Mesir dan Sinai',masa:'Sezaman dengan Musa',
k:['Musa berdoa agar Harun yang lebih fasih lidahnya dijadikan pembantunya, dan Allah mengabulkan.','Ketika Musa pergi ke Bukit Thur, Samiri menyesatkan Bani Israil dengan patung anak sapi. Harun menasihati mereka, tetapi mereka tidak mau mendengar sampai Musa kembali.'],
keut:['Diangkat menjadi nabi atas doa Musa (QS Maryam: 53)','Fasih lisannya (QS Al-Qashash: 34)','Kedudukan Ali bagi Nabi ﷺ diumpamakan seperti Harun bagi Musa (HR. Bukhari & Muslim)'],ref:'QS Thaha: 29–36, 90–94; Al-Qashash: 34–35'},
{id:'dzulkifli',cat:'nabi',n:'Nabi Dzulkifli',ar:'ذُو الْكِفْل',g:'Termasuk orang-orang sabar',tempat:'Tidak pasti. Sebagian riwayat mengaitkan dengan Al-Kifl di Irak.',masa:'Tidak diketahui',
k:['Al-Qur\'an menyebut Dzulkifli bersama Ismail dan Idris sebagai orang-orang yang sabar dan termasuk orang-orang pilihan.','Rincian kisahnya tidak disebut dalam Al-Qur\'an maupun hadis sahih. Kisah-kisah populer tentangnya bersumber dari riwayat yang tidak kuat. Sebagian ulama bahkan berbeda pendapat apakah beliau nabi atau orang saleh, tetapi mayoritas menyebutnya nabi.'],
keut:['Termasuk orang-orang sabar (QS Al-Anbiya: 85)','Termasuk orang-orang terbaik (QS Shad: 48)'],ref:'QS Al-Anbiya: 85–86; Shad: 48'},
{id:'daud',cat:'nabi',n:'Nabi Daud',ar:'دَاوُد',g:'Raja dan nabi; penerima Zabur',tempat:'Palestina, Baitul Maqdis',masa:'Perkiraan ±1000 SM',
k:['Saat masih muda, Daud ikut dalam pasukan Thalut dan membunuh Jalut (Goliat), panglima musuh yang perkasa.','Allah memberinya kerajaan dan hikmah. Ia memerintah dengan adil, beribadah dengan tekun, dan berpuasa sehari lalu berbuka sehari.','Allah menundukkan gunung-gunung dan burung untuk bertasbih bersamanya, serta melunakkan besi baginya untuk membuat baju besi.'],
keut:['Menerima kitab Zabur (QS An-Nisa: 163)','Gunung dan burung bertasbih bersamanya (QS Saba: 10)','Besi lunak di tangannya (QS Saba: 10–11)','Puasa Daud adalah puasa sunnah yang paling dicintai Allah (HR. Bukhari & Muslim)','Makan dari hasil kerja tangannya sendiri (HR. Bukhari)'],ref:'QS Al-Baqarah: 251; Saba: 10–11; Shad: 17–26'},
{id:'sulaiman',cat:'nabi',n:'Nabi Sulaiman',ar:'سُلَيْمَان',g:'Raja dengan kerajaan yang tak tertandingi',tempat:'Baitul Maqdis (Palestina); kisah Ratu Saba\' (Yaman)',masa:'Putra Daud; perkiraan ±abad 10 SM',
k:['Sulaiman mewarisi kenabian dan kerajaan Daud. Ia berdoa agar diberi kerajaan yang tidak dimiliki siapa pun sesudahnya, dan Allah mengabulkan.','Ia memahami bahasa burung dan semut. Ketika seekor semut memperingatkan kawan-kawannya agar tidak terinjak, Sulaiman tersenyum dan bersyukur.','Burung hud-hud membawa kabar tentang Ratu Balqis dari Saba\' yang menyembah matahari. Lewat surat dan mukjizat singgasana yang dipindahkan dalam sekejap, Balqis akhirnya berserah diri kepada Allah.'],
keut:['Kerajaan yang tak tertandingi (QS Shad: 35)','Memahami bahasa burung dan binatang (QS An-Naml: 16–19)','Angin tunduk kepadanya; jin bekerja untuknya (QS Saba: 12–13)','Kisah ajakan tauhid kepada Ratu Saba\' (QS An-Naml: 20–44)'],ref:'QS An-Naml: 15–44; Saba: 12–14; Shad: 30–40'},
{id:'ilyas',cat:'nabi',n:'Nabi Ilyas',ar:'إِلْيَاس',g:'Penentang penyembahan Ba\'l',tempat:'Syam; dikaitkan dengan Ba\'labak (Lebanon kini)',masa:'Setelah Sulaiman (riwayat)',
k:['Kaum Ilyas menyembah berhala bernama Ba\'l. Ilyas bertanya kepada mereka: "Patutkah kalian menyembah Ba\'l dan meninggalkan sebaik-baik Pencipta?"','Sebagian besar kaumnya mendustakannya, kecuali hamba-hamba Allah yang ikhlas.'],
keut:['Salam Allah atasnya: "Salamun \'ala Ilyasin" (QS Ash-Shaffat: 130)','Termasuk orang-orang saleh (QS Al-An\'am: 85)'],ref:'QS Ash-Shaffat: 123–132; Al-An\'am: 85'},
{id:'ilyasa',cat:'nabi',n:'Nabi Ilyasa\'',ar:'الْيَسَع',g:'Penerus dakwah Ilyas',tempat:'Syam (Palestina)',masa:'Setelah Ilyas (riwayat)',
k:['Menurut riwayat, Ilyasa\' adalah murid dan penerus Ilyas dalam berdakwah kepada Bani Israil.','Al-Qur\'an menyebutnya di antara para nabi yang dilebihkan derajatnya, tetapi tanpa rincian kisah.'],
keut:['Dilebihkan di atas umat pada masanya (QS Al-An\'am: 86)','Termasuk orang-orang terbaik (QS Shad: 48)'],ref:'QS Al-An\'am: 86; Shad: 48'},
{id:'yunus',cat:'nabi',n:'Nabi Yunus',ar:'يُونُس',g:'Dzun Nun (pemilik ikan)',tempat:'Ninawa (dekat Mosul, Irak)',masa:'Perkiraan ±abad 8 SM (tidak pasti)',
k:['Yunus diutus ke Ninawa. Karena kaumnya tidak kunjung beriman, ia pergi dalam keadaan marah sebelum ada izin Allah.','Ia menaiki kapal, lalu diundi dan dilemparkan ke laut. Seekor ikan besar menelannya.','Di dalam kegelapan perut ikan ia berdoa: "La ilaha illa anta, subhanaka inni kuntu minazh-zhalimin." Allah menyelamatkannya. Ia dimuntahkan ke daratan, lalu kembali kepada kaumnya yang ternyata telah beriman, lebih dari seratus ribu orang.'],
keut:['Selamat dari perut ikan (QS Ash-Shaffat: 139–146)','Doa Dzun Nun: tidaklah seorang muslim berdoa dengannya melainkan dikabulkan (HR. Tirmidzi)','Satu-satunya kaum yang taubatnya diterima ketika azab sudah mendekat (QS Yunus: 98)'],ref:'QS Yunus: 98; Al-Anbiya: 87–88; Ash-Shaffat: 139–148'},
{id:'zakaria',cat:'nabi',n:'Nabi Zakaria',ar:'زَكَرِيَّا',g:'Pengasuh Maryam',tempat:'Baitul Maqdis (Palestina)',masa:'Menjelang kelahiran Nabi Isa (±abad 1 SM)',
k:['Zakaria mengasuh Maryam di mihrab. Ia heran mendapati rezeki di sisi Maryam, yang menjawab bahwa rezeki itu dari Allah.','Melihat itu, Zakaria yang sudah tua dan istrinya mandul berdoa dengan suara lirih memohon keturunan yang saleh. Allah mengabarkan kelahiran Yahya. Tandanya, Zakaria tidak dapat berbicara selama tiga hari kecuali dengan isyarat.'],
keut:['Doanya dikabulkan meski sudah sangat tua (QS Maryam: 2–11)','Bekerja sebagai tukang kayu (HR. Muslim)'],ref:'QS Ali Imran: 37–41; Maryam: 2–15; Al-Anbiya: 89–90'},
{id:'yahya',cat:'nabi',n:'Nabi Yahya',ar:'يَحْيَى',g:'Pembenar kalimat Allah (Isa)',tempat:'Palestina',masa:'Sezaman dengan Isa',
k:['Yahya diberi hikmah sejak kanak-kanak. Ia sangat berbakti kepada orang tua, penuh kasih, suci, dan bertakwa.','Ia membenarkan kedatangan Isa. Menurut riwayat sejarah, beliau wafat dibunuh oleh penguasa zalim di zamannya.'],
keut:['Nama yang belum pernah diberikan kepada siapa pun sebelumnya (QS Maryam: 7)','Diberi hikmah sejak kecil (QS Maryam: 12)','"Pemimpin, menahan diri dari hawa nafsu, dan nabi dari orang saleh" (QS Ali Imran: 39)','Salam Allah atasnya pada hari lahir, wafat, dan dibangkitkan (QS Maryam: 15)'],ref:'QS Ali Imran: 39; Maryam: 7–15'},
{id:'isa',cat:'nabi',n:'Nabi Isa',ar:'عِيسَى',g:'Al-Masih; Ruhullah; Ulul Azmi; penerima Injil',tempat:'Lahir di Baitlahm (Betlehem), berdakwah di Palestina',masa:'Awal tarikh Masehi',
k:['Malaikat mengabarkan kepada Maryam bahwa ia akan melahirkan seorang putra tanpa ayah. Maryam melahirkan Isa di bawah pohon kurma.','Ketika kaumnya menuduh Maryam, bayi Isa berbicara dalam buaian: "Sesungguhnya aku hamba Allah, Dia memberiku Kitab dan menjadikanku nabi."','Isa menyeru Bani Israil kepada tauhid dengan mukjizat-mukjizat yang nyata. Para hawariyyun menjadi pengikut setianya.','Ketika hendak dibunuh, Allah menyelamatkan dan mengangkatnya. Ia tidak dibunuh dan tidak disalib. Menurut hadis sahih, ia akan turun kembali di akhir zaman.'],
keut:['Lahir tanpa ayah dan berbicara dalam buaian (QS Maryam: 16–33)','Dengan izin Allah: membentuk burung dari tanah lalu hidup, menyembuhkan orang buta dan berpenyakit sopak, menghidupkan orang mati (QS Ali Imran: 49)','Hidangan dari langit (QS Al-Ma\'idah: 112–115)','Diangkat ke sisi Allah (QS An-Nisa: 157–158)'],ref:'QS Ali Imran: 42–59; Maryam: 16–36; Al-Ma\'idah: 110–118'},
{id:'muhammad',cat:'nabi',n:'Nabi Muhammad ﷺ',ar:'مُحَمَّد ﷺ',g:'Khatamun Nabiyyin; rahmat bagi semesta alam',tempat:'Lahir dan diutus di Makkah; hijrah dan wafat di Madinah',masa:'571–632 M (lahir Tahun Gajah; wafat 11 H)',
k:['Lahir di Makkah pada Tahun Gajah (±571 M) dalam keadaan yatim. Ia diasuh kakeknya, Abdul Muthalib, lalu pamannya, Abu Thalib. Ia dikenal jujur sehingga digelari Al-Amin, dan menikah dengan Khadijah pada usia 25 tahun.','Pada usia 40 tahun (610 M), ketika menyendiri di Gua Hira, ia menerima wahyu pertama: "Iqra\'". Dakwah dimulai secara diam-diam, lalu terang-terangan, menghadapi penolakan keras Quraisy.','Pada 622 M ia hijrah ke Madinah (awal kalender Hijriah) dan membangun masyarakat Islam: Masjid Nabawi, persaudaraan Muhajirin–Anshar, dan Piagam Madinah. Terjadi perang Badar, Uhud, dan Khandaq, lalu Perjanjian Hudaibiyah.','Pada 8 H (630 M) Makkah ditaklukkan tanpa pertumpahan darah besar dan berhala dibersihkan dari Ka\'bah. Ia menunaikan Haji Wada\' pada 10 H dan wafat di Madinah pada 12 Rabi\'ul Awal 11 H (632 M).'],
keut:['Mukjizat terbesar: Al-Qur\'an yang terjaga (QS Al-Hijr: 9; Al-Isra: 88)','Isra\' Mi\'raj (QS Al-Isra: 1; An-Najm: 13–18)','Bulan terbelah (QS Al-Qamar: 1; HR. Bukhari & Muslim)','Air memancar dari sela jari-jarinya (HR. Bukhari)','Penutup para nabi (QS Al-Ahzab: 40) dan rahmat bagi semesta alam (QS Al-Anbiya: 107)','Pemilik syafa\'at agung di hari kiamat (HR. Bukhari & Muslim)'],ref:'Sirah Nabawiyah; QS Al-Alaq: 1–5; At-Taubah: 40; Al-Fath'},
/* ---------- NABI & TOKOH QUR'ANI LAIN ---------- */
{id:'syits',cat:'nabi2',n:'Nabi Syits',ar:'شِيث',g:'Putra Nabi Adam',tempat:'Tidak diketahui',masa:'Setelah Adam',
k:['Syits adalah putra Adam yang lahir setelah peristiwa Habil dan Qabil. Ia disebut sebagai penerus ajaran ayahnya.','Kenabiannya disebut dalam sebagian riwayat, termasuk hadis panjang Abu Dzar tentang jumlah nabi dan kitab. Banyak ulama hadis menilai riwayat itu lemah.'],
keut:['Menurut riwayat, menerima beberapa shuhuf (lembaran wahyu)'],ref:'Riwayat sejarah (Ibnu Katsir, Qashashul Anbiya)',note:'Status kenabian berdasarkan riwayat yang diperselisihkan kekuatannya.'},
{id:'yusya',cat:'nabi2',n:'Nabi Yusya\' bin Nun',ar:'يُوشَع بْن نُون',g:'Murid dan penerus Nabi Musa',tempat:'Sinai, lalu Palestina (Ariha/Yerikho)',masa:'Setelah wafatnya Musa',
k:['Banyak mufasir menyebut Yusya\' sebagai "pemuda" (fata) yang menemani Musa mencari Khidir (QS Al-Kahfi: 60–64).','Setelah masa tersesat 40 tahun di padang Tih, ia memimpin Bani Israil memasuki Tanah Suci.'],
keut:['Nabi ﷺ menceritakan seorang nabi yang berperang, lalu matahari ditahan agar tidak terbenam sampai kemenangan diraih (HR. Bukhari & Muslim). Dalam riwayat Ahmad, nabi itu disebut Yusya\' bin Nun.'],ref:'QS Al-Kahfi: 60–65 (menurut tafsir); HR. Bukhari & Muslim; HR. Ahmad'},
{id:'syamwil',cat:'nabi2',n:'Nabi Syamwil (Samuel)',ar:'شَمْوِيل',g:'Nabi yang mengangkat Thalut',tempat:'Palestina',masa:'Sebelum Daud',
k:['Al-Qur\'an menyebut para pemuka Bani Israil meminta kepada "nabi mereka" agar diangkat seorang raja untuk berperang. Menurut mufasir, nabi itu bernama Syamwil.','Allah mengangkat Thalut sebagai raja dengan tanda kembalinya Tabut. Dalam pasukan Thalut inilah Daud membunuh Jalut.'],
keut:['Kisahnya diabadikan dalam QS Al-Baqarah: 246–251'],ref:'QS Al-Baqarah: 246–251',note:'Namanya tidak disebut eksplisit dalam Al-Qur\'an; penamaan berasal dari mufasir.'},
{id:'khidir',cat:'nabi2',n:'Khidir',ar:'الْخَضِر',g:'Hamba yang diberi ilmu dari sisi Allah',tempat:'Majma\'ul Bahrain (pertemuan dua laut); lokasinya diperselisihkan',masa:'Sezaman dengan Musa',
k:['Musa ingin belajar kepada seorang hamba Allah yang diberi ilmu khusus. Khidir menerima dengan syarat Musa tidak bertanya sampai ia sendiri yang menjelaskan.','Khidir melubangi perahu, membunuh seorang anak, dan menegakkan dinding yang hampir roboh tanpa upah. Musa tidak dapat menahan diri untuk bertanya.','Di akhir, Khidir menjelaskan hikmah di balik semua perbuatan itu: semuanya atas perintah Allah.'],
keut:['Diberi rahmat dan ilmu dari sisi Allah (QS Al-Kahfi: 65)','Pelajaran bahwa ilmu Allah meliputi hikmah yang tak tampak oleh manusia'],ref:'QS Al-Kahfi: 60–82; HR. Bukhari & Muslim',note:'Ulama berbeda pendapat apakah Khidir nabi atau wali; banyak ulama menguatkan bahwa ia nabi.'},
{id:'uzair',cat:'nabi2',n:'Uzair',ar:'عُزَيْر',g:'Tokoh Bani Israil',tempat:'Baitul Maqdis (Palestina)',masa:'Setelah kehancuran Baitul Maqdis (±abad 6–5 SM)',
k:['Namanya disebut dalam QS At-Taubah: 30 sebagai sosok yang dikultuskan sebagian orang Yahudi.','Banyak mufasir mengaitkannya dengan kisah QS Al-Baqarah: 259: seorang yang melewati negeri yang runtuh, lalu dimatikan Allah seratus tahun kemudian dihidupkan kembali, sementara makanannya tidak berubah dan keledainya menjadi tulang belulang.'],
keut:['Tanda kekuasaan Allah menghidupkan yang mati (QS Al-Baqarah: 259, menurut tafsir)'],ref:'QS At-Taubah: 30; Al-Baqarah: 259',note:'Nabi ﷺ bersabda tidak mengetahui apakah Uzair nabi atau bukan (HR. Abu Dawud, Hakim). Statusnya diperselisihkan.'},
{id:'dzulqarnain',cat:'nabi2',n:'Dzulqarnain',ar:'ذُو الْقَرْنَيْن',g:'Raja saleh yang menjelajah timur dan barat',tempat:'Menjelajah ke barat dan timur; lokasi dinding diperselisihkan',masa:'Tidak diketahui pasti',
k:['Allah memberinya kekuasaan dan sarana. Ia berjalan ke tempat terbenam matahari, lalu ke tempat terbit matahari, dan memimpin dengan adil.','Sebuah kaum mengadu tentang Ya\'juj dan Ma\'juj yang membuat kerusakan. Dzulqarnain membangun dinding dari besi dan tembaga cair tanpa meminta upah, lalu berkata: "Ini rahmat dari Tuhanku."'],
keut:['Teladan pemimpin yang adil dan rendah hati (QS Al-Kahfi: 83–98)'],ref:'QS Al-Kahfi: 83–98',note:'Identitas dan status kenabiannya diperselisihkan; jumhur memandangnya raja saleh.'},
{id:'luqman',cat:'nabi2',n:'Luqman Al-Hakim',ar:'لُقْمَان',g:'Orang bijak yang diberi hikmah',tempat:'Riwayat menyebut berasal dari Habasyah (Ethiopia/Nubia)',masa:'Tidak diketahui',
k:['Allah memberi Luqman hikmah. Nasihatnya kepada anaknya diabadikan dalam surah yang memakai namanya.','Nasihat itu meliputi: jangan menyekutukan Allah, berbakti kepada orang tua, Allah mengetahui segala sesuatu sekecil biji sawi, dirikan sholat, amar ma\'ruf nahi munkar, sabar, tidak sombong, dan merendahkan suara.'],
keut:['Diberi hikmah oleh Allah (QS Luqman: 12)','Nasihat pendidikan anak yang abadi (QS Luqman: 13–19)'],ref:'QS Luqman: 12–19',note:'Jumhur ulama: Luqman orang saleh yang bijak, bukan nabi.'},
{id:'daniyal',cat:'nabi2',n:'Daniyal',ar:'دَانْيَال',g:'Tokoh saleh Bani Israil',tempat:'Babilonia; jasadnya menurut atsar ditemukan di Tustar (Persia)',masa:'Masa pembuangan Bani Israil ke Babilonia (±abad 6 SM)',
k:['Daniyal tidak disebut dalam Al-Qur\'an. Atsar menyebut bahwa pada masa Umar bin Khattab, kaum muslimin yang menaklukkan Tustar menemukan jasad seorang laki-laki yang masih utuh, yang disebut Daniyal.','Umar memerintahkan agar ia dimakamkan di tempat tersembunyi supaya tidak dikultuskan.'],
keut:['Pelajaran tentang menjaga tauhid: menutup jalan pengkultusan makam'],ref:'Atsar dalam Mushannaf Ibnu Abi Syaibah; Al-Bidayah wan Nihayah',note:'Status kenabian berdasarkan riwayat, tidak disebut Al-Qur\'an.'},
{id:'maryam',cat:'nabi2',n:'Maryam binti Imran',ar:'مَرْيَم',g:'Wanita pilihan; ibunda Nabi Isa',tempat:'Baitul Maqdis dan Baitlahm (Palestina)',masa:'Menjelang awal Masehi',
k:['Sejak dalam kandungan, ibunya menazarkan Maryam untuk berkhidmat di Baitul Maqdis. Ia diasuh Zakaria dan selalu mendapat rezeki dari Allah di mihrabnya.','Malaikat Jibril mengabarkan bahwa ia akan melahirkan Isa tanpa disentuh laki-laki. Ia bersabar menghadapi tuduhan kaumnya hingga bayinya sendiri yang membelanya.'],
keut:['Dipilih dan disucikan di atas wanita semesta alam (QS Ali Imran: 42)','Satu-satunya wanita yang namanya menjadi nama surah (Maryam)','Termasuk wanita terbaik: Maryam, Khadijah, Fatimah, Asiyah (HR. Tirmidzi, Ahmad)'],ref:'QS Ali Imran: 35–47; Maryam: 16–34',note:'Bukan nabi menurut jumhur; dimasukkan sebagai tokoh Qur\'ani.'},
{id:'kahfi',cat:'nabi2',n:'Ashabul Kahfi',ar:'أَصْحَابُ الْكَهْف',g:'Para pemuda penghuni gua',tempat:'Diperselisihkan; ada yang menyebut dekat Amman (Yordania) atau Efesus (Turki)',masa:'Diperselisihkan; sering dikaitkan dengan masa penguasa Romawi',
k:['Sekelompok pemuda beriman lari dari penguasa zalim yang memaksa mereka menyembah berhala. Mereka berlindung di sebuah gua bersama anjing mereka.','Allah menidurkan mereka selama 309 tahun. Ketika bangun, mereka mengira hanya tidur sehari. Kebangkitan mereka menjadi bukti kebenaran hari kebangkitan.'],
keut:['Teladan pemuda yang teguh dalam tauhid (QS Al-Kahfi: 13)','Tanda kekuasaan Allah atas kematian dan kebangkitan (QS Al-Kahfi: 21)'],ref:'QS Al-Kahfi: 9–26'},
/* ---------- SAHABAT ---------- */
{id:'abubakar',cat:'sahabat',n:'Abu Bakar Ash-Shiddiq',ar:'أَبُو بَكْر الصِّدِّيق',g:'Khalifah pertama; sahabat terdekat Nabi',tempat:'Makkah, Madinah',masa:'±573–634 M; khalifah 632–634 M (11–13 H)',
k:['Abu Bakar adalah laki-laki dewasa pertama yang masuk Islam. Ia memerdekakan budak-budak muslim yang disiksa, termasuk Bilal.','Ia langsung membenarkan peristiwa Isra\' Mi\'raj saat banyak orang meragukannya, sehingga digelari Ash-Shiddiq. Ia menemani Nabi ﷺ berhijrah dan bersembunyi di Gua Tsur.','Sebagai khalifah ia memerangi kaum murtad dan penolak zakat, serta memulai pengumpulan Al-Qur\'an dalam satu mushaf.'],
keut:['"Kedua dari dua orang ketika keduanya di dalam gua" (QS At-Taubah: 40)','Termasuk sepuluh sahabat yang dijamin surga (HR. Tirmidzi)','Orang yang paling dicintai Nabi ﷺ dari kalangan laki-laki (HR. Bukhari & Muslim)'],ref:'HR. Bukhari, Muslim; Tarikh Khulafa'},
{id:'umar',cat:'sahabat',n:'Umar bin Khattab',ar:'عُمَر بْن الْخَطَّاب',g:'Al-Faruq; khalifah kedua',tempat:'Makkah, Madinah; membebaskan Baitul Maqdis',masa:'±584–644 M; khalifah 634–644 M (13–23 H)',
k:['Umar semula penentang keras Islam, lalu masuk Islam setelah mendengar ayat-ayat Surah Thaha. Keislamannya memberi kekuatan besar bagi kaum muslimin.','Sebagai khalifah ia memperluas wilayah Islam ke Syam, Irak, Persia, dan Mesir. Ia menerima kunci Baitul Maqdis (±637–638 M) dan menetapkan kalender Hijriah.','Ia terkenal adil, sederhana, dan suka berkeliling malam memeriksa keadaan rakyat. Ia wafat syahid ditikam saat memimpin sholat Subuh.'],
keut:['Pembeda antara yang hak dan batil (Al-Faruq)','Beberapa pendapatnya dibenarkan wahyu (HR. Bukhari & Muslim)','Dijamin surga (HR. Tirmidzi)'],ref:'HR. Bukhari, Muslim; Tarikh Ath-Thabari'},
{id:'utsman',cat:'sahabat',n:'Utsman bin Affan',ar:'عُثْمَان بْن عَفَّان',g:'Dzun Nurain; khalifah ketiga',tempat:'Makkah, Madinah',masa:'±576–656 M; khalifah 644–656 M (23–35 H)',
k:['Utsman, saudagar kaya yang dermawan, menikahi dua putri Nabi ﷺ (Ruqayyah, lalu Ummu Kultsum), sehingga digelari Dzun Nurain (pemilik dua cahaya).','Ia membeli sumur Rumah untuk kaum muslimin dan membiayai pasukan Tabuk.','Sebagai khalifah ia menyatukan penulisan Al-Qur\'an dalam satu standar mushaf (Mushaf Utsmani) yang dipakai hingga kini. Ia wafat syahid di rumahnya saat membaca Al-Qur\'an.'],
keut:['Mushaf Utsmani menjaga keseragaman bacaan umat','Malaikat pun malu kepadanya (HR. Muslim)','Dijamin surga (HR. Tirmidzi)'],ref:'HR. Bukhari, Muslim'},
{id:'ali',cat:'sahabat',n:'Ali bin Abi Thalib',ar:'عَلِيّ بْن أَبِي طَالِب',g:'Khalifah keempat; menantu Nabi',tempat:'Makkah, Madinah, Kufah (Irak)',masa:'±600–661 M; khalifah 656–661 M (35–40 H)',
k:['Ali masuk Islam sejak kecil dan dibesarkan di rumah Nabi ﷺ. Pada malam hijrah ia tidur di ranjang Nabi untuk mengelabui kaum Quraisy.','Ia menikah dengan Fatimah Az-Zahra dan dikenal pemberani dalam perang Badar, Khandaq, dan Khaibar.','Ia terkenal luas ilmunya dan fasih. Ia wafat syahid di Kufah.'],
keut:['Panji Khaibar diberikan kepadanya: "orang yang mencintai Allah dan Rasul-Nya" (HR. Bukhari & Muslim)','Kedudukannya bagi Nabi seperti Harun bagi Musa (HR. Bukhari & Muslim)','Dijamin surga (HR. Tirmidzi)'],ref:'HR. Bukhari, Muslim'},
{id:'khadijah',cat:'sahabat',n:'Khadijah binti Khuwailid',ar:'خَدِيجَة',g:'Ummul Mukminin; orang pertama yang beriman',tempat:'Makkah',masa:'±555–619 M',
k:['Khadijah adalah saudagar wanita terhormat di Makkah. Ia menikah dengan Muhammad ﷺ yang saat itu berusia 25 tahun.','Ketika wahyu pertama turun, ia yang menenangkan Nabi dan menjadi orang pertama yang beriman. Hartanya ia korbankan untuk dakwah.','Ia wafat pada tahun ke-10 kenabian, yang dikenal sebagai Tahun Duka (\'Amul Huzn).'],
keut:['Allah menyampaikan salam kepadanya melalui Jibril (HR. Bukhari & Muslim)','Dikabarkan mendapat rumah di surga dari mutiara (HR. Bukhari)','Termasuk wanita terbaik di dunia (HR. Bukhari & Muslim)'],ref:'HR. Bukhari, Muslim'},
{id:'aisyah',cat:'sahabat',n:'Aisyah binti Abu Bakar',ar:'عَائِشَة',g:'Ummul Mukminin; guru para sahabat',tempat:'Makkah, Madinah',masa:'±613–678 M',
k:['Aisyah adalah putri Abu Bakar dan istri Nabi ﷺ. Ia sangat cerdas dan kuat hafalannya.','Ia meriwayatkan lebih dari dua ribu hadis dan menjadi rujukan para sahabat dalam fikih, terutama tentang kehidupan rumah tangga Nabi.','Kesuciannya dari fitnah (haditsul ifki) dibela langsung oleh Al-Qur\'an.'],
keut:['Kesuciannya ditegaskan dalam QS An-Nur: 11–20','Keutamaannya atas wanita lain seperti keutamaan tsarid atas makanan lain (HR. Bukhari & Muslim)'],ref:'HR. Bukhari, Muslim; QS An-Nur: 11–20'},
{id:'fatimah',cat:'sahabat',n:'Fatimah Az-Zahra',ar:'فَاطِمَة الزَّهْرَاء',g:'Putri Rasulullah; pemimpin wanita surga',tempat:'Makkah, Madinah',masa:'±605–632 M (wafat beberapa bulan setelah Nabi ﷺ)',
k:['Fatimah adalah putri bungsu Nabi ﷺ dan Khadijah. Ia menikah dengan Ali bin Abi Thalib dan melahirkan Hasan dan Husain.','Ia hidup sederhana. Nabi ﷺ mengajarinya dzikir tasbih, tahmid, dan takbir sebelum tidur sebagai ganti pembantu yang ia minta.'],
keut:['Pemimpin wanita penghuni surga (HR. Bukhari)','"Fatimah bagian dariku" (HR. Bukhari & Muslim)'],ref:'HR. Bukhari, Muslim'},
{id:'hamzah',cat:'sahabat',n:'Hamzah bin Abdul Muthalib',ar:'حَمْزَة',g:'Asadullah; Sayyidus Syuhada',tempat:'Makkah, Madinah; gugur di Uhud',masa:'Wafat 3 H (625 M)',
k:['Hamzah adalah paman Nabi ﷺ. Ia masuk Islam karena membela keponakannya yang dihina Abu Jahal.','Ia menjadi pahlawan Badar, lalu gugur syahid dalam Perang Uhud. Makamnya berada di kaki Jabal Uhud, Madinah.'],
keut:['Digelari Singa Allah dan pemimpin para syuhada (HR. Hakim)'],ref:'Sirah Nabawiyah'},
{id:'bilal',cat:'sahabat',n:'Bilal bin Rabah',ar:'بِلَال بْن رَبَاح',g:'Muadzin pertama dalam Islam',tempat:'Makkah, Madinah, wafat di Damaskus',masa:'Wafat ±20 H (±640 M)',
k:['Bilal adalah budak dari Habasyah. Ia disiksa di bawah terik matahari dengan batu besar di dadanya, tetapi terus mengucap "Ahad, Ahad".','Abu Bakar memerdekakannya. Di Madinah, Nabi ﷺ memilihnya mengumandangkan adzan karena suaranya yang merdu.'],
keut:['Nabi ﷺ mendengar suara terompahnya di surga (HR. Bukhari & Muslim)','Lambang kesetaraan dalam Islam: mantan budak menjadi muadzin Rasulullah'],ref:'HR. Bukhari, Muslim'},
{id:'mushab',cat:'sahabat',n:'Mush\'ab bin Umair',ar:'مُصْعَب بْن عُمَيْر',g:'Duta Islam pertama',tempat:'Makkah, Madinah; gugur di Uhud',masa:'Wafat 3 H (625 M)',
k:['Mush\'ab adalah pemuda kaya dan terpandang di Makkah. Ia meninggalkan kemewahan demi Islam.','Nabi ﷺ mengutusnya ke Madinah (Yatsrib) untuk mengajarkan Islam. Berkat dakwahnya, banyak penduduk Madinah masuk Islam sebelum hijrah.','Ia gugur di Uhud sebagai pembawa panji. Kain kafannya tidak cukup menutup seluruh tubuhnya.'],
keut:['Duta dakwah pertama dalam Islam','Teladan pengorbanan harta dan jiwa (HR. Bukhari)'],ref:'HR. Bukhari; Sirah Nabawiyah'},
{id:'abdurrahman',cat:'sahabat',n:'Abdurrahman bin Auf',ar:'عَبْد الرَّحْمٰن بْن عَوْف',g:'Saudagar dermawan',tempat:'Makkah, Madinah',masa:'Wafat ±32 H (±652 M)',
k:['Saat hijrah ia meninggalkan seluruh hartanya. Saudara Anshar-nya, Sa\'ad bin Rabi\', menawarkan separuh harta, tetapi ia hanya meminta ditunjukkan pasar.','Ia kembali sukses berdagang dan menyedekahkan harta dalam jumlah sangat besar untuk jihad dan kaum muslimin.'],
keut:['Termasuk sepuluh sahabat yang dijamin surga (HR. Tirmidzi)','Teladan kemandirian dan kedermawanan'],ref:'HR. Bukhari; HR. Tirmidzi'},
{id:'khalid',cat:'sahabat',n:'Khalid bin Walid',ar:'خَالِد بْن الْوَلِيد',g:'Saifullah (Pedang Allah)',tempat:'Makkah, Madinah, Syam; wafat di Homs (Suriah)',masa:'Wafat 21 H (642 M)',
k:['Sebelum masuk Islam, Khalid adalah panglima Quraisy di Uhud. Ia masuk Islam sekitar 8 H.','Ia menyelamatkan pasukan muslim di Perang Mu\'tah dan memimpin kemenangan besar di Yarmuk (636 M).','Ia tidak pernah kalah dalam pertempuran besar, tetapi wafat di atas ranjangnya.'],
keut:['Digelari Pedang Allah oleh Nabi ﷺ (HR. Bukhari)'],ref:'HR. Bukhari; Tarikh'},
{id:'salman',cat:'sahabat',n:'Salman Al-Farisi',ar:'سَلْمَان الْفَارِسِيّ',g:'Pencari kebenaran dari Persia',tempat:'Persia (Isfahan), Syam, Madinah; wafat di Mada\'in (Irak)',masa:'Wafat ±33–36 H (±654–656 M)',
k:['Salman lahir dari keluarga Majusi di Persia. Ia berpindah dari satu guru ke guru lain mencari kebenaran, hingga diperbudak dan dibawa ke Madinah.','Ia mengenali tanda-tanda kenabian pada Muhammad ﷺ lalu masuk Islam. Para sahabat membantunya memerdekakan diri.','Dalam Perang Khandaq (5 H), ia mengusulkan penggalian parit, strategi yang belum dikenal bangsa Arab.'],
keut:['"Salman termasuk keluarga kami, ahlul bait" (HR. Hakim; derajat diperselisihkan)','Teladan kesungguhan mencari kebenaran'],ref:'HR. Ahmad (kisah keislaman Salman)'},
{id:'abuubaidah',cat:'sahabat',n:'Abu Ubaidah bin Al-Jarrah',ar:'أَبُو عُبَيْدَة',g:'Kepercayaan umat ini',tempat:'Makkah, Madinah, Syam; wafat karena wabah \'Amwas',masa:'Wafat 18 H (639 M)',
k:['Abu Ubaidah termasuk yang awal masuk Islam. Ia memimpin pasukan pembebasan Syam.','Ketika wabah tha\'un \'Amwas melanda Syam, ia tetap bersama pasukannya dan wafat karena wabah itu.'],
keut:['"Setiap umat punya orang kepercayaan, dan kepercayaan umat ini adalah Abu Ubaidah" (HR. Bukhari & Muslim)','Dijamin surga (HR. Tirmidzi)'],ref:'HR. Bukhari, Muslim'},
{id:'saad',cat:'sahabat',n:'Sa\'ad bin Abi Waqqash',ar:'سَعْد بْن أَبِي وَقَّاص',g:'Pemanah pertama di jalan Allah',tempat:'Makkah, Madinah, Irak',masa:'Wafat ±55 H (±675 M)',
k:['Sa\'ad masuk Islam pada usia muda. Ia tetap teguh meski ibunya mogok makan agar ia murtad.','Ia memimpin kemenangan di Qadisiyah (636 M) dan pembebasan Mada\'in, ibu kota Persia.'],
keut:['Nabi ﷺ mendoakan agar doanya dikabulkan (HR. Tirmidzi)','Dijamin surga (HR. Tirmidzi)'],ref:'HR. Tirmidzi; HR. Muslim'},
{id:'abuhurairah',cat:'sahabat',n:'Abu Hurairah',ar:'أَبُو هُرَيْرَة',g:'Perawi hadis terbanyak',tempat:'Yaman (Daus), Madinah',masa:'Wafat ±57–59 H (±678 M)',
k:['Abu Hurairah masuk Islam sekitar tahun 7 H dan selalu menyertai Nabi ﷺ, tinggal bersama ahlus shuffah.','Ia meriwayatkan lebih dari 5.000 hadis. Nabi ﷺ pernah mendoakan kekuatan hafalannya.'],
keut:['Doa Nabi ﷺ sehingga ia tidak lupa apa yang didengarnya (HR. Bukhari)'],ref:'HR. Bukhari'},
{id:'ibnuabbas',cat:'sahabat',n:'Abdullah bin Abbas',ar:'عَبْد اللّٰه بْن عَبَّاس',g:'Turjumanul Qur\'an (penafsir Al-Qur\'an)',tempat:'Makkah, Madinah; wafat di Thaif',masa:'±619–687 M',
k:['Ibnu Abbas adalah sepupu Nabi ﷺ. Ia masih remaja ketika Nabi wafat, tetapi tekun belajar kepada para sahabat senior.','Ia menjadi rujukan utama tafsir Al-Qur\'an dan fikih, dan Umar sering mengajaknya bermusyawarah bersama para sahabat senior.'],
keut:['Didoakan Nabi ﷺ: "Ya Allah, pahamkan dia dalam agama dan ajarkan takwil" (HR. Bukhari & Ahmad)'],ref:'HR. Bukhari'},
/* ---------- TOKOH ---------- */
{id:'umarabdulaziz',cat:'tokoh',n:'Umar bin Abdul Aziz',ar:'عُمَر بْن عَبْد الْعَزِيز',g:'Khalifah yang adil',tempat:'Madinah, Damaskus',masa:'682–720 M; khalifah 717–720 M',
k:['Umar adalah khalifah Bani Umayyah yang hidup sangat sederhana setelah menjabat. Ia mengembalikan harta yang diambil secara zalim ke baitul mal.','Dalam masa pemerintahan sekitar dua setengah tahun, kesejahteraan merata hingga sulit menemukan penerima zakat di beberapa wilayah.','Ia memerintahkan pembukuan hadis secara resmi.'],
keut:['Sering disebut khalifah rasyidah kelima karena keadilannya','Perintis kodifikasi hadis'],ref:'Siyar A\'lamin Nubala; Tarikh'},
{id:'abuhanifah',cat:'tokoh',n:'Imam Abu Hanifah',ar:'أَبُو حَنِيفَة',g:'Pendiri mazhab Hanafi',tempat:'Kufah dan Baghdad (Irak)',masa:'80–150 H (699–767 M)',
k:['Nama aslinya An-Nu\'man bin Tsabit. Ia seorang pedagang kain yang jujur sekaligus ahli fikih.','Ia terkenal dengan metode qiyas dan ra\'yu. Ia menolak jabatan hakim dari penguasa hingga dipenjara.'],
keut:['Mazhabnya banyak diikuti di Turki, Asia Tengah, dan Asia Selatan'],ref:'Tarikh Baghdad'},
{id:'malik',cat:'tokoh',n:'Imam Malik bin Anas',ar:'مَالِك بْن أَنَس',g:'Imam Darul Hijrah',tempat:'Madinah',masa:'93–179 H (711–795 M)',
k:['Imam Malik hampir seluruh hidupnya tinggal di Madinah. Karena hormat kepada Nabi ﷺ, ia tidak menunggang kendaraan di kota itu.','Ia menyusun Al-Muwaththa\', salah satu kitab hadis dan fikih tertua.'],
keut:['Al-Muwaththa\'; mazhab Maliki banyak diikuti di Afrika Utara dan Barat'],ref:'Siyar A\'lamin Nubala'},
{id:'syafii',cat:'tokoh',n:'Imam Syafi\'i',ar:'الشَّافِعِيّ',g:'Pendiri mazhab Syafi\'i; peletak ushul fikih',tempat:'Lahir di Gaza; belajar di Makkah dan Madinah; wafat di Mesir',masa:'150–204 H (767–820 M)',
k:['Muhammad bin Idris Asy-Syafi\'i hafal Al-Qur\'an pada usia tujuh tahun dan belajar kepada Imam Malik.','Ia menyusun Ar-Risalah, kitab pertama yang menyusun ilmu ushul fikih secara sistematis.','Mazhab Syafi\'i menjadi mazhab yang paling banyak dianut di Indonesia dan Asia Tenggara.'],
keut:['Peletak dasar ushul fikih (Ar-Risalah)','Mazhab utama umat Islam Indonesia'],ref:'Manaqib Asy-Syafi\'i'},
{id:'ahmad',cat:'tokoh',n:'Imam Ahmad bin Hanbal',ar:'أَحْمَد بْن حَنْبَل',g:'Imam Ahlus Sunnah',tempat:'Baghdad (Irak)',masa:'164–241 H (780–855 M)',
k:['Imam Ahmad adalah murid Imam Syafi\'i dan penyusun Al-Musnad yang memuat puluhan ribu hadis.','Ia dipenjara dan dicambuk dalam peristiwa mihnah karena teguh menyatakan Al-Qur\'an adalah kalamullah, bukan makhluk.'],
keut:['Keteguhan menjaga akidah','Musnad Ahmad; mazhab Hanbali'],ref:'Siyar A\'lamin Nubala'},
{id:'bukhari',cat:'tokoh',n:'Imam Bukhari',ar:'الْبُخَارِيّ',g:'Amirul Mukminin dalam hadis',tempat:'Lahir di Bukhara (Uzbekistan); wafat di Khartank dekat Samarkand',masa:'194–256 H (810–870 M)',
k:['Muhammad bin Isma\'il Al-Bukhari berkelana ke berbagai negeri mengumpulkan hadis sejak muda.','Ia menyusun Shahih Al-Bukhari selama sekitar 16 tahun dengan syarat periwayatan yang sangat ketat.'],
keut:['Shahih Al-Bukhari: kitab hadis paling sahih menurut mayoritas ulama'],ref:'Hadyus Sari (Ibnu Hajar)'},
{id:'shalahuddin',cat:'tokoh',n:'Shalahuddin Al-Ayyubi',ar:'صَلَاح الدِّين الْأَيُّوبِيّ',g:'Pembebas Baitul Maqdis',tempat:'Lahir di Tikrit (Irak); Mesir, Syam; wafat di Damaskus',masa:'1137/1138–1193 M',
k:['Shalahuddin menyatukan Mesir dan Syam, lalu mengalahkan pasukan Salib di Hattin (1187).','Ia membebaskan Baitul Maqdis pada 1187 tanpa pembantaian, berbeda dengan peristiwa 1099.','Ia terkenal ksatria, bahkan di mata lawannya.'],
keut:['Teladan kepemimpinan yang adil dan berakhlak dalam perang'],ref:'Sejarah Perang Salib'},
{id:'alfatih',cat:'tokoh',n:'Sultan Muhammad Al-Fatih',ar:'مُحَمَّد الْفَاتِح',g:'Penakluk Konstantinopel',tempat:'Edirne dan Istanbul (Turki)',masa:'1432–1481 M',
k:['Pada usia 21 tahun, Sultan Utsmani Mehmed II menaklukkan Konstantinopel (29 Mei 1453). Ia antara lain memindahkan kapal lewat darat ke Tanduk Emas.','Kota itu kemudian dikenal sebagai Istanbul dan menjadi pusat peradaban Islam selama berabad-abad.'],
keut:['Sering dikaitkan dengan hadis tentang penaklukan Konstantinopel (HR. Ahmad; derajat diperselisihkan)'],ref:'Sejarah Utsmani'},
{id:'ibnusina',cat:'tokoh',n:'Ibnu Sina',ar:'ابْن سِينَا',g:'Bapak kedokteran modern',tempat:'Lahir dekat Bukhara; wafat di Hamadan (Iran)',masa:'980–1037 M',
k:['Ibnu Sina menguasai banyak ilmu sejak muda dan menjadi dokter istana.','Karyanya, Al-Qanun fit Thibb, menjadi buku rujukan kedokteran di Eropa selama berabad-abad.'],
keut:['Warisan ilmu kedokteran dan filsafat'],ref:'Sejarah sains Islam',note:'Sebagian pandangan filsafatnya dikritik para ulama akidah.'},
{id:'ibnubattuta',cat:'tokoh',n:'Ibnu Battuta',ar:'ابْن بَطُّوطَة',g:'Penjelajah muslim terbesar',tempat:'Lahir di Tangier (Maroko); menjelajah Afrika, Asia, hingga Sumatra',masa:'1304–1368/1369 M',
k:['Ibnu Battuta berangkat haji pada usia 21 tahun, lalu berkelana sekitar 29 tahun sejauh lebih dari 100.000 km.','Ia singgah di Kesultanan Samudera Pasai (Aceh) sekitar 1345–1346 dan mencatat sultannya sebagai penguasa yang alim dan gemar berdiskusi fikih mazhab Syafi\'i.'],
keut:['Catatan perjalanannya (Ar-Rihlah) menjadi bukti sejarah Islam di Nusantara'],ref:'Ar-Rihlah Ibnu Battuta'},
/* ---------- WALI SONGO ---------- */
{id:'malikibrahim',cat:'wali',n:'Sunan Gresik (Maulana Malik Ibrahim)',ar:'مَوْلَانَا مَالِك إِبْرَاهِيم',g:'Dianggap wali pertama di Jawa',tempat:'Gresik, Jawa Timur (makam di Gapura Wetan)',masa:'Wafat 822 H / 1419 M (tertulis di nisan)',
k:['Asal-usulnya diperselisihkan: ada yang menyebut Samarkand, Persia (Kashan), atau Campa. Ia tiba di pesisir Gresik pada akhir abad ke-14.','Ia berdakwah dengan cara yang dekat dengan rakyat: berdagang, mengobati orang sakit, dan mengajarkan cara bercocok tanam. Ia tidak menentang adat secara frontal.','Ia mendirikan tempat belajar agama yang menjadi cikal bakal pesantren di Jawa.'],
keut:['Perintis dakwah dengan pendekatan sosial-ekonomi','Makamnya salah satu bukti tertua Islam di Jawa Timur','Cerita tutur menyebut beliau tabib yang doanya mustajab (legenda masyarakat)'],ref:'Babad Tanah Jawi; nisan makam Gresik',note:'Kisah karomah wali bersumber dari cerita tutur dan babad, bukan dalil agama.'},
{id:'ampel',cat:'wali',n:'Sunan Ampel (Raden Rahmat)',ar:'رَادِين رَحْمَة',g:'Guru para wali',tempat:'Ampel Denta, Surabaya, Jawa Timur',masa:'±1401–1481 M',
k:['Raden Rahmat disebut berasal dari Campa dan datang ke Majapahit. Ia diberi tanah di Ampel Denta (Surabaya) dan mendirikan pesantren.','Muridnya antara lain Sunan Giri, Raden Patah (pendiri Demak), dan putra-putranya sendiri, Sunan Bonang dan Sunan Drajat.','Ia terkenal dengan ajaran "Moh Limo" (lima hal yang ditolak): moh main (berjudi), moh ngombe (mabuk), moh maling (mencuri), moh madat (candu), dan moh madon (berzina).'],
keut:['Pesantren Ampel Denta: pusat kaderisasi dai di Jawa','Berperan dalam berdirinya Kesultanan Demak','Masjid Ampel Surabaya masih ramai diziarahi'],ref:'Babad Tanah Jawi; tradisi pesantren',note:'Tahun lahir dan wafat adalah perkiraan.'},
{id:'giri',cat:'wali',n:'Sunan Giri (Raden Paku)',ar:'رَادِين فَاكُو',g:'Pendidik dan raja ulama Giri Kedaton',tempat:'Giri, Gresik, Jawa Timur',masa:'±1442–1506 M',
k:['Ia disebut putra Maulana Ishaq dan putri Blambangan. Menurut cerita, ia dihanyutkan ke laut dalam peti ketika bayi, lalu ditemukan dan diasuh Nyai Ageng Pinatih, saudagar Gresik.','Ia berguru kepada Sunan Ampel, lalu mendirikan pesantren di Bukit Giri yang kemudian menjadi Giri Kedaton.','Murid-muridnya menyebarkan Islam hingga Madura, Lombok, Kalimantan, Sulawesi, dan Maluku. Ia juga dikenal menciptakan permainan dan tembang anak bernuansa pendidikan.'],
keut:['Giri Kedaton menjadi pusat pendidikan Islam yang berpengaruh ke Indonesia timur','Dakwah lewat permainan anak dan tembang','Cerita tutur tentang bayi dalam peti yang selamat di laut (legenda)'],ref:'Babad Gresik; Babad Tanah Jawi',note:'Kisah karomah bersumber dari cerita tutur.'},
{id:'bonang',cat:'wali',n:'Sunan Bonang (Makdum Ibrahim)',ar:'مَخْدُوم إِبْرَاهِيم',g:'Wali seniman',tempat:'Tuban, Jawa Timur',masa:'±1465–1525 M',
k:['Putra Sunan Ampel. Ia berdakwah di Tuban dan pesisir utara Jawa.','Ia memakai gamelan, terutama alat musik bonang, dan tembang untuk menarik masyarakat. Tembang "Tombo Ati" sering dinisbatkan kepadanya.','Ia juga dikenal lewat karya sastra suluk, seperti Suluk Wujil.'],
keut:['Dakwah melalui seni musik dan sastra','Guru Sunan Kalijaga','Cerita tutur: mengubah buah aren menjadi emas di hadapan Raden Said (legenda tobatnya Sunan Kalijaga)'],ref:'Primbon Bonang; Babad Tanah Jawi',note:'Kisah karomah bersumber dari cerita tutur.'},
{id:'drajat',cat:'wali',n:'Sunan Drajat (Raden Qasim)',ar:'رَادِين قَاسِم',g:'Wali yang dermawan',tempat:'Paciran, Lamongan, Jawa Timur',masa:'±1470–1522 M',
k:['Putra Sunan Ampel. Ia dikenal karena kepedulian sosialnya kepada fakir miskin, yatim, dan orang sakit.','Ajarannya yang terkenal: "Wenehono teken marang wong kang wuto, wenehono mangan marang wong kang luwe, wenehono busono marang wong kang wudo, wenehono ngiyup marang wong kang kudanan" (beri tongkat orang buta, makan orang lapar, pakaian orang telanjang, dan tempat berteduh orang kehujanan).','Ia memakai gamelan Singo Mengkok dan tembang Pangkur dalam dakwah.'],
keut:['Teladan dakwah melalui kepedulian sosial','Ajaran kedermawanan yang masih dihafal masyarakat Jawa'],ref:'Tradisi Lamongan; Museum Sunan Drajat'},
{id:'kalijaga',cat:'wali',n:'Sunan Kalijaga (Raden Said)',ar:'رَادِين سَعِيد',g:'Wali budayawan',tempat:'Lahir di Tuban; berdakwah di Jawa Tengah; makam di Kadilangu, Demak',masa:'Lahir ±1450 M; wafat abad ke-16 (tahun pasti tidak diketahui)',
k:['Menurut cerita, Raden Said, putra Adipati Tuban, di masa muda merampok orang kaya untuk dibagikan kepada rakyat miskin sehingga dijuluki Brandal Lokajaya. Ia bertobat setelah bertemu Sunan Bonang.','Ia berdakwah lewat budaya Jawa: wayang kulit dengan lakon bernuansa Islam, tembang seperti "Lir-ilir" (sering dinisbatkan kepadanya), dan baju takwa.','Ia ikut membangun Masjid Agung Demak. Ia juga dikaitkan dengan tradisi Sekaten dan grebeg.'],
keut:['Dakwah yang merangkul budaya sehingga Islam diterima luas','Cerita tutur: "saka tatal" (tiang dari serpihan kayu) Masjid Agung Demak','Cerita tutur asal nama "Kalijaga": bertapa menjaga tongkat gurunya di tepi kali (legenda)'],ref:'Babad Tanah Jawi; Babad Demak',note:'Kisah karomah bersumber dari cerita tutur dan babad.'},
{id:'kudus',cat:'wali',n:'Sunan Kudus (Ja\'far Shadiq)',ar:'جَعْفَر صَادِق',g:'Waliyyul \'ilmi (wali ilmu)',tempat:'Kudus, Jawa Tengah',masa:'Wafat ±1550 M',
k:['Ia dikenal ahli fikih, tauhid, dan hadis, dan pernah menjadi senapati (panglima) Kesultanan Demak.','Ia mendirikan Masjid Al-Aqsa Menara Kudus. Inskripsi masjidnya bertarikh 956 H (±1549 M), dengan menara bergaya candi Hindu-Jawa.','Untuk menghormati umat Hindu, ia melarang pengikutnya menyembelih sapi. Hingga kini masyarakat Kudus banyak memakai daging kerbau.'],
keut:['Teladan toleransi dan dakwah yang menghormati keyakinan masyarakat','Masjid Menara Kudus: akulturasi arsitektur Islam dan Jawa'],ref:'Inskripsi Masjid Menara Kudus'},
{id:'muria',cat:'wali',n:'Sunan Muria (Raden Umar Said)',ar:'رَادِين عُمَر سَعِيد',g:'Wali rakyat pedesaan',tempat:'Gunung Muria, Kudus, Jawa Tengah',masa:'Abad ke-16 M',
k:['Putra Sunan Kalijaga. Ia memilih berdakwah di daerah pegunungan dan pedesaan, kepada petani, pedagang, dan nelayan.','Ia memakai tembang macapat seperti Sinom dan Kinanti (sering dinisbatkan kepadanya) dan mengajarkan keterampilan hidup.'],
keut:['Dakwah yang menjangkau masyarakat terpencil','Makamnya di puncak Gunung Muria ramai diziarahi'],ref:'Tradisi Kudus'},
{id:'gunungjati',cat:'wali',n:'Sunan Gunung Jati (Syarif Hidayatullah)',ar:'شَرِيف هِدَايَة اللّٰه',g:'Wali sekaligus sultan',tempat:'Cirebon, Jawa Barat; pengaruh hingga Banten',masa:'±1448–1568 M',
k:['Ibunya disebut putri Prabu Siliwangi (Pajajaran) dan ayahnya bangsawan Arab-Mesir. Ia belajar di Makkah, lalu kembali ke tanah Sunda.','Ia mendirikan Kesultanan Cirebon dan bersama putranya, Maulana Hasanuddin, merintis Kesultanan Banten.','Pada masanya, pasukan gabungan Demak–Cirebon merebut Sunda Kelapa dari Portugis (1527) dan menamainya Jayakarta, cikal bakal Jakarta.'],
keut:['Satu-satunya Wali Songo yang juga memimpin kesultanan','Penyebar Islam di tanah Sunda','Peran dalam berdirinya Jayakarta (1527)'],ref:'Babad Cirebon; Carita Purwaka Caruban Nagari',note:'Identifikasinya dengan Fatahillah diperselisihkan para sejarawan.'},
/* ---------- ISLAM DI NUSANTARA ---------- */
{id:'teori',cat:'nusantara',n:'Teori masuknya Islam',g:'Dari mana Islam datang?',tempat:'Seluruh Nusantara',masa:'Abad ke-7 hingga ke-13 M',
k:['Ada beberapa teori. Teori Gujarat (India) menyebut Islam datang abad ke-13 lewat pedagang India. Teori Arab/Makkah (dipopulerkan Buya Hamka) menyebut Islam sudah datang abad ke-7 lewat pedagang Arab. Teori Persia melihat kemiripan tradisi seperti peringatan 10 Muharram. Teori Cina menyoroti peran pedagang muslim Tionghoa.','Para sejarawan umumnya sepakat Islam masuk secara damai melalui perdagangan, pernikahan, pendidikan (pesantren), tasawuf, dan seni budaya.'],
keut:['Islam menyebar tanpa penaklukan militer besar','Akulturasi budaya membuat Islam mudah diterima'],ref:'Hamka, Sejarah Umat Islam; Azyumardi Azra, Jaringan Ulama'},
{id:'leran',cat:'nusantara',n:'Makam Fatimah binti Maimun',g:'Bukti tertua Islam di Jawa',tempat:'Leran, Gresik, Jawa Timur',masa:'475 H / 1082 M (tertulis di nisan)',
k:['Nisan berbahasa Arab ini menyebut wafatnya Fatimah binti Maimun bin Hibatullah pada 475 H (1082 M).','Temuan ini menunjukkan sudah ada komunitas muslim di pesisir Jawa pada abad ke-11, jauh sebelum era Wali Songo.'],
keut:['Salah satu nisan Islam tertua di Asia Tenggara'],ref:'Kajian epigrafi nisan Leran'},
{id:'pasai',cat:'nusantara',n:'Kesultanan Samudera Pasai',g:'Kerajaan Islam pertama di Nusantara',tempat:'Lhokseumawe, Aceh Utara',masa:'Abad ke-13 hingga ke-16 M; Sultan Malik As-Saleh wafat 696 H / 1297 M',
k:['Nisan Sultan Malik As-Saleh bertarikh 1297 M menjadi bukti kerajaan Islam tertua yang diketahui di Nusantara.','Marco Polo singgah di Perlak (Aceh) pada 1292 dan mencatat penduduk kotanya sudah memeluk Islam. Ibnu Battuta singgah di Pasai sekitar 1345–1346.','Pasai menjadi pusat perdagangan dan studi Islam bermazhab Syafi\'i, serta memakai mata uang emas (dirham).'],
keut:['Pusat penyebaran Islam ke Malaka dan Jawa','Bukti hubungan Nusantara dengan dunia Islam internasional'],ref:'Nisan Malik As-Saleh; Rihlah Ibnu Battuta; Hikayat Raja-raja Pasai'},
{id:'demak',cat:'nusantara',n:'Kesultanan Demak',g:'Kerajaan Islam pertama di Jawa',tempat:'Demak, Jawa Tengah',masa:'±1475–1548 M',
k:['Didirikan oleh Raden Patah, murid Sunan Ampel, ketika Majapahit melemah.','Masjid Agung Demak dibangun bersama para wali dan menjadi pusat dakwah Wali Songo.','Di bawah Sultan Trenggana, Demak meluaskan pengaruh ke Jawa Barat dan Jawa Timur serta melawan Portugis.'],
keut:['Masjid Agung Demak, salah satu masjid tertua di Indonesia','Basis politik dakwah Wali Songo'],ref:'Babad Demak; Babad Tanah Jawi'},
{id:'aceh',cat:'nusantara',n:'Kesultanan Aceh Darussalam',g:'Serambi Makkah',tempat:'Banda Aceh',masa:'1496–1903 M; puncak masa Sultan Iskandar Muda (1607–1636)',
k:['Aceh menjadi kekuatan besar di Selat Malaka setelah Malaka jatuh ke Portugis (1511), dan menjalin hubungan dengan Kesultanan Utsmani.','Aceh melahirkan ulama besar seperti Hamzah Fansuri, Nuruddin Ar-Raniri, dan Abdurrauf As-Singkili. As-Singkili menulis tafsir lengkap pertama dalam bahasa Melayu, Tarjuman Al-Mustafid.','Banyak jamaah haji Nusantara dahulu berangkat dari Aceh, sehingga dijuluki "Serambi Makkah".'],
keut:['Pusat ilmu Islam berbahasa Melayu','Perlawanan panjang terhadap penjajahan'],ref:'Hikayat Aceh; Azra, Jaringan Ulama'},
{id:'maluku',cat:'nusantara',n:'Ternate dan Tidore',g:'Islam di kepulauan rempah',tempat:'Maluku Utara',masa:'Abad ke-15 M; Sultan Zainal Abidin dari Ternate (±1486–1500)',

{id:'gowa',cat:'nusantara',n:'Gowa–Tallo (Makassar)',g:'Islam di Sulawesi Selatan',tempat:'Makassar, Sulawesi Selatan',masa:'Resmi memeluk Islam 1605 M',
k:['Tiga ulama asal Minangkabau, yaitu Datuk ri Bandang, Datuk ri Tiro, dan Datuk Patimang, berdakwah di Sulawesi Selatan.','Raja Tallo dan Raja Gowa (Sultan Alauddin) memeluk Islam pada 1605. Makassar kemudian menjadi pusat penyebaran Islam ke Bugis, Bima, dan Nusa Tenggara.','Sultan Hasanuddin (abad ke-17) dikenal sebagai "Ayam Jantan dari Timur" karena melawan VOC.'],

{id:'banten',cat:'nusantara',n:'Cirebon dan Banten',g:'Islam di tanah Sunda',tempat:'Cirebon dan Banten, Jawa Barat',masa:'Abad ke-15 hingga ke-19 M; Banten berdiri ±1527',
k:['Sunan Gunung Jati memimpin Cirebon. Putranya, Maulana Hasanuddin, menjadi sultan pertama Banten.','Banten menjadi pelabuhan lada internasional. Masjid Agung Banten dengan menaranya menjadi ikon kota.','Banten juga melahirkan ulama dunia, seperti Syaikh Nawawi Al-Bantani (1813–1897) yang mengajar di Masjidil Haram.'],
keut:['Jaringan ulama Nusantara di Makkah','Syaikh Nawawi Al-Bantani digelari Sayyidu Ulama\'il Hijaz'],ref:'Sejarah Banten; Azra'},
{id:'mataram',cat:'nusantara',n:'Kesultanan Mataram Islam',g:'Puncak Islam Jawa pedalaman',tempat:'Kotagede (Yogyakarta), lalu Kerta dan Plered',masa:'±1586–1755 M; Sultan Agung (1613–1645)',
k:['Mataram didirikan Panembahan Senopati. Puncaknya terjadi pada masa Sultan Agung, yang menyerang VOC di Batavia pada 1628 dan 1629.','Sultan Agung memadukan kalender Saka dengan kalender Hijriah menjadi kalender Jawa-Islam (1633 M).','Setelah Perjanjian Giyanti (1755), Mataram terbagi menjadi Kasunanan Surakarta dan Kesultanan Yogyakarta.'],

{id:'banjar',cat:'nusantara',n:'Kesultanan Banjar',g:'Islam di Kalimantan',tempat:'Banjarmasin, Kalimantan Selatan',masa:'Berdiri ±1526 M',

keut:['Kitab Sabilal Muhtadin karya Syaikh Arsyad Al-Banjari'],ref:'Hikayat Banjar'},
{id:'pergerakan',cat:'nusantara',n:'Ormas Islam dan perjuangan kemerdekaan',g:'Islam dan kebangkitan nasional',tempat:'Seluruh Indonesia',masa:'Awal abad ke-20 hingga 1945',
k:['Sarekat Islam berkembang pesat sejak 1912 sebagai gerakan rakyat. Muhammadiyah didirikan K.H. Ahmad Dahlan di Yogyakarta pada 18 November 1912. Nahdlatul Ulama didirikan K.H. Hasyim Asy\'ari di Surabaya pada 31 Januari 1926.','Para ulama dan santri ikut berjuang melawan penjajah. Pada 22 Oktober 1945, K.H. Hasyim Asy\'ari mencetuskan Resolusi Jihad yang menggerakkan pertempuran 10 November di Surabaya. Tanggal 22 Oktober kini diperingati sebagai Hari Santri Nasional.'],
keut:['Lahirnya sekolah, rumah sakit, dan pesantren modern','Peran besar ulama dan santri dalam kemerdekaan'],ref:'Sejarah Nasional Indonesia'}

['Niat ihram umrah','لَبَّيْكَ اللّٰهُمَّ عُمْرَةً','Labbaika Allâhumma \'umratan','Aku penuhi panggilan-Mu ya Allah untuk berumrah.','Diucapkan di miqat (HR. Muslim)'],
['Niat ihram haji','لَبَّيْكَ اللّٰهُمَّ حَجًّا','Labbaika Allâhumma hajjan','Aku penuhi panggilan-Mu ya Allah untuk berhaji.','Diucapkan di miqat (HR. Muslim)'],
TALBIYAH.concat(['Dibaca sejak ihram sampai mulai tawaf (umrah) atau sampai melempar jumrah aqabah (haji). HR. Bukhari & Muslim']),
['Masuk Masjidil Haram / Masjid Nabawi','بِسْمِ اللّٰهِ وَالصَّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللّٰهِ، اللّٰهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ','Bismillâhi wash-shalâtu was-salâmu \'alâ rasûlillâh, Allâhummaftah lî abwâba rahmatik','Dengan nama Allah, shalawat dan salam atas Rasulullah. Ya Allah, bukakanlah untukku pintu-pintu rahmat-Mu.','HR. Muslim; tambahan basmalah & salam: HR. Ibnu Majah. Masuk dengan kaki kanan.'],
['Saat melihat Ka\'bah','اللّٰهُمَّ زِدْ هٰذَا الْبَيْتَ تَشْرِيفًا وَتَعْظِيمًا وَتَكْرِيمًا وَمَهَابَةً','Allâhumma zid hâdzal-baita tasyrîfan wa ta\'zhîman wa takrîman wa mahâbah','Ya Allah, tambahkanlah kemuliaan, keagungan, kehormatan, dan kewibawaan rumah ini.','Riwayat Asy-Syafi\'i & Al-Baihaqi, sanadnya lemah. Boleh juga berdoa apa saja dengan bahasa sendiri.'],
['Memulai tawaf (menghadap Hajar Aswad)','بِسْمِ اللّٰهِ، اللّٰهُ أَكْبَرُ','Bismillâh, Allâhu akbar','Dengan nama Allah, Allah Maha Besar.','Takbir: HR. Bukhari. Basmalah: atsar Ibnu Umar (Al-Baihaqi). Ucapkan setiap melewati Hajar Aswad sambil mengusap/mencium atau cukup berisyarat dengan tangan.'],
['Antara Rukun Yamani dan Hajar Aswad','رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ','Rabbanâ âtinâ fid-dunyâ hasanah, wa fil-âkhirati hasanah, wa qinâ \'adzâban-nâr','Ya Tuhan kami, berilah kami kebaikan di dunia dan kebaikan di akhirat, dan lindungilah kami dari azab neraka.','HR. Abu Dawud (hasan). Di luar bagian ini, tidak ada doa khusus per putaran. Boleh berdzikir, berdoa bebas, atau membaca Al-Qur\'an.'],
['Di Maqam Ibrahim setelah tawaf','وَاتَّخِذُوا مِنْ مَقَامِ إِبْرَاهِيمَ مُصَلًّى','Wattakhidzû min maqâmi Ibrâhîma mushallâ','Dan jadikanlah sebagian Maqam Ibrahim tempat sholat.','QS Al-Baqarah: 125. Lalu sholat 2 rakaat (Al-Kafirun dan Al-Ikhlas) di belakang Maqam atau di mana saja di masjid jika padat (HR. Muslim).'],
['Minum air Zamzam','اللّٰهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا وَاسِعًا، وَشِفَاءً مِنْ كُلِّ دَاءٍ','Allâhumma innî as\'aluka \'ilman nâfi\'â, wa rizqan wâsi\'â, wa syifâ\'an min kulli dâ\'','Ya Allah, aku memohon kepada-Mu ilmu yang bermanfaat, rezeki yang luas, dan kesembuhan dari segala penyakit.','Atsar Ibnu Abbas (Ad-Daruquthni, Al-Hakim), derajat diperselisihkan. "Air Zamzam sesuai niat peminumnya" (HR. Ibnu Majah, Ahmad).'],
['Mendekati bukit Shafa','إِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَائِرِ اللّٰهِ، أَبْدَأُ بِمَا بَدَأَ اللّٰهُ بِهِ','Innash-shafâ wal-marwata min sya\'â\'irillâh, abda\'u bimâ bada\'allâhu bih','Sesungguhnya Shafa dan Marwah termasuk syiar Allah. Aku memulai dengan apa yang Allah mulai.','HR. Muslim (hadis Jabir). Dibaca sekali di awal sa\'i.'],
['Dzikir di atas Shafa dan Marwah','اللّٰهُ أَكْبَرُ، اللّٰهُ أَكْبَرُ، اللّٰهُ أَكْبَرُ، لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ، أَنْجَزَ وَعْدَهُ، وَنَصَرَ عَبْدَهُ، وَهَزَمَ الْأَحْزَابَ وَحْدَهُ','Allâhu akbar (3×). Lâ ilâha illallâhu wahdahu lâ syarîka lah, lahul-mulku wa lahul-hamdu wa huwa \'alâ kulli syai\'in qadîr. Lâ ilâha illallâhu wahdah, anjaza wa\'dah, wa nashara \'abdah, wa hazamal-ahzâba wahdah','Allah Maha Besar. Tiada Tuhan selain Allah semata, tiada sekutu bagi-Nya. Milik-Nya kerajaan dan pujian, dan Dia Maha Kuasa atas segala sesuatu. Tiada Tuhan selain Allah semata, yang menepati janji-Nya, menolong hamba-Nya, dan mengalahkan pasukan sekutu sendirian.','HR. Muslim. Menghadap Ka\'bah, diulang 3 kali diselingi doa bebas.'],
['Di antara lampu hijau (sa\'i)','رَبِّ اغْفِرْ وَارْحَمْ، إِنَّكَ أَنْتَ الْأَعَزُّ الْأَكْرَمُ','Rabbighfir warham, innaka antal-a\'azzul-akram','Ya Tuhanku, ampunilah dan rahmatilah. Sesungguhnya Engkau Maha Perkasa lagi Maha Mulia.','Atsar Ibnu Mas\'ud dan Ibnu Umar (Ibnu Abi Syaibah). Laki-laki berlari kecil di antara dua lampu hijau.'],
['Wukuf di Arafah (sebaik-baik doa)','لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ','Lâ ilâha illallâhu wahdahu lâ syarîka lah, lahul-mulku wa lahul-hamdu wa huwa \'alâ kulli syai\'in qadîr','Tiada Tuhan selain Allah semata, tiada sekutu bagi-Nya. Milik-Nya kerajaan dan pujian, dan Dia Maha Kuasa atas segala sesuatu.','"Sebaik-baik doa adalah doa hari Arafah…" (HR. Tirmidzi, hasan). Perbanyak doa, istighfar, dan dzikir sampai matahari terbenam.'],
['Di Muzdalifah (Masy\'aril Haram)','فَإِذَا أَفَضْتُمْ مِنْ عَرَفَاتٍ فَاذْكُرُوا اللّٰهَ عِنْدَ الْمَشْعَرِ الْحَرَامِ','Fa idzâ afadhtum min \'arafâtin fadzkurullâha \'indal-masy\'aril-harâm','Apabila kamu bertolak dari Arafah, berdzikirlah kepada Allah di Masy\'aril Haram.','QS Al-Baqarah: 198. Setelah Subuh, menghadap kiblat dan memperbanyak takbir, tahlil, dan doa (HR. Muslim).'],
['Melempar jumrah','اللّٰهُ أَكْبَرُ','Allâhu akbar','Allah Maha Besar.','Diucapkan setiap melempar satu kerikil (HR. Bukhari). Setelah jumrah Ula dan Wustha, menghadap kiblat dan berdoa panjang. Setelah Aqabah, langsung pergi (HR. Bukhari).'],
['Takbir hari raya dan tasyrik','اللّٰهُ أَكْبَرُ، اللّٰهُ أَكْبَرُ، لَا إِلٰهَ إِلَّا اللّٰهُ، وَاللّٰهُ أَكْبَرُ، اللّٰهُ أَكْبَرُ، وَلِلّٰهِ الْحَمْدُ','Allâhu akbar, Allâhu akbar, lâ ilâha illallâh, wallâhu akbar, Allâhu akbar, wa lillâhil-hamd','Allah Maha Besar, Allah Maha Besar, tiada Tuhan selain Allah, Allah Maha Besar, Allah Maha Besar, dan milik Allah segala puji.','Atsar Ibnu Mas\'ud (Ibnu Abi Syaibah). Dibaca pada 10–13 Zulhijah.'],
['Salam ziarah makam Nabi ﷺ','السَّلَامُ عَلَيْكَ يَا رَسُولَ اللّٰهِ، السَّلَامُ عَلَيْكَ يَا أَبَا بَكْرٍ، السَّلَامُ عَلَيْكَ يَا عُمَرُ','Assalâmu \'alaika yâ Rasûlallâh. Assalâmu \'alaika yâ Abâ Bakr. Assalâmu \'alaika yâ \'Umar','Salam sejahtera atasmu wahai Rasulullah, wahai Abu Bakar, wahai Umar.','Atsar Ibnu Umar (Malik, Al-Baihaqi). Ucapkan dengan suara pelan dan sopan. Berdoa menghadap kiblat, bukan ke makam.'],
['Ziarah makam Baqi\' dan Syuhada Uhud','السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللّٰهُ بِكُمْ لَلَاحِقُونَ، أَسْأَلُ اللّٰهَ لَنَا وَلَكُمُ الْعَافِيَةَ','Assalâmu \'alaikum ahlad-diyâri minal-mu\'minîna wal-muslimîn, wa innâ insyâ\'allâhu bikum lalâhiqûn, as\'alullâha lanâ wa lakumul-\'âfiyah','Salam atas kalian, penghuni kubur dari kaum mukminin dan muslimin. Insya Allah kami akan menyusul kalian. Aku memohon keselamatan kepada Allah untuk kami dan kalian.','HR. Muslim'],
['Doa safar (berangkat)','اللّٰهُ أَكْبَرُ، اللّٰهُ أَكْبَرُ، اللّٰهُ أَكْبَرُ، سُبْحَانَ الَّذِي سَخَّرَ لَنَا هٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ، اللّٰهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هٰذَا الْبِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى','Allâhu akbar (3×). Subhânalladzî sakhkhara lanâ hâdzâ wa mâ kunnâ lahû muqrinîn, wa innâ ilâ rabbinâ lamunqalibûn. Allâhumma innâ nas\'aluka fî safarinâ hâdzal-birra wat-taqwâ, wa minal-\'amali mâ tardhâ','Maha Suci Allah yang menundukkan kendaraan ini bagi kami, padahal kami tidak mampu menguasainya, dan kepada Tuhan kamilah kami kembali. Ya Allah, kami memohon kebaikan, takwa, dan amal yang Engkau ridai dalam perjalanan ini.','HR. Muslim'],
['Pulang dari safar','آيِبُونَ، تَائِبُونَ، عَابِدُونَ، لِرَبِّنَا حَامِدُونَ','Âyibûna, tâ\'ibûna, \'âbidûna, li rabbinâ hâmidûn','Kami kembali, bertaubat, beribadah, dan memuji Tuhan kami.','HR. Bukhari & Muslim']];

const kcatOf=c=>KCATS.find(x=>x[0]===c)||KCATS[0];
function kisahRow(x){const c=kcatOf(x.cat);
  return `<button class="kis" data-a="sheet" data-v="ks:${x.id}"><span class="kav" style="background:${c[3]}">${ic(c[4],20)}</span><span class="kt"><b>${esc(x.n)}</b><small>${esc(x.g||'')}</small><small class="kmeta">${ic('pin',12)} ${esc((x.tempat||'').split(/[.;(]/)[0].slice(0,46))} · ${esc((x.masa||'').split(/[;(]/)[0].slice(0,34))}</small></span>${ic('right',18)}</button>`}
function hajiPlace(p){const s=HSTAT[p.st];
  return `<div class="card hpl"><div class="hph"><b>${esc(p.n)}</b><span class="hst" style="background:${s[1]}">${s[0]}</span></div><p class="hwhy">${esc(p.why)}</p>
  <div class="hsec"><small>${ic('scroll',14)} Sejarah</small><p>${esc(p.s)}</p></div><div class="hsec"><small>${ic('spark',14)} Kini</small><p>${esc(p.n2)}</p></div><div class="hsec tip"><small>${ic('check',14)} Tips & adab</small><p>${esc(p.tip)}</p></div></div>`}
function Sheet8(){
  if(!sheet)return '';
  const hdr=(t,extra='')=>`<div class="shd"><button class="ibtn" data-a="close" aria-label="Kembali">${ic('left',26)}</button><h2>${t}</h2>${extra}</div>`;
  const wrap=(t,body,extra)=>`<div class="sheet">${hdr(t,extra)}<div class="scr pad kcompact" id="rscr">${body}</div></div>`;
  if(sheet==='kisah'){
    return wrap('Kisah & Sejarah',`<div class="qsearch">${ic('search',20)}<input data-in="kissearch" placeholder="Cari nabi, sahabat, wali, tempat, tahun…" aria-label="Cari kisah"></div><div id="kres"></div>
    <div class="dgrid">${KCATS.map(c=>`<button class="dcat" style="background:${c[3]}" data-a="sheet" data-v="kcat:${c[0]}"><b>${c[1]}</b><small>${KISAH.filter(x=>x.cat===c[0]).length} kisah · ${c[2]}</small><span>${ic(c[4],34)}</span></button>`).join('')}</div>
    <p class="mute" style="margin-top:14px">Kisah para nabi disusun dari Al-Qur'an dan hadis sahih. Bagian yang hanya bersumber dari riwayat sejarah atau cerita tutur diberi keterangan. Tahun kuno adalah perkiraan.</p>`)}
  if(sheet.startsWith('kcat:')){const c=kcatOf(sheet.slice(5)),L=KISAH.filter(x=>x.cat===c[0]);
    return wrap(c[1],`<div class="kbanner" style="background:${c[3]}"><span>${ic(c[4],30)}</span><div><b>${c[1]}</b><small>${L.length} kisah · ${c[2]}</small></div></div>
    ${c[0]==='nusantara'?'<p class="mute" style="margin:0 0 6px">Diurutkan dari masa awal hingga kemerdekaan.</p>':''}${L.map((x,i)=>kisahRow(x)).join('')}
    ${c[0]==='wali'?'<p class="mute">Karomah wali bersumber dari cerita tutur dan babad. Ambil teladan dakwahnya; keyakinan tetap bersandar pada Al-Qur\'an dan sunnah.</p>':''}`)}
  if(sheet.startsWith('ks:')){const x=KISAH.find(k=>k.id===sheet.slice(3));if(!x)return '';const c=kcatOf(x.cat),L=KISAH.filter(k=>k.cat===x.cat),i=L.indexOf(x);
    return wrap(esc(x.n),`<div class="khero" style="background:linear-gradient(160deg,${c[3]},color-mix(in srgb,${c[3]} 55%,#000))">${x.ar?`<div class="ar" style="font-size:30px;line-height:1.6">${x.ar}</div>`:''}<b>${esc(x.n)}</b><small>${esc(x.g||'')}</small></div>
    <div class="kfacts"><div><small>${ic('pin',14)} Tempat</small><p>${esc(x.tempat)}</p></div><div><small>${ic('cal',14)} Masa / tahun</small><p>${esc(x.masa)}</p></div></div>
    ${KBAB[x.id]?`<details class="card ksum"><summary><b>Ringkasan</b> <small class="mute">(ketuk untuk membuka)</small></summary>${x.k.map(p=>`<p class="kp">${esc(p)}</p>`).join('')}</details>
    <div class="ktoc">${KBAB[x.id].map((b,j)=>`<a href="#kb-${j}" data-a="kbjump" data-v="${j}">${j+1}. ${esc(b[0])}</a>`).join('')}</div>
    ${KBAB[x.id].map(([t,ps,dl],j)=>`<section class="card kbab" id="kb-${j}"><div class="kbh"><h3>${j+1}. ${esc(t)}</h3><button class="arsay" data-a="kbsay" data-v="${x.id}|${j}" aria-label="Bacakan bab ini">${ic('vol',18)}</button></div>${ps.map(p=>`<p class="kp">${esc(p)}</p>`).join('')}${dl&&dl.length?`<div class="kdlg">${dl.map(([who,said,ref])=>`<div class="kbub ${/^(Allah|Jibril|Para malaikat|Seruan)/.test(who)?'god':/Nabi Muhammad|^Muhammad|Yusuf$|^Nabi /.test(who)||who===x.n.replace(/^(Nabi|Sunan) /,'')?'me':''}"><small>${esc(who)}</small><p>“${esc(said)}”</p><cite>${esc(ref)}</cite></div>`).join('')}</div>`:''}</section>`).join('')}`
    :`<div class="card"><h3>Kisah</h3>${x.k.map(p=>`<p class="kp">${esc(p)}</p>`).join('')}</div>`}
    <div class="card"><h3>${c[5]}</h3>${stepList(x.keut)}</div>
    ${x.note?`<div class="card knote">${ic('spark',16)} <span>${esc(x.note)}</span></div>`:''}
    <p class="mute">Rujukan: ${esc(x.ref||'-')}</p>
    <div class="duo" style="padding:0 0 18px">${i>0?`<button class="btn" style="background:var(--c2)" data-a="ksgo" data-v="${L[i-1].id}">${ic('left',18)} ${esc(L[i-1].n.replace(/^(Nabi|Sunan) /,''))}</button>`:'<span></span>'}${i<L.length-1?`<button class="btn" data-a="ksgo" data-v="${L[i+1].id}">${esc(L[i+1].n.replace(/^(Nabi|Sunan) /,''))} ${ic('right',18)}</button>`:''}</div>`)}
  if(sheet==='haji'){const tb=S.hjtab||'manasik',city=S.hjcity||'Makkah';
    const seg=`<div class="seg2" style="margin-bottom:12px">${[['manasik','Manasik'],['doa','Doa'],['tempat','Tempat']].map(([k,l])=>`<button class="${tb===k?'on':''}" data-a="hjtab" data-v="${k}">${l}</button>`).join('')}</div>`;
    let body='';
    if(tb==='manasik')body=bacaCard(HDOA[0])+bacaCard(TALBIYAH)+Object.values(HAJI).map(h=>`<div class="card" style="margin:12px 0"><h3>${h.n}</h3>${stepList(h.s)}</div>`).join('')+'<p class="mute">Ringkasan manasik. Ikuti bimbingan pembimbing dan ketentuan resmi penyelenggara haji (Kemenag/Arab Saudi).</p>';
    if(tb==='doa')body=`<p class="mute" style="margin:0 0 4px">Urut sesuai perjalanan ibadah. Tidak ada doa wajib dengan lafaz tertentu di setiap putaran tawaf atau sa'i. Berdoalah dengan bahasa sendiri, khusyuk, dan penuh harap.</p>`+HDOA.map(bacaCard).join('');
    if(tb==='tempat'){const L=HPLACE.filter(p=>p.c===city);
      body=`<div class="chips" style="margin-bottom:8px">${['Makkah','Madinah'].map(k=>`<button class="${city===k?'on':''}" data-a="hjcity" data-v="${k}">${k}</button>`).join('')}</div>
      <div class="hleg">${Object.entries(HSTAT).map(([k,[l,col]])=>`<span><i style="background:${col}"></i>${l}</span>`).join('')}</div>
      ${['w','s','z'].map(st=>{const g=L.filter(p=>p.st===st);return g.length?`<h3 class="hgh">${HSTAT[st][0]}</h3>`+g.map(hajiPlace).join(''):''}).join('')}
      <p class="mute">Fasilitas dan aturan (misalnya izin Raudhah lewat aplikasi Nusuk) dapat berubah. Ikuti info terbaru dari pembimbing atau Kemenag.</p>`}
    return wrap('Haji & Umroh',seg+body)}
  return '';
}

[`Satu mushaf untuk umat`,[`Saat menjadi khalifah, wilayah Islam sangat luas. Hudzaifah bin Al-Yaman melihat kaum muslimin berselisih tentang cara membaca Al-Qur'an, lalu melapor dengan cemas. Utsman membentuk tim yang dipimpin Zaid bin Tsabit untuk menyalin mushaf standar dari mushaf Abu Bakar, lalu mengirimkannya ke berbagai wilayah. Itulah Mushaf Utsmani yang kita pakai sampai hari ini.`,`Di akhir pemerintahannya terjadi fitnah. Utsman menolak menumpahkan darah demi membela diri, dan wafat syahid di rumahnya saat membaca Al-Qur'an.`],
[[`Hudzaifah bin Al-Yaman`,`Wahai Amirul Mukminin, selamatkanlah umat ini sebelum mereka berselisih tentang Kitab seperti perselisihan Yahudi dan Nasrani.`,`HR. Bukhari`]]]];
KBAB.ali=[
[`Pemuda pertama yang beriman`,[`Ali bin Abi Thalib dibesarkan di rumah Nabi ﷺ sejak kecil, dan masuk Islam saat masih anak-anak. Pada malam hijrah, ia berbaring di ranjang Nabi ﷺ dengan selimut beliau, mempertaruhkan nyawa, lalu mengembalikan barang-barang titipan orang Quraisy kepada pemiliknya sebelum menyusul ke Madinah.`]],
[`Panji Khaibar`,[`Benteng Khaibar sulit ditaklukkan. Nabi ﷺ mengumumkan bahwa besok panji akan diberikan kepada seseorang yang dicintai Allah dan Rasul-Nya. Semalaman para sahabat berharap menjadi orang itu. Esoknya Nabi ﷺ memanggil Ali yang sedang sakit mata, mengusap matanya hingga sembuh, lalu memberikan panji. Khaibar pun ditaklukkan.`],
[[`Nabi Muhammad ﷺ`,`Sungguh, besok aku akan memberikan panji ini kepada seseorang yang Allah berikan kemenangan melalui tangannya. Ia mencintai Allah dan Rasul-Nya, dan Allah dan Rasul-Nya mencintainya.`,`HR. Bukhari & Muslim`],[`Nabi Muhammad ﷺ`,`Ajaklah mereka kepada Islam… Demi Allah, Allah memberi petunjuk kepada satu orang melalui dirimu lebih baik bagimu daripada unta merah.`,`HR. Bukhari & Muslim`]]],
[`Ilmu dan kezuhudan`,[`Ali dikenal sangat dalam ilmunya dan adil dalam memutuskan perkara. Umar sering meminta pendapatnya. Meski menjadi khalifah, ia hidup sederhana. Ia memimpin di masa penuh fitnah, lalu wafat syahid di Kufah pada 40 H setelah ditikam saat hendak sholat Subuh.`],
[[`Umar bin Khattab`,`Ali adalah yang paling baik dalam memutuskan perkara di antara kami.`,`HR. Bukhari (atsar)`]]]];
KBAB.khadijah=[
[`Saudagar wanita yang mulia`,[`Khadijah binti Khuwailid adalah wanita Quraisy yang kaya, cerdas, dan terhormat, dijuluki Ath-Thahirah (yang suci). Ia mempekerjakan Muhammad muda untuk membawa dagangannya ke Syam. Pelayannya, Maisarah, melaporkan kejujuran dan akhlak Muhammad. Khadijah tertarik dan melamarnya. Mereka menikah ketika Muhammad berusia 25 tahun.`]],
[`Penenang di malam wahyu`,[`Ketika wahyu pertama turun dan Nabi ﷺ pulang dengan gemetar, Khadijah yang menyelimutinya dan menguatkannya dengan kata-kata yang penuh keyakinan. Ia menjadi orang pertama yang beriman.`],
[[`Khadijah`,`Tidak, demi Allah, Allah tidak akan pernah menghinakanmu. Engkau menyambung silaturahim, menanggung beban orang lemah, memberi orang yang tidak punya, memuliakan tamu, dan menolong orang yang tertimpa musibah.`,`HR. Bukhari`]]],
[`Salam dari Allah`,[`Selama 25 tahun ia mendampingi Nabi ﷺ, mengorbankan hartanya, dan ikut menanggung pemboikotan. Suatu hari Jibril datang membawa salam dari Allah untuknya. Nabi ﷺ tidak pernah melupakannya, bahkan bertahun-tahun setelah ia wafat.`],
[[`Jibril`,`Wahai Rasulullah, ini Khadijah datang membawa bejana berisi makanan. Jika ia datang, sampaikan salam kepadanya dari Tuhannya dan dariku, dan beri kabar gembira kepadanya dengan rumah di surga dari mutiara, tidak ada kebisingan dan kelelahan di dalamnya.`,`HR. Bukhari & Muslim`],[`Nabi Muhammad ﷺ`,`Ia beriman kepadaku ketika manusia ingkar, membenarkanku ketika manusia mendustakanku, dan membantuku dengan hartanya ketika manusia tidak memberiku.`,`HR. Ahmad`]]]];
KBAB.aisyah=[
[`Putri Ash-Shiddiq`,[`Aisyah tumbuh di rumah Abu Bakar dalam suasana iman. Ia cerdas, kuat hafalannya, fasih, dan pandai syair. Di rumah Nabi ﷺ, ia menyaksikan langsung kehidupan sehari-hari Rasulullah, sehingga menjadi sumber ilmu yang tak tergantikan.`]],
[`Fitnah yang dibela langit`,[`Sepulang dari sebuah ekspedisi, Aisyah tertinggal rombongan karena mencari kalungnya yang hilang. Seorang sahabat, Shafwan bin Mu'aththal, menemukannya dan mengantarnya pulang. Kaum munafik menyebarkan fitnah. Selama sebulan Aisyah menangis. Lalu turun sepuluh ayat Surah An-Nur yang menyatakan ia bersih.`],
[[`Aisyah`,`Demi Allah, aku tidak mendapati perumpamaan bagiku dan kalian kecuali ucapan ayah Yusuf: "Maka kesabaran yang baik itulah (kesabaranku). Dan Allah sajalah yang dimohon pertolongan-Nya."`,`HR. Bukhari & Muslim`]]],
[`Guru para sahabat`,[`Setelah Nabi ﷺ wafat, para sahabat senior datang kepadanya untuk bertanya. Ia meriwayatkan lebih dari 2.000 hadis dan sering mengoreksi pemahaman yang keliru dengan dalil. Ketika ditanya tentang akhlak Nabi ﷺ, ia menjawab dengan kalimat yang sangat ringkas dan dalam.`],
[[`Seorang sahabat`,`Wahai Ummul Mukminin, ceritakan kepadaku tentang akhlak Rasulullah ﷺ.`,`HR. Muslim`],[`Aisyah`,`Akhlak beliau adalah Al-Qur'an.`,`HR. Muslim`]]]];
KBAB.fatimah=[
[`Putri yang paling mirip ayahnya`,[`Fatimah lahir di Makkah dan menyaksikan beratnya dakwah ayahnya. Ketika orang musyrik meletakkan kotoran unta di punggung Nabi ﷺ yang sedang sujud, Fatimah kecil datang membersihkannya. Cara berjalan dan berbicaranya sangat mirip dengan Nabi ﷺ. Setiap kali ia datang, Nabi ﷺ berdiri menyambut, menciumnya, dan mendudukkannya di tempat beliau.`]],
[`Hadiah yang lebih baik dari pembantu`,[`Fatimah bekerja keras menggiling gandum hingga tangannya lecet. Ia meminta seorang pembantu kepada ayahnya. Nabi ﷺ datang ke rumahnya dan Ali pada malam hari, lalu mengajarkan dzikir sebelum tidur.`],
[[`Nabi Muhammad ﷺ`,`Maukah aku tunjukkan kepada kalian sesuatu yang lebih baik dari apa yang kalian minta? Jika kalian hendak tidur, bertasbihlah 33 kali, bertahmidlah 33 kali, dan bertakbirlah 34 kali. Itu lebih baik bagi kalian daripada seorang pembantu.`,`HR. Bukhari & Muslim`]]],
[`Bisikan tangis dan senyum`,[`Saat sakit menjelang wafat, Nabi ﷺ membisikkan sesuatu kepada Fatimah, dan ia menangis. Lalu beliau berbisik lagi, dan ia tersenyum. Setelah Nabi ﷺ wafat, Fatimah menceritakannya kepada Aisyah. Ia wafat sekitar enam bulan kemudian.`],
[[`Fatimah`,`Beliau membisikkan bahwa beliau akan wafat karena sakitnya, maka aku menangis. Lalu beliau membisikkan bahwa aku adalah keluarganya yang pertama menyusulnya, maka aku tersenyum.`,`HR. Bukhari & Muslim`],[`Nabi Muhammad ﷺ`,`Tidakkah engkau rida menjadi pemimpin para wanita penghuni surga?`,`HR. Bukhari`]]]];
KBAB.hamzah=[
[`Busur yang membela keponakan`,[`Hamzah bin Abdul Muthalib adalah paman Nabi ﷺ, pemberani dan ahli berburu. Suatu hari, sepulang berburu, ia mendengar Abu Jahal mencaci dan menyakiti Nabi ﷺ. Ia langsung mendatangi Abu Jahal di dekat Ka'bah dan memukul kepalanya dengan busur.`],
[[`Hamzah`,`Engkau mencacinya, padahal aku telah memeluk agamanya? Aku mengatakan apa yang ia katakan. Balaslah aku jika engkau mampu!`,`Sirah Ibnu Hisyam`]]],
[`Singa Allah di Badar dan Uhud`,[`Hamzah menjadi pahlawan dalam Perang Badar. Di Perang Uhud, ia gugur ditombak Wahsyi, budak yang dijanjikan merdeka oleh Hindun. Jasadnya dirusak, dan Nabi ﷺ sangat berduka. Bertahun-tahun kemudian, Wahsyi masuk Islam dan Nabi ﷺ memaafkannya, tetapi meminta agar Wahsyi tidak menampakkan wajahnya di hadapan beliau. Kelak Wahsyi menebus masa lalunya dengan membunuh Musailamah Al-Kadzdzab.`],
[[`Nabi Muhammad ﷺ`,`Pemimpin para syuhada adalah Hamzah bin Abdul Muthalib.`,`HR. Hakim (sahih)`]]]];
KBAB.bilal=[
[`Ahad, Ahad`,[`Bilal bin Rabah adalah budak berkulit hitam milik Umayyah bin Khalaf. Ketika masuk Islam, ia disiksa di padang pasir yang membara, batu besar ditindihkan di dadanya, dan ia dipaksa kembali menyembah Latta dan Uzza. Ia hanya mengulang satu kata.`,`Abu Bakar membelinya dan memerdekakannya.`],
[[`Bilal`,`Ahad… Ahad… (Allah Maha Esa)`,`Sirah Ibnu Hisyam`]]],
[`Suara adzan pertama`,[`Di Madinah, kaum muslimin bermusyawarah tentang cara memanggil sholat. Abdullah bin Zaid bermimpi diajari lafaz adzan. Nabi ﷺ membenarkannya dan menyuruhnya mengajarkan kepada Bilal karena suaranya lebih lantang. Saat Fathu Makkah, Bilal naik ke atas Ka'bah dan mengumandangkan adzan.`],
[[`Nabi Muhammad ﷺ`,`Itu mimpi yang benar, insya Allah. Berdirilah bersama Bilal dan ajarkan kepadanya apa yang engkau lihat, karena suaranya lebih lantang darimu.`,`HR. Abu Dawud & Tirmidzi`]]],
[`Terompah di surga`,[`Suatu pagi, Nabi ﷺ bertanya kepada Bilal tentang amal apa yang paling ia harapkan pahalanya, karena beliau mendengar suara terompah Bilal di surga.`],
[[`Nabi Muhammad ﷺ`,`Wahai Bilal, ceritakan kepadaku amalan yang paling engkau harapkan dalam Islam, karena aku mendengar suara terompahmu di depanku di surga.`,`HR. Bukhari & Muslim`],[`Bilal`,`Tidak ada amalan yang paling aku harapkan, kecuali aku tidak pernah bersuci pada waktu malam atau siang, melainkan aku sholat dengan wudhu itu sebanyak yang ditetapkan bagiku.`,`HR. Bukhari & Muslim`]]]];
KBAB.mushab=[
[`Pemuda paling harum di Makkah`,[`Mush'ab bin Umair adalah pemuda Quraisy paling tampan dan paling mewah pakaiannya, sangat dimanja ibunya. Ia masuk Islam diam-diam. Ketika ketahuan, keluarganya mengurungnya. Ia lepas dan hijrah ke Habasyah, meninggalkan semua kemewahan.`],
[[`Nabi Muhammad ﷺ (saat melihatnya berpakaian lusuh)`,`Lihatlah orang ini, yang hatinya telah Allah sinari. Sungguh aku pernah melihatnya di tengah kedua orang tuanya yang memberinya makanan dan minuman terbaik…`,`Hilyatul Auliya (Abu Nu'aim)`]]],
[`Duta ke Yatsrib`,[`Setelah Baiat Aqabah pertama, Nabi ﷺ mengutus Mush'ab ke Yatsrib untuk mengajarkan Al-Qur'an. Pemuka Bani Abdul Asyhal, Usaid bin Hudhair, datang dengan tombak hendak mengusirnya. Mush'ab menjawab dengan tenang, lalu membacakan Al-Qur'an. Usaid masuk Islam, disusul Sa'ad bin Mu'adz dan seluruh kabilahnya.`],
[[`Mush'ab`,`Duduklah dan dengarkanlah. Jika engkau suka, terimalah. Jika engkau tidak suka, kami akan berhenti dari apa yang engkau benci.`,`Sirah Ibnu Hisyam`]]],
[`Kafan yang tak cukup`,[`Di Uhud, Mush'ab membawa panji kaum muslimin. Tangan kanannya ditebas, ia memegang panji dengan tangan kiri. Tangan kirinya ditebas, ia mendekapnya dengan kedua lengan hingga gugur. Kain kafannya terlalu pendek: jika kepalanya ditutup, kakinya terbuka. Nabi ﷺ menyuruh kepalanya ditutup dan kakinya ditutupi rumput idzkhir. (HR. Bukhari)`],
[[`Mush'ab (menurut riwayat sirah)`,`Muhammad hanyalah seorang rasul; sungguh telah berlalu sebelumnya beberapa rasul…`,`QS Ali Imran: 144; riwayat Ibnu Sa'ad`]]]];
KBAB.abdurrahman=[
[`Tunjukkan saja aku pasar`,[`Abdurrahman bin Auf hijrah ke Madinah tanpa harta. Nabi ﷺ mempersaudarakannya dengan Sa'ad bin Ar-Rabi', orang Anshar yang kaya. Sa'ad menawarkan separuh hartanya. Abdurrahman menolak dengan halus dan hanya meminta ditunjukkan pasar. Tak lama ia kembali sukses berdagang.`],
[[`Sa'ad bin Ar-Rabi'`,`Aku orang Anshar yang paling banyak hartanya. Aku bagi hartaku menjadi dua untukmu…`,`HR. Bukhari`],[`Abdurrahman bin Auf`,`Semoga Allah memberkahi keluarga dan hartamu. Tunjukkan saja kepadaku di mana pasar.`,`HR. Bukhari`]]],
[`Kafilah tujuh ratus unta`,[`Suatu hari kafilah dagang Abdurrahman yang sangat besar tiba di Madinah. Kota itu bergemuruh. Menurut riwayat, ia menyedekahkan seluruh kafilah itu di jalan Allah. Ia juga mewasiatkan harta untuk para veteran Badar dan para Ummul Mukminin.`,`Meski kaya raya, ia sering menangis mengingat Mush'ab dan Hamzah yang wafat dengan kain kafan yang tak cukup, karena khawatir kebaikannya telah disegerakan di dunia. (HR. Bukhari)`]]];
KBAB.khalid=[
[`Dari Uhud menuju Islam`,[`Khalid bin Walid adalah panglima Quraisy yang membalik keadaan di Uhud. Setelah Perjanjian Hudaibiyah, ia merenung dan akhirnya berangkat ke Madinah bersama Amr bin Al-Ash untuk masuk Islam. Nabi ﷺ menyambutnya.`],
[[`Nabi Muhammad ﷺ`,`Segala puji bagi Allah yang telah memberimu petunjuk. Sungguh, aku melihat engkau memiliki akal yang aku harapkan tidak akan membawamu kecuali kepada kebaikan.`,`Riwayat Al-Waqidi dalam Sirah`]]],
[`Pedang Allah di Mu'tah`,[`Di Perang Mu'tah (8 H), 3.000 kaum muslimin menghadapi pasukan Romawi yang jauh lebih besar. Tiga panglima gugur satu per satu: Zaid, Ja'far, dan Abdullah bin Rawahah. Khalid mengambil alih panji dan, dengan strategi cerdik, berhasil menarik pasukan dengan selamat. Di Madinah, Nabi ﷺ mengabarkan peristiwa itu sambil berlinang air mata.`],
[[`Nabi Muhammad ﷺ`,`…Kemudian panji diambil oleh salah satu pedang dari pedang-pedang Allah, hingga Allah memberikan kemenangan kepada mereka.`,`HR. Bukhari`]]],
[`Yarmuk dan ketaatan`,[`Khalid memimpin kemenangan besar di Yarmuk (636 M). Kemudian Umar mencopotnya dari jabatan panglima agar manusia tidak menyangka kemenangan bergantung pada Khalid. Khalid menerima dengan lapang dada dan tetap berjuang sebagai prajurit biasa. Ia wafat di Homs di atas ranjangnya, padahal sangat merindukan syahid.`],
[[`Khalid (menjelang wafat, menurut riwayat)`,`Aku telah ikut dalam banyak pertempuran… tidak ada sejengkal pun di tubuhku kecuali ada bekas tebasan pedang atau tusukan tombak. Dan kini aku mati di atas ranjangku…`,`Siyar A'lamin Nubala`]]]];
KBAB.salman=[
[`Perjalanan mencari kebenaran`,[`Salman berasal dari keluarga Majusi di Isfahan, Persia. Ayahnya menugasinya menjaga api sesembahan. Suatu hari ia melewati gereja dan tertarik pada ibadah mereka. Ia lalu berkelana ke Syam, Mosul, Nashibin, dan Amuriyah, berguru dari satu pendeta saleh ke pendeta saleh lainnya.`,`Pendeta terakhir berpesan bahwa telah dekat masa seorang nabi yang akan muncul di negeri berkurma di antara dua bukit berbatu hitam.`],
[[`Pendeta Amuriyah`,`Pada dirinya ada tanda-tanda: ia makan hadiah, tetapi tidak makan sedekah, dan di antara kedua bahunya ada cap kenabian.`,`HR. Ahmad (sahih)`]]],
[`Menemukan yang dicari`,[`Salman ditipu kafilah Arab dan dijual sebagai budak hingga tiba di Madinah. Ketika Nabi ﷺ hijrah, Salman menguji tanda-tanda itu: ia membawakan sedekah, lalu hadiah, lalu melihat cap kenabian. Ia menangis dan memeluk Nabi ﷺ. Para sahabat membantunya menebus kemerdekaannya dengan menanam 300 pohon kurma.`]],
[`Ide parit`,[`Menjelang Perang Ahzab (5 H), pasukan sekutu yang sangat besar hendak menyerbu Madinah. Salman mengusulkan strategi Persia yang belum dikenal bangsa Arab. Kaum muslimin menggali parit di sisi utara kota, dan pasukan musuh tertahan hingga akhirnya pulang.`],
[[`Salman`,`Wahai Rasulullah, dahulu di Persia jika kami dikepung, kami membuat parit di sekeliling kami.`,`Sirah (Al-Waqidi, Ibnu Sa'ad)`]]]];
KBAB.abuubaidah=[
[`Orang kepercayaan umat`,[`Abu Ubaidah bin Al-Jarrah termasuk sepuluh orang pertama yang masuk Islam. Ia lembut, rendah hati, dan sangat jujur. Ketika utusan Najran meminta seorang yang terpercaya untuk mengajari mereka, para sahabat berharap terpilih. Nabi ﷺ memilih Abu Ubaidah.`],
[[`Nabi Muhammad ﷺ`,`Sungguh aku akan mengutus kepada kalian seorang yang benar-benar terpercaya.`,`HR. Bukhari & Muslim`],[`Nabi Muhammad ﷺ`,`Setiap umat punya orang kepercayaan, dan orang kepercayaan umat ini adalah Abu Ubaidah bin Al-Jarrah.`,`HR. Bukhari & Muslim`]]],
[`Rumah sang gubernur`,[`Saat menjabat gubernur Syam, Umar berkunjung dan ingin melihat rumahnya. Di dalam hanya ada pedang, perisai, dan pelana. Umar menangis.`,`Ketika wabah tha'un Amwas melanda Syam, Umar memintanya pulang ke Madinah. Abu Ubaidah memahami maksud Umar dan menolak meninggalkan pasukannya. Ia wafat karena wabah itu.`],
[[`Umar`,`Dunia telah mengubah kita semua, kecuali engkau, wahai Abu Ubaidah.`,`Siyar A'lamin Nubala`]]]];
KBAB.saad=[
[`Ujian dari ibu`,[`Sa'ad bin Abi Waqqash masuk Islam pada usia sekitar 17 tahun. Ibunya bersumpah tidak akan makan dan minum sampai Sa'ad meninggalkan Islam. Sa'ad tetap berbakti, tetapi teguh dalam iman. Allah menurunkan ayat tentang hal ini.`],
[[`Sa'ad`,`Wahai ibu, demi Allah, seandainya engkau punya seratus nyawa lalu keluar satu per satu, aku tidak akan meninggalkan agamaku ini.`,`HR. Muslim (makna)`],[`Allah`,`Dan jika keduanya memaksamu untuk mempersekutukan Aku… maka janganlah engkau menaati keduanya, dan pergaulilah keduanya di dunia dengan baik.`,`QS Luqman: 15`]]],
[`Tebusan ayah dan ibu`,[`Di Perang Uhud, Sa'ad memanah di dekat Nabi ﷺ. Nabi ﷺ menyemangatinya dengan ungkapan yang belum pernah beliau ucapkan untuk orang lain.`],
[[`Nabi Muhammad ﷺ`,`Panahlah! Ayah dan ibuku menjadi tebusanmu.`,`HR. Bukhari & Muslim`]]],
[`Doa yang mustajab`,[`Nabi ﷺ mendoakannya agar doanya dikabulkan. Sa'ad kemudian memimpin kemenangan di Qadisiyah dan menaklukkan Mada'in. Sebagai gubernur Kufah, ia pernah difitnah tidak becus mengimami sholat. Ia membela diri dengan menjelaskan bahwa ia sholat persis seperti sholat Rasulullah.`],
[[`Nabi Muhammad ﷺ`,`Ya Allah, kabulkanlah doa Sa'ad jika ia berdoa kepada-Mu.`,`HR. Tirmidzi`]]]];
KBAB.abuhurairah=[
[`Lapar di emperan masjid`,[`Abu Hurairah datang dari kabilah Daus di Yaman dan masuk Islam sekitar Perang Khaibar. Ia memilih selalu bersama Nabi ﷺ dan tinggal di Shuffah, emperan Masjid Nabawi, bersama sahabat-sahabat miskin. Kadang ia sampai pingsan karena lapar. Suatu hari Nabi ﷺ memintanya memanggil seluruh ahlus shuffah untuk minum dari satu wadah susu. Semuanya kenyang, dan Abu Hurairah minum terakhir.`],
[[`Nabi Muhammad ﷺ`,`Minumlah.`,`HR. Bukhari`],[`Abu Hurairah`,`Demi Dzat yang mengutusmu dengan kebenaran, aku tidak mendapati lagi tempat (dalam perutku) untuknya.`,`HR. Bukhari`]]],
[`Selendang hafalan`,[`Abu Hurairah mengeluh kepada Nabi ﷺ bahwa ia sering lupa. Nabi ﷺ memintanya membentangkan selendang, lalu beliau seolah menuangkan sesuatu dengan kedua tangan ke dalamnya, dan menyuruhnya mendekapkan selendang itu ke dada. Sejak itu ia tidak lupa apa pun yang ia dengar.`],
[[`Abu Hurairah`,`Wahai Rasulullah, aku mendengar banyak hadis darimu, lalu aku lupa.`,`HR. Bukhari`],[`Nabi Muhammad ﷺ`,`Bentangkan selendangmu.`,`HR. Bukhari`]]]];
KBAB.ibnuabbas=[
[`Doa untuk seorang anak`,[`Abdullah bin Abbas adalah sepupu Nabi ﷺ. Saat kecil ia pernah menyiapkan air wudhu untuk beliau tanpa diminta. Nabi ﷺ senang dan mendoakannya. Suatu hari, ketika membonceng di belakang Nabi ﷺ, ia mendapat nasihat yang menjadi salah satu hadis paling terkenal.`],
[[`Nabi Muhammad ﷺ`,`Ya Allah, pahamkanlah ia dalam agama dan ajarkanlah kepadanya takwil (tafsir).`,`HR. Bukhari & Ahmad`],[`Nabi Muhammad ﷺ`,`Wahai anak, aku ajarkan kepadamu beberapa kalimat: Jagalah Allah, niscaya Allah menjagamu. Jagalah Allah, niscaya engkau dapati Dia di hadapanmu. Jika engkau meminta, mintalah kepada Allah. Jika engkau memohon pertolongan, mohonlah kepada Allah.`,`HR. Tirmidzi (hasan sahih)`]]],
[`Menunggu di depan pintu`,[`Setelah Nabi ﷺ wafat, Ibnu Abbas mendatangi para sahabat senior untuk belajar. Jika mendengar seorang sahabat punya hadis, ia mendatangi rumahnya pada siang hari, lalu tidur berbantal selendang di depan pintu, diterpa angin dan debu, sampai sahabat itu keluar. Ia tidak mau mengetuk pintu agar tidak mengganggu.`],
[[`Sahabat tuan rumah`,`Wahai sepupu Rasulullah, mengapa tidak engkau suruh orang memanggilku, aku yang akan datang kepadamu?`,`Sunan Ad-Darimi`],[`Ibnu Abbas`,`Tidak, akulah yang lebih berhak datang kepadamu.`,`Sunan Ad-Darimi`]]]];

KBAB.umarabdulaziz=[
[`Pangeran yang berubah`,[`Umar bin Abdul Aziz adalah bangsawan Bani Umayyah. Dari pihak ibu, ia cicit Umar bin Khattab. Dahulu ia dikenal berpakaian mewah dan wangi. Saat diangkat menjadi khalifah (717 M), ia menangis dan ingin menolak. Ia menolak iring-iringan kemewahan, menjual kuda-kuda istana untuk baitul mal, dan meminta istrinya, Fatimah binti Abdul Malik, menyerahkan perhiasannya ke kas negara.`],
[[`Umar bin Abdul Aziz (pidato pertama)`,`Wahai manusia, aku telah diuji dengan perkara ini tanpa dimintai pendapat… Maka pilihlah untuk diri kalian (pemimpin lain).`,`Siyar A'lamin Nubala`]]],
[`Lilin milik negara`,[`Diceritakan bahwa suatu malam seorang tamu datang membicarakan urusan pribadi, dan Umar memadamkan lilin milik negara lalu menyalakan lilin miliknya sendiri. Dalam masa sekitar dua setengah tahun, keadilan dan kesejahteraan merata, sampai petugas zakat di beberapa wilayah kesulitan menemukan penerima.`,`Ia juga memerintahkan Abu Bakar bin Hazm dan para ulama untuk membukukan hadis karena khawatir ilmu hilang bersama wafatnya para ulama.`],
[[`Umar bin Abdul Aziz (surat kepada Abu Bakar bin Hazm)`,`Perhatikanlah hadis Rasulullah ﷺ yang ada, lalu tulislah. Sungguh aku khawatir ilmu akan lenyap dan para ulama akan wafat.`,`Shahih Bukhari (Kitab Al-'Ilm)`]]]];
KBAB.abuhanifah=[
[`Pedagang kain yang jujur`,[`An-Nu'man bin Tsabit lahir di Kufah pada 80 H. Ia pedagang kain sutra yang sangat jujur. Pernah rekan dagangnya menjual kain yang cacat tanpa memberi tahu pembeli. Abu Hanifah lalu menyedekahkan seluruh hasil penjualan itu. Seorang ulama, Asy-Sya'bi, melihat kecerdasannya dan menyarankannya menekuni ilmu.`]],
[`Majelis musyawarah fikih`,[`Abu Hanifah belajar kepada Hammad bin Abi Sulaiman selama 18 tahun. Ia mengembangkan metode diskusi bersama murid-murid: setiap masalah dibahas berhari-hari sebelum diputuskan. Muridnya, Abu Yusuf dan Muhammad bin Al-Hasan, membukukan mazhabnya.`],
[[`Imam Syafi'i`,`Manusia dalam hal fikih adalah anak-anak (yang bergantung) kepada Abu Hanifah.`,`Tarikh Baghdad`]]],
[`Menolak jabatan`,[`Khalifah Abu Ja'far Al-Manshur memintanya menjadi qadhi (hakim agung). Abu Hanifah menolak karena khawatir tidak mampu berlaku adil di bawah tekanan penguasa. Ia dipenjara dan dicambuk, lalu wafat pada 150 H. Menurut riwayat, puluhan ribu orang menyalatkan jenazahnya.`]]];
KBAB.malik=[
[`Ibu yang memakaikan sorban`,[`Malik bin Anas lahir di Madinah pada 93 H. Ibunya memakaikannya pakaian terbaik dan sorban, lalu menyuruhnya belajar kepada Rabi'ah, seorang ulama Madinah, dengan pesan yang terkenal.`],
[[`Ibu Imam Malik`,`Pergilah kepada Rabi'ah, pelajarilah adabnya sebelum ilmunya.`,`Tartib Al-Madarik (Qadhi 'Iyadh)`]]],
[`"Aku tidak tahu"`,[`Seorang laki-laki menempuh perjalanan berbulan-bulan dari Maghrib untuk bertanya kepada Imam Malik. Dari puluhan pertanyaan, Malik menjawab "aku tidak tahu" untuk sebagian besarnya, karena ia sangat berhati-hati dalam berfatwa.`],
[[`Penanya`,`Aku datang dari jauh, apa yang harus kukatakan kepada kaumku?`,`Tartib Al-Madarik`],[`Imam Malik`,`Katakan kepada mereka: Malik berkata, "Aku tidak tahu."`,`Tartib Al-Madarik`]]],
[`Adab kepada hadis`,[`Sebelum mengajar hadis, Malik mandi, memakai wewangian dan pakaian terbaik, lalu duduk dengan khusyuk. Ia menyusun Al-Muwaththa' selama bertahun-tahun. Ketika Khalifah Harun Ar-Rasyid ingin memaksakan Al-Muwaththa' sebagai satu-satunya rujukan, Malik menolak karena para sahabat telah tersebar dengan ilmu masing-masing.`]]];
KBAB.syafii=[
[`Yatim yang haus ilmu`,[`Muhammad bin Idris Asy-Syafi'i lahir di Gaza pada 150 H, tahun wafatnya Abu Hanifah. Ayahnya wafat saat ia kecil, dan ibunya membawanya ke Makkah. Karena miskin, ia menulis pelajaran di tulang dan pelepah kurma. Ia hafal Al-Qur'an pada usia 7 tahun dan hafal Al-Muwaththa' pada usia 10 tahun. Ia juga tinggal bersama suku Hudzail di pedalaman untuk mempelajari bahasa Arab yang fasih.`]],
[`Berguru kepada Imam Malik`,[`Ia berangkat ke Madinah dan membacakan Al-Muwaththa' dari hafalan di hadapan Imam Malik. Malik takjub dan menasihatinya.`],
[[`Imam Malik`,`Sesungguhnya Allah telah meletakkan cahaya di hatimu, maka janganlah engkau padamkan dengan maksiat.`,`Manaqib Asy-Syafi'i (Al-Baihaqi)`]]],
[`Mengadu kepada Waki'`,[`Imam Syafi'i menceritakan bahwa ia pernah mengadu kepada gurunya, Waki', tentang hafalannya yang memburuk. Ia mengabadikan nasihat gurunya dalam syair yang sangat terkenal.`],
[[`Imam Syafi'i (syair)`,`Aku mengadu kepada Waki' tentang buruknya hafalanku. Ia membimbingku untuk meninggalkan maksiat. Ia berkata: ketahuilah, ilmu itu cahaya, dan cahaya Allah tidak diberikan kepada pelaku maksiat.`,`Diwan Asy-Syafi'i`]]],
[`Ar-Risalah dan Mesir`,[`Syafi'i menggabungkan metode ahli hadis Madinah dan ahli ra'yu Irak. Ia menulis Ar-Risalah, kitab pertama yang menyusun ushul fikih. Di Mesir ia merevisi banyak pendapatnya (qaul jadid), lalu wafat pada 204 H. Mazhabnya kemudian menjadi mazhab utama di Indonesia.`],
[[`Imam Syafi'i`,`Jika hadis itu sahih, maka itulah mazhabku.`,`Siyar A'lamin Nubala`]]]];
KBAB.ahmad=[
[`Penuntut ilmu sepanjang hayat`,[`Ahmad bin Hanbal lahir di Baghdad pada 164 H dan tumbuh yatim. Ia berkelana ke Hijaz, Yaman, Syam, dan Irak untuk mengumpulkan hadis, dan berguru antara lain kepada Imam Syafi'i. Hingga tua ia tetap membawa tinta dan pena. Ketika ditanya sampai kapan, jawabannya sangat terkenal.`],
[[`Seseorang`,`Wahai Abu Abdillah, engkau telah mencapai derajat ini, tetapi masih membawa tinta?`,`Manaqib Al-Imam Ahmad (Ibnul Jauzi)`],[`Imam Ahmad`,`Bersama tinta sampai ke liang lahat.`,`Manaqib Al-Imam Ahmad (Ibnul Jauzi)`]]],
[`Teguh dalam mihnah`,[`Pada masa Khalifah Al-Ma'mun hingga Al-Watsiq, para ulama dipaksa menyatakan bahwa Al-Qur'an adalah makhluk. Banyak yang menyerah karena takut. Imam Ahmad menolak, lalu dipenjara dan dicambuk hingga pingsan. Ia tetap berkata Al-Qur'an adalah kalamullah. Keteguhannya menjaga akidah umat. Khalifah Al-Mutawakkil kemudian menghentikan mihnah.`],
[[`Imam Ahmad`,`Berikan kepadaku sesuatu dari Kitab Allah atau Sunnah Rasul-Nya, niscaya aku akan mengatakannya.`,`Siyar A'lamin Nubala`]]]];
KBAB.bukhari=[
[`Anak yang matanya dikembalikan`,[`Muhammad bin Isma'il lahir di Bukhara pada 194 H. Menurut riwayat, ia sempat kehilangan penglihatan saat kecil, dan ibunya terus berdoa hingga bermimpi bertemu Nabi Ibrahim yang mengabarkan bahwa Allah mengembalikan penglihatan putranya. Sejak kecil ia sudah menghafal ribuan hadis dan mampu mengoreksi sanad gurunya.`]],
[`Ujian seratus hadis di Baghdad`,[`Ketika tiba di Baghdad, para ulama mengujinya. Sepuluh orang masing-masing membacakan sepuluh hadis yang matan dan sanadnya sengaja diacak. Untuk setiap hadis, Bukhari menjawab "Aku tidak mengenalnya." Setelah selesai, ia mengulang seratus hadis itu dalam versi salah seperti yang dibacakan, lalu mengembalikan setiap sanad ke matan yang benar, satu per satu. Para ulama mengakui keunggulannya.`]],
[`Dua rakaat untuk setiap hadis`,[`Ia menyaring Shahih Al-Bukhari dari sekitar 600.000 hadis selama 16 tahun. Diriwayatkan bahwa ia mandi dan sholat dua rakaat sebelum mencantumkan setiap hadis. Kitab ini diakui mayoritas ulama sebagai kitab paling sahih setelah Al-Qur'an. Ia wafat di Khartank dekat Samarkand pada malam Idul Fitri 256 H.`],
[[`Imam Bukhari`,`Aku tidak memasukkan ke dalam kitab ini kecuali yang sahih, dan apa yang aku tinggalkan dari yang sahih lebih banyak.`,`Hadyus Sari (Ibnu Hajar)`]]]];
KBAB.shalahuddin=[
[`Dari Tikrit ke Kairo`,[`Yusuf bin Ayyub, yang dikenal sebagai Shalahuddin, lahir di Tikrit (Irak) dari keluarga Kurdi. Ia tumbuh di bawah asuhan pamannya, Syirkuh, dan Sultan Nuruddin Zanki yang saleh. Ia menjadi wazir Mesir, lalu menyatukan Mesir dan Syam di bawah satu kepemimpinan untuk menghadapi pasukan Salib.`]],
[`Hattin dan pembebasan Baitul Maqdis`,[`Pada Juli 1187, di Hattin dekat Danau Tiberias, Shalahuddin mengalahkan pasukan Salib yang kehausan. Pada 2 Oktober 1187, bertepatan dengan 27 Rajab 583 H (bulan Isra' Mi'raj), Baitul Maqdis dibebaskan.`,`Berbeda dengan pembantaian pada 1099, Shalahuddin memberi jaminan keamanan. Penduduk boleh pergi dengan tebusan, dan banyak orang miskin dibebaskan tanpa tebusan. Masjid Al-Aqsa disucikan, dan mimbar yang dipesan Nuruddin dipasang.`]],
[`Ksatria di mata lawan`,[`Dalam Perang Salib Ketiga, saat Raja Richard dari Inggris sakit, Shalahuddin mengirimkan buah-buahan dan salju. Ketika kuda Richard mati di medan perang, Shalahuddin mengirimkan kuda pengganti. Ia wafat di Damaskus pada 1193 dalam keadaan miskin. Hartanya tidak cukup untuk biaya pemakamannya sendiri, karena semuanya telah ia sedekahkan.`]]];
KBAB.alfatih=[
[`Pendidikan seorang pangeran`,[`Muhammad bin Murad, yang kelak bergelar Al-Fatih, lahir pada 1432 M. Ayahnya, Sultan Murad II, menghadirkan para ulama terbaik untuk mendidiknya, di antaranya Syaikh Aaq Syamsuddin. Sang guru menanamkan keyakinan bahwa dialah yang dimaksud hadis tentang penaklukan Konstantinopel. Al-Fatih menguasai beberapa bahasa, matematika, dan strategi militer.`],
[[`Hadis yang memotivasinya`,`Konstantinopel sungguh akan ditaklukkan. Sebaik-baik pemimpin adalah pemimpinnya, dan sebaik-baik pasukan adalah pasukan tersebut.`,`HR. Ahmad (derajatnya diperselisihkan ulama)`]]],
[`Kapal-kapal di atas bukit`,[`Pada 1453, Konstantinopel dikepung. Teluk Tanduk Emas tertutup rantai raksasa. Al-Fatih memerintahkan sekitar 70 kapal ditarik melalui daratan di atas batang kayu yang diminyaki, melintasi bukit Galata dalam satu malam, lalu diturunkan di dalam teluk. Ia juga memakai meriam raksasa rancangan Orban.`,`Pada 29 Mei 1453, setelah 53 hari pengepungan, kota itu ditaklukkan. Al-Fatih menjamin keamanan penduduk dan kebebasan beribadah mereka. Kota itu kemudian dikenal sebagai Istanbul.`]]];

KBAB.ibnusina=[
[`Anak ajaib dari Bukhara`,[`Abu Ali Al-Husain bin Abdullah bin Sina lahir pada 980 M di Afsyanah dekat Bukhara. Pada usia 10 tahun ia telah hafal Al-Qur'an dan banyak syair. Ia belajar fikih, logika, matematika, lalu kedokteran secara otodidak. Pada usia 16 tahun para dokter senior sudah belajar kepadanya.`,`Dalam otobiografinya ia menceritakan bahwa ia membaca buku Metafisika karya Aristoteles sampai 40 kali tanpa paham. Pemahamannya baru terbuka setelah membaca syarah Al-Farabi yang ia beli murah di pasar, dan ia bersedekah sebagai rasa syukur.`]],
[`Menyembuhkan sang sultan`,[`Pada usia 17 tahun ia berhasil mengobati Sultan Nuh bin Manshur dari Dinasti Samaniyah ketika dokter-dokter istana menyerah. Sebagai hadiah, ia meminta izin membaca di perpustakaan istana yang luar biasa lengkap.`,`Kelak ia menulis Al-Qanun fit Thibb, ensiklopedia kedokteran yang menjelaskan penularan penyakit, karantina, dan uji klinis obat. Buku ini dipakai di universitas-universitas Eropa hingga abad ke-17. Ia wafat di Hamadan pada 1037 M.`]]];
KBAB.ibnubattuta=[
[`Berangkat haji, pulang 29 tahun kemudian`,[`Muhammad bin Abdullah bin Battuta lahir di Tangier, Maroko, pada 1304 M. Pada usia 21 tahun ia berangkat haji seorang diri dan menangis meninggalkan kedua orang tuanya. Namun perjalanan itu tidak berhenti di Makkah. Ia menjelajah Afrika Timur, Persia, Asia Tengah, India, Maladewa, hingga Cina, sekitar 120.000 km.`]],
[`Singgah di Samudera Pasai`,[`Dalam perjalanan ke Cina sekitar 1345–1346, Ibnu Battuta singgah di Kesultanan Samudera Pasai di pesisir Aceh. Ia disambut hangat dan tinggal sekitar dua pekan. Ia mencatat bahwa Sultan Al-Malik Azh-Zhahir adalah penguasa yang alim, rendah hati, bermazhab Syafi'i, gemar berdiskusi fikih dengan para ulama, dan berjalan kaki ke masjid untuk sholat Jumat.`,`Catatan perjalanannya, Tuhfatun Nuzhzhar (Ar-Rihlah), menjadi salah satu bukti tertulis tertua tentang kerajaan Islam di Nusantara.`]]];

/* ============ V13: IBADAH ANAK & PANTAUAN ORANG TUA ============ */
const KIBX=[['ngaji',"Mengaji / baca Al-Qur'an",'book'],['doa','Doa pagi & petang','hands'],['bakti','Membantu orang tua','heart'],['sedekah','Berbagi / sedekah','gift'],['puasa','Puasa','moon']];
const kib=(kd,k)=>{kd.ib=kd.ib||{};return kd.ib[k]||(kd.ib[k]={})};
const kAl=kd=>{if(!kd.al||typeof kd.al!=='object')kd.al={on:true,snd:'ceria',fired:{}};kd.al.fired=kd.al.fired||{};return kd.al};
function kidWeek(kd){const days=[...Array(7)].map((_,i)=>dayDate(i-6)),rows=days.map(d=>{const o=(kd.ib||{})[dkey(d)]||{};return{d,n:P5.filter(p=>o[p]).length,x:KIBX.filter(x=>o[x[0]]).length}});
  let streak=0;for(let i=rows.length-1;i>=0;i--){if(rows[i].n===5)streak++;else if(i===rows.length-1)continue;else break}
  return{rows,pct:Math.round(rows.reduce((s,r)=>s+r.n,0)/35*100),streak}}
function kidFire(p){const kd=S.kid,a=kAl(kd),nm=PN[p],who=kd.name||(isAdik()?'Adik':'Kakak');
  notifyNow(`Waktunya sholat ${nm}, ${who}!`,'Yuk wudhu dulu, lalu sholat.','cahaya-kid-'+p);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(_){}
  let o=document.getElementById('adzov');if(o)o.remove();o=document.createElement('div');o.id='adzov';o.className='ovl';
  o.innerHTML=`<div class="ovbox kidov" role="alertdialog" aria-labelledby="kah">${nuri('happy',96)}<h3 id="kah">Waktunya sholat ${esc(nm)}, ${esc(who)}!</h3><p>Yuk ambil wudhu dulu, lalu sholat. Jangan lupa centang bintangnya di Sholat-ku ya.</p><div class="ovbtns"><button class="btn" data-x="stop">Siap, aku sholat!</button></div></div>`;
  o.addEventListener('click',e=>{if(e.target.closest('[data-x]')){stopAdzan();if(S.mode==='kids'){S.kv='sholat';render()}}});document.body.appendChild(o);
  if(a.snd==='adzan')playAdzan(p==='fajr'?(alS().fstyle||'fajr'):alS().style);else{sfx('win');setTimeout(()=>speak(`Waktunya sholat ${nm}, ${who}. Yuk wudhu dulu.`,'id-ID'),700)}}
function kidTick(){const kd=S.kid;if(!kd||!kd.profile)return;const a=kAl(kd);if(!a.on)return;const d=dayDate(0),tt=timesFor(d),now=Date.now(),dk=d.toISOString().slice(0,10);
  for(const p of P5){const at=epochOf(d,tt[p]),k=dk+p;if(now>=at&&now-at<3*6e4&&!a.fired[k]){a.fired[k]=1;kidFire(p)}}
  const ks=Object.keys(a.fired);if(ks.length>30)ks.slice(0,ks.length-15).forEach(x=>delete a.fired[x]);save()}
function KIbadah(){const kd=S.kid,d=dayDate(0),k=dkey(d),o=kib(kd,k),a=kAl(kd);
  return `<div class="kcard"><b style="font-size:20px">Ibadah lainnya hari ini</b><div class="kib">${KIBX.map(([id,n,i])=>`<button class="${o[id]?'on':''}" data-a="kibx" data-v="${id}" aria-pressed="${!!o[id]}"><span>${ic(o[id]?'check':i,26)}</span>${n}</button>`).join('')}</div></div>
  <div class="kcard"><b style="font-size:20px">Pengingat sholatku</b><p style="margin:6px 0 10px;color:#7d8aa5;font-weight:600">Nuri akan mengingatkan saat waktu sholat tiba (selama Mode Anak terbuka).</p>
  <button class="ktgl ${a.on?'on':''}" data-a="kalon"><span>${a.on?'Pengingat nyala':'Pengingat mati'}</span><i></i></button>
  <div class="ktabs" style="margin-top:10px"><button class="${a.snd!=='adzan'?'on':''}" data-a="kalsnd" data-v="ceria">🔔 Suara ceria</button><button class="${a.snd==='adzan'?'on':''}" data-a="kalsnd" data-v="adzan">🕌 Adzan</button></div></div>`}
function Pantau(){const L=S.kids||[];if(!L.length||!L.some(k=>k.profile))return `<div class="card"><p class="mute" style="margin:0 0 10px">Belum ada profil anak.</p><button class="btn" data-a="kids">${ic('smile',18)} Buka Mode Anak</button></div>`;
  return L.filter(k=>k.profile).map(kd=>{const w=kidWeek(kd),t=(kd.ib||{})[dkey(dayDate(0))]||{},a=kAl(kd),lv=Math.floor((kd.xp||0)/100)+1;
    return `<div class="card pan"><div class="panh"><span class="av" style="background:${kd.color||'#59b8ff'}">${esc((kd.name||'A')[0].toUpperCase())}</span><div><b>${esc(kd.name||'Anak')}</b><small class="mute">${kd.profile==='adik'?'Adik (4–7 th)':'Kakak (8–12 th)'} · Level ${lv} · ${kd.xp||0} XP</small></div></div>
    <div class="panstat"><div><b>${P5.filter(p=>t[p]).length}/5</b><small>Sholat hari ini</small></div><div><b>${w.pct}%</b><small>Sholat 7 hari</small></div><div><b>${w.streak}</b><small>Hari lengkap berturut</small></div></div>
    <div class="pangrid"><span></span>${w.rows.map(r=>`<span>${'MSSRKJS'[r.d.getUTCDay()]}</span>`).join('')}${P5.map(p=>`<span>${PN[p]}</span>${w.rows.map(r=>`<i class="${((kd.ib||{})[dkey(r.d)]||{})[p]?'on':''}"></i>`).join('')}`).join('')}</div>
    <div class="panx">${KIBX.map(([id,n])=>`<span class="${t[id]?'on':''}">${t[id]?'✓':'○'} ${n}</span>`).join('')}</div>
    <button class="tgl" data-a="kalpar" data-v="${kd.id}"><span>Pengingat sholat anak (di Mode Anak)</span><span class="sw2 ${a.on?'on':''}"></span></button></div>`}).join('')+'<p class="mute">Data diisi anak sendiri di Mode Anak → Sholat-ku. Centangan orang tua di tab Sholat tidak tercampur dengan data anak.</p>'}

/* ---------- Bab penutup: akhir dakwah, wafat, dan makam ---------- */
const KEND={
adam:[`Akhir hayat Nabi Adam`,[`Adam menjalani hidup panjang di bumi, mengajarkan tauhid, ibadah, dan cara hidup kepada anak cucunya. Nabi ﷺ mengabarkan bahwa Allah memperlihatkan keturunan Adam kepadanya, dan Adam menghadiahkan sebagian umurnya kepada Dawud. Ketika ajalnya tiba, ia lupa pemberian itu. Nabi ﷺ bersabda bahwa Adam lupa, maka keturunannya pun lupa (HR. Tirmidzi, hasan sahih).`,`Riwayat lain menyebut Adam wafat dan dimandikan, dikafani, serta disholatkan oleh para malaikat, lalu mereka berkata: "Inilah sunnah kalian, wahai anak Adam" (HR. Ahmad dan Al-Hakim; sebagian ulama menilainya mauquf). Letak makamnya tidak diketahui secara pasti. Riwayat tentang India, Makkah, atau Baitul Maqdis tidak kuat.`],[[`Nabi Muhammad ﷺ`,`Adam mengingkari (lupa), maka keturunannya pun mengingkari. Adam lupa, maka keturunannya pun lupa. Adam berbuat salah, maka keturunannya pun berbuat salah.`,`HR. Tirmidzi`]]],
idris:[`Akhir kisah Nabi Idris`,[`Al-Qur'an menyebut Allah mengangkat Idris "ke tempat yang tinggi". Sebagian mufasir memahaminya sebagai martabat kenabian yang tinggi, sebagian lain sebagai diangkat ke langit (karena Nabi ﷺ bertemu dengannya di langit keempat). Kisah populer tentang Idris yang berteman dengan malaikat maut lalu wafat di langit berasal dari israiliyat dan tidak dapat dipastikan. Tempat wafat dan makamnya tidak diketahui.`]],
nuh:[`Setelah banjir dan wafatnya Nuh`,[`Setelah banjir surut, Nuh dan orang-orang beriman turun dari bahtera dengan salam dan berkah dari Allah. Keturunan Nuh menjadi nenek moyang umat manusia sesudahnya, sehingga ia dijuluki "bapak manusia kedua".`,`Menjelang wafat, Nuh berwasiat kepada putranya dengan dua perintah dan dua larangan. Tempat wafat dan makamnya tidak diketahui pasti. Tradisi setempat menyebut beberapa lokasi, seperti di Karak (Yordania) dan dekat Najaf (Irak), tetapi tidak ada dalil yang memastikannya.`],[[`Allah`,`Wahai Nuh! Turunlah dengan selamat sejahtera dan penuh keberkahan dari Kami, bagimu dan bagi semua umat (mukmin) yang bersamamu.`,`QS Hud: 48`],[`Nuh (wasiat kepada putranya)`,`Aku perintahkan kepadamu dua perkara dan aku larang dua perkara. Aku perintahkan "La ilaha illallah"… dan "Subhanallah wa bihamdih"… Aku larang engkau dari syirik dan sombong.`,`HR. Ahmad (sahih), dari Abdullah bin Amr`]]],
hud:[`Setelah azab menimpa kaum 'Ad`,[`Allah menyelamatkan Hud dan orang-orang yang beriman bersamanya. Menurut riwayat sejarah, Hud lalu tinggal di Hadramaut (Yaman) sampai wafat. Di lembah Hadramaut terdapat makam yang secara tradisi dinisbatkan kepadanya, "Qabr Nabi Hud", yang diziarahi masyarakat setiap bulan Sya'ban. Kepastian lokasi ini tidak berdasarkan dalil.`],[[`Allah`,`Dan ketika keputusan Kami datang, Kami selamatkan Hud dan orang-orang yang beriman bersama dia dengan rahmat Kami.`,`QS Hud: 58`]]],
saleh:[`Setelah binasanya Tsamud`,[`Saleh dan orang-orang beriman diselamatkan dan meninggalkan negeri Tsamud. Saat berpaling, Saleh berkata kepada kaumnya yang telah binasa bahwa ia sudah menyampaikan nasihat. Riwayat sejarah berbeda pendapat tentang tempat tinggalnya kemudian: ada yang menyebut Palestina, ada yang menyebut Makkah. Makamnya tidak diketahui pasti.`,`Ketika melewati Al-Hijr dalam perjalanan ke Tabuk, Nabi ﷺ berjalan cepat sambil menutup kepala, dan memerintahkan agar tepung yang sudah diadoni dengan air sumur Tsamud diberikan kepada unta.`],[[`Nabi Muhammad ﷺ`,`Janganlah kalian memasuki tempat tinggal orang-orang yang menzalimi diri mereka sendiri, kecuali sambil menangis, agar kalian tidak tertimpa apa yang menimpa mereka.`,`HR. Bukhari & Muslim`]]],
ibrahim:[`Akhir hayat Sang Khalilullah`,[`Ibrahim terus berdakwah, berkurban, dan memohon untuk keturunannya. Ia hidup sangat lama, dan Allah memberinya keturunan para nabi dari Ismail dan Ishaq. Menjelang wafat, ia berwasiat kepada anak-anaknya agar tetap memeluk Islam.`,`Menurut riwayat sejarah, Ibrahim wafat di Kan'an dan dimakamkan di Gua Makhpela di kota Al-Khalil (Hebron, Palestina), bersama Sarah. Kota itu dinamai sesuai gelarnya, Al-Khalil. Di atasnya kini berdiri Masjid Ibrahimi.`],[[`Ibrahim (wasiat)`,`Wahai anak-anakku! Sesungguhnya Allah telah memilih agama ini untukmu, maka janganlah kamu mati kecuali dalam keadaan muslim.`,`QS Al-Baqarah: 132`],[`Ibrahim (doa)`,`Ya Tuhanku, jadikanlah aku dan anak cucuku orang yang tetap melaksanakan sholat. Ya Tuhan kami, perkenankanlah doaku. Ya Tuhan kami, ampunilah aku, kedua orang tuaku, dan semua orang yang beriman pada hari diadakan perhitungan.`,`QS Ibrahim: 40–41`]]],
luth:[`Setelah keluar dari Sadum`,[`Luth dan kedua putrinya selamat. Menurut riwayat, mereka kembali tinggal di dekat Ibrahim. Tempat wafatnya tidak disebut dalam Al-Qur'an. Tradisi setempat menyebut makamnya di desa Bani Na'im dekat Al-Khalil (Hebron). Daerah Laut Mati, yang permukaannya paling rendah di bumi, sering dikaitkan dengan negeri kaum Luth.`],[[`Allah`,`Maka Kami selamatkan dia dan pengikut-pengikutnya, kecuali istrinya.`,`QS Al-A'raf: 83`]]],
ismail:[`Wafatnya Ismail`,[`Ismail menjadi nabi bagi kabilah-kabilah Arab di sekitar Makkah, menjaga Ka'bah, dan mengajarkan sholat dan zakat. Ia memiliki dua belas putra, di antaranya Nabit dan Qaidar, leluhur kabilah-kabilah Arab Adnaniyah.`,`Menurut riwayat sejarah, ia wafat di Makkah. Sebagian riwayat menyebut ia dimakamkan di dekat Hijr Ismail bersama ibunya, Hajar, tetapi sanad riwayat ini tidak kuat.`]],
ishaq:[`Wafatnya Ishaq`,[`Ishaq hidup lama di Kan'an dan menyaksikan kelahiran Ya'qub. Menurut riwayat sejarah, ia wafat di Kan'an dan dimakamkan di Gua Makhpela, Al-Khalil (Hebron), di dekat makam ayahnya, Ibrahim.`]],
yaqub:[`Wafat di Mesir`,[`Ya'qub menghabiskan tahun-tahun terakhirnya di Mesir bersama Yusuf dan keluarganya. Setelah berwasiat tentang tauhid kepada anak-anaknya, ia wafat di sana. Menurut riwayat Ahli Kitab yang dikutip para sejarawan, jasadnya dibawa ke Kan'an dan dimakamkan di Gua Makhpela, Al-Khalil, bersama Ibrahim dan Ishaq.`]],
yusuf:[`Akhir hayat Yusuf`,[`Yusuf memimpin perbendaharaan Mesir dan wafat di sana. Nabi ﷺ menceritakan bahwa ketika Musa membawa Bani Israil keluar dari Mesir, ia mencari makam Yusuf karena Yusuf berwasiat agar jasadnya dibawa ke tanah leluhur. Seorang wanita tua Bani Israil menunjukkan tempatnya di dasar sebuah danau, dengan syarat ia ingin bersama Musa di surga (HR. Al-Hakim dan Ibnu Hibban, sahih).`,`Tradisi menyebut makamnya di Nablus (Palestina), tetapi lokasi pastinya tidak diketahui.`],[[`Wanita tua Bani Israil`,`Aku ingin bersamamu di surga.`,`HR. Al-Hakim`]]],
ayyub:[`Setelah ujian berakhir`,[`Setelah sembuh, Ayyub hidup dalam kecukupan bersama keluarganya. Nabi ﷺ menceritakan bahwa ketika Ayyub mandi, berjatuhan belalang-belalang emas. Ayyub mengumpulkannya, lalu Allah bertanya mengapa, dan jawabannya menunjukkan rasa butuhnya kepada berkah Allah.`,`Tempat wafatnya tidak disebut dalam dalil. Beberapa tempat dinisbatkan kepadanya oleh tradisi, misalnya di Salalah (Oman) dan di Lebanon.`],[[`Allah`,`Wahai Ayyub, bukankah Aku telah mencukupkanmu dari apa yang engkau lihat?`,`HR. Bukhari`],[`Ayyub`,`Benar, demi kemuliaan-Mu. Tetapi aku tidak pernah merasa cukup dari keberkahan-Mu.`,`HR. Bukhari`]]],
syuaib:[`Setelah binasanya Madyan`,[`Syu'aib dan orang-orang beriman diselamatkan. Ia berpaling dari kaumnya yang binasa sambil bersedih. Tempat wafatnya tidak disebut Al-Qur'an. Tradisi menyebut makamnya di Wadi Syu'aib dekat As-Salt (Yordania), dan ada pula yang menyebut di Hittin (Palestina).`],[[`Syu'aib`,`Wahai kaumku! Sungguh, aku telah menyampaikan amanat Tuhanku kepadamu dan aku telah menasihati kamu. Maka bagaimana aku akan bersedih hati terhadap orang-orang kafir?`,`QS Al-A'raf: 93`]]],
musa:[`Empat puluh tahun di padang Tih`,[`Bani Israil diperintahkan memasuki Tanah Suci, tetapi mereka takut kepada penduduknya yang kuat. Mereka berkata kepada Musa: "Pergilah engkau bersama Tuhanmu dan berperanglah kalian berdua." Allah menghukum mereka tersesat di padang Tih selama 40 tahun. Di sana mereka diberi manna dan salwa, dan awan menaungi mereka.`],[[`Bani Israil`,`Wahai Musa! Sampai kapan pun kami tidak akan memasukinya selama mereka masih ada di dalamnya. Karena itu, pergilah engkau bersama Tuhanmu, dan berperanglah kamu berdua. Biarlah kami tetap (menanti) di sini saja.`,`QS Al-Ma'idah: 24`],[`Musa`,`Ya Tuhanku, aku hanya menguasai diriku sendiri dan saudaraku. Sebab itu pisahkanlah antara kami dan orang-orang fasik itu.`,`QS Al-Ma'idah: 25`]]],
harun:[`Wafatnya Harun`,[`Harun wafat lebih dahulu daripada Musa, ketika Bani Israil masih tersesat di padang Tih. Tradisi menyebut makamnya di puncak Jabal Harun dekat Petra (Yordania), tempat berdiri sebuah bangunan kecil berkubah putih. Lokasi ini berdasarkan tradisi, bukan dalil.`]],
dzulkifli:[`Akhir kisah`,[`Tidak ada dalil yang menjelaskan akhir hayat Dzulkifli. Kota Al-Kifl di Irak menyimpan makam yang dinisbatkan kepadanya, tetapi sebagian sejarawan mengaitkan makam itu dengan tokoh Bani Israil lain. Yang pasti dari Al-Qur'an: ia termasuk orang-orang yang sabar dan terpilih.`]],
daud:[`Wafatnya Nabi Daud`,[`Daud memerintah Bani Israil sekitar 40 tahun dengan adil. Nabi ﷺ menceritakan bahwa Daud sangat pencemburu, sehingga jika ia keluar rumah, pintu dikunci. Suatu hari ia mendapati seorang laki-laki di dalam rumahnya. Ternyata itu malaikat maut, yang tidak takut kepada raja dan tidak terhalang oleh penghalang. Daud wafat pada hari Sabtu, dan burung-burung menaungi jenazahnya atas perintah Sulaiman (HR. Ahmad).`,`Ia digantikan oleh putranya, Sulaiman. Tradisi menyebut makamnya di Gunung Zion, Baitul Maqdis.`],[[`Daud`,`Siapakah engkau?`,`HR. Ahmad`],[`Malaikat maut`,`Aku adalah yang tidak takut kepada raja-raja dan tidak terhalang oleh penghalang apa pun.`,`HR. Ahmad`],[`Daud`,`Kalau begitu, engkau adalah malaikat maut. Selamat datang dengan perintah Allah.`,`HR. Ahmad`]]],
sulaiman:[`Warisan Sulaiman`,[`Sulaiman membangun Baitul Maqdis (Masjidil Aqsha) dengan megah. Nabi ﷺ bersabda bahwa setelah selesai membangunnya, Sulaiman memohon tiga hal kepada Allah, dan dua di antaranya telah dikabulkan. Ia wafat sambil bersandar pada tongkatnya, sebagaimana diceritakan di bab sebelumnya, dan menurut tradisi dimakamkan di Baitul Maqdis.`],[[`Sulaiman (doa)`,`(Ya Allah, berilah aku) keputusan yang sesuai dengan keputusan-Mu, kerajaan yang tidak layak dimiliki seorang pun sesudahku, dan siapa pun yang datang ke masjid ini hanya untuk sholat, keluarlah ia dari dosa-dosanya seperti hari ia dilahirkan ibunya.`,`HR. An-Nasa'i & Ibnu Majah (sahih)`]]],
ilyas:[`Akhir kisah Ilyas`,[`Al-Qur'an menyebut bahwa kaum Ilyas mendustakannya, maka mereka akan diseret ke azab, kecuali hamba-hamba Allah yang ikhlas. Kisah tentang Ilyas yang diangkat ke langit dengan kereta berapi berasal dari kitab Ahli Kitab, dan riwayat bahwa ia masih hidup bersama Khidir dinilai lemah oleh para ahli hadis. Tempat wafatnya tidak diketahui.`],[[`Allah`,`Tetapi mereka mendustakannya (Ilyas), maka sungguh, mereka akan diseret (ke neraka), kecuali hamba-hamba Allah yang disucikan (dari dosa).`,`QS Ash-Shaffat: 127–128`]]],
ilyasa:[`Akhir kisah Ilyasa'`,[`Menurut para sejarawan, Ilyasa' memimpin Bani Israil setelah Ilyas sampai wafat. Tempat wafat dan makamnya tidak diketahui dari dalil yang sahih. Tradisi Ahli Kitab menyebut makamnya di Samaria (Palestina).`]],
yunus:[`Setelah kembali kepada kaumnya`,[`Yunus kembali ke Ninawa dan mendapati lebih dari seratus ribu orang telah beriman. Allah memberi mereka kenikmatan hidup sampai waktu yang ditentukan. Nabi ﷺ melarang umatnya merendahkan Yunus.`,`Tempat wafatnya tidak disebut dalam dalil. Di Mosul pernah berdiri Masjid Nabi Yunus di atas makam yang dinisbatkan kepadanya. Masjid itu dihancurkan pada 2014 dan sedang dipugar.`],[[`Nabi Muhammad ﷺ`,`Tidak sepantasnya seorang hamba berkata, "Aku lebih baik daripada Yunus bin Matta."`,`HR. Bukhari & Muslim`]]],
zakaria:[`Akhir hayat Zakaria`,[`Zakaria terus mengajar dan beribadah di Baitul Maqdis, dan menyaksikan putranya, Yahya, menjadi nabi. Al-Qur'an tidak menyebut cara wafatnya. Sebagian riwayat sejarah menyebut ia dibunuh oleh orang-orang zalim dari Bani Israil, tetapi riwayat-riwayat ini tidak dapat dipastikan. Tradisi menyebut makamnya di Masjid Agung Aleppo (Suriah), ada pula yang menyebut di Baitul Maqdis.`]],
yahya:[`Syahidnya Yahya`,[`Riwayat sejarah menyebut Yahya menentang keinginan seorang raja zalim untuk menikahi wanita yang haram baginya. Wanita itu meminta kepala Yahya sebagai hadiah, dan raja pun membunuhnya. Darah para nabi yang dibunuh menjadi celaan bagi Bani Israil dalam Al-Qur'an.`,`Di dalam Masjid Umayyah, Damaskus, terdapat bangunan yang secara tradisi diyakini menyimpan kepala Nabi Yahya.`],[[`Allah`,`…dan mereka membunuh para nabi tanpa hak (alasan yang benar).`,`QS Ali Imran: 21`]]],
isa:[`Turun di akhir zaman`,[`Nabi ﷺ mengabarkan bahwa Isa akan turun di dekat menara putih di sebelah timur Damaskus, dengan kedua tangan di atas sayap dua malaikat. Ia akan membunuh Dajjal di Bab Ludd, mematahkan salib, membunuh babi, menghapus jizyah, dan memerintah dengan syariat Nabi Muhammad. Harta melimpah sampai tidak ada yang mau menerimanya.`,`Menurut riwayat, Isa tinggal di bumi selama 40 tahun, lalu wafat dan disholatkan kaum muslimin (HR. Abu Dawud, sahih). Sebagian riwayat lemah menyebut ia dimakamkan di samping Nabi ﷺ di Madinah.`],[[`Nabi Muhammad ﷺ`,`Demi Dzat yang jiwaku di tangan-Nya, sungguh sudah dekat saatnya Isa putra Maryam turun di tengah kalian sebagai hakim yang adil. Ia mematahkan salib, membunuh babi, dan menghapus jizyah.`,`HR. Bukhari & Muslim`]]],
muhammad:[`Pemakaman di kamar Aisyah`,[`Setelah wafat, para sahabat berbeda pendapat tentang tempat pemakaman. Abu Bakar menyampaikan hadis yang ia dengar. Maka Nabi ﷺ dimakamkan di kamar Aisyah, tempat beliau wafat, pada malam Rabu. Para sahabat menyholatkan beliau bergiliran, kelompok demi kelompok, tanpa imam.`,`Kamar itu kini berada di dalam Masjid Nabawi, Madinah, di bawah Kubah Hijau. Di sampingnya dimakamkan Abu Bakar dan Umar.`],[[`Abu Bakar`,`Aku mendengar Rasulullah ﷺ bersabda: "Tidaklah seorang nabi wafat melainkan ia dimakamkan di tempat ia wafat."`,`HR. Tirmidzi & Ibnu Majah`]]],
abubakar:[`Wafat dan dimakamkan di samping Nabi`,[`Abu Bakar jatuh sakit setelah mandi pada hari yang dingin, lalu demam selama sekitar 15 hari. Ia menunjuk Umar sebagai penggantinya setelah bermusyawarah dengan para sahabat senior. Ia wafat pada Jumadil Akhir 13 H (634 M) dalam usia 63 tahun, sama seperti usia Nabi ﷺ. Ia dimakamkan di kamar Aisyah, kepalanya sejajar dengan bahu Nabi ﷺ.`],[[`Abu Bakar (kepada Aisyah)`,`Pada hari apa Rasulullah ﷺ wafat?… Aku berharap (wafat) antara saat ini dan malam nanti. Kafanilah aku dengan dua pakaianku ini, karena orang hidup lebih berhak atas pakaian baru daripada mayit.`,`HR. Bukhari`]]],
umar:[`Dimakamkan di samping dua sahabatnya`,[`Umar wafat tiga hari setelah ditikam, pada akhir Dzulhijjah 23 H (644 M), dalam usia sekitar 63 tahun. Ia membentuk dewan syura enam orang untuk memilih khalifah berikutnya. Ia mengutus putranya, Abdullah, meminta izin kepada Aisyah, dan Aisyah mengizinkan. Umar pun dimakamkan di samping Nabi ﷺ dan Abu Bakar.`],[[`Umar`,`Pergilah kepada Ummul Mukminin Aisyah dan katakan: Umar meminta izin untuk dimakamkan bersama kedua sahabatnya.`,`HR. Bukhari`],[`Aisyah`,`Dahulu aku menginginkannya untuk diriku, tetapi hari ini aku mendahulukan Umar atas diriku.`,`HR. Bukhari`]]],
utsman:[`Pengepungan dan syahidnya Utsman`,[`Di akhir pemerintahannya, para pemberontak dari Mesir, Kufah, dan Bashrah mengepung rumah Utsman selama sekitar 40 hari. Para sahabat menawarkan diri untuk melawan, tetapi Utsman melarang agar tidak ada darah tertumpah karena dirinya. Ia ingat pesan Nabi ﷺ untuk bersabar. Ia dibunuh pada 18 Dzulhijjah 35 H (656 M) dalam keadaan berpuasa dan membaca Al-Qur'an. Darahnya menetes pada ayat "Maka Allah akan memelihara engkau dari mereka" (QS Al-Baqarah: 137). Ia dimakamkan di Baqi', Madinah.`],[[`Utsman`,`Rasulullah ﷺ telah membuat perjanjian denganku, dan aku bersabar atasnya.`,`HR. Tirmidzi (sahih)`]]],
ali:[`Syahid di Kufah`,[`Pada 17 Ramadhan 40 H (661 M), ketika keluar membangunkan orang untuk sholat Subuh, Ali ditikam dengan pedang beracun oleh Abdurrahman bin Muljam dari kaum Khawarij. Ia wafat dua hari kemudian. Sebelum wafat, ia berpesan agar pembunuhnya diperlakukan dengan adil dan tidak dianiaya. Ia dimakamkan secara rahasia, dan banyak riwayat menyebut makamnya di Najaf (Irak).`],[[`Ali (pesan tentang pembunuhnya)`,`Jika aku hidup, aku yang akan memutuskan urusannya. Jika aku mati, balaslah ia satu pukulan, seperti ia memukulku, dan jangan kalian mencincangnya.`,`Tarikh Ath-Thabari`]]],
khadijah:[`Tahun duka`,[`Khadijah wafat di Makkah pada bulan Ramadhan tahun ke-10 kenabian (±619 M), sekitar tiga tahun sebelum hijrah, dalam usia sekitar 65 tahun. Saat itu belum disyariatkan sholat jenazah. Nabi ﷺ sendiri turun ke liang kuburnya di Al-Hajun, yang kini dikenal sebagai pemakaman Jannatul Ma'la, Makkah.`,`Setelah wafatnya, Nabi ﷺ sering menyebut kebaikannya dan mengirim hadiah kepada sahabat-sahabat Khadijah.`],[[`Aisyah`,`Aku tidak pernah cemburu kepada seorang pun dari istri-istri Nabi ﷺ sebagaimana cemburuku kepada Khadijah, padahal aku tidak pernah melihatnya. Beliau sering sekali menyebutnya.`,`HR. Bukhari & Muslim`]]],
aisyah:[`Akhir hayat Aisyah`,[`Aisyah hidup hampir 50 tahun setelah Nabi ﷺ wafat, menjadi rujukan ilmu dan teladan kedermawanan. Pernah ia menerima 100.000 dirham dan membagikan semuanya dalam satu hari, sementara ia sendiri berpuasa dan lupa menyisakan untuk berbuka. Ia wafat di Madinah pada malam 17 Ramadhan 58 H (678 M), disholatkan oleh Abu Hurairah, dan dimakamkan di Baqi' pada malam itu juga.`],[[`Ummu Dzarrah (pelayannya)`,`Tidakkah engkau bisa membeli daging satu dirham untuk kita berbuka?`,`Siyar A'lamin Nubala`],[`Aisyah`,`Seandainya engkau mengingatkanku, tentu aku lakukan.`,`Siyar A'lamin Nubala`]]],
fatimah:[`Wafat enam bulan setelah ayahnya`,[`Sesuai kabar dari ayahnya, Fatimah adalah keluarga Nabi ﷺ yang pertama menyusul beliau. Ia wafat sekitar enam bulan setelah Nabi ﷺ, pada Ramadhan 11 H (632 M), dalam usia sekitar 28 tahun. Ia berwasiat agar jenazahnya ditutup dengan baik. Ali memakamkannya pada malam hari. Menurut pendapat yang masyhur, makamnya di Baqi', Madinah.`]],
hamzah:[`Dimakamkan di kaki Uhud`,[`Ketika Nabi ﷺ melihat jasad Hamzah yang dirusak di Uhud, beliau sangat berduka. Hamzah dikafani dengan kain yang tidak cukup, sehingga kakinya ditutupi rumput idzkhir. Ia dimakamkan bersama para syuhada Uhud di kaki Jabal Uhud, Madinah. Makam itu kini dikenal sebagai Makam Syuhada Uhud dan diziarahi jamaah haji dan umrah.`]],
bilal:[`Hijrah ke Syam dan wafat di Damaskus`,[`Setelah Nabi ﷺ wafat, Bilal tidak sanggup lagi mengumandangkan adzan di Madinah, karena setiap sampai "Asyhadu anna Muhammadar Rasulullah" ia menangis. Ia meminta izin ikut berjihad ke Syam dan tinggal di sana.`,`Menurut riwayat, ketika sakit menjelang wafat, istrinya menangis, sementara Bilal justru bergembira. Ia wafat di Damaskus sekitar 20 H (±640 M) dan dimakamkan di pemakaman Bab Ash-Shaghir.`],[[`Istri Bilal`,`Alangkah sedihnya!`,`Siyar A'lamin Nubala`],[`Bilal`,`Alangkah gembiranya! Besok aku akan bertemu dengan orang-orang tercinta: Muhammad dan sahabat-sahabatnya.`,`Siyar A'lamin Nubala`]]],
mushab:[`Makam di Uhud`,[`Mush'ab gugur di Uhud pada 3 H (625 M) dan dimakamkan bersama para syuhada di kaki Jabal Uhud. Nabi ﷺ berdiri di dekat jasadnya dan membaca ayat tentang orang-orang yang menepati janji kepada Allah. Abdurrahman bin Auf kelak sering menangis mengingat Mush'ab yang wafat tanpa kain kafan yang cukup.`],[[`Nabi Muhammad ﷺ`,`Di antara orang-orang mukmin ada orang-orang yang menepati apa yang telah mereka janjikan kepada Allah…`,`QS Al-Ahzab: 23 (dibacakan di dekat jasad Mush'ab, riwayat Ibnu Sa'ad)`]]],
abdurrahman:[`Wafat di Madinah`,[`Abdurrahman bin Auf termasuk enam anggota dewan syura yang ditunjuk Umar. Ia sendiri mundur dari pencalonan agar dapat memimpin musyawarah, yang akhirnya memilih Utsman. Ia wafat di Madinah sekitar 32 H (652 M) dalam usia sekitar 72 tahun. Ia mewasiatkan 400 dinar untuk setiap veteran Badar yang masih hidup. Utsman ikut menyholatkannya, dan ia dimakamkan di Baqi'.`]],
khalid:[`Wafat di atas ranjang di Homs`,[`Khalid menghabiskan tahun-tahun terakhirnya di Homs (Suriah). Ia wafat pada 21 H (642 M). Saat wafat, hartanya hanya berupa kuda, senjata, dan seorang budak yang ia wakafkan di jalan Allah. Umar menangis mendengar kabar wafatnya. Makamnya berada di kompleks Masjid Khalid bin Walid, Homs.`],[[`Umar`,`Para wanita boleh menangisi orang seperti Abu Sulaiman (Khalid).`,`Siyar A'lamin Nubala`]]],
salman:[`Gubernur yang menganyam keranjang`,[`Pada masa Umar, Salman diangkat menjadi gubernur Mada'in (Irak). Gajinya ia sedekahkan, sementara ia makan dari hasil menganyam keranjang. Menjelang wafat ia menangis, karena khawatir hartanya melebihi wasiat Nabi ﷺ, padahal hartanya hanya beberapa perabot sederhana. Ia wafat di Mada'in sekitar 33–36 H (±654–656 M) dan dimakamkan di sana, di kota yang kini bernama Salman Pak.`],[[`Salman`,`Rasulullah ﷺ berpesan kepada kami agar bekal salah seorang dari kami (dari dunia) seperti bekal seorang pengendara (musafir).`,`HR. Ibnu Majah & Ahmad`]]],
abuubaidah:[`Wafat karena wabah Amwas`,[`Saat wabah tha'un Amwas (18 H / 639 M), Umar mengirim surat yang memanggilnya ke Madinah dengan alasan ada keperluan. Abu Ubaidah memahami maksud Umar dan menolak meninggalkan pasukannya. Ia terkena wabah dan wafat dalam usia sekitar 58 tahun. Ia dimakamkan di lembah Yordan. Makamnya kini berada di kota Deir Alla, Yordania.`],[[`Abu Ubaidah (balasan surat)`,`Aku tahu keperluanmu kepadaku. Aku berada di tengah pasukan kaum muslimin, dan aku tidak ingin memisahkan diri dari mereka.`,`Tarikh Ath-Thabari`]]],
saad:[`Yang terakhir wafat dari sepuluh sahabat`,[`Pada masa fitnah, Sa'ad memilih menjauh dari pertikaian dan tinggal di Al-'Aqiq, dekat Madinah. Ia wafat di sana sekitar 55 H (±675 M). Ia termasuk yang terakhir wafat di antara sepuluh sahabat yang dijamin surga. Jenazahnya dipikul ke Madinah dan dimakamkan di Baqi'. Ia berwasiat agar dikafani dengan jubah wol yang ia pakai saat Perang Badar.`],[[`Sa'ad (wasiat)`,`Kafanilah aku dengan jubah ini. Aku memakainya ketika menghadapi kaum musyrik di Perang Badar, dan aku menyimpannya untuk hari ini.`,`Siyar A'lamin Nubala`]]],
abuhurairah:[`Menangis karena jauhnya perjalanan`,[`Abu Hurairah pernah menjadi gubernur Madinah dan Bahrain, tetapi tetap rendah hati. Ia sering memikul kayu bakar sendiri di pasar. Menjelang wafat ia menangis, bukan karena dunia, tetapi karena jauhnya perjalanan dan sedikitnya bekal. Ia wafat di Al-'Aqiq sekitar 57–59 H (±678 M) dan dimakamkan di Baqi', Madinah.`],[[`Abu Hurairah`,`Aku tidak menangisi dunia kalian ini. Aku menangis karena jauhnya perjalananku dan sedikitnya bekalku.`,`Siyar A'lamin Nubala`]]],
ibnuabbas:[`Akhir hayat di Thaif`,[`Ibnu Abbas mengajar tafsir, fikih, dan syair di Makkah, dan majelisnya sangat ramai. Ia pernah menjadi gubernur Bashrah. Di akhir hayat penglihatannya hilang. Ia wafat di Thaif pada 68 H (±687 M) dalam usia sekitar 71 tahun. Muhammad bin Al-Hanafiyah menyholatkannya, dan makamnya berada di sebelah Masjid Abdullah bin Abbas, Thaif.`],[[`Muhammad bin Al-Hanafiyah`,`Hari ini telah wafat rabbani (ulama) umat ini.`,`Siyar A'lamin Nubala`]]],
umarabdulaziz:[`Wafat di Dair Sim'an`,[`Umar bin Abdul Aziz memerintah hanya sekitar dua tahun lima bulan. Ia sakit pada usia sekitar 39 tahun, dan banyak riwayat menyebut ia diracun oleh pembantunya. Ia memaafkan pelakunya. Ia wafat pada Rajab 101 H (720 M) di Dair Sim'an dekat Aleppo (Suriah) dan dimakamkan di sana.`],[[`Umar bin Abdul Aziz (kepada pembantunya)`,`Apa yang membuatmu melakukan ini?… Pergilah ke tempat yang tidak dapat ditemukan orang.`,`Siyar A'lamin Nubala`]]],
abuhanifah:[`Wafat di penjara Baghdad`,[`Setelah menolak jabatan qadhi, Abu Hanifah dipenjara di Baghdad. Ia wafat pada Rajab 150 H (767 M) dalam usia 70 tahun. Jenazahnya disholatkan berkali-kali karena jumlah pelayat yang sangat besar. Ia dimakamkan di pemakaman Khaizuran, Baghdad, di kawasan yang kini bernama Al-A'zhamiyah, dengan masjid besar di atasnya (Masjid Abu Hanifah).`]],
malik:[`Wafat di kota Nabi`,[`Imam Malik mengajar di Masjid Nabawi lebih dari 60 tahun. Di akhir hayatnya ia jarang keluar rumah karena sakit, dan ia tidak menjelaskan alasannya kepada orang lain. Ia wafat di Madinah pada Rabi'ul Awal 179 H (795 M) dalam usia sekitar 85 tahun dan dimakamkan di Baqi'.`],[[`Imam Malik (menjelang wafat)`,`Tidak setiap orang mampu menyebutkan uzurnya.`,`Tartib Al-Madarik`]]],
syafii:[`Wafat di Mesir`,[`Di Mesir, Imam Syafi'i mengajar dan menulis tanpa henti, termasuk merevisi Ar-Risalah dan menyusun Al-Umm, meski menderita penyakit berat. Ketika muridnya, Al-Muzani, menjenguk dan bertanya tentang keadaannya, ia menjawab dengan penuh harap kepada Allah. Ia wafat pada malam Jumat akhir Rajab 204 H (820 M) dalam usia 54 tahun dan dimakamkan di Al-Qarafah, Kairo, yang kini menjadi kompleks Masjid dan Makam Imam Syafi'i.`],[[`Al-Muzani`,`Bagaimana keadaanmu pagi ini, wahai guru?`,`Manaqib Asy-Syafi'i (Al-Baihaqi)`],[`Imam Syafi'i`,`Pagi ini aku akan meninggalkan dunia, berpisah dengan saudara-saudara, meminum gelas kematian, dan menghadap Allah. Demi Allah, aku tidak tahu apakah ruhku akan menuju surga sehingga aku memberi selamat, atau ke neraka sehingga aku berbelasungkawa.`,`Manaqib Asy-Syafi'i (Al-Baihaqi)`]]],
ahmad:[`Jenazah yang diantar ratusan ribu orang`,[`Setelah mihnah berakhir, Imam Ahmad hidup sederhana dan menolak hadiah dari khalifah. Ia wafat di Baghdad pada Rabi'ul Awal 241 H (855 M) dalam usia 77 tahun. Menurut catatan sejarah, pelayat jenazahnya mencapai ratusan ribu orang. Ia dimakamkan di pemakaman Bab Harb, Baghdad. Makam itu kemudian hilang tergerus banjir Sungai Tigris.`],[[`Imam Ahmad`,`Katakan kepada ahli bid'ah: antara kami dan kalian adalah hari jenazah (kami).`,`Thabaqat Al-Hanabilah`]]],
bukhari:[`Wafat di Khartank`,[`Di akhir hayatnya, Imam Bukhari terusir dari Naisabur dan Bukhara karena fitnah dan karena menolak mengajar khusus di istana penguasa. Ia menuju Khartank dekat Samarkand dan berdoa agar bumi yang luas ini menerimanya. Ia wafat di sana pada malam Idul Fitri 256 H (870 M) dalam usia 62 tahun. Makamnya kini berada dalam kompleks Imam Bukhari di dekat Samarkand, Uzbekistan.`],[[`Imam Bukhari (doa)`,`Ya Allah, bumi yang luas ini telah terasa sempit bagiku, maka genggamlah aku kepada-Mu.`,`Hadyus Sari (Ibnu Hajar)`]]],
shalahuddin:[`Wafat dalam keadaan miskin`,[`Setelah Perjanjian Ramalah (1192) dengan Raja Richard, yang menjamin kaum muslimin tetap menguasai Baitul Maqdis dan memberi peziarah Kristen akses, Shalahuddin kembali ke Damaskus. Ia wafat pada 27 Safar 589 H (4 Maret 1193) dalam usia 55 tahun. Hartanya hanya 47 dirham dan sekeping emas, tidak cukup untuk biaya pemakamannya. Ia dimakamkan di dekat Masjid Umayyah, Damaskus.`]],
alfatih:[`Wafat dalam perjalanan`,[`Setelah menaklukkan Konstantinopel, Al-Fatih membangun kota itu dengan masjid, madrasah, rumah sakit, dan pasar, serta menjamin hak-hak penduduk non-muslim. Pada 1481 ia memimpin pasukan dalam sebuah kampanye militer yang tujuannya dirahasiakan. Di tengah perjalanan, di Gebze, ia jatuh sakit dan wafat pada 3 Mei 1481 dalam usia 49 tahun. Ia dimakamkan di kompleks Masjid Fatih, Istanbul.`]],
ibnusina:[`Wafat di Hamadan`,[`Hidup Ibnu Sina penuh gejolak: ia berpindah-pindah antar istana, pernah menjadi menteri, dan pernah dipenjara. Ia menulis lebih dari 200 karya. Ketika sakit perut yang parah dalam perjalanan bersama penguasa Isfahan, ia menyadari ajalnya dekat. Menurut riwayat, ia bertaubat, menyedekahkan hartanya, dan memerdekakan budak-budaknya. Ia wafat pada 1037 M di Hamadan (Iran) dan dimakamkan di sana.`]],
ibnubattuta:[`Pulang dan menulis Ar-Rihlah`,[`Ibnu Battuta pulang ke Maroko pada 1349 dan mendapati ibunya telah wafat karena wabah. Ia masih sempat berkelana ke Andalusia dan Mali. Atas perintah Sultan Abu Inan, pada 1355 ia mendiktekan seluruh kisah perjalanannya kepada sastrawan Ibnu Juzayy. Ia lalu menjadi qadhi di Maroko dan wafat sekitar 1368/1369 M. Tradisi menyebut makamnya di Tangier, kota kelahirannya.`]]};

const tok=s=>s.split(' ');

const GENERIC=['for','since','when','while','before','after','by','by the time','already','how long','later','soon','at that time'];
const others=(pool,correct,n=2)=>shuffle([...new Set(pool.filter(x=>x!==correct))]).slice(0,n);

    const fill={t:'fill',s:t.fill[0],a:t.fill[1],o:shuffle(t.fill[2]),why:`Ingat rumusnya: ${t.f.split('|').map(p=>p.split('~')[0]).join(' + ')}.`};
    const spot={t:'spot',s:t.spot[0],w:tok(t.spot[0]).findIndex(x=>clean(x)===t.spot[1].toLowerCase()),fix:t.spot[2],why:t.spot[3]};
    const listen={t:'listen',say:t.ex[L],o:shuffle(t.ex),a:t.ex[L]};
